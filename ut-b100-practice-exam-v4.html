<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UT B100 Business &amp; Law — Practice Exam</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --blue-950:#0a1f33;
    --blue-900:#0e2a44;
    --blue-800:#123657;
    --line:#4f90c4;
    --line-soft:#2e5478;
    --amber:#e0a548;
    --brick:#c1543a;
    --green:#5f9e6e;
    --ink:#eaf1f7;
    --ink-dim:#a9bdd0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--blue-950);
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:28px 28px;
    background-position:-1px -1px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 18px;}

  header.top{border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:22px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:28px;line-height:1.15;margin:0 0 8px 0;}
  .sub{color:var(--ink-dim);font-size:14px;line-height:1.5;}
  .blueprint-badge{display:inline-block;border:1.5px solid var(--line);border-radius:2px;padding:2px 8px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--line);margin-right:6px;margin-top:10px;}
  .blueprint-badge.weak{border-color:var(--brick);color:var(--brick);}

  .panel{background:var(--blue-900);border:1px solid var(--line-soft);border-radius:4px;padding:18px;margin-bottom:16px;}
  .breakdown-row{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-bottom:9px;}
  .breakdown-label{font-family:'IBM Plex Mono',monospace;width:150px;flex-shrink:0;color:var(--ink-dim);}
  .breakdown-label.weak{color:var(--brick);font-weight:600;}
  .bar-track{flex:1;height:8px;background:var(--blue-800);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--line);}
  .bar-fill.weak{background:var(--brick);}
  .breakdown-pct{font-family:'IBM Plex Mono',monospace;width:52px;text-align:right;color:var(--ink);flex-shrink:0;}

  button.primary{background:var(--amber);color:var(--blue-950);border:none;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;letter-spacing:0.03em;padding:14px 20px;border-radius:3px;width:100%;cursor:pointer;margin-top:8px;}
  button.primary:active{transform:translateY(1px);}
  button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:10px 16px;border-radius:3px;cursor:pointer;width:100%;margin-top:10px;}
  button.secondary{background:var(--blue-800);color:var(--amber);border:1.5px solid var(--amber);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;padding:12px 16px;border-radius:3px;width:100%;cursor:pointer;margin-top:10px;}

  .progress-row{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);margin-bottom:10px;}
  .progress-track{height:5px;background:var(--blue-800);border-radius:3px;overflow:hidden;margin-bottom:20px;}
  .progress-fill{height:100%;background:var(--amber);transition:width .25s ease;}

  .topic-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--blue-950);background:var(--line);padding:3px 8px;border-radius:2px;margin-bottom:12px;}
  .topic-tag.weak{background:var(--brick);}

  .question-card{background:var(--blue-900);border:1px solid var(--line-soft);border-radius:4px;padding:20px 18px 18px 18px;}
  .q-text{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.35;margin:0 0 16px 0;}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--blue-800);border:1.5px solid transparent;color:var(--ink);font-family:'Inter',sans-serif;font-size:14.5px;line-height:1.4;padding:12px 12px;border-radius:3px;margin-bottom:9px;cursor:pointer;}
  .opt .letter{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--line);flex-shrink:0;}
  .opt.correct{border-color:var(--green);background:rgba(95,158,110,0.18);}
  .opt.correct .letter{color:var(--green);}
  .opt.incorrect{border-color:var(--brick);background:rgba(193,84,58,0.18);}
  .opt.incorrect .letter{color:var(--brick);}
  .opt:disabled{cursor:default;}

  .explain{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-soft);font-size:13.5px;line-height:1.55;color:var(--ink-dim);}
  .explain b{color:var(--ink);}

  .nav-row{display:flex;gap:10px;margin-top:16px;}

  .score-hero{text-align:center;padding:26px 0 10px 0;}
  .score-num{font-family:'Fraunces',serif;font-weight:700;font-size:64px;line-height:1;}
  .score-num.pass{color:var(--green);}
  .score-num.fail{color:var(--brick);}
  .score-label{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-dim);margin-top:6px;}

  .topic-result-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:9px 0;border-bottom:1px solid var(--blue-800);}
  .topic-result-row:last-child{border-bottom:none;}
  .topic-score{font-family:'IBM Plex Mono',monospace;color:var(--ink-dim);}
  .topic-result-row.weak span:first-child{color:var(--brick);font-weight:600;}

  footer{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--line-soft);margin-top:26px;}
  .mode-row{display:flex;gap:8px;margin-bottom:6px;}
  .mode-btn{flex:1;background:var(--blue-800);border:1.5px solid var(--line-soft);color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:10px 8px;border-radius:3px;cursor:pointer;text-align:center;}
  .mode-btn.active{border-color:var(--amber);color:var(--amber);}

  .history-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--blue-800);font-family:'IBM Plex Mono',monospace;}
  .history-row:last-child{border-bottom:none;}
  .history-score{font-weight:600;}
  .history-score.pass{color:var(--green);}
  .history-score.fail{color:var(--brick);}
  .history-meta{color:var(--ink-dim);}
  .empty-note{color:var(--ink-dim);font-size:13px;font-style:italic;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// Fernando's actual 03/20/2026 Prov score report — used to flag weak subject areas
const LAST_SCORE = {
  "Business Organization": {correct:1, total:4},
  "Contract Management": {correct:1, total:6},
  "Estimating and Bidding": {correct:4, total:6},
  "Financial Management": {correct:4, total:6},
  "Labor Laws": {correct:3, total:6},
  "Licensing": {correct:5, total:10},
  "Lien Laws": {correct:1, total:3},
  "Project Management": {correct:5, total:5},
  "Risk Management": {correct:3, total:5},
  "Safety": {correct:0, total:4},
  "Tax Laws": {correct:2, total:5}
};
const WEAK_THRESHOLD = 0.5;
function isWeak(topic){
  const s = LAST_SCORE[topic];
  if(!s) return false;
  return (s.correct/s.total) < WEAK_THRESHOLD;
}

// Expanded question bank — each topic has more questions than any single quiz uses,
// so "shuffle a new set" pulls a genuinely different mix each time.
const QUESTIONS = [
  // BUSINESS ORGANIZATION (9) — weak
  {topic:"Business Organization", q:"What is the main advantage of forming an LLC over a sole proprietorship for a contracting business?", opts:["It eliminates the need for a license","It generally shields personal assets from business debts and liabilities","It removes the need for insurance","It exempts the business from taxes entirely"], correct:1, explain:"An LLC creates a legal separation between the business and the owner's personal assets, limiting personal liability for business debts."},
  {topic:"Business Organization", q:"In a sole proprietorship, who is personally liable for business debts and lawsuits?", opts:["No one — the business is a separate entity","The owner, personally and without limit","Only the bank that financed the business","The State of Utah"], correct:1, explain:"A sole proprietorship has no legal separation from its owner, so the owner bears unlimited personal liability."},
  {topic:"Business Organization", q:"What is a 'qualifying party' (or qualifier) in the context of a Utah contracting license?", opts:["The customer who hires the contractor","The individual whose experience and exam results qualify the business entity for licensure","The bank that approves a construction loan","The building inspector assigned to a project"], correct:1, explain:"The qualifier is the individual (owner, officer, or employee) whose experience and passed exam allow the business entity to hold a license."},
  {topic:"Business Organization", q:"A general partnership means that each partner is typically:", opts:["Only liable up to their invested capital","Personally liable for the partnership's debts, including a partner's actions","Protected from all business liability","Taxed separately from the partnership's income"], correct:1, explain:"In a general partnership, partners share personal liability for business obligations, including debts created by other partners acting within the business."},
  {topic:"Business Organization", q:"What does 'DBA' (doing business as) allow a company to do?", opts:["Avoid needing a contractor license","Operate and advertise under a name other than its legal registered name","Skip filing taxes","Bypass workers' compensation requirements"], correct:1, explain:"A DBA (assumed/fictitious business name filing) lets a business legally operate under a trade name different from its registered legal name."},
  {topic:"Business Organization", q:"Which business structure creates the clearest separation between the business entity and its owners, with shares and a board?", opts:["Sole proprietorship","General partnership","Corporation","Informal joint venture"], correct:2, explain:"A corporation is a distinct legal entity from its owners (shareholders), with its own liability shield, governed by officers/directors."},
  {topic:"Business Organization", q:"An S-corporation election primarily affects a business's:", opts:["Ability to hold a contractor license","Tax treatment, passing income/loss through to shareholders' personal returns","Insurance requirements","Bonding requirements"], correct:1, explain:"An S-corp is a tax election allowing income and losses to pass through to shareholders, avoiding corporate-level double taxation."},
  {topic:"Business Organization", q:"A registered agent for a Utah LLC or corporation is primarily responsible for:", opts:["Managing daily job site operations","Receiving legal and official state correspondence on behalf of the business","Signing every customer contract","Filing the company's sales tax returns"], correct:1, explain:"A registered agent is the designated point of contact for legal notices and state filings sent to the business."},
  {topic:"Business Organization", q:"In a joint venture between two contracting companies for a single large project, each party typically:", opts:["Has no liability tied to the venture","Shares in the profits, losses, and liability of that specific project per their agreement","Automatically merges into one company permanently","Is exempt from needing their own license"], correct:1, explain:"A joint venture is a temporary partnership for a specific project, with liability and profit/loss shared per the venture agreement."},

  // CONTRACT MANAGEMENT (11) — weak
  {topic:"Contract Management", q:"What three elements must generally be present for a construction contract to be enforceable?", opts:["Notarization, witnesses, and a state seal","Offer, acceptance, and consideration","A permit number, a bond, and insurance proof","A handshake, a deposit, and a start date"], correct:1, explain:"Like any contract, a construction contract needs an offer, acceptance of that offer, and consideration (something of value exchanged) to be legally binding."},
  {topic:"Contract Management", q:"A homeowner asks for added scope mid-project that wasn't in the original agreement. What should happen before the work proceeds?", opts:["Just complete the work and mention it on the final invoice","A written, signed change order documenting scope, cost, and schedule impact","A verbal agreement is sufficient and standard practice","The contractor should refuse any changes once signed"], correct:1, explain:"Written change orders, signed by both parties before work begins, protect against payment disputes and scope creep."},
  {topic:"Contract Management", q:"What is 'retainage' in a construction contract?", opts:["A late fee charged to the owner","A percentage of each payment withheld until satisfactory completion","A state tax on construction contracts","An insurance deductible"], correct:1, explain:"Retainage is a portion (commonly 5–10%) of each progress payment withheld until the work is completed and accepted."},
  {topic:"Contract Management", q:"What does a force majeure clause protect a contractor against?", opts:["Poor workmanship claims","Delay caused by extraordinary events outside either party's control, like severe weather or natural disaster","Late payment from the owner","Subcontractor default"], correct:1, explain:"Force majeure clauses excuse performance delays caused by extraordinary events beyond the parties' control."},
  {topic:"Contract Management", q:"In a cost-plus contract, the contractor is paid:", opts:["A fixed lump sum regardless of actual costs incurred","Actual documented costs of labor and materials, plus an agreed fee or percentage","Only for materials, with labor unpaid","A flat hourly rate with no cost documentation"], correct:1, explain:"Cost-plus contracts reimburse actual project costs and add a contractor fee, shifting more cost risk to the owner than fixed-price contracts."},
  {topic:"Contract Management", q:"An indemnification clause in a contract primarily does what?", opts:["Sets the payment schedule","Shifts liability for specified claims or losses from one party to another","Defines the warranty period on materials","Sets the project's completion date"], correct:1, explain:"Indemnification clauses allocate responsibility for specified losses, claims, or damages between the contracting parties."},
  {topic:"Contract Management", q:"A liquidated damages clause is used to:", opts:["Guarantee the contractor a bonus for finishing early","Pre-set a dollar penalty for late completion, agreed to in advance by both parties","Waive all contractor liability for defects","Automatically approve every change order"], correct:1, explain:"Liquidated damages establish a pre-agreed daily or flat penalty for missing the completion date, avoiding the need to prove actual damages later."},
  {topic:"Contract Management", q:"Best practice when a customer wants work to start before a written contract is finalized is to:", opts:["Start work anyway and formalize the contract later","Decline to begin substantial work until scope and terms are documented and signed","Rely on a verbal 'yes' recorded during a phone call","Have a friend witness a handshake agreement instead"], correct:1, explain:"Starting substantial work without a signed contract creates real legal and payment risk — get scope and terms documented first."},
  {topic:"Contract Management", q:"A 'time is of the essence' clause in a construction contract signals that:", opts:["Deadlines are casual suggestions","Meeting the stated deadlines is a material contract term, and missing them can be a breach","The contract has no fixed end date","Only the owner's deadlines matter, not the contractor's"], correct:1, explain:"This clause elevates scheduled dates to material terms — missing them can constitute a breach of contract, not just a minor delay."},
  {topic:"Contract Management", q:"A warranty clause in a construction contract typically specifies:", opts:["The contractor's personal cell phone number","The period and scope during which the contractor will remedy defects in workmanship or materials","The homeowner's mortgage terms","The subcontractor's hourly rate"], correct:1, explain:"Warranty clauses define how long and to what extent the contractor is responsible for correcting defective work after completion."},
  {topic:"Contract Management", q:"If a contract is silent on a specific issue that later becomes a dispute, courts often look to:", opts:["Whichever party shouts loudest","Industry custom, prior dealings between the parties, and general contract law principles","Always ruling in favor of the contractor","Voiding the entire contract automatically"], correct:1, explain:"Courts often fill contractual gaps using industry custom, the parties' prior course of dealing, and general legal principles."},

  // ESTIMATING AND BIDDING (8)
  {topic:"Estimating and Bidding", q:"A material and labor 'takeoff' refers to:", opts:["Removing old materials from a site","Quantifying materials and labor needed from the plans to build an estimate","The final walkthrough with the owner","A tax deduction for tools"], correct:1, explain:"A takeoff is the process of measuring plans/specs to quantify materials, labor, and other costs used to build an estimate."},
  {topic:"Estimating and Bidding", q:"What does a contractor's overhead and profit markup applied to a bid typically cover?", opts:["Only the cost of raw materials","Business operating costs (overhead) plus the contractor's profit margin, on top of direct job costs","Government permit fees exclusively","The homeowner's mortgage interest"], correct:1, explain:"Overhead and profit (O&P) is added on top of direct costs to cover business operating expenses and generate a profit."},
  {topic:"Estimating and Bidding", q:"What is a bid bond intended to guarantee?", opts:["That the contractor will finish the job on time","That if awarded the job, the bidder will sign the contract and provide required bonds, or forfeit the bond amount","That the lowest bidder automatically wins the job","That materials will be delivered on schedule"], correct:1, explain:"A bid bond assures the project owner that a winning bidder will honor their bid and proceed with the contract, or the surety covers the difference."},
  {topic:"Estimating and Bidding", q:"Why include a contingency line item in a project estimate?", opts:["To inflate the bid to guarantee the highest price wins","To budget for unforeseen costs or conditions discovered during construction","Because it's required by DOPL on every bid","To cover the owner's future maintenance costs"], correct:1, explain:"A contingency reserves budget for unforeseen conditions or costs that surface once work begins, reducing the risk of a loss on the job."},
  {topic:"Estimating and Bidding", q:"When comparing competitive bids, an unusually low bid compared to others often signals:", opts:["The bidder is the most efficient and should always be selected","A possible scope gap, underestimation, or intent to make up costs through change orders","That the project will finish early","Nothing of concern"], correct:1, explain:"A bid far below others can indicate missing scope, poor estimating, or a strategy to recover profit later through change orders — worth a closer look before awarding."},
  {topic:"Estimating and Bidding", q:"Unit pricing in a bid (e.g., cost per square foot or per linear foot) is most useful for:", opts:["Hiding the true total cost from the owner","Pricing quantities that may change during construction and adjusting the contract value accordingly","Avoiding the need for a written contract","Calculating payroll taxes"], correct:1, explain:"Unit pricing lets both parties adjust final contract value fairly when actual quantities differ from the original estimate."},
  {topic:"Estimating and Bidding", q:"A pre-bid site visit is valuable primarily because it helps a contractor:", opts:["Meet the neighbors","Identify site conditions, access issues, and scope details that affect the estimate's accuracy","Skip reading the plans","Guarantee winning the bid"], correct:1, explain:"Site visits surface real conditions — access, terrain, existing utilities — that plans alone may not fully capture, improving estimate accuracy."},
  {topic:"Estimating and Bidding", q:"An allowance in a bid or contract (e.g., '$5,000 allowance for flooring') is used when:", opts:["The final material selection hasn't been made yet, so a placeholder budget is set","The contractor wants to avoid liability entirely","The item is guaranteed to cost exactly that amount","No work will actually be done in that category"], correct:0, explain:"Allowances set a placeholder budget for items the owner hasn't finalized yet, to be adjusted once the actual selection and cost are known."},

  // FINANCIAL MANAGEMENT (8)
  {topic:"Financial Management", q:"Positive cash flow in a construction business means:", opts:["The business is profitable on paper only","More cash is coming in than going out during a given period","All invoices have been paid by the owner","The business owns more equipment than debt"], correct:1, explain:"Cash flow tracks actual cash movement; a business can be profitable on paper yet still run out of cash if receivables lag behind expenses."},
  {topic:"Financial Management", q:"Overhead costs in a construction business generally refer to:", opts:["Direct materials used on a specific job","Ongoing business expenses not tied to one specific job, like office rent, insurance, and admin salaries","Subcontractor invoices for a project","Change order costs"], correct:1, explain:"Overhead is the cost of running the business generally (office, admin, insurance) rather than a specific job's direct costs."},
  {topic:"Financial Management", q:"A contractor's break-even point is the level of revenue at which:", opts:["Profit is maximized","Total revenue equals total costs, with zero profit or loss","The business must close","Taxes are no longer owed"], correct:1, explain:"Break-even is the sales/revenue level where total costs are exactly covered — beyond that point, additional revenue becomes profit."},
  {topic:"Financial Management", q:"Under cash-basis accounting, income is recorded when:", opts:["A contract is signed","Cash is actually received, not necessarily when it's earned","Work begins on a project","An invoice is sent to the client"], correct:1, explain:"Cash-basis accounting records income and expenses when cash actually changes hands, unlike accrual accounting which records them when earned/incurred."},
  {topic:"Financial Management", q:"Accounts receivable represents:", opts:["Money the business owes to suppliers","Money owed to the business by clients for completed work","Cash reserved for payroll","Depreciation on equipment"], correct:1, explain:"Accounts receivable is money owed to the business by customers, typically for invoiced work not yet paid."},
  {topic:"Financial Management", q:"Why is job costing (tracking actual cost per project) important for a contractor?", opts:["It's only useful for tax filing","It shows whether each job was profitable and improves future estimating accuracy","It replaces the need for insurance","It's required only for government contracts"], correct:1, explain:"Job costing compares actual costs to the estimate on each project, revealing profitability and sharpening future bids."},
  {topic:"Financial Management", q:"Under accrual-basis accounting, revenue is recorded when:", opts:["Cash is physically deposited","It is earned (e.g., work is completed or a milestone is met), regardless of when cash is received","The fiscal year ends","A customer signs a new contract"], correct:1, explain:"Accrual accounting recognizes revenue when it's earned, not necessarily when cash actually arrives — the opposite of cash-basis timing."},
  {topic:"Financial Management", q:"A healthy current ratio (current assets ÷ current liabilities) above 1.0 generally suggests:", opts:["The business has no debt at all","The business has enough short-term assets to cover its short-term obligations","The business is guaranteed to be profitable","The business overpaid its taxes"], correct:1, explain:"A current ratio above 1.0 indicates short-term assets exceed short-term liabilities, a sign of reasonable short-term financial health."},

  // LABOR LAWS (8)
  {topic:"Labor Laws", q:"Under federal labor law (FLSA), non-exempt employees who work over 40 hours in a week are generally entitled to:", opts:["No additional pay","Overtime pay, typically at 1.5x their regular rate","Comp time only, never pay","A flat bonus regardless of hours"], correct:1, explain:"The Fair Labor Standards Act requires overtime pay (typically time-and-a-half) for non-exempt employees working over 40 hours per week."},
  {topic:"Labor Laws", q:"Misclassifying an employee as an independent contractor can expose a contracting business to:", opts:["No real consequences if the worker agrees","Back taxes, penalties, and liability for unpaid workers' comp/unemployment insurance","A tax refund","Automatic license renewal"], correct:1, explain:"Misclassification carries real financial and legal risk, including back payroll taxes, penalties, and unpaid insurance contributions."},
  {topic:"Labor Laws", q:"Employers are generally required to verify a new employee's identity and work eligibility using which federal form?", opts:["W-9","Form I-9","1099-NEC","W-4 only"], correct:1, explain:"Form I-9 is used to verify identity and employment authorization for new hires."},
  {topic:"Labor Laws", q:"On a public works project, what wage requirement often applies that doesn't apply to typical private jobs?", opts:["Federal minimum wage only, with no exceptions","Prevailing wage rates set for that trade and locality","No wage laws apply on public projects","Only union employees may be paid"], correct:1, explain:"Public works projects often require paying prevailing wage rates, set by government surveys of local wage standards for each trade."},
  {topic:"Labor Laws", q:"Which of these is a key factor in determining whether a worker is an employee vs. an independent contractor?", opts:["The worker's preferred job title","The degree of control the business has over how, when, and where the work is performed","Whether the worker owns a truck","How many years the worker has been in the trade"], correct:1, explain:"Behavioral and financial control — how much the business directs the work — is a central factor in employee vs. contractor classification tests."},
  {topic:"Labor Laws", q:"What must employers generally maintain regarding workplace injuries under OSHA recordkeeping rules?", opts:["Nothing, unless someone is hospitalized","A log of recordable work-related injuries and illnesses (e.g., OSHA Form 300)","A public press release for every injury","Only verbal notification to OSHA"], correct:1, explain:"Covered employers must maintain injury and illness records, such as the OSHA 300 log, for recordable workplace incidents."},
  {topic:"Labor Laws", q:"Federal minimum wage sets a floor that:", opts:["Always overrides a higher state minimum wage","Applies unless a state or local minimum wage is higher, in which case the higher rate applies","Only applies to salaried employees","Doesn't apply to construction workers"], correct:1, explain:"Employers must pay at least the highest applicable minimum wage among federal, state, and local requirements."},
  {topic:"Labor Laws", q:"A jobsite apprentice working under a licensed contractor typically must:", opts:["Hold their own separate contractor license","Work under appropriate supervision per apprenticeship/training program requirements","Be paid the same rate as a licensed journeyman immediately","Skip all safety training"], correct:1, explain:"Apprentices generally work under defined supervision within a training program rather than independently or unsupervised."},

  // LICENSING (16) — largest exam section
  {topic:"Licensing", q:"Which state agency oversees contractor licensing in Utah?", opts:["Utah Department of Commerce Insurance Division","Utah Division of Occupational and Professional Licensing (DOPL)","Utah Labor Commission","Utah State Construction Registrar"], correct:1, explain:"DOPL, under the Department of Commerce, administers contractor licensing and enforcement through its Construction Trades Bureau."},
  {topic:"Licensing", q:"At what project value does a person need a Utah contractor license to legally perform the work?", opts:["$1,000 or more","$2,000 or more","$3,000 or more","$5,000 or more"], correct:2, explain:"Utah law requires a license for construction work valued at $3,000 or more."},
  {topic:"Licensing", q:"What classification code identifies a Utah General Building Contractor license?", opts:["R100","B100","E100","S200"], correct:1, explain:"B100 is the General Building Contractor classification, covering structural work but not electrical, plumbing, or mechanical scopes."},
  {topic:"Licensing", q:"A B100 licensee wants to install new electrical wiring on a remodel. What must they do?", opts:["Nothing — B100 covers all trades","Subcontract to a licensed electrical contractor","Self-perform since they're the GC of record","Get a same-day verbal waiver from DOPL"], correct:1, explain:"B100 is a structural license only; electrical, plumbing, and mechanical work must be performed by separately licensed trade contractors."},
  {topic:"Licensing", q:"How much experience is generally required to qualify for a B100 license?", opts:["1 year (2,000 hours)","2 years (4,000 hours)","3 years (6,000 hours)","4 years (8,000 hours)"], correct:1, explain:"Utah requires 2 years of paid construction experience totaling at least 4,000 hours."},
  {topic:"Licensing", q:"Of the required experience for a B100 qualifier, how much must be in a supervisory or managerial role?", opts:["None required","At least 6 months","At least 1 of the 2 years","All of it"], correct:2, explain:"Under Utah rule, at least one of the two required years must be in a supervisory or managerial capacity."},
  {topic:"Licensing", q:"A contractor licensed and in good standing in another state for at least a year applies in Utah. What is true about the Business & Law exam?", opts:["Still mandatory regardless of out-of-state license","May be waived if the out-of-state license covers a similar scope and is active/in good standing","Only the trade exam is waived, not Business & Law","Exam is waived only for military veterans"], correct:1, explain:"Utah can waive the Business & Law exam for applicants with at least one year of active, similar-scope licensure in good standing elsewhere."},

const ALL_TOPICS = Object.keys(LAST_SCORE);
const WEAK_TOPICS = ALL_TOPICS.filter(isWeak);

let state = {screen:"intro", idx:0, answers:[], mode:"weak", source:"bank"};
let activeQuestions = [];
let attemptHistory = [];
const STORAGE_KEY = "ut_b100_attempts_v1";
const SEEN_KEY = "ut_b100_seen_ids_v1";

// ---------- localStorage-based history (works on any deployed site) ----------
function loadHistory(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    attemptHistory = raw ? JSON.parse(raw) : [];
  } catch(e){
    attemptHistory = [];
  }
}
function saveAttempt(record){
  attemptHistory.unshift(record);
  if(attemptHistory.length > 40) attemptHistory = attemptHistory.slice(0,40);
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(attemptHistory)); } catch(e){ console.error(e); }
}
function getSeenIds(){
  try{
    const raw = localStorage.getItem(SEEN_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}
function markSeen(ids){
  try{
    let seen = getSeenIds();
    seen = seen.concat(ids);
    if(seen.length > 200) seen = seen.slice(seen.length-200);
    localStorage.setItem(SEEN_KEY, JSON.stringify(seen));
  } catch(e){}
}

// assign a stable id to each question (topic + question text)
QUESTIONS.forEach(q => { q._id = q.topic + "::" + q.q; });

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Build a fresh random set: prefer unseen questions first, shuffle answer order too
function buildRandomSet(topics, countPerTopicTarget){
  const seen = getSeenIds();
  let picked = [];
  topics.forEach(topic => {
    let pool = QUESTIONS.filter(q => q.topic === topic);
    let unseen = pool.filter(q => !seen.includes(q._id));
    let usePool = unseen.length > 0 ? unseen : pool; // reset once exhausted
    usePool = shuffle(usePool);
    const n = Math.min(countPerTopicTarget, usePool.length);
    picked = picked.concat(usePool.slice(0,n));
  });
  picked = shuffle(picked);
  // shuffle each question's option order independently
  const finalSet = picked.map(q => {
    const order = shuffle([0,1,2,3]);
    const newOpts = order.map(i => q.opts[i]);
    const newCorrect = order.indexOf(q.correct);
    return {topic:q.topic, q:q.q, opts:newOpts, correct:newCorrect, explain:q.explain, _id:q._id};
  });
  markSeen(finalSet.map(q => q._id));
  return finalSet;
}

function buildActiveSet(mode){
  const topics = mode === "weak" ? WEAK_TOPICS : ALL_TOPICS;
  const perTopic = mode === "weak" ? 3 : 2;
  activeQuestions = buildRandomSet(topics, perTopic);
}

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'intro') app.innerHTML = renderIntro();
  else if(state.screen === 'quiz') app.innerHTML = renderQuiz();
  else app.innerHTML = renderResults();
}

function renderIntro(){
  let bars = ALL_TOPICS.map(name => {
    const s = LAST_SCORE[name];
    const pct = Math.round((s.correct/s.total)*100);
    const weak = isWeak(name);
    return `
    <div class="breakdown-row">
      <div class="breakdown-label ${weak?'weak':''}">${name}</div>
      <div class="bar-track"><div class="bar-fill ${weak?'weak':''}" style="width:${pct}%"></div></div>
      <div class="breakdown-pct">${s.correct}/${s.total}</div>
    </div>`;
  }).join('');

  let historyBlock;
  if(attemptHistory.length === 0){
    historyBlock = `<div class="empty-note">No practice attempts logged yet on this device. Finish a set below and it'll show up here.</div>`;
  } else {
    historyBlock = attemptHistory.slice(0,8).map(a => {
      const d = new Date(a.date);
      const dateStr = (d.getMonth()+1) + "/" + d.getDate() + "/" + d.getFullYear();
      const passed = a.scorePct >= 70;
      const modeLabel = a.mode === 'weak' ? 'Weak areas' : 'Full exam';
      return `<div class="history-row">
        <span class="history-meta">${dateStr} · ${modeLabel} · ${a.total} Q</span>
        <span class="history-score ${passed?'pass':'fail'}">${a.scorePct}%</span>
      </div>`;
    }).join('');
  }

  return `
    <header class="top">
      <div class="eyebrow">Retake Prep — Built From Your Actual Score Report</div>
      <h1>B100 Business &amp; Law<br>Practice Exam</h1>
      <div class="sub">Your 03/20/2026 attempt scored 48% (needed 70%). Weakest areas: Safety, Business Organization, Contract Management, and Lien Laws.</div>
      <span class="blueprint-badge">70% TO PASS</span>
      <span class="blueprint-badge weak">${QUESTIONS.filter(q=>isWeak(q.topic)).length} WEAK-AREA QUESTIONS IN BANK</span>
    </header>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:12px;">Your last attempt, by subject</div>
      ${bars}
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:10px;">Practice history (this device)</div>
      ${historyBlock}
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:10px;">Choose scope</div>
      <div class="mode-row">
        <div class="mode-btn ${state.mode==='weak'?'active':''}" onclick="setMode('weak')">Weak Areas Only</div>
        <div class="mode-btn ${state.mode==='all'?'active':''}" onclick="setMode('all')">Full Exam (All Areas)</div>
      </div>
      <div class="sub" style="margin-top:8px;">${state.mode==='weak' ? "Drills only Safety, Business Organization, Contract Management, and Lien Laws — the sections that sank your last score." : "Covers all 11 subject areas, including the ones you already did well on, to confirm they've stuck."}</div>
    </div>
    <button class="primary" onclick="startQuiz()">Shuffle a New Set →</button>
    <footer>Every set pulls a fresh random mix from a ${QUESTIONS.length}-question bank with shuffled answer order. Study aid only — verify current rules with DOPL / your Prov candidate handbook.</footer>
  `;
}

function setMode(m){
  state.mode = m;
  render();
}

function startQuiz(){
  buildActiveSet(state.mode);
  state.source = "bank";
  state.screen = "quiz";
  state.idx = 0;
  state.answers = new Array(activeQuestions.length).fill(null);
  render();
}

function renderQuiz(){
  const q = activeQuestions[state.idx];
  const answered = state.answers[state.idx] !== null;
  const pct = Math.round((state.idx/activeQuestions.length)*100);
  const weak = isWeak(q.topic);

  let opts = q.opts.map((opt, i) => {
    let cls = "opt";
    let disabledAttr = answered ? "disabled" : "";
    if(answered){
      if(i === q.correct) cls += " correct";
      else if(i === state.answers[state.idx] && i !== q.correct) cls += " incorrect";
    }
    return `<button class="${cls}" ${disabledAttr} onclick="selectAnswer(${i})">
      <span class="letter">${String.fromCharCode(65+i)}</span><span>${opt}</span>
    </button>`;
  }).join('');

  let explainBlock = answered ? `<div class="explain"><b>${state.answers[state.idx] === q.correct ? "Correct." : "Not quite."}</b> ${q.explain}</div>` : '';

  let navButtons = `<div class="nav-row">`;
  if(answered){
    navButtons += `<button class="primary" onclick="nextQuestion()">${state.idx === activeQuestions.length-1 ? "See Results →" : "Next Question →"}</button>`;
  }
  navButtons += `</div>`;

  return `
    <div class="progress-row">
      <span>QUESTION ${state.idx+1} / ${activeQuestions.length}</span>
      <span>${pct}% THROUGH</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <span class="topic-tag ${weak?'weak':''}">${q.topic}${weak?' · weak spot':''}</span>
    <div class="question-card">
      <p class="q-text">${q.q}</p>
      ${opts}
      ${explainBlock}
    </div>
    ${navButtons}
  `;
}

function selectAnswer(i){
  if(state.answers[state.idx] !== null) return;
  state.answers[state.idx] = i;
  render();
}

function nextQuestion(){
  if(state.idx === activeQuestions.length-1){
    finishAttempt();
    state.screen = "results";
  } else {
    state.idx += 1;
  }
  render();
}

function finishAttempt(){
  let correctCount = 0;
  let topicStats = {};
  activeQuestions.forEach((q,i) => {
    if(!topicStats[q.topic]) topicStats[q.topic] = {correct:0,total:0};
    topicStats[q.topic].total += 1;
    if(state.answers[i] === q.correct){
      correctCount += 1;
      topicStats[q.topic].correct += 1;
    }
  });
  const scorePct = Math.round((correctCount/activeQuestions.length)*100);
  saveAttempt({
    date: new Date().toISOString(),
    mode: state.mode,
    scorePct: scorePct,
    correct: correctCount,
    total: activeQuestions.length,
    topics: topicStats
  });
}

function renderResults(){
  let correctCount = 0;
  let topicStats = {};
  activeQuestions.forEach((q,i) => {
    if(!topicStats[q.topic]) topicStats[q.topic] = {correct:0,total:0};
    topicStats[q.topic].total += 1;
    if(state.answers[i] === q.correct){
      correctCount += 1;
      topicStats[q.topic].correct += 1;
    }
  });
  const scorePct = Math.round((correctCount/activeQuestions.length)*100);
  const passed = scorePct >= 70;

  let topicRows = Object.keys(topicStats).map(name => {
    let s = topicStats[name];
    let weak = isWeak(name);
    return `<div class="topic-result-row ${weak?'weak':''}"><span>${name}</span><span class="topic-score">${s.correct}/${s.total}</span></div>`;
  }).join('');

  return `
    <header class="top">
      <div class="eyebrow">Results — ${state.mode === 'weak' ? 'Weak-Area Drill' : 'Full Exam'}</div>
      <h1>Practice Complete</h1>
    </header>
    <div class="panel">
      <div class="score-hero">
        <div class="score-num ${passed ? 'pass':'fail'}">${scorePct}%</div>
        <div class="score-label">${correctCount} of ${activeQuestions.length} correct — ${passed ? 'passing (70% needed)' : 'below 70% passing mark'}</div>
      </div>
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:8px;">By topic</div>
      ${topicRows}
    </div>
    <button class="ghost" onclick="reviewMissed()">Review Missed Questions</button>
    <button class="secondary" onclick="startQuiz()">Shuffle Another New Set (same scope) →</button>
    <button class="primary" onclick="backToIntro()">Back to Start</button>
    <footer>Study aid only — verify current rules with DOPL / your Prov candidate handbook.</footer>
  `;
}

function backToIntro(){
  state.screen = "intro";
  render();
}

function reviewMissed(){
  const app = document.getElementById('app');
  let missed = activeQuestions.map((q,i) => ({q,i})).filter(item => state.answers[item.i] !== item.q.correct);
  let html = `
    <header class="top">
      <div class="eyebrow">Review</div>
      <h1>Missed Questions</h1>
      <div class="sub">${missed.length === 0 ? "You didn't miss any — nice work." : missed.length + " question(s) to revisit."}</div>
    </header>
  `;
  missed.forEach(item => {
    let q = item.q;
    let yourAns = state.answers[item.i];
    let weak = isWeak(q.topic);
    html += `
      <div class="question-card" style="margin-bottom:14px;">
        <span class="topic-tag ${weak?'weak':''}">${q.topic}</span>
        <p class="q-text">${q.q}</p>
        ${q.opts.map((opt,i) => {
          let cls = "opt";
          if(i === q.correct) cls += " correct";
          else if(i === yourAns) cls += " incorrect";
          return `<div class="${cls}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${opt}</span></div>`;
        }).join('')}
        <div class="explain"><b>Why:</b> ${q.explain}</div>
      </div>
    `;
  });
  html += `<button class="primary" onclick="backToIntro()">Back to Start</button>`;
  app.innerHTML = html;
}

loadHistory();
render();
</script>
</body>
</html>
