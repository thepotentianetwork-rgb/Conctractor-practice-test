  {topic:"Tax Laws", q:"Self-employed contractors who expect to owe tax are generally required to pay taxes:", opts:["Only once a year, in April","Quarterly, as estimated tax payments","Never, if income is under $100,000","Only if audited"], correct:1, explain:"Self-employed individuals typically must make quarterly estimated tax payments rather than paying everything at year-end.", ref:"IRS Form 1040-ES (estimated tax); HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"A contractor purchases a truck used 70% for business and 30% for personal errands. For tax purposes, the deductible portion of related vehicle expenses is generally:", opts:["100%, since it's titled to the business","Limited to the business-use percentage (roughly 70% in this case), not the full cost","0%, since any personal use disqualifies the entire deduction","Determined solely by the truck's purchase price"], correct:1, explain:"Mixed-use vehicle expenses are generally deductible only in proportion to actual business use, requiring reasonable recordkeeping (e.g., a mileage log) to support the split.", ref:"IRS Publication 463 (business use of a vehicle); HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"A contractor accepts a large cash payment for a job and doesn't report it as income. Beyond ethical concerns, this creates exposure to:", opts:["No real risk if it's under $10,000","Tax evasion penalties, interest, and potential criminal exposure if discovered, regardless of the payment method","A simple late-filing fee only","Nothing, since cash transactions aren't taxable"], correct:1, explain:"All income is taxable regardless of payment form; failing to report cash income creates the same (or greater) audit and penalty exposure as any other unreported income.", ref:"IRC income-reporting rules; IRS Form 1040 / Schedule C; HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"A Section 179 deduction allows a business to:", opts:["Avoid ever paying sales tax on equipment","Potentially deduct the full purchase price of qualifying equipment/tools in the year purchased, rather than depreciating it over several years","Skip filing a tax return entirely for that year","Exempt all business vehicles from registration fees"], correct:1, explain:"Section 179 allows eligible businesses to expense the full cost of qualifying equipment purchases immediately, rather than spreading the deduction out through standard depreciation schedules.", ref:"IRC Section 179; IRS Publication 946; HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"A contractor operating as an LLC taxed as a sole proprietorship generally owes self-employment tax on:", opts:["Nothing, since LLCs are tax-exempt","Net self-employment earnings, covering the individual's share of Social Security and Medicare that an employer would otherwise split with an employee","Only gross revenue before any expenses","Only income above $1,000,000"], correct:1, explain:"Self-employed individuals owe self-employment tax on net earnings, covering both the employee and employer portions of Social Security/Medicare that a traditional employer would otherwise split.", ref:"IRS self-employment tax (Schedule SE); HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"The self-employment tax rate on net self-employment earnings is approximately:", opts:["7.65%","15.3%","22%","35%"], correct:1, explain:"Self-employment tax is roughly 15.3% of net earnings — 12.4% for Social Security plus 2.9% for Medicare, covering both the 'employee' and 'employer' shares a traditional payroll arrangement would split.", commonlyMissed:true, ref:"IRS Schedule SE / self-employment tax rate (15.3%); HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"Form W-9 is used to:", opts:["Report an employee's annual wages and withholding","Collect a contractor's/vendor's taxpayer ID information before the payer issues a 1099", "Apply for an EIN directly with the IRS","Report quarterly payroll tax deposits"], correct:1, explain:"A business collects Form W-9 from independent contractors/vendors to get their taxpayer ID number, which is then used to prepare an accurate Form 1099 at year-end.", commonlyMissed:true, ref:"IRS Form W-9; HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"If a contractor fails to provide a valid taxpayer ID on Form W-9, the payer may be required to withhold what's known as 'backup withholding' from payments at a rate of approximately:", opts:["10%","24%","33%","50%"], correct:1, explain:"Backup withholding is currently around 24% of the payment when a payee fails to furnish a valid taxpayer ID, and the payer must remit it to the IRS.", commonlyMissed:true, ref:"IRS backup withholding (Form W-9 / 1099); HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"Form 941 is filed by employers to report:", opts:["Annual business income tax","Quarterly federal payroll taxes withheld from employees, plus the employer's matching share","Sales tax collected from customers","A one-time new-hire notification"], correct:1, explain:"Form 941 is the employer's quarterly federal tax return reporting withheld income tax plus Social Security/Medicare taxes for both employee and employer portions.", commonlyMissed:true, ref:"IRS Form 941 (quarterly federal employment tax); HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"The 'trust fund recovery penalty' can make a responsible individual (like a business owner) personally liable for what portion of unpaid withheld payroll taxes?", opts:["10%","50%","Up to 100%","There is no personal liability, only the business entity is liable"], correct:2, explain:"The trust fund recovery penalty can impose personal liability of up to 100% of unpaid withheld payroll taxes on responsible individuals, piercing the usual entity liability shield for this specific obligation.", commonlyMissed:true, ref:"IRS trust fund recovery penalty (unpaid withheld payroll taxes); HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"Since the 2020 tax year, nonemployee compensation paid to independent contractors is reported on which form — a change from the older practice of using a different form's box for this?", opts:["1099-MISC, as it always has been","1099-NEC — nonemployee compensation was moved OFF the 1099-MISC and onto its own dedicated form starting with the 2020 tax year, a change that trips up anyone recalling older rules", "W-2, same as employees","There is no dedicated reporting form for this"], correct:1, explain:"Starting with tax year 2020, the IRS revived Form 1099-NEC specifically for nonemployee compensation, which had previously been reported in a box on Form 1099-MISC — outdated study material or memory can lead people to answer 1099-MISC incorrectly.", commonlyMissed:true, ref:"IRS Form 1099-NEC vs 1099-MISC; HBA book: Tax Laws section"},
  {topic:"Contract Management", q:"A 'novation' in contract law specifically means:", opts:["Adding a minor amendment to an existing contract","Substituting a new party into a contract in place of an original party, with the original party's obligations fully released — different from an assignment, where the original party can remain liable","Simply renaming the contract document","Extending the contract's deadline"], correct:1, explain:"Novation fully substitutes a new party and releases the original party from the contract entirely — this is the key distinction from an assignment, where the assignor can often still remain secondarily liable.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, novation"},
  {topic:"Contract Management", q:"An 'assignment' of contract rights differs from a 'delegation' of contract duties in that:", opts:["They are simply two names for the exact same thing","Assignment transfers the BENEFITS/rights under a contract, while delegation transfers the OBLIGATIONS/duties — a party can do one, the other, or both, and delegating duties doesn't necessarily release the delegator from liability if they aren't performed", "Only duties can ever be transferred, never rights","Delegation requires court approval but assignment doesn't"], correct:1, explain:"Rights (benefits) are assigned; duties (obligations) are delegated — and unlike a novation, delegating a duty typically doesn't release the original party from liability if the delegate fails to perform.", ref:"NASCLA guide: Contract Management, assignment vs delegation"},
  {topic:"Contract Management", q:"'Privity of contract' refers to:", opts:["The confidentiality of contract terms","The direct legal relationship that exists only between the actual parties to a contract — generally why an owner can't sue a sub-subcontractor directly without another legal basis, like a lien or a third-party beneficiary claim", "A clause requiring private arbitration","The private, unrecorded nature of a contract"], correct:1, explain:"Privity limits contract enforcement rights to the actual contracting parties — a key reason mechanics liens and payment bonds exist as separate remedies for parties (like sub-subs and suppliers) who lack direct privity with the owner.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, privity of contract"},
  {topic:"Contract Management", q:"A 'third-party beneficiary' of a contract is someone who:", opts:["Signed the contract as a witness","Is not a party to the contract but was specifically intended to benefit from it, and may in some cases have enforceable rights under it despite lacking privity","Provided financing for the contract","Is automatically liable for any breach of the contract"], correct:1, explain:"Third-party beneficiary status is an exception to the general privity rule — someone the contracting parties specifically intended to benefit can sometimes enforce the contract even without being a signatory.", ref:"NASCLA guide: Contract Management, third-party beneficiaries"},
  {topic:"Contract Management", q:"'Quantum meruit' is an equitable remedy that allows a contractor to recover:", opts:["Punitive damages for a willful breach","The reasonable value of labor/materials actually provided, even absent an enforceable contract covering that work — often used when a contract is void, incomplete, or doesn't cover the work performed", "Their full expected profit regardless of work performed","Only amounts specifically itemized in a signed change order"], correct:1, explain:"Quantum meruit ('as much as deserved') lets a party recover the reasonable value of work performed even without a valid enforceable contract, preventing unjust enrichment of the party who received the benefit.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, quantum meruit"},
  {topic:"Contract Management", q:"'Accord and satisfaction' in a payment dispute means:", opts:["The parties agreed on a new contract price before work began","The parties settled a disputed claim by agreeing to and accepting a different (often lesser) payment than originally claimed, discharging the original obligation", "A court ordered specific performance","The contractor formally accepted defective materials"], correct:1, explain:"Accord and satisfaction resolves a genuine dispute — accepting a lesser negotiated payment as full satisfaction discharges the original claim, which is why cashing a 'paid in full' check on a disputed invoice can be legally risky.", ref:"NASCLA guide: Contract Management, accord and satisfaction"},
  {topic:"Contract Management", q:"The legal difference between 'waiver' and 'estoppel' is that waiver is:", opts:["Identical to estoppel with no practical difference","The intentional, voluntary relinquishment of a known right, while estoppel prevents a party from asserting a right because their own conduct induced another party's reasonable reliance — waiver requires intent, estoppel doesn't", "Only relevant to lien law, never to general contracts","Something only a court can grant, never the parties themselves"], correct:1, explain:"Waiver is about a party's own intentional choice to give up a right; estoppel is about being barred from asserting a right due to your conduct having misled someone else who reasonably relied on it — a subtle but real distinction.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, waiver vs estoppel"},
  {topic:"Contract Management", q:"A 'latent defect' differs from a 'patent defect' in that a latent defect is:", opts:["Always more expensive to repair","Hidden and not reasonably discoverable through a normal inspection at the time, unlike a patent defect which is reasonably obvious/visible upon inspection — this distinction affects warranty claims and when a discovery-based clock starts running", "Only relevant to electrical work","A defect caused intentionally by the contractor"], correct:1, explain:"Latent defects are hidden/not reasonably discoverable at the time (like a structural flaw behind finished walls), while patent defects are apparent on reasonable inspection — the distinction matters for when claims can reasonably be discovered and pursued.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, latent vs patent defects"},
  {topic:"Contract Management", q:"A 'cardinal change' to a contract is one that is:", opts:["Any change order, no matter how small","So fundamental in scope or nature that it goes beyond what the parties originally bargained for — potentially treated as a breach of the original contract rather than a covered change", "Only relevant to change orders under $1,000","A change requested verbally instead of in writing"], correct:1, explain:"A cardinal change is so drastic it effectively creates a different project than the parties agreed to — courts may treat it as a breach of the original contract rather than simply a large change order within its scope.", ref:"NASCLA guide: Contract Management, cardinal change"},
  {topic:"Contract Management", q:"'Consequential damages' differ from 'direct damages' in a construction dispute in that consequential damages:", opts:["Are always smaller in dollar amount than direct damages","Are indirect losses flowing from a breach — like lost business income or rental costs during a delay — rather than the direct cost of fixing/completing the work itself; many contracts specifically waive consequential damages to limit this exposure", "Only apply to residential projects","Can never be included in a construction contract"], correct:1, explain:"Direct damages are the immediate cost of the breach itself (redoing bad work, cost to complete); consequential damages are the ripple-effect losses (lost profits, rental costs) — which is exactly why many contracts include a mutual waiver of consequential damages to cap exposure.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, consequential vs direct damages"},
  {topic:"Risk Management", q:"In surety bond terminology, the 'obligee,' 'principal,' and 'surety' refer respectively to:", opts:["The contractor, the owner, and the bank","The party protected by the bond (usually the project owner), the party whose performance is guaranteed (the contractor), and the company issuing the bond and guaranteeing performance", "Three different types of the same bond","The insurance agent, the adjuster, and the underwriter"], correct:1, explain:"Obligee = the protected party (typically the owner); Principal = the bonded party (the contractor); Surety = the company backing the bond financially — mixing these up is a common and costly terminology error.", commonlyMissed:true, ref:"NASCLA guide: Risk Management, surety parties (obligee, principal, surety)"},
  {topic:"Risk Management", q:"In an indemnification arrangement, the 'indemnitor' and 'indemnitee' refer respectively to:", opts:["The insurance company and the policyholder","The party who agrees to cover/hold harmless the other party's losses (indemnitor), and the party being protected/held harmless (indemnitee)", "The plaintiff and the defendant in any lawsuit","Two interchangeable terms for the same role"], correct:1, explain:"The indemnitor is the one agreeing to absorb specified losses; the indemnitee is the one being protected — this maps directly onto who is providing versus receiving protection in an indemnification clause.", ref:"NASCLA guide: Risk Management, indemnitor and indemnitee"},
  {topic:"Risk Management", q:"A 'named insured' on a policy differs from an 'additional insured' in that the named insured:", opts:["Has fewer rights under the policy than an additional insured","Is the primary policyholder with the broadest rights and obligations under the policy (like paying premiums and being notified of changes), while an additional insured has coverage extended to them for specified purposes without those primary policyholder obligations", "Is only relevant for health insurance, not liability policies","Automatically becomes the additional insured's employer"], correct:1, explain:"The named insured is the actual policyholder with full rights/obligations; an additional insured gets coverage extended to them for specific situations (like a GC on a sub's policy) without taking on the named insured's full role.", ref:"NASCLA guide: Risk Management, named insured vs additional insured"},
  {topic:"Risk Management", q:"An 'occurrence' form liability policy differs from a 'claims-made' form in that an occurrence policy:", opts:["Only covers claims filed the same year the policy is purchased","Covers incidents that HAPPENED during the active policy period, regardless of when the claim is later filed — even years afterward — unlike claims-made policies which respond based on when the claim itself is filed", "Costs less in every case","Doesn't require paying any premium"], correct:1, explain:"Occurrence coverage attaches to when the incident actually happened, so a policy from years ago can still respond to a claim filed today — claims-made coverage instead depends on the claim being filed while that specific policy (or an extended reporting period) is active.", ref:"NASCLA guide: Risk Management, occurrence vs claims-made coverage"},
  {topic:"Risk Management", q:"'Betterment' in an insurance/risk context refers to:", opts:["A bonus paid to a contractor for excellent work","A situation where repairing damage results in the property being improved beyond its original condition — insurers often won't pay for the 'improvement' portion, only the cost to restore to the prior condition", "The process of upgrading an insurance policy's coverage limits","A type of performance bond"], correct:1, explain:"When a repair necessarily improves a property beyond its pre-loss condition, insurers typically only cover restoring the original condition — the value of the 'betterment' improvement is often excluded or cost-shared.", ref:"NASCLA guide: Risk Management, betterment"},
  {topic:"Risk Management", q:"'Subrogation' (before any waiver is applied) generally refers to an insurer's right to:", opts:["Deny any claim it disagrees with","Step into the insured's shoes and pursue a responsible third party to recover what it paid out on a claim — this is the underlying right that a 'waiver of subrogation' specifically gives up", "Cancel a policy at any time without notice","Charge the insured a higher premium after any claim"], correct:1, explain:"Subrogation is the insurer's baseline legal right to recoup a paid claim from whoever was actually responsible — understanding this baseline right is what makes clear why a waiver of subrogation (giving that right up) is a meaningful contract concession.", ref:"NASCLA guide: Risk Management, subrogation"},
  {topic:"Risk Management", q:"A 'certificate holder' listed on an insurance certificate has fundamentally different rights than an 'additional insured' because a certificate holder:", opts:["Actually has broader coverage rights than an additional insured","Merely receives notice/proof that a policy exists and is in force, without any actual coverage under that policy — being an additional insured is what actually extends coverage protection", "Is always the insurance company itself","Automatically becomes a named insured after 30 days"], correct:1, explain:"This is one of the most common and costly confusions in construction risk management — a certificate holder just gets paperwork/notice, while only an additional insured actually gets protected by the policy's coverage.", commonlyMissed:true, ref:"NASCLA guide: Risk Management, certificate holder vs additional insured"},
  {topic:"Project Management", q:"An RFI (Request for Information) in construction project management is used to:", opts:["Request additional payment from the owner","Formally seek clarification from the design team/owner about an ambiguity, conflict, or missing detail in the plans or specifications before proceeding with that portion of work", "Report a safety violation to OSHA","Request a background check on a new subcontractor"], correct:1, explain:"RFIs are the formal, documented channel for resolving plan/spec ambiguities — proceeding on an assumption instead of submitting an RFI can create costly rework and liability exposure if the assumption turns out wrong.", ref:"NASCLA guide: Scheduling and Project Management, RFIs"},
  {topic:"Project Management", q:"A 'construction change directive' differs from a standard 'change order' in that a change directive:", opts:["Is simply a faster way to write the same document","Is typically issued unilaterally by the owner/architect directing the contractor to proceed with a change while the exact price and/or time impact is STILL being negotiated — unlike a change order, which reflects mutual agreement on scope, price, and time already reached", "Can only be used for safety-related changes","Never requires the contractor to actually perform any work"], correct:1, explain:"A change directive keeps the project moving on a change before price/time is fully negotiated and agreed — a meaningful practical difference from a change order, which represents a completed, mutually-agreed modification.", ref:"NASCLA guide: Scheduling and Project Management, construction change directives vs change orders"},
  {topic:"Project Management", q:"'Value engineering' in a construction project refers to:", opts:["Reducing the contractor's profit margin to win a bid","A systematic process of analyzing design/material choices to reduce cost or improve efficiency while maintaining the required function and quality of the project", "Increasing scope to justify a higher fee","A term specific to structural steel engineering only"], correct:1, explain:"Value engineering looks for ways to deliver the same functional outcome for less cost or with more efficiency — distinct from simply cutting scope or quality to save money.", ref:"NASCLA guide: Scheduling and Project Management, value engineering"},
  {topic:"Project Management", q:"'Constructive acceleration' occurs when:", opts:["A contractor voluntarily speeds up work to finish early for a bonus","An owner fails to grant a legitimate time extension the contractor was entitled to, effectively forcing the contractor to accelerate performance (at their own cost) to meet the original deadline anyway", "A schedule is compressed using additional resources by mutual agreement","A project uses prefabricated/modular construction methods"], correct:1, explain:"Constructive acceleration is a claim theory — the owner didn't explicitly order acceleration, but their refusal to grant a warranted extension effectively forced it, potentially entitling the contractor to recover the added cost.", ref:"NASCLA guide: Scheduling and Project Management, constructive acceleration"},
  {topic:"Project Management", q:"'As-built' drawings are best described as:", opts:["The original architectural plans before construction began","Final drawings updated to reflect the ACTUAL conditions and any changes made during construction, which may differ from the original design documents", "A contractor's personal sketch used only for their own reference","Drawings required only on projects over $1 million"], correct:1, explain:"As-built drawings capture what was actually constructed, including field changes and deviations from the original plans — valuable for future renovation, maintenance, and dispute resolution.", ref:"NASCLA guide: Scheduling and Project Management, as-built drawings"},
  {topic:"Project Management", q:"A 'notice to proceed' in a construction contract typically:", opts:["Has no formal significance and is purely informal courtesy", "Formally authorizes the contractor to begin work and often establishes the official start date the project schedule (and related deadlines) are measured from", "Is only used on government/public projects, never private ones","Replaces the need for a signed contract"], correct:1, explain:"The notice to proceed is often the formal trigger date the entire project schedule counts from, even if it's issued after the contract itself was signed.", ref:"NASCLA guide: Scheduling and Project Management, notice to proceed"},
  {topic:"Project Management", q:"A 'means and methods' clause in a construction contract typically establishes that:", opts:["The owner controls exactly how the contractor performs the work, step by step","The contractor generally has control over and responsibility for HOW the work gets done (construction techniques, sequencing, safety procedures), while the owner/architect's role is generally focused on the design and end-result requirements", "Only union labor may be used on the project","The architect is liable for all jobsite safety incidents"], correct:1, explain:"Means and methods is a key liability boundary — contractors generally control (and bear responsibility for) HOW work gets built, while owners/designers are generally focused on WHAT gets built, not the construction techniques used to get there.", ref:"NASCLA guide: Scheduling and Project Management, means and methods"},
  {topic:"Business Organization", q:"'Ultra vires' refers to actions by a corporation (or its officers) that are:", opts:["Standard and fully authorized under the corporate charter","Beyond the scope of authority granted by the corporation's charter or governing documents — potentially void or challengeable for that reason", "Required by state law for all corporations","A type of tax election"], correct:1, explain:"Ultra vires ('beyond the powers') describes acts exceeding what a corporation's charter/bylaws actually authorize — historically a bigger issue than today, but still relevant when officers act outside their granted authority.", ref:"NASCLA guide: Business Organization, ultra vires / corporate authority"},
  {topic:"Business Organization", q:"A 'fiduciary duty' owed by a business partner or corporate officer generally means they must:", opts:["Only follow the letter of their written contract, nothing more","Act with loyalty and good faith in the best interest of the business/other partners, rather than prioritizing personal interests in conflict with that duty", "Personally guarantee all business debts","Work a minimum number of hours per week"], correct:1, explain:"Fiduciary duty is a heightened legal obligation of loyalty and care — a partner or officer who prioritizes personal gain over the business's interest in a conflict-of-interest situation can be in breach of this duty.", ref:"NASCLA guide: Business Organization, fiduciary duties"},
  {topic:"Business Organization", q:"'Apparent authority' can make a business liable for an employee's actions when:", opts:["The employee had zero actual authorization but the business's own conduct reasonably led a third party to believe the employee was authorized to act on the business's behalf", "The employee explicitly had written authorization for every action","The business had no relationship with the employee at all","The employee acted purely for personal benefit with no connection to the business"], correct:0, explain:"Apparent authority binds a business based on how it presented the employee's authority to outsiders — even without actual internal authorization, reasonable reliance by a third party can create real liability.", ref:"NASCLA guide: Business Organization, apparent authority"},
  {topic:"Labor Laws", q:"'Respondeat superior' is a legal doctrine holding that:", opts:["Employees are always personally liable for workplace injuries, never the employer","An employer can be held liable for an employee's negligent acts committed within the scope of their employment — not for purely personal acts unrelated to their job duties", "Only supervisors can be held liable for injuries on a jobsite","Employers are liable for employee actions only if they personally witnessed them"], correct:1, explain:"Respondeat superior ('let the master answer') holds employers liable for employee negligence within the scope of employment — a foundational reason jobsite conduct and supervision matter so much for liability exposure.", ref:"NASCLA guide: Employee Management, respondeat superior / employer liability; HBA book: Labor Laws section"},
  {topic:"Labor Laws", q:"Utah is generally an 'at-will employment' state, which means:", opts:["Employees can never be terminated for any reason","Absent a contract or specific legal exception (like discrimination or retaliation), either the employer or employee can generally end the employment relationship at any time, for almost any reason, without cause", "Employers must give 2 weeks notice before any termination","Only applies to employees working fewer than 40 hours per week"], correct:1, explain:"At-will employment allows termination by either party without cause in most situations — but this default is still limited by specific legal exceptions like anti-discrimination law and retaliation protections (e.g., for OSHA complaints).", ref:"HBA book: Labor Laws section, Utah at-will employment (and statutory exceptions)"},
  {topic:"Safety", q:"Under OSHA's violation classification system, a 'willful' violation differs from a 'serious' violation primarily in that a willful violation involves:", opts:["A lower penalty than a serious violation","Intentional disregard for or plain indifference to a known legal requirement or known hazard — carrying the highest penalty tier, versus a serious violation where there's substantial probability of serious harm but not necessarily intentional disregard", "Only paperwork/recordkeeping failures","Violations that occurred more than 5 years ago"], correct:1, explain:"Willful violations (intentional disregard/plain indifference) carry OSHA's steepest penalties — meaningfully more severe than serious violations, which involve substantial harm potential without necessarily being intentional.", commonlyMissed:true, ref:"OSHA violation classifications (willful vs serious); 29 U.S.C. 666; HBA book: Safety section"},
  {topic:"Safety", q:"A 'de minimis' OSHA violation is one that:", opts:["Results in the largest possible fine","Has no direct or immediate relationship to safety or health — typically results in no citation and no monetary penalty, just a verbal or written notice", "Is automatically classified as willful","Only applies to violations discovered during a fatality investigation"], correct:1, explain:"De minimis violations are technical in nature with no real safety/health impact — OSHA generally doesn't issue a formal citation or penalty for these, unlike serious, willful, or repeat violations.", ref:"OSHA violation classifications (de minimis); 29 U.S.C. 666; HBA book: Safety section"},
  {topic:"Safety", q:"A 'repeat' OSHA violation classification applies when:", opts:["Any violation is found on a second inspection, regardless of similarity","An employer is cited for a substantially similar violation to one previously cited within a specific look-back period — generally carrying substantially higher penalties than a first-time violation of the same type", "The same inspector visits the site more than once","The violation involves repeated equipment failures only"], correct:1, explain:"Repeat violations specifically require a substantially similar prior citation within OSHA's look-back period — and they carry significantly elevated penalties compared to a first-time citation for the same type of hazard.", ref:"OSHA violation classifications (repeat); 29 U.S.C. 666; HBA book: Safety section"},
  {topic:"Tax Laws", q:"FUTA (Federal Unemployment Tax Act) differs from FICA in that FUTA:", opts:["Is withheld from the employee's paycheck, just like FICA","Is generally paid solely by the EMPLOYER (not withheld from employee wages) and funds unemployment compensation programs, unlike FICA which is split between employer and employee to fund Social Security/Medicare", "Only applies to construction companies","Replaced FICA entirely in recent years"], correct:1, explain:"FUTA is an employer-only tax funding unemployment programs; FICA is the shared employer/employee tax funding Social Security and Medicare — mixing up who actually pays which tax is a common error.", commonlyMissed:true, ref:"IRS FUTA vs FICA (Forms 940 and 941); HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"A 'pass-through entity' for tax purposes is one where:", opts:["The business pays corporate-level income tax before any distributions","Business income/loss passes through to the owners' personal tax returns, avoiding a separate entity-level income tax — sole proprietorships, most LLCs, S-corps, and partnerships are common examples", "Only government contractors qualify for this status","The business is exempt from all taxation permanently"], correct:1, explain:"Pass-through taxation avoids the 'double taxation' that traditional C-corporations face, since income flows directly to owners' personal returns rather than being taxed at the entity level first.", ref:"IRS pass-through entities; HBA book: Tax Laws section"},
  {topic:"Licensing", q:"Utah 'licensure by endorsement' differs from 'reciprocity' in that endorsement generally:", opts:["Are simply two identical terms for the same process","Relies on Utah's own evaluation of an out-of-state license holder's qualifications (experience, exam, standing) on a case-by-case basis, while true reciprocity would involve a formal state-to-state agreement automatically recognizing each other's licenses — Utah primarily uses endorsement-style evaluation rather than blanket reciprocity agreements", "Requires a completely new apprenticeship regardless of prior licensure","Only applies to specialty trade licenses, never general contractors"], correct:1, explain:"Endorsement means Utah individually evaluates an out-of-state applicant's credentials against its own requirements, which is different from a formal blanket reciprocity agreement between states — Utah's waiver provisions function more like endorsement review than automatic reciprocity.", ref:"HBA book: Licensing section, Utah Code 58-1-302 (licensure by endorsement)"},
  {topic:"Licensing", q:"The 'qualifier of record' on a Utah contractor license is best understood as:", opts:["Any employee who happens to have construction experience","The specific individual whose personal experience and passed exam legally qualify the business entity for licensure — formally designated and on file with DOPL, not just informally recognized within the company", "The business's registered agent for legal notices","The person who signs every customer contract"], correct:1, explain:"The 'of record' distinction matters — DOPL recognizes a specific formally-designated individual, not just whoever happens to be most experienced; changing this designation requires formal notification, not just an internal company decision.", ref:"HBA book: Licensing section, Utah Code 58-55 and R156-55a-501 (qualifier of record / change notice)"},
  {topic:"Financial Management", q:"'Accounts payable' represents:", opts:["Money owed TO the business by its customers","Money the business itself owes to its own suppliers, subcontractors, or vendors for goods/services already received but not yet paid for", "Cash reserved specifically for payroll","The value of depreciated equipment"], correct:1, explain:"Accounts payable is the mirror image of accounts receivable — what the business owes others, rather than what's owed to the business — mixing the two up misreads a company's financial position entirely.", ref:"NASCLA guide: Financial Management, accounts payable"},

  {topic:"Financial Management", q:"On a contractor's financial statements, the balance sheet reports:", opts:["Assets, liabilities, and owners' equity at a specific point in time","Revenues and expenses over a period of time, resulting in net income or loss","Only cash received and cash paid during the year","The scheduled start and finish dates for each job"], correct:0, explain:"The balance sheet is a snapshot of assets, liabilities, and equity as of a given date. Revenues and expenses over a period belong on the income statement, not the balance sheet.", ref:"NASCLA guide: Financial Management, balance sheet"},
  {topic:"Financial Management", q:"A contractor has current assets of $240,000 and current liabilities of $80,000. The current ratio is:", opts:["$160,000","0.33","$320,000","3.0"], correct:3, explain:"Current ratio = current assets ÷ current liabilities = $240,000 ÷ $80,000 = 3.0. This is a ratio, not a dollar amount — $160,000 would be working capital (current assets minus current liabilities), a related but different measure.", ref:"NASCLA guide: Financial Management, ratios (current ratio)"},
  {topic:"Financial Management", q:"A contractor has cash of $40,000, accounts receivable of $80,000, inventory of $50,000, prepaid expenses of $10,000, and current liabilities of $60,000. The quick (acid-test) ratio is:", opts:["3.0","0.67","2.0","2.83"], correct:2, explain:"The quick ratio is (cash + accounts receivable + other quick assets) ÷ current liabilities, and it excludes inventory and prepaid expenses. ($40,000 + $80,000) ÷ $60,000 = 2.0. Including inventory would produce about 2.83, and including all current assets would produce 3.0 — both of which measure liquidity less conservatively than the quick ratio.", ref:"NASCLA guide: Financial Management, ratios (quick / acid-test)"},
  {topic:"Financial Management", q:"Under the accrual method of accounting, a contractor who completes a billed progress payment in December but does not collect the cash until January should:", opts:["Record the revenue in January, when the cash is actually received","Record the revenue in December, when it is earned, and record an account receivable until the cash is collected","Never record the amount, since cash has not been received by year-end","Record it as a reduction of accounts payable"], correct:1, explain:"Accrual accounting recognizes revenue when it is earned, not when cash is collected, so December work that has been billed is revenue in December with a corresponding receivable. Cash-basis accounting would wait until January; mixing the two methods misstates both the income statement and the balance sheet.", ref:"NASCLA guide: Financial Management, accrual vs cash accounting"},
  {topic:"Financial Management", q:"A lump-sum contract is priced at $400,000. Estimated total cost is $250,000, and costs incurred to date are $100,000. Using the cost-to-cost percentage-of-completion method, gross profit recognized to date is:", opts:["$60,000","$150,000","$100,000","$160,000"], correct:0, explain:"Percent complete = costs to date ÷ estimated total cost = $100,000 ÷ $250,000 = 40%. Total estimated gross profit is $400,000 − $250,000 = $150,000, so profit recognized to date is 40% × $150,000 = $60,000. $160,000 is the revenue recognized to date (40% × $400,000), not the profit.", ref:"NASCLA guide: Financial Management, percentage-of-completion"},
  {topic:"Financial Management", q:"Job costing on a construction project is used primarily to:", opts:["Replace the need for a balance sheet","Record only the company's income tax liability","Allocate corporate dividends to individual jobs","Track direct materials, direct labor, and allocated overhead against a specific job so actual cost can be compared to the estimate"], correct:3, explain:"Job costing accumulates the actual costs of a particular project — typically direct materials, direct labor, and a share of overhead — so management can compare them to the estimate, control overruns, and price future work more accurately.", ref:"NASCLA guide: Financial Management, job costing"},
  {topic:"Financial Management", q:"A job has $50,000 in direct costs. The contractor applies overhead at 20% of direct costs, then adds a 10% markup on the resulting total cost (direct costs plus overhead). The bid price should be:", opts:["$55,000","$60,000","$66,000","$72,000"], correct:2, explain:"Overhead = 20% × $50,000 = $10,000, so total cost = $60,000. A 10% markup on that total cost is $6,000, for a bid price of $66,000. $55,000 applies the 10% markup to direct costs and skips overhead; $60,000 includes overhead but no markup; $72,000 incorrectly applies a 20% factor twice.", ref:"NASCLA guide: Financial Management, overhead and markup"},
  {topic:"Financial Management", q:"A contractor buys equipment for $85,000, estimates a $10,000 salvage value, and uses straight-line depreciation over a 5-year useful life. Annual depreciation expense is:", opts:["$17,000","$15,000","$85,000","$10,000"], correct:1, explain:"Straight-line depreciation = (cost − salvage value) ÷ useful life = ($85,000 − $10,000) ÷ 5 = $15,000 per year. $17,000 would result from ignoring salvage value ($85,000 ÷ 5).", ref:"NASCLA guide: Financial Management, depreciation"},
  {topic:"Financial Management", q:"A contractor's fixed costs are $48,000 and the contribution margin ratio is 20% of sales. The sales volume needed to break even is:", opts:["$240,000","$9,600","$60,000","$48,000"], correct:0, explain:"Break-even sales = fixed costs ÷ contribution margin ratio = $48,000 ÷ 0.20 = $240,000. At that revenue, contribution margin exactly covers fixed costs and profit is zero. $9,600 is 20% of the fixed costs, which is not the break-even formula.", ref:"NASCLA guide: Financial Management, break-even analysis"},
  {topic:"Financial Management", q:"A contractor pays $40,000 cash for a piece of equipment. On the statement of cash flows, this transaction is generally classified as:", opts:["Revenue on the income statement equal to the $40,000 paid","An operating cash inflow","A financing cash inflow","An investing cash outflow"], correct:3, explain:"Buying equipment for cash is a capital expenditure, reported as an investing outflow on the statement of cash flows. It is not an operating cash flow, not a financing inflow, and the $40,000 purchase price is not recorded as revenue — the cost is capitalized as an asset and then depreciated.", ref:"NASCLA guide: Financial Management, statement of cash flows"},
  {topic:"Financial Management", q:"Retainage that a contractor has earned but that the owner is still holding until substantial completion is generally reported as:", opts:["A current liability, because the cash has not been received","An account payable to the owner","A receivable (often a current asset), representing amounts earned but withheld under the contract","A retained-earnings appropriation on the equity section only"], correct:2, explain:"Retainage receivable is an amount the contractor has earned under the contract but that the owner is contractually holding back. It is an asset — typically current if collection is expected within a year — not a liability or a component of retained earnings. It becomes cash when the retainage is released.", ref:"NASCLA guide: Financial Management, retainage as a receivable"},
  {topic:"Financial Management", q:"An accounts-receivable aging schedule is used primarily to:", opts:["Show how long customer invoices have been outstanding so management can estimate collection risk and any allowance for doubtful accounts","Calculate the current ratio by adding receivables to inventory","Determine payroll tax deposits due that quarter","Depreciate equipment over its useful life"], correct:0, explain:"An aging schedule groups receivables by how long they have been outstanding (for example current, 31–60 days, 61–90, and over 90). Older balances generally carry more collection risk, which is why aging supports both collections follow-up and the estimate of an allowance for doubtful accounts.", ref:"NASCLA guide: Financial Management, accounts-receivable aging"},
  {topic:"Lien Laws", q:"A construction lien gives the lien holder the ability to:", opts:["Enforce the lien by a foreclosure action and court-ordered sale of the property","Be paid only if the owner later chooses to sell the property","Collect from a statutory payment guarantee that replaces the need to record a lien","Both be paid only if the property is sold and collect a payment guarantee"], correct:0, explain:"Utah Code §38-1a-701 requires a claimant to file an action to enforce a construction lien. Section 38-1a-704 then directs the court to cause the property to be sold in satisfaction of the liens and costs as in the case of a mortgage foreclosure. A lien is a security interest enforced by foreclosure, not a payment guarantee and not a right that exists only if the owner later decides to sell.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-701"},
  {topic:"Lien Laws", q:"Which statement about material suppliers is true under Utah law?", opts:["General contractors and subcontractors have lien rights, but material suppliers do not","A person who provides material for construction work may claim a construction lien for its reasonable value","Only suppliers of structural materials, not fasteners or consumables, have lien rights","Material suppliers may lien a project only if they also performed labor on site"], correct:1, explain:"Utah Code §38-1a-102(11) defines construction work to include material provided for constructing, altering, or repairing an improvement. Section 38-1a-301(1) gives a person who provides construction work a lien on the project property for its reasonable value. Material suppliers therefore have lien rights; it is not limited to GCs and subcontractors.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-102(11)"},
  {topic:"Lien Laws", q:"Which statement about the Utah State Construction Registry is true?", opts:["It is an optional forum for notifying parties, and filing is never required to preserve lien rights","It may be used only after a lien has already been recorded with the county recorder","It is a central repository for required notices, and a person who fails to file a preliminary notice may not claim a construction lien","Filing in the registry replaces the need to record a notice of construction lien with the county recorder"], correct:2, explain:"Utah Code §38-1a-201 establishes the SCR as a central repository for required notices. Section 38-1a-501(1)(e) states that a person who fails to file a preliminary notice as required may not claim a construction lien. The registry is not an optional forum for claimants who want to preserve lien rights. Recording the later notice of construction lien with the county recorder is a separate step under §38-1a-502.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-201 and 38-1a-502"},
  {topic:"Lien Laws", q:"Who may use the Utah State Construction Registry?", opts:["Only licensed general contractors","Only subcontractors and material suppliers","Only the Division of Professional Licensing itself","Owners, original contractors, subcontractors, lenders, sureties, title companies, and other interested persons, depending on the notice"], correct:3, explain:"The SCR is not limited to contractors. Utah Code §38-1a-204 allows a person to request notification of required notices, and §38-1a-507 allows an owner, original contractor, lender, surety, or title company to file a notice of completion. Preliminary notices and other required notices are filed by the various parties the chapter identifies, not only by GCs.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-204 and 38-1a-507"},
  {topic:"Lien Laws", q:"Under Utah law, which of the following can support a preconstruction or construction lien?", opts:["Finish carpentry, excavation, supplying nails, rental equipment, estimating, staking, observation, project management, and architectural design done before construction starts","Preparing an estimate, staking, observation, and project management, but not finish carpentry","Only labor performed after a building permit is issued","Only work performed by the original contractor, not by suppliers or designers"], correct:0, explain:"Utah Code §38-1a-102(11) defines construction work as labor, service, material, or equipment provided during construction, and it expressly includes estimating, staking, supervising, managing, inspection, and observation. That covers finish carpentry, excavation, nails and fasteners, rental equipment, and project management. Section 38-1a-102(29) defines preconstruction service to include planning or design before construction commences, such as preparing a design, plan, or drawing. Section 38-1a-301 grants a lien for preconstruction service or construction work. Finish carpentry is labor used to construct or alter an improvement and is lienable like the other listed items.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-102(11)"},
  {topic:"Lien Laws", q:"Which statement about public (government) projects is true under Utah law?", opts:["A mechanic's lien may be recorded against public property just as on a private project","Unpaid claimants on public work generally proceed against a payment bond, not a construction lien on the public property","A lien on a school or city building is valid if filed within 90 days","Public projects are exempt from any notice or claim procedure"], correct:1, explain:"Public construction is covered by the payment-bond requirements of Utah Code §14-1-18 and §63G-6a-1103, which protect persons supplying labor, service, equipment, or material on public buildings or public work. Government-project notices (including Notice of Commencement) are in Title 38, Chapter 1b, not the private-project construction-lien foreclosure scheme. Claimants on public work look to the payment bond (or, if the public entity failed to obtain a bond, to the remedies in §14-1-19), not to a mechanic's lien against the public property.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 14-1-18, 63G-6a-1103, and Title 38, Chapter 1b"},
  {topic:"Lien Laws", q:"Must a general contractor on a private Utah project file a Notice of Commencement on the SCR?", opts:["Yes, on every private and public project","Yes, but only on residential projects","No. A Notice of Commencement is a government-project filing under Utah Code §38-1b-201","Yes, but only if the contract exceeds $7,000"], correct:2, explain:"Utah Code §38-1a-102(23) defines a notice of commencement as a notice required under §38-1b-201 for a government project. Section 38-1b-201 requires the original contractor, owner, or owner-builder on a government project to file that notice no later than 15 days after physical construction begins. A GC on a private project is not required to file a Notice of Commencement.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-102(23) and 38-1b-201"},
  {topic:"Lien Laws", q:"Is a property's physical address enough, by itself, to identify it for a required private-project notice on the SCR?", opts:["Yes, the street address is the only identifier the registry uses","Yes, if the address includes a zip code","No, because private-project notices may be filed only by legal description with the county recorder, never on the SCR","No. A private-project filing must also include the tax parcel identification number or the building permit number, and the county"], correct:3, explain:"Utah Code §38-1a-203(4) requires filings to include the county and, for a private project, the tax parcel identification number of each parcel or the building permit number. Section 38-1a-501(1)(h) likewise requires a preliminary notice to include the county and a tax parcel identification number (or specified alternatives such as a prior entry number or building permit), plus the address or a location description. A street address alone is not sufficient.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-203(4)"},
  {topic:"Lien Laws", q:"A person who wants to claim a construction lien but does not file a preliminary notice as required:", opts:["May not claim a construction lien","May still record a valid construction lien at any time","Loses only the right to attorney's fees, not the lien itself","May substitute a notice filed with the county recorder for the SCR preliminary notice"], correct:0, explain:"Utah Code §38-1a-501(1)(e) states that a person who fails to file a preliminary notice as required in that section may not claim a construction lien.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-501(1)(e)"},
  {topic:"Lien Laws", q:"Which statement about preconstruction and construction liens is true?", opts:["A preconstruction lien may include amounts for later construction work","A construction lien may include an amount claimed for a preconstruction service, but a preconstruction lien may not include an amount claimed for construction work","The two lien types are interchangeable and use the same notice form","Preconstruction design work can never support a lien of any kind"], correct:1, explain:"Utah Code §38-1a-301(3) provides that a construction lien may include an amount claimed for a preconstruction service, but a preconstruction lien may not include an amount claimed for construction work.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-301(3)"},
  {topic:"Lien Laws", q:"If a court enforces a construction lien, the property is sold:", opts:["Only if the owner agrees to list it with a realtor","Automatically, without a court action, 30 days after the lien is recorded","As in the case of a foreclosure of a mortgage, subject to the same right of redemption","Only to the original contractor, at the unpaid contract balance"], correct:2, explain:"Utah Code §38-1a-704(1) requires the court to cause the property to be sold in satisfaction of the liens and costs as in the case of a foreclosure of a mortgage, subject to the same right of redemption.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-704(1)"},
  {topic:"Lien Laws", q:"After final completion, a notice of completion may be filed with the SCR by:", opts:["Only the original contractor","Only the county recorder","Any passerby who noticed that work had stopped","An owner, original contractor, construction lender, surety, or title company issuing a title policy on the project"], correct:3, explain:"Utah Code §38-1a-507(1)(a) allows a notice of completion to be filed by an owner; an original contractor for construction work; a lender that provided financing; a surety that provided bonding; or a title company issuing a title insurance policy on the project.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-507(1)(a)"},
  {topic:"Lien Laws", q:"'Preconstruction service' under Utah lien law means:", opts:["Planning or design of an improvement before construction commences, for compensation separate from construction work, including preparing designs, plans, or drawings","Any punch-list work after substantial completion","Only soil testing performed during excavation","Warranty call-backs in the first year after occupancy"], correct:0, explain:"Utah Code §38-1a-102(29) defines preconstruction service as planning or designing, or assisting in the planning or design of, an improvement before construction commences, for compensation separate from construction work. It includes preparing a study, report, rendering, model, survey, plat, map, design, plan, drawing, specification, or contract document, as well as estimating and similar preconstruction tasks.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-102(29)"},
  {topic:"Lien Laws", q:"A construction lien generally attaches to:", opts:["The entire neighborhood in which the project sits","Only the interest that the owner has in the project property","Any property in Utah titled in the contractor's name","The contractor's personal residence automatically"], correct:1, explain:"Utah Code §38-1a-301(4)(a) provides that a preconstruction or construction lien attaches only to the interest that the owner has in the project property that is the subject of the lien. If the owner has less than fee simple, the lien generally attaches only to that lesser interest, subject to the limited exception in subsection (4)(c).", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-301(4)(a)"},
  {topic:"Lien Laws", q:"When a claimant files an action to enforce a construction lien, the claimant must also record a notice of pendency of the action:", opts:["Within 30 days after judgment","Only if the project is a public building","Within the same time period allowed for filing the enforcement action, or the lien is void except as to parties and persons with actual knowledge","Never; lis pendens filings are optional"], correct:2, explain:"Utah Code §38-1a-701(3) requires the claimant, within the time for filing the enforcement action, to record a notice of the pendency of the action with each applicable county recorder. If the claimant fails to do so, the lien is void except as to persons who have been made parties to the action and persons having actual knowledge of the commencement of the action.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-701(3)"},
  {topic:"Lien Laws", q:"On a Utah public construction project, a person who has not been paid in full generally may bring an action on the payment bond if unpaid for how long, and how soon must the action be commenced?", opts:["Unpaid 30 days; sue within 90 days","Unpaid 180 days; no lawsuit deadline","There is no bond claim; the only remedy is a mechanic's lien on the public building","Unpaid 90 days after the last day of labor, service, or supply; commence the action within one year after that last day"], correct:3, explain:"Utah Code §63G-6a-1103 provides a right of action on the required payment bond if the person has not been paid in full within 90 days after the last day the person performed the labor or service or supplied the equipment or material, and the action is barred if not commenced within one year after that last day. Section 14-1-18 applies that bond requirement to public buildings and public work of the state and its political subdivisions.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 63G-6a-1103 (public payment-bond claims)"},
  {topic:"Contract Management", q:"Which statement about enforceability of construction contracts is true under Utah law?", opts:["A construction contract is not automatically void just because it is oral; the statute of frauds requires a writing for listed agreements, including those that by their terms cannot be performed within one year","Every construction contract must be in writing to be legally enforceable","Oral construction contracts are never enforceable in Utah","A construction contract is enforceable only if it is notarized"], correct:0, explain:"Utah Code §25-5-4 requires a writing, signed by the party to be charged, for certain listed agreements — including an agreement that by its terms is not to be performed within one year — not for every construction contract. An oral construction contract can be enforceable if it does not fall within those listed categories.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 25-5-4 (statute of frauds)"},
  {topic:"Contract Management", q:"Which statement about contingent payment (pay-if-paid or pay-when-paid) clauses is true under Utah law?", opts:["They are fully enforceable in every setting and defeat both contract claims and liens","The existence of a contingent payment contract is not a defense to a preconstruction or construction lien, except on private residential work of four units or less","They are illegal and void in every construction contract","They apply only to public projects"], correct:1, explain:"Utah Code §13-8-4(3)(a) states that the existence of a contingent payment contract is not a defense to a claim to enforce a preconstruction or construction lien. Subsection (3)(b) carves out private residential work of four units or less. The statute does not say that such clauses are illegal in all contracts, nor that they defeat lien claims on covered projects.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-4(3)(a) (contingent payment / liens)"},
  {topic:"Contract Management", q:"On a contract covered by Utah's retainage statute, interest that accrues on retainage withheld by the owner or public agency is:", opts:["Kept by the owner as a financing fee","Paid only to the project lender","For the benefit of the contractor and subcontractors","Not allowed; retainage must be held in a non-interest account"], correct:2, explain:"Utah Code §13-8-5(4) requires retainage withheld by the owner or public agency to be placed in an interest-bearing account. The accrued interest is for the benefit of the contractor and subcontractors and is paid after the project is completed and accepted. The contractor must distribute that interest to subcontractors on a pro rata basis.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-5(4) (retainage)"},
  {topic:"Contract Management", q:"Is the prevailing party in every Utah construction dispute automatically entitled to attorney's fees?", opts:["Yes, Utah law awards attorney's fees to the winner of any construction dispute","Yes, but only if the amount in dispute exceeds $10,000","No, attorney's fees are never recoverable in any construction case","No. Fees are not automatic in every dispute; a successful party may recover reasonable fees in a lien-enforcement action under §38-1a-707, and in a retainage-collection action under §13-8-5"], correct:3, explain:"Utah follows the usual rule that attorney's fees are not awarded in every dispute unless a statute or contract says so. Utah Code §38-1a-707 allows the successful party in an action to enforce a lien under that chapter to recover reasonable attorney's fees, and §13-8-5 allows fees to the successful party in an action to collect retainage withheld in violation of that section. There is no general statute awarding fees in every construction dispute.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 38-1a-707 and 13-8-5"},
  {topic:"Contract Management", q:"What interest may the parties agree to charge on past-due amounts in a lawful Utah construction contract?", opts:["The parties may agree upon any rate; if they do not specify a rate, the legal rate is 10% per year","No more than 10%","No more than 18%","No more than 24%"], correct:0, explain:"Utah Code §15-1-1(1) allows the parties to a lawful contract to agree upon any rate of interest. Subsection (2) sets a legal rate of 10% per annum if the parties do not expressly specify a different rate. Separately, §38-1a-309 caps the interest on a lien claimed by a person who is not in privity of contract with the owner or owner-builder at that 10% legal rate.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 15-1-1 and 38-1a-309 (interest)"},
  {topic:"Contract Management", q:"Which statement about change orders is true under Utah law?", opts:["Every change order must be in writing or it is automatically void","Utah law does not require every change order to be in writing; the statute of frauds requires a writing only for listed agreements, such as those that cannot be performed within one year","Change orders are enforceable only if recorded with the county recorder","Change orders are illegal on private projects"], correct:1, explain:"Utah Code §25-5-4 requires a writing for certain listed agreements, including those that by their terms cannot be performed within one year. It does not say that every construction change order must be written to be enforceable. A contract may itself require written change orders, but that is a contract term, not a universal statutory rule.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 25-5-4 (statute of frauds)"},
  {topic:"Contract Management", q:"Retainage withheld by an owner or public agency on a contract covered by Utah Code §13-8-5 must be:", opts:["Held in the owner's general operating account","Turned over to the county recorder","Placed in an interest-bearing account and accounted for separately from other amounts paid under the contract","Paid immediately to the original contractor's payroll account"], correct:2, explain:"Utah Code §13-8-5(4)(a) requires retainage withheld by the owner or public agency to be placed in an interest-bearing account and accounted for separately from other amounts paid under the contract.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-5(4)(a) (retainage)"},
  {topic:"Contract Management", q:"On a contract covered by Utah Code §13-8-5, retainage and accrued interest must generally be released within how many days of the later of the listed statutory trigger dates?", opts:["10 days","30 days","180 days","45 days"], correct:3, explain:"Utah Code §13-8-5(5) generally requires retainage and accrued interest to be released pursuant to a billing statement from the contractor within 45 days from the later of specified events, including the date the owner or public agency receives the billing statement and specified occupancy, acceptance, or final-pay-quantity dates.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-5(5)"},
  {topic:"Contract Management", q:"An owner, public agency, original contractor, or subcontractor who knowingly and wrongfully withholds retainage under Utah Code §13-8-5 is subject to a charge of:", opts:["2% per month on the improperly withheld amount, in addition to any interest otherwise due","1% per year","10% once, as a flat penalty","No monetary penalty, only an injunction"], correct:0, explain:"Utah Code §13-8-5(10)(b) imposes a charge of 2% per month on the improperly withheld amount, in addition to any interest otherwise due, payable to the contractor or subcontractor from whom the retainage was wrongfully withheld.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-5(10)(b)"},
  {topic:"Contract Management", q:"Which statement about payment under a Utah construction contract is true?", opts:["A contractor may ignore scheduled payment dates if cash is tight","A party to a construction contract shall make all scheduled payments under the terms of the contract","Payment is due only after a mechanic's lien is recorded","Scheduled payments apply only to public projects"], correct:1, explain:"Utah Code §13-8-4(2) states that a party to a construction contract shall make all scheduled payments under the terms of the construction contract.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-4(2)"},
  {topic:"Contract Management", q:"May a party to a contract covered by Utah's retainage statute require another party to waive that statute?", opts:["Yes, if the waiver is in the original contract","Yes, after substantial completion only","No. A party to a construction contract may not require any other party to waive any provision of Utah Code §13-8-5","Yes, on residential projects only"], correct:2, explain:"Utah Code §13-8-5(11) states that a party to a construction contract may not require any other party to waive any provision of that section.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-5(11)"},
  {topic:"Contract Management", q:"If a lawful Utah construction contract does not specify an interest rate, the legal rate is:", opts:["5% per year","18% per year","24% per year","10% per year"], correct:3, explain:"Utah Code §15-1-1(2) provides that unless the parties expressly specify a different rate, the legal rate of interest is 10% per annum. Section 38-1a-309 applies that same rate to a construction or preconstruction contract, and to a lien, unless the contract provides otherwise.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 15-1-1(2) (legal interest)"},
  {topic:"Contract Management", q:"Before signing a contingent payment subcontract, the subcontractor:", opts:["May request, and the contractor shall provide, financial information the contractor has received about the project financing and the paying party","Has no right to any project-financing information","Must file a preliminary notice before even requesting information","May request the information only after work is complete"], correct:0, explain:"Utah Code §13-8-4(4) allows the subcontractor, if the contract is a contingent payment contract, to request the financial information the contractor has received regarding the project financing and the public or private party, and requires the contractor to provide that information before the subcontractor signs.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-4(4)"},
  {topic:"Business Organization", q:"Under current Utah LLC law, a member or manager is personally liable for the LLC's debts:", opts:["Automatically, solely by reason of being a member or manager","Not solely by reason of being or acting as a member or manager; an LLC's debt is solely the LLC's debt","Only after the LLC has been in existence for one year","Only if the LLC has more than one member"], correct:1, explain:"Utah Code §16-20-304(1) (effective October 1, 2026, succeeding former §48-3a-304) provides that a debt, obligation, or other liability of an LLC is solely the LLC's, and that a member or manager is not personally liable solely by reason of being or acting as a member or manager. This applies even after dissolution. It does not erase liability the person separately assumes, such as a personal guarantee.", commonlyMissed:true, ref:"HBA book: Business Organization section, Utah Code 16-20-304 (LLC liability shield; formerly 48-3a-304)"},
  {topic:"Business Organization", q:"Under Utah LLC law, failure to observe company formalities:", opts:["Automatically makes every member personally liable for all LLC debts","Requires the Division to dissolve the LLC within 30 days","Is not, by itself, a ground for imposing liability on a member or manager for an LLC debt","Converts the LLC into a general partnership"], correct:2, explain:"Utah Code §16-20-304(2) states that failure of an LLC to observe formalities relating to the exercise of its powers or management of its activities and affairs is not a ground for imposing liability on a member or manager for an LLC debt. Personal guarantees and other separately assumed obligations are a different issue.", commonlyMissed:true, ref:"HBA book: Business Organization section, Utah Code 16-20-304 (failure to observe formalities)"},
  {topic:"Business Organization", q:"Is a member an agent of a Utah LLC solely because the person is a member?", opts:["Yes, every member can bind the LLC on any contract","Yes, but only for contracts under $7,000","Yes, after the LLC is dissolved","No. A member is not an agent of a limited liability company solely by reason of being a member"], correct:3, explain:"Utah Code §16-20-301(1) (effective October 1, 2026) provides that a member is not an agent of a limited liability company solely by reason of being a member. Authority to bind the company comes from the company's organic rules, a grant of authority, or other law — not from membership status alone.", commonlyMissed:true, ref:"HBA book: Business Organization section, Utah Code 16-20-301 (member is not an agent solely by membership)"},
  {topic:"Safety", q:"In a trench that is 4 feet or more deep, OSHA requires a stairway, ladder, ramp, or other safe means of egress located so that a worker's lateral travel is no more than:", opts:["25 feet","10 feet","15 feet","50 feet"], correct:0, explain:"29 CFR 1926.651(c)(2) requires a stairway, ladder, ramp, or other safe means of egress in trench excavations that are 4 feet or more in depth, located so as to require no more than 25 feet of lateral travel for employees.", commonlyMissed:true, ref:"OSHA 29 CFR 1926.651(c)(2) (trench egress); HBA book: Safety section"},
  {topic:"Safety", q:"OSHA generally requires excavated materials (spoils) and other materials or equipment that could fall or roll into an excavation to be kept at least how far from the edge, unless a sufficient retaining device is used?", opts:["6 inches","2 feet","6 feet","10 feet"], correct:1, explain:"29 CFR 1926.651(j)(2) requires protection by placing and keeping such materials or equipment at least 2 feet from the edge of excavations, or by using retaining devices sufficient to prevent materials or equipment from falling or rolling into excavations, or both if necessary.", commonlyMissed:true, ref:"OSHA 29 CFR 1926.651(j)(2) (spoils setback); HBA book: Safety section"},
  {topic:"Safety", q:"When employee exposure can be reasonably anticipated, a competent person must inspect an excavation:", opts:["Only when OSHA is on site","Once, at the beginning of the project only","Daily before the start of work and as needed during the shift, and after every rainstorm or other hazard-increasing occurrence","Only after a cave-in has already occurred"], correct:2, explain:"29 CFR 1926.651(k)(1) requires a competent person to inspect the excavation, adjacent areas, and protective systems daily prior to the start of work and as needed throughout the shift, and also after every rainstorm or other hazard-increasing occurrence, when employee exposure can be reasonably anticipated.", commonlyMissed:true, ref:"OSHA 29 CFR 1926.651(k) (excavation inspections); HBA book: Safety section"},
  {topic:"Safety", q:"When a portable ladder is used to reach an upper landing, the side rails must generally extend above that landing by at least:", opts:["1 foot","6 feet","10 feet","3 feet"], correct:3, explain:"29 CFR 1926.1053(b)(1) requires that when portable ladders are used for access to an upper landing surface, the ladder side rails extend at least 3 feet above the upper landing surface, unless the ladder is properly secured to a rigid support and a suitable grasping device is provided.", commonlyMissed:true, ref:"OSHA 29 CFR 1926.1053(b)(1) (ladder extension above landing); HBA book: Safety section"},
  {topic:"Safety", q:"An employer required to complete the OSHA Form 300A annual summary must generally post it from:", opts:["February 1 through April 30","January 1 through January 31","July 1 through December 31","Only on the day of an OSHA inspection"], correct:0, explain:"29 CFR 1904.32 requires the employer to post the Form 300A annual summary in a conspicuous place from February 1 through April 30 of the year following the calendar year covered by the records.", commonlyMissed:true, ref:"OSHA 29 CFR 1904.32 (Form 300A posting); HBA book: Safety section"},
  {topic:"Safety", q:"Hazard communication on a construction site requires employees to have access to information about hazardous chemicals, including:", opts:["Only a verbal warning from a coworker","Safety Data Sheets and the other required elements of the Hazard Communication standard","A single poster with no chemical-specific information","Nothing, because construction is exempt from hazard communication rules"], correct:1, explain:"OSHA's Hazard Communication standard, 29 CFR 1910.1200, applies to construction through 29 CFR 1926.59. Employers must have a hazard-communication program, label containers, provide Safety Data Sheets, and train employees on hazardous chemicals in the workplace.", commonlyMissed:true, ref:"OSHA 29 CFR 1910.1200 and 1926.59 (hazard communication / SDS); HBA book: Safety section"},
  {topic:"Tax Laws", q:"A contractor should generally report wages paid to an employee on which form, as distinct from nonemployee compensation paid to an independent contractor?", opts:["Form 1099-NEC for the employee and Form W-2 for the independent contractor","Form 940 for both","Form W-2 for the employee and, when required, Form 1099-NEC for the independent contractor","Form W-9 for both, with no year-end information return"], correct:2, explain:"Employers report wages paid to employees on Form W-2. Nonemployee compensation of $600 or more paid to an independent contractor is generally reported on Form 1099-NEC. Mixing those forms is a common classification and reporting error.", commonlyMissed:true, ref:"IRS Form W-2 vs Form 1099-NEC; HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"An employer's annual federal unemployment (FUTA) tax return is filed on:", opts:["Form 941","Form 1099-NEC","Form W-4","Form 940"], correct:3, explain:"Form 940 is the employer's annual Federal Unemployment Tax Act (FUTA) return. Form 941 is the quarterly return for withheld income tax and the employer and employee shares of Social Security and Medicare taxes, not the annual FUTA return.", commonlyMissed:true, ref:"IRS Form 940 (annual FUTA); HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"Form W-4 is used to:", opts:["Let an employee tell the employer how to calculate federal income tax withholding from wages","Report an independent contractor's annual nonemployee compensation","Apply for an Employer Identification Number","File the employer's annual FUTA return"], correct:0, explain:"An employee completes Form W-4 so the employer can calculate federal income tax withholding from wages. It is not the year-end wage statement (W-2), the independent-contractor reporting form (1099-NEC), or the FUTA return (940).", commonlyMissed:true, ref:"IRS Form W-4 (employee withholding); HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"In addition to the 2.9% Medicare portion of self-employment or FICA tax, an additional Medicare tax of 0.9% generally applies to earnings above a statutory threshold. That additional 0.9% is:", opts:["Split equally by a 0.45% employer match","Paid only by the employee or self-employed individual; there is no employer match","Paid only by the employer","Repealed and no longer in effect"], correct:1, explain:"The Additional Medicare Tax of 0.9% under the Internal Revenue Code applies to wages or self-employment income above the statutory threshold and is not matched by an employer. That is separate from the base 1.45% employee / 1.45% employer Medicare tax (or the 2.9% Medicare portion of self-employment tax).", commonlyMissed:true, ref:"IRC Additional Medicare Tax (0.9%); HBA book: Tax Laws section"},
