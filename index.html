<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UT B100 Business &amp; Law — Practice Exam</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --blue-950:#0a1f33;
    --blue-900:#0e2a44;
    --blue-800:#123657;
    --line:#4f90c4;
    --line-soft:#2e5478;
    --amber:#e0a548;
    --brick:#c1543a;
    --green:#5f9e6e;
    --ink:#eaf1f7;
    --ink-dim:#a9bdd0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--blue-950);
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:28px 28px;
    background-position:-1px -1px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 18px;}

  header.top{border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:22px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:28px;line-height:1.15;margin:0 0 8px 0;}
  .sub{color:var(--ink-dim);font-size:14px;line-height:1.5;}
  .blueprint-badge{display:inline-block;border:1.5px solid var(--line);border-radius:2px;padding:2px 8px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--line);margin-right:6px;margin-top:10px;}
  .blueprint-badge.weak{border-color:var(--brick);color:var(--brick);}

  .panel{background:var(--blue-900);border:1px solid var(--line-soft);border-radius:4px;padding:18px;margin-bottom:16px;}
  .breakdown-row{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-bottom:9px;}
  .breakdown-label{font-family:'IBM Plex Mono',monospace;width:150px;flex-shrink:0;color:var(--ink-dim);}
  .breakdown-label.weak{color:var(--brick);font-weight:600;}
  .bar-track{flex:1;height:8px;background:var(--blue-800);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--line);}
  .bar-fill.weak{background:var(--brick);}
  .breakdown-pct{font-family:'IBM Plex Mono',monospace;width:52px;text-align:right;color:var(--ink);flex-shrink:0;}

  button.primary{background:var(--amber);color:var(--blue-950);border:none;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;letter-spacing:0.03em;padding:14px 20px;border-radius:3px;width:100%;cursor:pointer;margin-top:8px;}
  button.primary:active{transform:translateY(1px);}
  button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:10px 16px;border-radius:3px;cursor:pointer;width:100%;margin-top:10px;}
  button.secondary{background:var(--blue-800);color:var(--amber);border:1.5px solid var(--amber);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;padding:12px 16px;border-radius:3px;width:100%;cursor:pointer;margin-top:10px;}

  .progress-row{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);margin-bottom:10px;}
  .progress-track{height:5px;background:var(--blue-800);border-radius:3px;overflow:hidden;margin-bottom:20px;}
  .progress-fill{height:100%;background:var(--amber);transition:width .25s ease;}

  .topic-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--blue-950);background:var(--line);padding:3px 8px;border-radius:2px;margin-bottom:12px;}
  .topic-tag.weak{background:var(--brick);}

  .question-card{background:var(--blue-900);border:1px solid var(--line-soft);border-radius:4px;padding:20px 18px 18px 18px;}
  .q-text{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.35;margin:0 0 16px 0;}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--blue-800);border:1.5px solid transparent;color:var(--ink);font-family:'Inter',sans-serif;font-size:14.5px;line-height:1.4;padding:12px 12px;border-radius:3px;margin-bottom:9px;cursor:pointer;}
  .opt .letter{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--line);flex-shrink:0;}
  .opt.correct{border-color:var(--green);background:rgba(95,158,110,0.18);}
  .opt.correct .letter{color:var(--green);}
  .opt.incorrect{border-color:var(--brick);background:rgba(193,84,58,0.18);}
  .opt.incorrect .letter{color:var(--brick);}
  .opt:disabled{cursor:default;}

  .explain{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-soft);font-size:13.5px;line-height:1.55;color:var(--ink-dim);}
  .explain b{color:var(--ink);}

  .ref-line{font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.5;color:var(--amber);margin:-4px 0 14px 0;}
  .ref-line .ref-label{color:var(--ink-dim);letter-spacing:0.06em;text-transform:uppercase;font-size:10.5px;margin-right:6px;}
  .ref-toggle{background:none;border:none;color:var(--line);font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;padding:0;margin-left:8px;text-decoration:underline;white-space:nowrap;}
  .ref-toggle:hover{color:var(--amber);}
  .ref-line.ref-hidden{color:var(--ink-dim);}

  .nav-row{display:flex;gap:10px;margin-top:16px;}

  .score-hero{text-align:center;padding:26px 0 10px 0;}
  .score-num{font-family:'Fraunces',serif;font-weight:700;font-size:64px;line-height:1;}
  .score-num.pass{color:var(--green);}
  .score-num.fail{color:var(--brick);}
  .score-label{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-dim);margin-top:6px;}

  .topic-result-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:9px 0;border-bottom:1px solid var(--blue-800);}
  .topic-result-row:last-child{border-bottom:none;}
  .topic-score{font-family:'IBM Plex Mono',monospace;color:var(--ink-dim);}
  .topic-result-row.weak span:first-child{color:var(--brick);font-weight:600;}

  footer{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--line-soft);margin-top:26px;}
  .mode-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .mode-btn{flex:1 1 calc(50% - 4px);background:var(--blue-800);border:1.5px solid var(--line-soft);color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:10px 8px;border-radius:3px;cursor:pointer;text-align:center;}
  .mode-btn.active{border-color:var(--amber);color:var(--amber);}

  .history-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--blue-800);font-family:'IBM Plex Mono',monospace;}
  .history-row:last-child{border-bottom:none;}
  .history-score{font-weight:600;}
  .history-score.pass{color:var(--green);}
  .history-score.fail{color:var(--brick);}
  .history-meta{color:var(--ink-dim);}
  .empty-note{color:var(--ink-dim);font-size:13px;font-style:italic;}
</style>
</head>

<script>
// Nando's official Prov score reports — most recent first.
// LAST_SCORE and weak-area mode use the latest report; earlier official attempts stay in SCORE_REPORTS for history.
const SCORE_REPORTS = [
  {
    date: "07/29/2026",
    scores: {
      "Business Organization": {correct:4, total:4},
      "Contract Management": {correct:5, total:6},
      "Estimating and Bidding": {correct:3, total:6},
      "Financial Management": {correct:5, total:6},
      "Labor Laws": {correct:3, total:6},
      "Licensing": {correct:6, total:10},
      "Lien Laws": {correct:2, total:3},
      "Project Management": {correct:2, total:5},
      "Risk Management": {correct:3, total:5},
      "Safety": {correct:2, total:4},
      "Tax Laws": {correct:2, total:5}
    }
  },
  {
    date: "03/20/2026",
    scores: {
      "Business Organization": {correct:1, total:4},
      "Contract Management": {correct:1, total:6},
      "Estimating and Bidding": {correct:4, total:6},
      "Financial Management": {correct:4, total:6},
      "Labor Laws": {correct:3, total:6},
      "Licensing": {correct:5, total:10},
      "Lien Laws": {correct:1, total:3},
      "Project Management": {correct:5, total:5},
      "Risk Management": {correct:3, total:5},
      "Safety": {correct:0, total:4},
      "Tax Laws": {correct:2, total:5}
    }
  }
];
const LATEST_REPORT = SCORE_REPORTS[0];
const LAST_SCORE = LATEST_REPORT.scores;
const WEAK_THRESHOLD = 0.5;
function isWeak(topic){
  const s = LAST_SCORE[topic];
  if(!s) return false;
  return (s.correct/s.total) < WEAK_THRESHOLD;
}
function reportTotals(scores){
  let correct = 0, total = 0;
  Object.values(scores).forEach(s => { correct += s.correct; total += s.total; });
  return {correct, total, pct: Math.round((correct/total)*100)};
}
function formatTopicList(topics){
  if(!topics || topics.length === 0) return "none under the 50% cutoff";
  if(topics.length === 1) return topics[0];
  if(topics.length === 2) return topics[0] + " and " + topics[1];
  return topics.slice(0, -1).join(", ") + ", and " + topics[topics.length - 1];
}

// Expanded question bank — each topic has more questions than any single quiz uses,
// so "shuffle a new set" pulls a genuinely different mix each time.
const QUESTIONS = [
  {topic:"Business Organization", q:"An LLC owner personally guarantees a business loan for equipment. If the LLC later defaults, the owner's personal assets are:", opts:["Fully protected for that loan as well, because an LLC is said to shield every company debt including personal guarantees","Exposed for that specific guaranteed debt, despite the LLC's general liability protection","Protected so long as the owner is also listed as the company's qualifier of record on the license","Automatically forgiven under LLC law once the company itself is dissolved or formally defaults"], correct:1, explain:"A personal guarantee creates individual liability for that specific debt, overriding the LLC's protection for that obligation regardless of the entity structure.", commonlyMissed:true, ref:"NASCLA guide: Business Organization, personal guarantees"},
  {topic:"Business Organization", q:"'Piercing the corporate veil' is a legal doctrine that allows a court to:", opts:["Dissolve a corporation automatically for late tax filings, even when owners respected corporate formalities","Hold owners personally liable despite a corporate/LLC structure, typically due to fraud or ignoring corporate formalities","Automatically transfer ownership of the company to creditors whenever a business debt goes unpaid, without a separate foreclosure step","Require a company to change its legal business name after any lawsuit is filed against it, even if the company name stays the same"], correct:1, explain:"Courts can disregard the liability shield and reach owners' personal assets when formalities are ignored or the entity is used to commit fraud or injustice.", commonlyMissed:true, ref:"NASCLA guide: Business Organization, piercing the corporate veil"},
  {topic:"Business Organization", q:"By default, a single-member LLC that hasn't elected corporate tax treatment is taxed by the IRS as:", opts:["A C-corporation that files its own corporate income-tax return each year","A disregarded entity, with income reported on the owner's personal return","An automatically tax-exempt organization that owes no federal income tax","A general partnership, even though the company has only one owner"], correct:1, explain:"A single-member LLC is a 'disregarded entity' by default — its income/loss flows directly to the owner's personal tax return unless an election is made otherwise.", commonlyMissed:true, ref:"NASCLA guide: Business Organization, LLC tax treatment (disregarded entity)"},
  {topic:"Business Organization", q:"An LLC elects to be taxed as an S-corporation instead of its default disregarded-entity/partnership tax treatment. This election primarily changes:", opts:["The LLC's liability protection for its owners, making the personal shield stronger than before the election","How income can be split between salary and distributions, which may affect self-employment tax, not the LLC's liability shield","Whether the LLC still needs a contractor license to perform licensed construction work in Utah, so the LLC could drop its contractor license","Whether the LLC is allowed to have more than one owner after the tax election is filed, limiting the LLC to a single owner after the election"], correct:1, explain:"An S-corp tax election is purely a tax-treatment choice, primarily affecting self-employment tax exposure via salary/distribution splits — it does not change or enhance the LLC's liability shield, which comes from the entity type itself, not the tax election.", commonlyMissed:true, ref:"NASCLA guide: Business Organization, S-corporation tax election"},
  {topic:"Business Organization", q:"A limited liability partnership (LLP) most specifically protects an individual partner from personal liability for:", opts:["All debts and obligations of the partnership under any circumstance, including the partner's own malpractice, including debts the partner personally guaranteed","The malpractice, negligence, or misconduct of the other partners, not necessarily the partner's own acts or personally guaranteed debts","Only the partner's own negligent work, while remaining fully liable for co-partners' malpractice, leaving the partner exposed for co-partners' malpractice","Criminal liability for any partner's actions, including crimes the partner did not personally commit, including crimes the partner did not take part in"], correct:1, explain:"LLP status is narrower than many assume — it typically shields a partner from liability caused by co-partners' negligence or misconduct, but doesn't necessarily eliminate liability for the partner's own actions or personally guaranteed debts.", commonlyMissed:true, ref:"NASCLA guide: Business Organization, partnerships and LLPs"},
  {topic:"Contract Management", q:"What is 'retainage' in a construction contract?", opts:["A late fee the owner must pay if a progress invoice is not processed by a stated date in the contract","A percentage of each progress payment withheld until the work is satisfactorily completed and accepted","A state tax automatically withheld from every construction contract payment, at a set percentage of the invoice","An insurance deductible the contractor must pay before a liability claim is covered under the policy"], correct:1, explain:"Retainage is a portion (commonly 5–10%) of each progress payment withheld until the work is completed and accepted.", ref:"NASCLA guide: Contract Management, retainage"},
  {topic:"Contract Management", q:"A 'pay-if-paid' clause in a subcontract differs from a 'pay-when-paid' clause in that pay-if-paid:", opts:["A timing rule only, meaning the sub is still owed payment even if the owner does not pay the GC","Can shift the risk of owner non-payment entirely onto the subcontractor, contingent on the GC actually being paid","A guarantee that the subcontractor will be paid on the original schedule regardless of owner payment","A clause that applies only to change-order work and not to the original subcontract balance"], correct:1, explain:"A pay-if-paid clause makes owner payment to the GC a true condition precedent to paying the sub, shifting non-payment risk downstream — treated differently by courts than a pay-when-paid timing clause.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, pay-if-paid vs pay-when-paid"},
  {topic:"Contract Management", q:"A contract includes both a liquidated damages clause AND allows the owner to also sue for actual/consequential damages from the same delay. This is generally considered:", opts:["Fully enforceable, because the owner may stack both remedies for the same delay period, stacking liquidated damages on top of a later actual-damages lawsuit","Potentially unenforceable as an improper penalty, since liquidated damages are meant to replace, not add to, proof of actual damages","Required under Utah law whenever a contract includes a completion date or liquidated-damages clause","A concern only on public projects, because private contracts may freely combine both remedies"], correct:1, explain:"Courts often view liquidated damages as the exclusive remedy for the delay they cover; stacking actual damages on top can render the clause an unenforceable penalty.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, liquidated damages"},
  {topic:"Contract Management", q:"A 'no-damages-for-delay' clause in a contract generally means:", opts:["The contractor is excused from meeting the schedule and cannot be held to a completion date","The contractor's remedy for an owner-caused delay is limited to a time extension only, not monetary damages","The owner waives all rights to enforce the schedule or to assess delay damages of any kind","The clause is treated as having no legal effect and is ignored when a delay occurs, leaving money damages still available"], correct:1, explain:"This clause limits the contractor's remedy for delay to additional time rather than money, even when the delay is caused by the owner — though some jurisdictions carve out exceptions for bad faith.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, no-damages-for-delay"},
  {topic:"Contract Management", q:"A contractor completes 90% of a project on a lump-sum contract, then the owner terminates for convenience. Absent other contract terms, the contractor is generally entitled to:", opts:["Nothing at all, because payment is earned only if the project reaches final completion, leaving unpaid work-in-place uncompensated","Payment for work properly completed and costs reasonably incurred up to termination, per the termination clause","The full original contract price, including profit on work that was not performed, as if the remaining 10% had been completed","Reimbursement for unused materials only, with no payment for labor already performed, so installed work already performed would go unpaid"], correct:1, explain:"Termination-for-convenience clauses typically entitle the contractor to payment for completed work and reasonably incurred costs, not the full remaining contract value.", ref:"NASCLA guide: Contract Management, termination for convenience"},
  {topic:"Contract Management", q:"A 'flow-down' (or 'flow-through') clause in a subcontract is used to:", opts:["Waive the subcontractor's right to payment if the owner has not yet paid the general contractor","Bind the subcontractor to the same relevant terms and obligations the GC owes the owner in the prime contract","Guarantee the subcontractor an extra profit percentage matching the GC's markup on the prime contract","Eliminate the need for a written subcontract once the prime contract has been signed"], correct:1, explain:"Flow-down clauses pass applicable prime contract obligations (schedule, quality, dispute procedures) down to the subcontractor, keeping obligations consistent through the contract chain.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, flow-down clauses"},
  {topic:"Contract Management", q:"Two clauses conflict: the general conditions say disputes go to arbitration, but a later-signed addendum says disputes go to court. Under standard contract interpretation, which typically controls?", opts:["The general conditions control, because they were part of the original signed contract set","Generally, the more specific and/or later-executed document controls over the earlier general terms","Neither clause is valid, so the contract has no enforceable dispute-resolution process","A judge assigned before the addendum was signed must decide which clause to follow"], correct:1, explain:"Standard interpretation principles generally favor specific and later-in-time provisions over earlier general ones when contract documents conflict.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, order of precedence / conflicting clauses"},
  {topic:"Contract Management", q:"'Substantial completion' differs from 'final completion' in that substantial completion generally:", opts:["Means the contractor has been fully paid and all retainage has already been released, after retainage has already been released","Marks when the owner can use or occupy the project for its intended purpose, even though minor punch-list items remain","Is simply another name for final completion, with no practical difference in rights or timing","Applies only on public projects and is not used to measure completion on private work, leaving private jobs to use only final completion"], correct:1, explain:"Substantial completion is a specific milestone (usable for intended purpose) that starts warranty clocks and often partial retainage release, while final completion requires all remaining punch list items to be finished — conflating the two is a common costly mistake.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, substantial completion vs final completion"},
  {topic:"Contract Management", q:"A contract requires written notice of any claim within 10 days of the event giving rise to it, or the claim is waived. A contractor discovers a differing site condition and submits written notice on day 12. Under a strictly enforced notice clause, the claim is most likely:", opts:["Still valid, because missing a notice deadline by two days is treated as a minor technicality","Waived, since strict contractual notice deadlines are generally enforced even if the contractor later acted promptly","Automatically preserved, because differing-site-condition claims are exempt from contractual notice deadlines","Valid only if the owner later agrees in writing to accept the late notice, and without that later written acceptance the late notice would still be timely"], correct:1, explain:"Courts often strictly enforce contractual notice-of-claim deadlines as written; missing the deadline — even by a couple of days, even with a legitimate underlying claim — can waive the claim entirely absent a specific contract exception.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, claim notice provisions"},
  {topic:"Contract Management", q:"An integration (merger) clause in a signed contract most specifically means:", opts:["The contract merges two companies into one legal entity for the duration of the project, combining the owner's and contractor's businesses into a single project entity","The written contract represents the entire and final agreement between the parties, superseding prior verbal or written negotiations on the same subject","The contract automatically renews each year unless a party gives notice of cancellation after the initial term, without any further signed agreement","Change orders are no longer allowed after the original contract has been signed, so later written modifications would be ineffective once the contract is signed"], correct:1, explain:"An integration/merger clause has real legal weight — it bars a party from later claiming a prior verbal promise or earlier draft term still applies, since the final written contract is treated as the complete agreement.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, integration (merger) clauses"},
  {topic:"Contract Management", q:"A 'differing site conditions' clause and a 'no-damages-for-delay' clause appear in the same contract. If an unforeseen differing site condition causes a delay, which clause's protection for the contractor typically controls, absent clearer contract language?", opts:["The no-damages-for-delay clause automatically controls and bars any time or money for the unforeseen condition, with no time extension or extra compensation available for the differing site condition","This depends on the specific contract language: differing-site-conditions clauses are often carved out from a no-damages-for-delay bar, but only if the contract actually says so","The differing-site-conditions clause automatically overrides the delay clause, even if the contract has no carve-out, so the contractor would recover delay money even if the contract is silent on a carve-out","Both clauses are cancelled, and the parties must renegotiate the entire contract from scratch, leaving neither clause in effect until a replacement contract is signed"], correct:1, explain:"These clauses can genuinely conflict; whether a differing site conditions claim escapes a no-damages-for-delay bar depends entirely on the specific carve-out language in that contract — there's no universal default, which is exactly why this trips people up.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, differing site conditions"},
  {topic:"Contract Management", q:"Under Utah Code §78B-2-225, which statement best describes the time limits for a construction-defect claim against a builder?", opts:["All construction-defect claims are barred 6 years after completion, which is Utah's only statute of repose for every claim type, with no separate 2-year discovery period and no longer outer limit that varies by claim type","Contract or warranty claims generally must be commenced within 6 years after completion or abandonment; other claims generally have 2 years from discovery and may not be commenced more than 9 years after completion or abandonment","All claims have 2 years from discovery, and there is no outer deadline measured from completion or abandonment, so a contract or warranty claim could be filed many years after completion if it was recently discovered","There is a single 10-year statute of repose that applies the same way to contract, warranty, and all other claims, so contract, warranty, and discovery-based claims would all share that single 10-year outer limit"], correct:1, explain:"Utah Code §78B-2-225 distinguishes two clocks: subsection (3) generally requires contract or warranty actions within 6 years after completion or abandonment, while subsection (4) generally requires all other actions within 2 years of discovery (or when they should have been discovered) and, except for a limited year-8/9 discovery extension, bars those other actions more than 9 years after completion or abandonment. Exceptions include fraudulent concealment and willful or intentional acts. It is therefore inaccurate to treat 6 years as a single hard repose period for every defect claim.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 78B-2-225 (construction-defect time limits)", numeric:true},
  {topic:"Estimating and Bidding", q:"An allowance in a bid or contract (e.g., '$5,000 allowance for flooring') is used when:", opts:["The final material selection has not been made yet, so a placeholder budget is set and later adjusted to the actual selection's cost","The contractor wants to avoid liability for that part of the work by leaving it out of the contract entirely, with no later adjustment for the actual material chosen","The item is guaranteed to cost exactly that allowance amount, with no later adjustment up or down once the final material is selected","No work will actually be performed in that category, so the allowance is only a bid-form placeholder and is not later reconciled to an actual selection"], correct:0, explain:"Allowances set a placeholder budget for items the owner hasn't finalized yet, to be adjusted once the actual selection and cost are known.", ref:"NASCLA guide: Bidding and Estimating, allowances"},
  {topic:"Estimating and Bidding", q:"A job has direct costs of $80,000. The contractor applies 10% overhead and then 10% profit, each calculated on the running subtotal. What is the approximate total bid price?", opts:["$96,000","$96,800","$100,000","$88,000"], correct:1, explain:"$80,000 + 10% overhead ($8,000) = $88,000; then + 10% profit on that subtotal ($8,800) = $96,800 total bid.", commonlyMissed:true, ref:"NASCLA guide: Bidding and Estimating, overhead and profit applied to a running subtotal", numeric:true},
  {topic:"Estimating and Bidding", q:"A contractor's estimate assumes 4 workers for 10 days at 8 hours/day, but the actual crew size needed is 5 workers for the same duration. What best describes the estimating error?", opts:["A unit-price error only, because the labor hours were estimated correctly and only the hourly rate was wrong","An underestimation of labor quantity (man-hours), which will compress margins if not corrected before bidding","No error, because using 4 workers or 5 workers does not change the total labor hours in the estimate","A materials takeoff error, because crew size affects only the quantity of materials needed for the work"], correct:1, explain:"Underestimating the number of workers needed understates total labor hours and cost, a quantity (not pricing) estimating error that erodes profit if uncorrected.", ref:"NASCLA guide: Bidding and Estimating, labor productivity / crew-size errors"},
  {topic:"Estimating and Bidding", q:"Two bids come in for the same scope: Bid A is a lump sum of $150,000; Bid B is $140,000 plus unit prices for site conditions that 'may' add up to $20,000. From a risk standpoint, the owner should recognize that:", opts:["Bid B is definitely cheaper overall, because its base price is $10,000 lower than Bid A's lump sum","Bid A offers more cost certainty, while Bid B carries potential upside/downside risk tied to actual field conditions","Lump-sum bids are not a permitted pricing method on projects that also allow unit prices for site work","Unit-price bids cannot exceed the stated allowance cap, so Bid B cannot cost more than $140,000"], correct:1, explain:"Lump sum pricing transfers quantity risk to the contractor and gives the owner price certainty, while unit-price/allowance structures leave final cost dependent on actual conditions.", ref:"NASCLA guide: Bidding and Estimating, lump-sum vs unit-price bids"},
  {topic:"Estimating and Bidding", q:"A contractor discovers a takeoff error the day before a bid is due that would raise their price by 8%. The most defensible course of action is to:", opts:["Submit the original uncorrected bid, to avoid looking disorganized so close to the bid deadline","Correct the error and submit the accurate, adjusted bid, even if it changes their competitive position","Submit the low bid as written and plan to recover the 8% difference through later change orders","Withdraw the bid entirely rather than correct the takeoff and submit a revised figure"], correct:1, explain:"Submitting a known-inaccurate bid to appear competitive, intending to recover cost later through change orders, is a red flag for bad-faith bidding practice — correcting and submitting an accurate number is the defensible path.", ref:"NASCLA guide: Bidding and Estimating, takeoff errors before bid"},
  {topic:"Estimating and Bidding", q:"A general contractor receives a bid bond requirement of 5% of the bid amount on a project. What is this bond amount if the bid is $400,000?", opts:["$4,000","$20,000","$40,000","$2,000"], correct:1, explain:"5% of $400,000 is $20,000 — the bid bond amount tied to that bid.", ref:"NASCLA guide: Bidding and Estimating, bid bonds", numeric:true},
  {topic:"Estimating and Bidding", q:"A contractor wants a 20% GROSS MARGIN on a job with $80,000 in direct costs (margin calculated on the final selling price, not on cost). What should the bid price be?", opts:["$96,000","$100,000","$104,000","$88,000"], correct:1, explain:"For a 20% margin on price: Price × (1 − 0.20) = Cost, so Price = $80,000 ÷ 0.80 = $100,000. This differs from a 20% MARKUP on cost, which would instead be $80,000 × 1.20 = $96,000 — mixing up margin-on-price versus markup-on-cost is a classic estimating error.", commonlyMissed:true, ref:"NASCLA guide: Bidding and Estimating, margin vs markup math", numeric:true},
  {topic:"Estimating and Bidding", q:"Two contractors both claim to add '15% profit' to a $100,000 cost job — one calculates it as a markup on cost, the other as a margin on the final price. Their resulting bid prices will be:", opts:["Identical, because both contractors used the same nominal 15% and the same $100,000 cost figure, producing the same bid price under both the markup-on-cost and margin-on-price methods","Different — the margin-on-price method yields a higher bid price ($117,647) than the markup-on-cost method ($115,000) for the same nominal '15%'","Different, but the markup-on-cost method yields the higher bid price of the two 15% approaches, so a 15% markup on the $100,000 cost would exceed a 15% margin on the selling price","Impossible to determine from the given figures, because a 15% rate cannot be converted either way, as if 15% markup and 15% margin could not be computed from a known $100,000 cost"], correct:1, explain:"Markup-on-cost: $100,000 × 1.15 = $115,000. Margin-on-price: Price = $100,000 ÷ (1 − 0.15) = $117,647. The same percentage produces different dollar results depending on which base it's applied to — a frequent source of bidding confusion.", commonlyMissed:true, ref:"NASCLA guide: Bidding and Estimating, markup vs margin math", numeric:true},
  {topic:"Estimating and Bidding", q:"A bid includes a unit price of $45/linear foot for site utility trenching, with an estimated 800 linear feet, but the engineer's estimate shows only 750 linear feet as the likely actual quantity. If actual field quantities come in at 750 LF, standard unit-price contract practice generally means the contractor is paid:", opts:["For the original estimated 800 LF, regardless of how many linear feet were actually installed in the field, so the contractor would still be paid for the unused 50 linear feet at $45/LF","For the actual 750 LF installed, at the agreed $45/LF unit rate; unit pricing adjusts to true field quantities rather than locking in the estimate","Nothing, because the engineer's estimated quantity did not match the 800 LF shown in the bid, leaving the 750 LF of installed trench unpaid because it did not match the bid quantity","A newly renegotiated lump-sum amount for the entire contract, not the unit rate times actual quantity, replacing the $45/LF unit price with a newly negotiated single lump-sum figure"], correct:1, explain:"Unit-price contracts are specifically designed to true up to actual field-measured quantities at the agreed rate, unlike a lump-sum contract which would lock in the original estimated total regardless of actual quantity.", ref:"NASCLA guide: Bidding and Estimating, unit-price quantities", numeric:true},
  {topic:"Financial Management", q:"On a $500,000 owner-occupied residential remodel — a job outside the scope of Utah's statutory retainage cap — the contract withholds 10% retainage from progress payments. How much of the contract value is withheld until final completion?", opts:["$5,000, which would be 1% of the $500,000 contract","$50,000, which is 10% of the $500,000 contract","$10,000, which would be 2% of the $500,000 contract","$25,000, which would be 5% of the $500,000 contract"], correct:1, explain:"10% of $500,000 is $50,000 held back as retainage until the work is completed and accepted. Utah Code §13-8-5's 5% retainage cap applies to nonresidential commercial or industrial construction contracts, not to this residential remodel, so a 10% contract rate can apply here.", ref:"HBA book: Financial Management section, Utah Code 13-8-5 (residential retainage math / scope)", numeric:true},
  {topic:"Financial Management", q:"A contractor relies heavily on one large client for 70% of annual revenue. From a financial risk standpoint, this represents:", opts:["Healthy diversification, because a single large client is generally safer than many small accounts","Significant customer concentration risk — losing that client could severely impact cash flow and viability","A bookkeeping issue only, with no effect on cash-flow risk if the invoices are paid on time","A bonding advantage, because sureties prefer contractors that rely on one repeat customer"], correct:1, explain:"Heavy reliance on one client creates concentration risk; losing that relationship can create an outsized, sudden impact on revenue and cash flow.", ref:"NASCLA guide: Financial Management, revenue concentration / customer risk"},
  {topic:"Financial Management", q:"A contractor has current assets of $180,000 and current liabilities of $130,000. Their working capital is:", opts:["$310,000, which would be current assets plus current liabilities rather than the difference between them","$50,000, which is current assets of $180,000 minus current liabilities of $130,000 (working capital as a dollar amount)","$1.38, which is a current ratio rather than a working-capital dollar amount (assets minus liabilities)","It cannot be determined, because working capital also requires the company's net profit figure in addition to current assets and liabilities"], correct:1, explain:"Working capital = current assets − current liabilities = $180,000 − $130,000 = $50,000. (Note this is different from the CURRENT RATIO, which would be 180,000 ÷ 130,000 ≈ 1.38 — a ratio, not a dollar amount; mixing these two up is a common error.)", ref:"NASCLA guide: Financial Management, working capital", numeric:true},
  {topic:"Financial Management", q:"A contractor's income statement shows a healthy $150,000 net profit for the year, but their cash balance actually DECREASED by $40,000 over the same period. The most likely explanation involves differences between:", opts:["A rule that reported profit and the change in cash must match exactly over the same period, so a $150,000 profit figure would have to be matched by a $150,000 increase in cash","Accrual-based profit recognition versus actual cash timing, such as unbilled receivables, cash equipment purchases, or debt principal payments that do not appear on the income statement","A bookkeeping error that must be the only explanation and has to be corrected immediately, as if a cash drop during a profitable year could not happen under ordinary accrual accounting","A sales-tax miscalculation that would reduce cash without affecting the income-statement profit figure, which would explain a cash decrease only if sales tax were omitted from the income statement"], correct:1, explain:"Profit (income statement, accrual basis) and cash change (cash flow) are genuinely different measures — growing receivables, capital purchases, and debt principal payments can all reduce cash without reducing reported profit, a distinction that trips up many contractors.", ref:"NASCLA guide: Financial Management, profit vs cash flow"},
  {topic:"Financial Management", q:"Under Utah Code §13-8-5, retainage withheld on a covered construction contract cannot exceed:", opts:["10%, and the cap applies to every construction project in Utah, including owner-occupied residential work, so a 10% retainage holdback would be lawful on residential and commercial jobs alike","5%, but only on nonresidential commercial or industrial construction contracts (and the nonresidential portion of a mixed-use project), at every tier down the contract chain","5% on public projects only; private commercial jobs have no statutory retainage cap at any tier, leaving private commercial and industrial contracts with no maximum retainage percentage","15% on any public or private project, including residential remodels and commercial work, so a 15% retainage clause would be lawful on a covered commercial or industrial contract"], correct:1, explain:"Utah Code §13-8-5(1)(a) defines a 'construction contract' as one for nonresidential commercial or industrial construction; mixed-use projects are covered only as to the nonresidential portion, pro rata by square footage. On those covered contracts, subsections (3)(a)–(b) cap retainage at 5% of each payment and 5% of the total construction price, and the cap applies to the owner or public agency, the original contractor, and subcontractors. The statute does not impose that 5% cap on purely residential work.", commonlyMissed:true, ref:"HBA book: Financial Management section, Utah Code 13-8-5(1)(a) (retainage cap scope)", numeric:true},
  {topic:"Financial Management", q:"Once retainage is released to a general contractor in Utah, the GC must generally pass along the appropriate share to their subcontractors within:", opts:["45 days of the GC receiving the retainage","30 days of the GC receiving the retainage","10 days of the GC receiving the retainage","60 days of the GC receiving the retainage"], correct:2, explain:"GCs and subs must release retainage down the contract chain within 10 days of receiving it themselves — a much tighter window than the 45-day deadline that applies to the initial release from the owner.", ref:"HBA book: Financial Management section, Utah Code 13-8-5 (10-day retainage pass-along)", numeric:true},
  {topic:"Labor Laws", q:"Under federal labor law (FLSA), non-exempt employees who work over 40 hours in a week are generally entitled to:", opts:["No additional pay beyond the straight-time wage already earned for those hours over 40","Overtime pay, typically at 1.5 times their regular rate, for hours worked over 40 in the workweek","Compensatory time off later, instead of overtime pay, as the standard private-sector remedy","A flat bonus for the week, regardless of how many hours over 40 were actually worked"], correct:1, explain:"The Fair Labor Standards Act requires overtime pay (typically time-and-a-half) for non-exempt employees working over 40 hours per week.", ref:"FLSA, 29 U.S.C. 207 (overtime); HBA book: Labor Laws section", numeric:true},
  {topic:"Labor Laws", q:"What must employers generally maintain regarding workplace injuries under OSHA recordkeeping rules?", opts:["Nothing unless someone is hospitalized, in which case only that single incident is recorded","A log of recordable work-related injuries and illnesses (e.g., OSHA Form 300)","A public press release for every workplace injury, in addition to any internal record","Only verbal notification to OSHA, with no written injury or illness log required"], correct:1, explain:"Covered employers must maintain injury and illness records, such as the OSHA 300 log, for recordable workplace incidents.", ref:"OSHA 29 CFR 1904 (injury and illness recordkeeping, Form 300); HBA book: Labor Laws section"},
  {topic:"Labor Laws", q:"A worker sets their own hours, uses their own tools, works for multiple contractors simultaneously, and is paid a flat fee per project. These facts tend to support classifying them as:", opts:["An employee, because anyone paid to work on a construction project is classified as an employee","An independent contractor, since they show low behavioral/financial control by the hiring business","Neither an employee nor a contractor, because mixed facts leave the worker in a third legal category","An employee whenever the person works more than 10 hours in a week, regardless of those other facts"], correct:1, explain:"Autonomy over schedule/methods, use of own tools, working for multiple clients, and flat-fee pay are hallmark indicators supporting independent contractor status.", ref:"IRS / common-law independent contractor factors; HBA book: Labor Laws section"},
  {topic:"Labor Laws", q:"A salaried supervisor who regularly directs the work of other employees and has hiring/firing input is most likely classified under the FLSA as:", opts:["Non-exempt and entitled to overtime, because a salary by itself does not support an exemption","Potentially exempt from overtime under the executive exemption, if duties and salary tests are met","Automatically an independent contractor, because a salary plus hiring authority is enough for that status","Ineligible for a salary of any kind, because supervisors on construction sites must be paid hourly"], correct:1, explain:"The FLSA executive exemption can apply to supervisory employees meeting salary and duties tests, exempting them from overtime pay requirements.", ref:"FLSA, 29 U.S.C. 213 and 29 CFR 541 (white-collar exemptions); HBA book: Labor Laws section"},
  {topic:"Labor Laws", q:"An employee is injured on the job and workers' compensation applies. In most cases, the employee's ability to sue the employer directly for the injury (outside the workers' comp system) is:", opts:["Unlimited, and a civil lawsuit against the employer may be filed in addition to a workers' comp claim","Generally barred, since workers' comp is typically the exclusive remedy for workplace injuries","Available only if the injury occurred on a weekend or after regular scheduled hours","Available whenever the medical costs or lost wages from the injury exceed $10,000"], correct:1, explain:"Workers' compensation is generally the exclusive remedy for workplace injuries, meaning the employee generally cannot also sue the employer in most ordinary injury cases.", ref:"HBA book: Labor Laws section, Utah Code 34A-2 (Workers' Compensation Act, exclusive remedy)"},
  {topic:"Labor Laws", q:"A contractor pays a crew a flat day rate regardless of hours worked, sometimes exceeding 50 hours/week, without extra pay. If these workers are properly classified as non-exempt employees, this practice:", opts:["Compliant as long as the day rate is generous enough to exceed what overtime pay would have been on paper, even when the crew regularly exceeds 40 hours","Likely violates overtime requirements, since day-rate pay doesn't automatically satisfy FLSA overtime obligations for non-exempt workers","A problem only for salaried employees, because day-rate crews are outside the FLSA overtime rules, so day-rate workers would have no weekly overtime premium","Permitted for private construction work, because day-rate pay is treated as a complete weekly wage, leaving a flat day rate in place of time-and-a-half"], correct:1, explain:"Non-exempt employees are generally owed overtime for hours over 40/week regardless of pay structure; a flat day rate alone doesn't satisfy this requirement without proper overtime calculation.", ref:"FLSA, 29 U.S.C. 207 (overtime; day rates); HBA book: Labor Laws section"},
  {topic:"Labor Laws", q:"Under the FLSA, overtime is generally calculated based on hours worked beyond 40 in a single:", opts:["Calendar month, combining all hours worked in that month before any overtime is calculated","Workweek, meaning a fixed, recurring 168-hour period, not necessarily a calendar week or a two-week pay period","Two-week pay period, with hours averaged together across the two weeks before overtime is due","Calendar year, so overtime is owed only after total hours for the year exceed a yearly threshold"], correct:1, explain:"Overtime is calculated per workweek — a fixed, regularly recurring 7-day/168-hour period the employer defines — not averaged across pay periods or months.", commonlyMissed:true, ref:"FLSA, 29 U.S.C. 207 (overtime workweek); HBA book: Labor Laws section"},
  {topic:"Labor Laws", q:"An employer wants to avoid paying overtime by giving an employee 'comp time' (time off later) instead of overtime pay for hours over 40 in a week. For most private-sector non-exempt employees, this practice is:", opts:["Fully compliant in the private sector, and a common way to avoid paying a cash overtime premium, so a private contractor could bank extra hours as future time off instead of cash overtime","Generally not permitted under the FLSA for private employers — overtime for non-exempt employees is normally paid in wages, not banked comp time","Not permitted only if the employee objects in writing; otherwise compensatory time may be used, and a signed employee consent would make private-sector compensatory time lawful under the FLSA","Required by federal law as the first remedy, with cash overtime used only if time off cannot be scheduled"], correct:1, explain:"Private-sector employers generally can't substitute comp time for cash overtime pay owed to non-exempt employees under the FLSA — that practice is more common in public-sector employment.", ref:"FLSA, 29 U.S.C. 207 (private-sector overtime vs compensatory time); HBA book: Labor Laws section"},
  {topic:"Labor Laws", q:"Federal law generally imposes daily overtime requirements (e.g., overtime after 8 hours in a single day) on private employers:", opts:["As a federal floor in every state, so overtime is due after 8 hours in a day as well as after 40 in a week, with overtime due after 8 hours in a day","Not by default — the FLSA sets a weekly 40-hour threshold, and daily overtime rules (if any) come from state law, not federal law","Only for construction workers, because the FLSA imposes a daily overtime rule unique to that industry, so construction crews would earn daily FLSA overtime","Only when the employment contract or collective-bargaining agreement expressly waives daily overtime, and only if the parties had first waived that duty"], correct:1, explain:"The FLSA's overtime trigger is weekly (over 40 hours), not daily; any daily overtime requirement would have to come from a state law, since federal law doesn't impose one by default.", ref:"FLSA, 29 U.S.C. 207 (weekly, not daily, overtime); HBA book: Labor Laws section", numeric:true},
  {topic:"Labor Laws", q:"A worker travels between two job sites during the middle of their workday, staying on the clock the whole time. This travel time is generally:", opts:["Not compensable, because all travel is treated as commuting that the employee must absorb unpaid","Compensable work time, since it occurs during the workday between duty locations","Compensable only if the travel between job sites exceeds 2 hours in a single workday","The employee's own unpaid responsibility, even if the travel occurs in the middle of the workday"], correct:1, explain:"Travel between job sites during the workday is generally compensable hours worked, distinct from an employee's normal home-to-first-jobsite commute, which typically isn't.", ref:"FLSA / 29 CFR 785 (hours worked, travel time); HBA book: Labor Laws section"},
  {topic:"Labor Laws", q:"An employee is required to remain on the jobsite during a short break, unable to leave or use the time freely. Under FLSA rules, short breaks (typically under about 20 minutes) are usually treated as:", opts:["Unpaid time, even if the employee must remain on the jobsite and cannot use the break freely","Compensable work time that counts toward hours worked, including for overtime calculations","Paid only if the employee requests in writing that the short break be treated as hours worked","Automatically unpaid if the break is longer than 5 minutes, regardless of whether the employee is relieved"], correct:1, explain:"Short rest breaks (typically under ~20 minutes) are generally counted as compensable hours worked under FLSA guidance, unlike longer bona fide meal periods where the employee is fully relieved of duty.", ref:"FLSA / 29 CFR 785.18 (short rest breaks); HBA book: Labor Laws section"},
  {topic:"Labor Laws", q:"To qualify for the FLSA's executive/administrative overtime exemption, an employee generally must meet BOTH a duties test AND:", opts:["A minimum age of 21, with no separate salary-basis requirement once the duties test is met","A minimum salary threshold, with the employee paid on a salary basis rather than hourly","A college degree in the field being supervised, in addition to the duties test","Employment by a company that has more than 500 employees in the current calendar year"], correct:1, explain:"Overtime exemptions like executive/administrative require satisfying both a duties test (nature of the work) and a minimum salary-basis threshold — hourly workers generally can't be classified exempt regardless of duties.", ref:"FLSA, 29 CFR 541 (salary basis and duties tests); HBA book: Labor Laws section"},
  {topic:"Labor Laws", q:"A non-exempt employee earns $20/hour and also receives a $100 non-discretionary weekly production bonus. In a week they work 45 hours, their overtime rate calculation must:", opts:["Ignore the bonus completely, and calculate the overtime premium on the $20 hourly rate alone","Fold the non-discretionary bonus into the 'regular rate' used to calculate the overtime premium, not just use the base hourly rate alone","Count the bonus toward overtime only if the $100 bonus exceeds a $500 weekly threshold, so a $100 production bonus would be left out of the regular rate until it exceeded $500","Treat the bonus as fully exempt from the regular-rate calculation used for overtime pay, leaving the $100 weekly production bonus out of the regular rate used for overtime"], correct:1, explain:"Non-discretionary bonuses must generally be included when calculating an employee's 'regular rate' for overtime purposes — using only the base hourly rate and ignoring the bonus understates the overtime actually owed.", commonlyMissed:true, ref:"FLSA, 29 CFR 778 (regular rate, nondiscretionary bonuses); HBA book: Labor Laws section"},
  {topic:"Labor Laws", q:"Two companies — a staffing agency and a contractor — jointly direct and control the same worker's daily tasks and schedule on a jobsite. Under a 'joint employer' analysis, wage and hour compliance obligations (like overtime) generally:", opts:["Fall solely on the staffing agency, because only the company that issues the paycheck can be the employer, so the contractor who directs the work would have no wage-and-hour exposure of its own","Can be shared between both companies, since both may be considered joint employers responsible for FLSA compliance depending on their actual degree of control","Fall solely on the contractor, because wage-and-hour duties follow the jobsite rather than the payroll source, so the staffing agency that issues the paycheck would have no FLSA exposure of its own","Do not apply in a joint-direction arrangement, because neither company is treated as the employer, leaving both companies free of overtime and minimum-wage duties in a shared-control arrangement"], correct:1, explain:"Under a joint employer analysis, both companies exercising meaningful control over the worker can share FLSA compliance responsibility — simply not being the one who issues the paycheck doesn't eliminate wage and hour exposure.", ref:"FLSA joint-employer principles; HBA book: Labor Laws section"},
  {topic:"Licensing", q:"As of current DOPL rules, at what total project value (labor and materials combined) does work require a full Utah contractor license?", opts:["$3,000 or more","$5,000 or more","$7,000 or more","$10,000 or more"], correct:2, explain:"The licensing threshold was raised to $7,000 (labor and materials combined). Projects between $3,000 and $7,000 fall under the 'handyman exemption' — no license needed, but a one-time insurance/workers' comp affirmation must still be filed with DOPL. This changed from the older $3,000 threshold, so confirm against dopl.utah.gov if it's been a while since you checked.", ref:"HBA book: Licensing section, Utah Code 58-55-305 (license threshold / handyman exemption)", numeric:true},
  {topic:"Licensing", q:"How much experience is generally required to qualify for a B100 license?", opts:["1 year (2,000 hours)","2 years (4,000 hours)","3 years (6,000 hours)","4 years (8,000 hours)"], correct:1, explain:"Utah requires 2 years of paid construction experience totaling at least 4,000 hours.", ref:"HBA book: Licensing section, Utah Code 58-55-302 (experience; two years / 4,000 hours)", numeric:true},
  {topic:"Licensing", q:"Of the required experience for a B100 qualifier, how much must be in a supervisory or managerial role?", opts:["None of the required years, because supervisory time is optional for a B100 qualifier","At least 6 months of the 2 required years, but not a full year","At least 1 of the 2 required years must be in a supervisory or managerial role","All 2 of the required years, with no credit for non-supervisory field work"], correct:0, explain:"Utah Code §58-55-302(1)(e)(ii)(A) requires two years of full-time paid construction experience and says that experience 'does not have to include supervisory experience.' DOPL's current general-contractor application lists 4,000 hours (2 years) of paid construction experience with no supervisory component. Older study materials that describe a required supervisory year are out of date. Note: Title 58, Chapter 55 is renumbered January 1, 2027 (qualifications move to §58-55-203).", ref:"HBA book: Licensing section, Utah Code 58-55-302(1)(e) (experience; no supervisory year required)", numeric:true},
  {topic:"Licensing", q:"Under the current Utah Construction Trades Licensing Act Rule, what is the minimum liability insurance a licensed contractor must carry?", opts:["$100,000 per incident / $300,000 in total (the old minimum)","$1,000,000 per incident / $3,000,000 in total","$1,000,000 per incident / $2,000,000 in total","No minimum is specified by rule"], correct:2, explain:"Utah Admin. Rule R156-55a-302d, in the current rule effective August 7, 2026, requires licensed contractors to maintain liability insurance of at least $1,000,000 for each incident and $2,000,000 in total, with the Division named as a certificate holder, coverage for the licensed scope of work, and the policy in force for the entire duration of licensure. An earlier 2026 amendment had briefly set the total at $3,000,000 before the current $2,000,000 figure was adopted.", ref:"HBA book: Licensing section, R156-55a-302d (liability insurance minimums)", numeric:true},
  {topic:"Licensing", q:"What is the minimum passing score on the Utah Contractors Business and Law exam?", opts:["60%","65%","70%","75%"], correct:2, explain:"A minimum score of 70% is required to pass the Utah Business and Law exam.", ref:"HBA book: Licensing section; Prov candidate handbook (70% passing score)", numeric:true},
  {topic:"Licensing", q:"A Utah contractor license generally must be renewed:", opts:["Only once, after which the license remains in effect for the contractor's lifetime with no further filing","On a periodic renewal cycle set by DOPL, typically requiring a renewal fee and a showing of good standing","Every 10 years automatically, with no renewal application, fee, or good-standing review required","The license stays in effect permanently, because a Utah contractor license does not expire once it has been issued"], correct:1, explain:"Contractor licenses require periodic renewal with DOPL, including a renewal fee and maintaining required insurance/bonding.", ref:"HBA book: Licensing section, R156-55a-303a (renewal)"},
  {topic:"Licensing", q:"A B100-licensed contractor wants to also occasionally perform small plumbing repairs incidental to a remodel. The correct approach is generally to:", opts:["Perform the plumbing repairs under the B100 license, because incidental plumbing is within that classification","Still subcontract to or coordinate with a licensed plumbing contractor, since B100 doesn't cover plumbing scope","Add a verbal note to the contract that the plumbing is incidental, which brings it under the B100 scope","Have an unlicensed employee complete the plumbing, because incidental repairs do not require a separate license"], correct:1, explain:"B100 remains a structural-only license; plumbing work generally requires a separately licensed plumbing contractor regardless of how minor or 'incidental' it seems.", ref:"HBA book: Licensing section, Utah Code 58-55-102 and 58-55-301 (classification scope; plumbing)"},
  {topic:"Licensing", q:"An applicant has only 18 months of paid construction experience but holds a 2-year construction management degree. Under DOPL's current B100 requirements, the degree:", opts:["Can satisfy the experience requirement by itself, as one of DOPL's listed alternatives to 4,000 hours","Counts for nothing, because only paid field hours can satisfy the B100 experience requirement at all","Counts only toward a required supervisory year, so the applicant still needs a full 4,000 field hours","Counts only if the applicant also passes the NASCLA exam in addition to the Utah Business and Law exam"], correct:0, explain:"DOPL's general-contractor application lists ways to meet the experience requirement: 4,000 hours (2 years) of paid construction experience, or one of these alternatives: qualifier on a current or previous Utah contractor license for at least 2 years, a construction management degree (2- or 4-year), a licensed Utah professional engineer, or passing the NASCLA commercial general building contractor exam. Utah Code §58-55-302 no longer requires a separate supervisory year.", ref:"HBA book: Licensing section, Utah Code 58-55-302 and DOPL general contractor application (experience alternatives)"},
  {topic:"Licensing", q:"An out-of-state applicant has held an active, similar-scope contractor license in good standing for 8 months (not yet a full year). Regarding the Utah Business & Law exam requirement, they are:", opts:["Already eligible for the experience-based exam waiver, because 8 months is treated as close enough to one year","Not yet eligible for the experience-based exam waiver, since Utah's waiver generally requires at least one full year of active, similar-scope licensure","Eligible for a partial waiver that covers half of the Business and Law exam after 8 months of licensure, reducing the Business and Law exam by half after only 8 months of similar-scope licensure","Required to wait until 24 months of out-of-state licensure before any exam waiver can be considered, doubling the usual one-year similar-scope period before any waiver could be requested"], correct:1, explain:"The waiver generally requires at least one full year of active, similar-scope licensure in good standing — 8 months would not yet meet that threshold.", ref:"HBA book: Licensing section, Utah Code 58-1-302 and 58-55-302 (endorsement / exam waiver)", numeric:true},
  {topic:"Licensing", q:"A DOPL disciplinary action results in a contractor's license being placed on probation rather than revoked. This generally means the contractor:", opts:["Must immediately stop all licensed work, because probation has the same effect as a revocation","May continue operating but under specific conditions or monitoring set by DOPL, with revocation possible if violated","May continue operating with no conditions, because probation is only a notation on the license record","Automatically receives a new license after 30 days, with the prior disciplinary file closed"], correct:1, explain:"Probation allows continued licensed operation under DOPL-imposed conditions; violating those conditions can escalate to suspension or revocation.", ref:"HBA book: Licensing section, Utah Code 58-55-401 and 58-1-401 (discipline, including probation)"},
  {topic:"Licensing", q:"A contractor is licensed R100 (Residential and Small Commercial) and is offered a $300,000 commercial remodel job. Given R100's project value cap on small commercial work, the contractor should recognize that:", opts:["R100 covers any commercial project regardless of size or value, so the contractor may proceed under that license, allowing an R100 licensee to take a large commercial remodel with no scope or value limit","This project likely exceeds R100's small-commercial scope/value cap, so a B100 (uncapped general) or the appropriate higher classification may be required instead","Only a specialty S-classification could cover this remodel, because R100 and B100 both exclude commercial work, so neither an R100 nor a B100 license could be used for this commercial remodel work","R100 and B100 are interchangeable classifications, so either license is sufficient for this commercial job, treating R100's small-commercial limit as interchangeable with an uncapped B100 license"], correct:1, explain:"R100 is scoped to residential plus SMALL commercial work under a value cap; a $300,000 commercial remodel is likely to exceed that scope, meaning the contractor needs to confirm whether B100 or another classification is actually required for this job.", ref:"HBA book: Licensing section, Utah Code 58-55-102(42) and R156-55a-301h (R100 scope)", numeric:true},
  {topic:"Licensing", q:"An applicant is licensed and in good standing as a qualifier in a state Utah recognizes, but has only held that license for 10 months. Compared to an applicant with 14 months in the same situation, the 10-month applicant:", opts:["Qualifies for the same exam waiver as the 14-month applicant, because both are treated as having about a year, so a 10-month applicant and a 14-month applicant would receive the same exam waiver","Does not yet qualify for the experience-based Business and Law exam waiver, because Utah's waiver generally requires at least 12 months, and 10 months falls short","Automatically qualifies, because 10 months of good-standing licensure is rounded up to a full year, rounding 10 months of good-standing licensure up to the one-year waiver threshold","Is treated identically to an applicant with no out-of-state license, because anything under 14 months is ignored, so 10 months of out-of-state licensure would be given no credit toward the waiver period"], correct:1, explain:"The waiver threshold is a genuine cutoff at one full year — 10 months, despite being close, does not satisfy it, illustrating how these thresholds are applied literally rather than 'approximately.'", ref:"HBA book: Licensing section, Utah Code 58-1-302 and 58-55-302 (endorsement / exam waiver)", numeric:true},
  {topic:"Licensing", q:"Which of these is one of DOPL's listed alternatives to the 4,000 paid hours of experience for a B100 qualifier?", opts:["Being a qualifier on a current or previous Utah contractor license for at least 2 years","Keeping a Utah handyman-exemption insurance affirmation on file with DOPL for 2 years","Completing the 30-hour pre-licensure course a second time with a passing course grade","Working 2 years as an unpaid volunteer on residential projects for a nonprofit builder"], correct:0, explain:"DOPL's general-contractor application lists these alternatives to 4,000 hours of paid experience: qualifier on a current or previous Utah contractor license for at least 2 years, a construction management degree (2- or 4-year), a licensed Utah professional engineer, or passing the NASCLA commercial general building contractor exam. Volunteer work, the handyman exemption, and repeating the pre-licensure course do not count.", ref:"HBA book: Licensing section, Utah Code 58-55-302 and DOPL general contractor application (experience alternatives)"},
  {topic:"Licensing", q:"A Utah contractor license must generally be renewed on what cycle?", opts:["Every 1 year","Every 2 years","Every 3 years","Every 5 years"], correct:1, explain:"Utah Admin. Code R156-55a-303a establishes a 2-year renewal cycle for contractor licenses, which also carries a continuing education requirement that must be satisfied by the licensee, qualifier, or a designated officer/supervisor.", ref:"HBA book: Licensing section, R156-55a-303a (2-year renewal cycle)", numeric:true},
  {topic:"Lien Laws", q:"A lien claimant files a valid mechanics lien but then fails to file a lawsuit to foreclose the lien within the statutory period after filing. The likely result is:", opts:["The lien remains enforceable indefinitely once it has been recorded, with no later lawsuit deadline","The lien can expire or become unenforceable, since foreclosure deadlines are also strictly time-bound","The claimant must re-record the same lien, but the original filing date still controls the enforcement period","The unpaid balance converts automatically to a personal judgment, so no foreclosure action is required"], correct:1, explain:"Beyond the initial filing deadline, statutes also set a window to actually foreclose (enforce) the lien in court — missing that deadline too can render the lien unenforceable.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-701 (foreclosure / enforcement deadline)"},
  {topic:"Lien Laws", q:"A contractor's preliminary notice was served, but it listed an incorrect legal description of the property. This kind of defect could:", opts:["Is treated as a minor typo that does not affect the notice or the claimant's later lien rights, so the later lien rights would still be preserved","Potentially invalidate the notice and jeopardize lien rights, since accuracy in required notice content is often strictly enforced","Can be corrected at any time without affecting the original effective date of the preliminary notice, relating the correction back to the original filing date","Matters only on public projects, and an incorrect legal description is ignored on private work, leaving an incorrect description harmless on private work"], correct:1, explain:"Because lien rights are statutorily strict, errors in required notice content (like the legal property description) can undermine the notice's validity and the lien rights it was meant to preserve.", ref:"HBA book: Lien Law section, Utah Code 38-1a-501 (preliminary notice content)"},
  {topic:"Lien Laws", q:"A subcontractor furnished labor on a Utah project from March 1 through March 30. The original contract is finally completed on June 15, and no notice of completion is filed. Under Utah Code §38-1a-502, the sub's deadline to record a notice of construction lien is generally measured from:", opts:["March 1, the date the subcontractor first furnished labor on the project, starting the recording clock on the first day of labor","March 30, the date the subcontractor last furnished labor on the project, starting the recording clock on the last day of labor","June 15, the date of final completion of the original contract, not the sub's own last day on the job","The date the subcontractor sent its final invoice for the work it performed"], correct:2, explain:"Utah Code §38-1a-502(1)(a) generally requires a notice of construction lien to be recorded no later than 180 days after final completion of the original contract if no notice of completion is filed, or 90 days after a notice of completion (but not later than 180 days after final completion of the original contract). The filing clock therefore runs from project/original-contract completion (or a notice of completion), not from the sub's last furnishing date. A narrower exception in §38-1a-502(1)(b) applies only if the sub provides substantial work after a certificate of occupancy is issued or a required final inspection is completed, in which case the deadline is 180 days after final completion of that subcontractor's work. By contrast, the preliminary-notice deadline in §38-1a-501 is measured from when the claimant commences providing construction work.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-502 (lien filing clock)", numeric:true},
  {topic:"Lien Laws", q:"A GC receives an invoice from a sub for $50,000 but only pays $35,000 due to a good-faith dispute over back-charges. The sub is considering whether to file a lien for the unpaid $15,000. Filing a lien in this situation:", opts:["Is barred completely, because accepting any partial payment waives lien rights on the rest of the invoice, so accepting the $35,000 payment would waive the lien on the remaining $15,000","Can generally still be pursued for the legitimately unpaid balance; a partial payment does not automatically waive lien rights for the remaining unpaid amount","May be filed only for the $35,000 already paid, not for the $15,000 that remains in dispute, treating the already-paid $35,000 as the only sum that could be liened","Is available only after the back-charge dispute has been fully tried and reduced to a final judgment, so the unpaid $15,000 could not be liened until a court had entered a final judgment"], correct:1, explain:"Partial payment doesn't waive lien rights to the legitimately unpaid remainder; the lien remedy and the underlying billing dispute are related but distinct issues that may both need addressing.", ref:"HBA book: Lien Law section, Utah Code 38-1a (lien rights on the unpaid balance)"},
  {topic:"Lien Laws", q:"In Utah, a preliminary notice must generally be filed with the State Construction Registry (SCR) within how many days of first furnishing labor or materials to a project?", opts:["10 days","15 days","20 days","30 days"], correct:2, explain:"Utah Code §38-1a-501 requires a preliminary notice to be filed with the State Construction Registry no later than 20 days after the day the person commences providing construction work — not sent directly to the GC or owner as in many other states.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-501 (20-day preliminary notice)", numeric:true},
  {topic:"Lien Laws", q:"A contractor files their Utah preliminary notice late — 30 days after first furnishing labor, instead of the required 20. Under Utah's 'late notice' rule, the notice becomes effective:", opts:["Retroactively, covering all labor and materials furnished from the first day the contractor was on the job","5 days after the late filing date, protecting only labor or materials furnished from that point forward, not retroactively","Immediately upon filing, covering everything furnished both before and after the late notice date","The late notice is entirely void and gives no partial protection, because a preliminary notice filed after 20 days is treated as a complete miss"], correct:1, explain:"A late preliminary notice in Utah isn't a total loss — it becomes effective 5 days after filing, but only protects the value of labor/materials furnished from that 5-day mark forward, not the earlier work.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-501 (late preliminary notice)", numeric:true},
  {topic:"Lien Laws", q:"A Notice of Completion is recorded on a Utah project. After that date, a preliminary notice can still be validly filed, but only within:", opts:["30 days after the Notice of Completion, which replaces the ordinary 20-day first-furnishing rule","20 days after the Notice of Completion, the same period that applies before a notice of completion is recorded","10 days after the Notice of Completion; a preliminary notice filed after that window is entirely invalid","No cutoff after a Notice of Completion is recorded; the ordinary 20-day first-furnishing rule still governs"], correct:2, explain:"Recording a Notice of Completion starts a hard 10-day outer limit — a preliminary notice filed after that window is invalid entirely, even if it would otherwise still be within the normal 20-day rule.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-501 (preliminary notice after notice of completion)", numeric:true},
  {topic:"Lien Laws", q:"If NO Notice of Completion is recorded on a Utah project, a mechanics lien must generally be filed within how many days after completion of the project?", opts:["90 days","120 days","180 days","365 days"], correct:2, explain:"Without a recorded Notice of Completion, Utah's default mechanics lien filing deadline is 180 days after project completion.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-502 (180-day filing if no notice of completion)", numeric:true},
  {topic:"Lien Laws", q:"If a Notice of Completion IS recorded on a Utah project, the mechanics lien filing deadline shortens from the default 180 days to:", opts:["150 days after the Notice of Completion","90 days after the Notice of Completion","60 days after the Notice of Completion","30 days after the Notice of Completion"], correct:1, explain:"Recording a Notice of Completion cuts the lien filing window roughly in half — from 180 days after project completion down to 90 days after the Notice of Completion is recorded.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-502 (90-day filing after notice of completion)", numeric:true},
  {topic:"Lien Laws", q:"Once a mechanics lien is properly filed in Utah, a lawsuit to foreclose (enforce) that lien must generally be filed within:", opts:["30 days after the lien is filed","90 days after the lien is filed","180 days after the lien is filed","365 days after the lien is filed"], correct:2, explain:"Filing the lien itself isn't the end of the process — Utah requires the foreclosure lawsuit to be filed within 180 days after the lien is recorded, a separate and easily-missed deadline from the lien filing deadline itself.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-701 (180-day foreclosure action)", numeric:true},
  {topic:"Lien Laws", q:"On a Utah PUBLIC (government) project, a Notice of Commencement must generally be filed within how many days of starting work — and what happens to subcontractor notice obligations if it's missed?", opts:["30 days; missing the filing has no effect on subcontractor or supplier preliminary-notice duties","15 days; if missed or late, subs/suppliers are excused from having to send preliminary notice to make a payment bond claim","60 days; missing the filing voids the entire public contract and stops all payment-bond claims","There is no notice-of-commencement requirement on public projects, and preliminary notice is still required"], correct:1, explain:"Notice of Commencement (public projects only) is due within 15 days of starting work; if the owner/GC fails to file it properly, subs and suppliers are relieved of their own preliminary notice obligation for payment bond claims — a meaningful consequence for the party who was supposed to file it.", ref:"HBA book: Lien Law section, Utah Code 38-1b (public-project notice of commencement) and 63G-6a-1103", numeric:true},
  {topic:"Project Management", q:"A task on the critical path slips by 3 days with no mitigation. What is the most likely direct effect on the overall project?", opts:["The overall project completion date stays the same, because a 3-day slip can be absorbed without using float","The overall project completion date is also likely delayed by approximately 3 days, since critical path tasks have zero float","Only the delayed task is affected, and downstream critical-path activities keep their original finish dates","The project finish date moves 3 days earlier, because a critical-path slip automatically creates float elsewhere"], correct:1, explain:"By definition, critical path tasks have no float — any delay on them pushes back the entire project's finish date by roughly the same amount, absent schedule compression efforts.", ref:"NASCLA guide: Scheduling and Project Management, critical path", numeric:true},
  {topic:"Project Management", q:"On a project schedule, Path A takes 20 days and is the critical path; Path B takes 15 days. What is the float available on Path B?", opts:["0 days","5 days","15 days","20 days"], correct:1, explain:"Float on a non-critical path equals the critical path duration minus that path's own duration: 20 − 15 = 5 days of float available on Path B before it would also become critical.", ref:"NASCLA guide: Scheduling and Project Management, float", numeric:true},
