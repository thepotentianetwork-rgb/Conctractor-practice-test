  {topic:"Financial Management", q:"A contractor pays $40,000 cash for a piece of equipment. On the statement of cash flows, this transaction is generally classified as:", opts:["Revenue on the income statement equal to the $40,000 paid, rather than a cash-flow classification","An operating cash inflow, as if the equipment purchase increased cash from operations","A financing cash inflow, as if the purchase were treated as new borrowing","An investing cash outflow, because a cash purchase of equipment is classified as an investing activity"], correct:3, explain:"Buying equipment for cash is a capital expenditure, reported as an investing outflow on the statement of cash flows. It is not an operating cash flow, not a financing inflow, and the $40,000 purchase price is not recorded as revenue — the cost is capitalized as an asset and then depreciated.", ref:"NASCLA guide: Financial Management, statement of cash flows"},
  {topic:"Financial Management", q:"Retainage that a contractor has earned but that the owner is still holding until substantial completion is generally reported as:", opts:["A current liability, because the cash has not been received even though the work has been earned","An account payable to the owner, as if the contractor owed the withheld amount back to the owner","A receivable (often a current asset), representing amounts earned but withheld under the contract","A retained-earnings appropriation on the equity section only, and not a receivable or a liability"], correct:2, explain:"Retainage receivable is an amount the contractor has earned under the contract but that the owner is contractually holding back. It is an asset — typically current if collection is expected within a year — not a liability or a component of retained earnings. It becomes cash when the retainage is released.", ref:"NASCLA guide: Financial Management, retainage as a receivable"},
  {topic:"Financial Management", q:"An accounts-receivable aging schedule is used primarily to:", opts:["Show how long customer invoices have been outstanding so management can estimate collection risk and any allowance for doubtful accounts","Calculate the current ratio by adding receivables to inventory, without regard to how old the invoices are","Determine payroll-tax deposits due that quarter, based on wages rather than customer invoices, to compute quarterly payroll-tax deposits from wages","Depreciate equipment over its useful life, which is a fixed-asset schedule rather than a receivables tool"], correct:0, explain:"An aging schedule groups receivables by how long they have been outstanding (for example current, 31–60 days, 61–90, and over 90). Older balances generally carry more collection risk, which is why aging supports both collections follow-up and the estimate of an allowance for doubtful accounts.", ref:"NASCLA guide: Financial Management, accounts-receivable aging"},
  {topic:"Lien Laws", q:"A construction lien gives the lien holder the ability to:", opts:["Enforce the lien by a foreclosure action and court-ordered sale of the property","Be paid only if the owner later chooses to sell the property","Collect from a statutory payment guarantee that replaces the need to record a lien","Both be paid only if the property is sold and collect a payment guarantee"], correct:0, explain:"Utah Code §38-1a-701 requires a claimant to file an action to enforce a construction lien. Section 38-1a-704 then directs the court to cause the property to be sold in satisfaction of the liens and costs as in the case of a mortgage foreclosure. A lien is a security interest enforced by foreclosure, not a payment guarantee and not a right that exists only if the owner later decides to sell.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-701"},
  {topic:"Lien Laws", q:"Which statement about material suppliers is true under Utah law?", opts:["General contractors and subcontractors have lien rights, but material suppliers do not","A person who provides material for construction work may claim a construction lien for its reasonable value","Only suppliers of structural materials, not fasteners or consumables, have lien rights","Material suppliers may lien a project only if they also performed labor on the site"], correct:1, explain:"Utah Code §38-1a-102(11) defines construction work to include material provided for constructing, altering, or repairing an improvement. Section 38-1a-301(1) gives a person who provides construction work a lien on the project property for its reasonable value. Material suppliers therefore have lien rights; it is not limited to GCs and subcontractors.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-102(11)"},
  {topic:"Lien Laws", q:"Which statement about the Utah State Construction Registry is true?", opts:["It is an optional forum for notifying parties, and filing is not required to preserve lien rights","It may be used only after a lien has already been recorded with the county recorder, so the registry could not be used until after a notice of construction lien was already of record","It is a central repository for required notices, and a person who fails to file a preliminary notice may not claim a construction lien","Filing in the registry replaces the need to record a notice of construction lien with the county recorder"], correct:2, explain:"Utah Code §38-1a-201 establishes the SCR as a central repository for required notices. Section 38-1a-501(1)(e) states that a person who fails to file a preliminary notice as required may not claim a construction lien. The registry is not an optional forum for claimants who want to preserve lien rights. Recording the later notice of construction lien with the county recorder is a separate step under §38-1a-502.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-201 and 38-1a-502"},
  {topic:"Lien Laws", q:"Who may use the Utah State Construction Registry?", opts:["Only licensed general contractors, and no other project participants may file or search notices","Only subcontractors and material suppliers, and owners, lenders, and sureties may not use it, so owners, lenders, and sureties would be barred from using the registry at all","Only the Division of Professional Licensing itself, and private parties may not file notices there","Owners, original contractors, subcontractors, lenders, sureties, title companies, and other interested persons, depending on the notice"], correct:3, explain:"The SCR is not limited to contractors. Utah Code §38-1a-204 allows a person to request notification of required notices, and §38-1a-507 allows an owner, original contractor, lender, surety, or title company to file a notice of completion. Preliminary notices and other required notices are filed by the various parties the chapter identifies, not only by GCs.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-204 and 38-1a-507"},
  {topic:"Lien Laws", q:"Under Utah law, which of the following can support a preconstruction or construction lien?", opts:["Finish carpentry, excavation, supplying nails, rental equipment, estimating, staking, observation, project management, and architectural design done before construction starts","Preparing an estimate, staking, observation, and project management, but not finish carpentry, leaving finish carpentry, excavation, and supplying nails outside the work that can support a lien","Only labor performed after a building permit is issued, and not preconstruction design or supplies, so preconstruction design, supplies, and work before a permit issued could not support a lien","Only work performed by the original contractor, not work by suppliers, designers, or subcontractors, so suppliers, designers, and subcontractors would be unable to claim a preconstruction or construction lien"], correct:0, explain:"Utah Code §38-1a-102(11) defines construction work as labor, service, material, or equipment provided during construction, and it expressly includes estimating, staking, supervising, managing, inspection, and observation. That covers finish carpentry, excavation, nails and fasteners, rental equipment, and project management. Section 38-1a-102(29) defines preconstruction service to include planning or design before construction commences, such as preparing a design, plan, or drawing. Section 38-1a-301 grants a lien for preconstruction service or construction work. Finish carpentry is labor used to construct or alter an improvement and is lienable like the other listed items.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-102(11)"},
  {topic:"Lien Laws", q:"Which statement about public (government) projects is true under Utah law?", opts:["A mechanic's lien may be recorded against public property just as it may be recorded on a private project","Unpaid claimants on public work generally proceed against a payment bond, not a construction lien on the public property","A lien on a school or city building is valid if it is filed within 90 days after the claimant's last work","Public projects are exempt from any notice or claim procedure, including payment-bond claims"], correct:1, explain:"Public construction is covered by the payment-bond requirements of Utah Code §14-1-18 and §63G-6a-1103, which protect persons supplying labor, service, equipment, or material on public buildings or public work. Government-project notices (including Notice of Commencement) are in Title 38, Chapter 1b, not the private-project construction-lien foreclosure scheme. Claimants on public work look to the payment bond (or, if the public entity failed to obtain a bond, to the remedies in §14-1-19), not to a mechanic's lien against the public property.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 14-1-18, 63G-6a-1103, and Title 38, Chapter 1b"},
  {topic:"Lien Laws", q:"Must a general contractor on a private Utah project file a Notice of Commencement on the SCR?", opts:["Yes, on every private and public project, because a Notice of Commencement is required before work may start","Yes, but only on residential projects; commercial private work does not use a Notice of Commencement","No. A Notice of Commencement is a government-project filing under Utah Code §38-1b-201","Yes, but only if the contract exceeds $7,000, which is also the contractor-license threshold"], correct:2, explain:"Utah Code §38-1a-102(23) defines a notice of commencement as a notice required under §38-1b-201 for a government project. Section 38-1b-201 requires the original contractor, owner, or owner-builder on a government project to file that notice no later than 15 days after physical construction begins. A GC on a private project is not required to file a Notice of Commencement.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-102(23) and 38-1b-201"},
  {topic:"Lien Laws", q:"Is a property's physical address enough, by itself, to identify it for a required private-project notice on the SCR?", opts:["Yes, the street address is the only identifier the registry uses for a private-project notice, so a street address alone would identify the property for a required private-project SCR notice","Yes, if the address includes a zip code, which is treated as a complete legal identifier, so adding a zip code to the street address would be treated as a complete legal identifier on the SCR","No, because private-project notices may be filed only by legal description with the county recorder, and not on the SCR","No. A private-project filing must also include the tax parcel identification number or the building permit number, and the county in which the project is located"], correct:3, explain:"Utah Code §38-1a-203(4) requires filings to include the county and, for a private project, the tax parcel identification number of each parcel or the building permit number. Section 38-1a-501(1)(h) likewise requires a preliminary notice to include the county and a tax parcel identification number (or specified alternatives such as a prior entry number or building permit), plus the address or a location description. A street address alone is not sufficient.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-203(4)"},
  {topic:"Lien Laws", q:"A person who wants to claim a construction lien but does not file a preliminary notice as required:", opts:["May not claim a construction lien on that project after failing to file the required preliminary notice","May still record a valid construction lien at any time, even without a preliminary notice","Loses only the right to attorney's fees, and may still record and enforce the lien itself","May substitute a notice filed with the county recorder for the required SCR preliminary notice"], correct:0, explain:"Utah Code §38-1a-501(1)(e) states that a person who fails to file a preliminary notice as required in that section may not claim a construction lien.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-501(1)(e)"},
  {topic:"Lien Laws", q:"Which statement about preconstruction and construction liens is true?", opts:["A preconstruction lien may include amounts for later construction work as well as the preconstruction services, so amounts for later construction work could be bundled into the earlier preconstruction-lien claim","A construction lien may include an amount claimed for a preconstruction service, but a preconstruction lien may not include an amount claimed for construction work","The two lien types are interchangeable and are filed on the same notice form with the same deadlines, so either notice form and either deadline could be used for preconstruction or construction work","Preconstruction design work cannot support a lien of any kind, even if it was separately compensated, so a separately compensated design or planning service performed before construction could not support a lien"], correct:1, explain:"Utah Code §38-1a-301(3) provides that a construction lien may include an amount claimed for a preconstruction service, but a preconstruction lien may not include an amount claimed for construction work.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-301(3)"},
  {topic:"Lien Laws", q:"If a court enforces a construction lien, the property is sold:", opts:["Only if the owner agrees to list the property with a realtor after the judgment is entered","Automatically, without a court action, 30 days after the notice of construction lien is recorded","As in the case of a foreclosure of a mortgage, subject to the same right of redemption","Only to the original contractor, and only for the unpaid contract balance as the sale price"], correct:2, explain:"Utah Code §38-1a-704(1) requires the court to cause the property to be sold in satisfaction of the liens and costs as in the case of a foreclosure of a mortgage, subject to the same right of redemption.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-704(1)"},
  {topic:"Lien Laws", q:"After final completion, a notice of completion may be filed with the SCR by:", opts:["Only the original contractor, and no other project participant may file that notice, so an owner, lender, or surety could not file that notice","Only the county recorder, acting on the recorder's own initiative after work appears to have stopped","Any passerby who noticed that work had stopped, even with no interest in the project","An owner, original contractor, construction lender, surety, or title company issuing a title policy on the project"], correct:3, explain:"Utah Code §38-1a-507(1)(a) allows a notice of completion to be filed by an owner; an original contractor for construction work; a lender that provided financing; a surety that provided bonding; or a title company issuing a title insurance policy on the project.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-507(1)(a)"},
  {topic:"Lien Laws", q:"'Preconstruction service' under Utah lien law means:", opts:["Planning or design of an improvement before construction commences, for compensation separate from construction work, including preparing designs, plans, or drawings","Any punch-list work after substantial completion, even though construction has already begun, treating punch-list work after substantial completion as a preconstruction service","Only soil testing performed during excavation, and not planning, design, or preparation of drawings, limiting the term to soil testing during excavation and excluding planning, design, and drawings","Warranty call-backs in the first year after occupancy, which are treated as preconstruction services, treating first-year warranty call-backs after occupancy as preconstruction services"], correct:0, explain:"Utah Code §38-1a-102(29) defines preconstruction service as planning or designing, or assisting in the planning or design of, an improvement before construction commences, for compensation separate from construction work. It includes preparing a study, report, rendering, model, survey, plat, map, design, plan, drawing, specification, or contract document, as well as estimating and similar preconstruction tasks.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-102(29)"},
  {topic:"Lien Laws", q:"A construction lien generally attaches to:", opts:["The entire neighborhood in which the project sits, including parcels the owner does not hold","Only the interest that the owner has in the project property, not other parcels or the contractor's own assets","Any property in Utah titled in the contractor's name, whether or not that property is the project site","The contractor's personal residence automatically, in addition to the project property"], correct:1, explain:"Utah Code §38-1a-301(4)(a) provides that a preconstruction or construction lien attaches only to the interest that the owner has in the project property that is the subject of the lien. If the owner has less than fee simple, the lien generally attaches only to that lesser interest, subject to the limited exception in subsection (4)(c).", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-301(4)(a)"},
  {topic:"Lien Laws", q:"When a claimant files an action to enforce a construction lien, the claimant must also record a notice of pendency of the action:", opts:["Within 30 days after judgment is entered, and not at the time the enforcement action is filed","Only if the project is a public building; lis pendens filings are not used on private work","Within the same time period allowed for filing the enforcement action, or the lien is void except as to parties and persons with actual knowledge","A notice of pendency is optional and the lien remains fully effective without it, leaving the lien fully effective as to everyone even if no notice of pendency is recorded"], correct:2, explain:"Utah Code §38-1a-701(3) requires the claimant, within the time for filing the enforcement action, to record a notice of the pendency of the action with each applicable county recorder. If the claimant fails to do so, the lien is void except as to persons who have been made parties to the action and persons having actual knowledge of the commencement of the action.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 38-1a-701(3)", numeric:true},
  {topic:"Lien Laws", q:"On a Utah public construction project, a person who has not been paid in full generally may bring an action on the payment bond if unpaid for how long, and how soon must the action be commenced?", opts:["Unpaid 30 days after the last day of labor, service, or supply; sue within 90 days after that last day","Unpaid 180 days after the last day of labor, service, or supply, with no later lawsuit deadline","There is no payment-bond claim; the only remedy is a mechanic's lien on the public building","Unpaid 90 days after the last day of labor, service, or supply; commence the action within one year after that last day"], correct:3, explain:"Utah Code §63G-6a-1103 provides a right of action on the required payment bond if the person has not been paid in full within 90 days after the last day the person performed the labor or service or supplied the equipment or material, and the action is barred if not commenced within one year after that last day. Section 14-1-18 applies that bond requirement to public buildings and public work of the state and its political subdivisions.", commonlyMissed:true, ref:"HBA book: Lien Law section, Utah Code 63G-6a-1103 (public payment-bond claims)", numeric:true},
  {topic:"Contract Management", q:"Which statement about enforceability of construction contracts is true under Utah law?", opts:["A construction contract is not automatically void just because it is oral; the statute of frauds requires a writing for listed agreements, including those that cannot be performed within one year","Every construction contract must be in writing to be legally enforceable, regardless of its term, so even a short job that can be fully performed within one year would have to be in writing to be enforceable","Oral construction contracts are not enforceable in Utah, even if they can be fully performed within one year, so an oral agreement that can be fully performed within one year would still be unenforceable in Utah","A construction contract is enforceable only if it is notarized, whether it is oral or written, so a written construction contract would still be unenforceable unless it was also notarized"], correct:0, explain:"Utah Code §25-5-4 requires a writing, signed by the party to be charged, for certain listed agreements — including an agreement that by its terms is not to be performed within one year — not for every construction contract. An oral construction contract can be enforceable if it does not fall within those listed categories.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 25-5-4 (statute of frauds)"},
  {topic:"Contract Management", q:"Which statement about contingent payment (pay-if-paid or pay-when-paid) clauses is true under Utah law?", opts:["They are fully enforceable in every setting and defeat both ordinary contract claims and construction liens, so a pay-if-paid or pay-when-paid clause would also defeat a construction-lien claim on a covered project","The existence of a contingent payment contract is not a defense to a preconstruction or construction lien, except on private residential work of four units or less","They are illegal and void in every construction contract, including private residential work, so a contingent-payment clause would be unenforceable even on private residential work of four units or less","They apply only to public projects, and they have no effect on private residential or commercial work, leaving contingent-payment clauses with no effect on private residential or commercial subcontracts"], correct:1, explain:"Utah Code §13-8-4(3)(a) states that the existence of a contingent payment contract is not a defense to a claim to enforce a preconstruction or construction lien. Subsection (3)(b) carves out private residential work of four units or less. The statute does not say that such clauses are illegal in all contracts, nor that they defeat lien claims on covered projects.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-4(3)(a) (contingent payment / liens)"},
  {topic:"Contract Management", q:"On a contract covered by Utah's retainage statute, interest that accrues on retainage withheld by the owner or public agency is:", opts:["Kept by the owner as a financing fee for holding the funds until final completion","Paid only to the project lender, and not shared with the contractor or subcontractors","For the benefit of the contractor and subcontractors, not kept by the owner as a financing fee","Not allowed; retainage on a covered contract must be held in a non-interest-bearing account"], correct:2, explain:"Utah Code §13-8-5(4) requires retainage withheld by the owner or public agency to be placed in an interest-bearing account. The accrued interest is for the benefit of the contractor and subcontractors and is paid after the project is completed and accepted. The contractor must distribute that interest to subcontractors on a pro rata basis.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-5(4) (retainage)"},
  {topic:"Contract Management", q:"Is the prevailing party in every Utah construction dispute automatically entitled to attorney's fees?", opts:["Yes, the prevailing party in any construction dispute automatically recovers attorney's fees by statute, so attorney's fees would be awarded by statute in every construction dispute regardless of the claim type","Yes, but only the project owner may recover fees, and only on private residential work, limiting fee recovery to a project owner, and only on a private residential construction dispute","No, because Utah law does not allow attorney's fees in lien-enforcement or retainage-collection actions, so a successful party in a lien-enforcement or retainage-collection action could not recover attorney's fees","No. Fees are not automatic in every dispute; a successful party may recover reasonable fees in a lien-enforcement action under §38-1a-707, and in a retainage-collection action under §13-8-5"], correct:3, explain:"Utah follows the usual rule that attorney's fees are not awarded in every dispute unless a statute or contract says so. Utah Code §38-1a-707 allows the successful party in an action to enforce a lien under that chapter to recover reasonable attorney's fees, and §13-8-5 allows fees to the successful party in an action to collect retainage withheld in violation of that section. There is no general statute awarding fees in every construction dispute.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 38-1a-707 and 13-8-5"},
  {topic:"Contract Management", q:"What interest may the parties agree to charge on past-due amounts in a lawful Utah construction contract?", opts:["The parties may agree upon any rate; if they do not specify a rate, the legal rate is 10% per year","The parties may not agree on a rate; the legal rate of 10% per year is mandatory in every construction contract","If the contract is silent, no interest may be charged on unpaid amounts until a court enters judgment","The legal rate is 18% per year whenever the contract does not state a different agreed rate"], correct:0, explain:"Utah Code §15-1-1(1) allows the parties to a lawful contract to agree upon any rate of interest. Subsection (2) sets a legal rate of 10% per annum if the parties do not expressly specify a different rate. Separately, §38-1a-309 caps the interest on a lien claimed by a person who is not in privity of contract with the owner or owner-builder at that 10% legal rate.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 15-1-1 and 38-1a-309 (interest)", numeric:true},
  {topic:"Contract Management", q:"Which statement about change orders is true under Utah law?", opts:["Every change order must be in writing to be enforceable, regardless of the size or duration of the change, so even a small or short-duration change would have to be in a signed writing to be enforceable","Utah law does not require every change order to be in writing; the statute of frauds requires a writing only for listed agreements, such as those that cannot be performed within one year","Oral change orders are not enforceable in Utah, even on contracts that can be performed within one year, so an oral change on a contract that can be performed within one year would still be unenforceable","A change order is enforceable only if it is notarized and recorded with the county recorder, so a change order would also have to be notarized and recorded with the county recorder to be enforceable"], correct:1, explain:"Utah Code §25-5-4 requires a writing for certain listed agreements, including those that by their terms cannot be performed within one year. It does not say that every construction change order must be written to be enforceable. A contract may itself require written change orders, but that is a contract term, not a universal statutory rule.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 25-5-4 (statute of frauds)"},
  {topic:"Contract Management", q:"Retainage withheld by an owner or public agency on a contract covered by Utah Code §13-8-5 must be:", opts:["Commingled with the owner's general operating funds, with no separate accounting required","Paid immediately to the original contractor, because retainage cannot be withheld on a covered contract","Placed in an interest-bearing account and accounted for separately from other amounts paid under the contract","Held by the surety on the payment bond, rather than by the owner or public agency"], correct:2, explain:"Utah Code §13-8-5(4)(a) requires retainage withheld by the owner or public agency to be placed in an interest-bearing account and accounted for separately from other amounts paid under the contract.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-5(4)(a) (retainage)"},
  {topic:"Contract Management", q:"On a contract covered by Utah Code §13-8-5, retainage and accrued interest must generally be released within how many days of the later of the listed statutory trigger dates?", opts:["10 days","30 days","180 days","45 days"], correct:3, explain:"Utah Code §13-8-5(5) generally requires retainage and accrued interest to be released pursuant to a billing statement from the contractor within 45 days from the later of specified events, including the date the owner or public agency receives the billing statement and specified occupancy, acceptance, or final-pay-quantity dates.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-5(5)", numeric:true},
  {topic:"Contract Management", q:"An owner, public agency, original contractor, or subcontractor who knowingly and wrongfully withholds retainage under Utah Code §13-8-5 is subject to a charge of:", opts:["2% per month on the improperly withheld amount, in addition to any interest otherwise due","1% per year on the improperly withheld amount, and no other interest may be added","5% of the original contract price, as a one-time penalty, regardless of how long the amount is withheld","10% per year, which replaces any other interest or penalty that would otherwise apply"], correct:0, explain:"Utah Code §13-8-5(10)(b) imposes a charge of 2% per month on the improperly withheld amount, in addition to any interest otherwise due, payable to the contractor or subcontractor from whom the retainage was wrongfully withheld.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-5(10)(b)", numeric:true},
  {topic:"Contract Management", q:"Which statement about payment under a Utah construction contract is true?", opts:["A party may withhold any scheduled payment until the entire project reaches final completion","A party to a construction contract shall make all scheduled payments under the terms of the contract","Scheduled payments are recommended but are not required if the contract is silent on a payment calendar","A party may condition every scheduled payment on the owner first receiving a waiver of all lien rights"], correct:1, explain:"Utah Code §13-8-4(2) states that a party to a construction contract shall make all scheduled payments under the terms of the construction contract.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-4(2)"},
  {topic:"Contract Management", q:"May a party to a contract covered by Utah's retainage statute require another party to waive that statute?", opts:["Yes, a party may require a blanket waiver of Utah Code 13-8-5 as a condition of being awarded the work","Yes, but only on public projects, where the retainage statute may be waived by contract","No. A party to a construction contract may not require any other party to waive any provision of Utah Code §13-8-5","Yes, if both parties initial the waiver, the statute no longer applies to that contract"], correct:2, explain:"Utah Code §13-8-5(11) states that a party to a construction contract may not require any other party to waive any provision of that section.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-5(11)"},
  {topic:"Contract Management", q:"If a lawful Utah construction contract does not specify an interest rate, the legal rate is:", opts:["5% per year","18% per year","24% per year","10% per year"], correct:3, explain:"Utah Code §15-1-1(2) provides that unless the parties expressly specify a different rate, the legal rate of interest is 10% per annum. Section 38-1a-309 applies that same rate to a construction or preconstruction contract, and to a lien, unless the contract provides otherwise.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 15-1-1(2) (legal interest)", numeric:true},
  {topic:"Contract Management", q:"Before signing a contingent payment subcontract, the subcontractor:", opts:["May request, and the contractor shall provide, financial information the contractor has received about the project financing and the paying party","May not request any financing information, because that information is treated as confidential to the GC, leaving the sub with no right to see financing information","May request the information only after the contingent-payment subcontract has already been signed, so the request would have to wait until after the subcontract was signed","Is entitled only to the owner's name, and not to any information about project financing or the paying party, leaving the sub without information about the paying party"], correct:0, explain:"Utah Code §13-8-4(4) allows the subcontractor, if the contract is a contingent payment contract, to request the financial information the contractor has received regarding the project financing and the public or private party, and requires the contractor to provide that information before the subcontractor signs.", commonlyMissed:true, ref:"HBA book: Contract Management section, Utah Code 13-8-4(4)"},
  {topic:"Business Organization", q:"Under current Utah LLC law, a member or manager is personally liable for the LLC's debts:", opts:["Automatically, solely because the person is a member or manager of the LLC, even without a personal guarantee","Not solely by reason of being or acting as a member or manager; an LLC's debt is solely the LLC's debt","Only if the LLC has more than one member; a single-member LLC does not have a liability shield","For every contract the LLC signs, because members are treated as general partners under Utah law"], correct:1, explain:"Utah Code §16-20-304(1) (effective October 1, 2026, succeeding former §48-3a-304) provides that a debt, obligation, or other liability of an LLC is solely the LLC's, and that a member or manager is not personally liable solely by reason of being or acting as a member or manager. This applies even after dissolution. It does not erase liability the person separately assumes, such as a personal guarantee.", commonlyMissed:true, ref:"HBA book: Business Organization section, Utah Code 16-20-304 (LLC liability shield; formerly 48-3a-304)"},
  {topic:"Business Organization", q:"Under Utah LLC law, failure to observe company formalities:", opts:["Automatically makes every member personally liable for all of the LLC's debts","Requires the Division of Professional Licensing to revoke the company's contractor license","Is not, by itself, a ground for imposing liability on a member or manager for an LLC debt","Is treated as fraud in every case, and is the only way a court may reach a member's personal assets"], correct:2, explain:"Utah Code §16-20-304(2) states that failure of an LLC to observe formalities relating to the exercise of its powers or management of its activities and affairs is not a ground for imposing liability on a member or manager for an LLC debt. Personal guarantees and other separately assumed obligations are a different issue.", commonlyMissed:true, ref:"HBA book: Business Organization section, Utah Code 16-20-304 (failure to observe formalities)"},
  {topic:"Business Organization", q:"Is a member an agent of a Utah LLC solely because the person is a member?", opts:["Yes, every member can bind the LLC on any contract, solely because that person is a member","Yes, but only for contracts under $7,000, which is also the contractor-license threshold","Yes, if the member is also an employee of the LLC, even without any other grant of authority","No. A member is not an agent of a limited liability company solely by reason of being a member"], correct:3, explain:"Utah Code §16-20-301(1) (effective October 1, 2026) provides that a member is not an agent of a limited liability company solely by reason of being a member. Authority to bind the company comes from the company's organic rules, a grant of authority, or other law — not from membership status alone.", commonlyMissed:true, ref:"HBA book: Business Organization section, Utah Code 16-20-301 (member is not an agent solely by membership)"},
  {topic:"Safety", q:"In a trench that is 4 feet or more deep, OSHA requires a stairway, ladder, ramp, or other safe means of egress located so that a worker's lateral travel is no more than:", opts:["25 feet","10 feet","15 feet","50 feet"], correct:0, explain:"29 CFR 1926.651(c)(2) requires a stairway, ladder, ramp, or other safe means of egress in trench excavations that are 4 feet or more in depth, located so as to require no more than 25 feet of lateral travel for employees.", commonlyMissed:true, ref:"OSHA 29 CFR 1926.651(c)(2) (trench egress); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"OSHA generally requires excavated materials (spoils) and other materials or equipment that could fall or roll into an excavation to be kept at least how far from the edge, unless a sufficient retaining device is used?", opts:["6 inches","2 feet","6 feet","10 feet"], correct:1, explain:"29 CFR 1926.651(j)(2) requires protection by placing and keeping such materials or equipment at least 2 feet from the edge of excavations, or by using retaining devices sufficient to prevent materials or equipment from falling or rolling into excavations, or both if necessary.", commonlyMissed:true, ref:"OSHA 29 CFR 1926.651(j)(2) (spoils setback); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"When employee exposure can be reasonably anticipated, a competent person must inspect an excavation:", opts:["Only when OSHA is on site, and not as a routine daily or post-storm requirement, so a daily or post-storm inspection would not be required","Once, at the beginning of the project only, with no further inspections after work starts, with no further inspections required after that initial visit","Daily before the start of work and as needed during the shift, and after every rainstorm or other hazard-increasing occurrence","Only after a cave-in has already occurred, as part of the post-incident investigation, so the inspection would be only a post-incident step after a cave-in"], correct:2, explain:"29 CFR 1926.651(k)(1) requires a competent person to inspect the excavation, adjacent areas, and protective systems daily prior to the start of work and as needed throughout the shift, and also after every rainstorm or other hazard-increasing occurrence, when employee exposure can be reasonably anticipated.", commonlyMissed:true, ref:"OSHA 29 CFR 1926.651(k) (excavation inspections); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"When a portable ladder is used to reach an upper landing, the side rails must generally extend above that landing by at least:", opts:["1 foot","6 feet","10 feet","3 feet"], correct:3, explain:"29 CFR 1926.1053(b)(1) requires that when portable ladders are used for access to an upper landing surface, the ladder side rails extend at least 3 feet above the upper landing surface, unless the ladder is properly secured to a rigid support and a suitable grasping device is provided.", commonlyMissed:true, ref:"OSHA 29 CFR 1926.1053(b)(1) (ladder extension above landing); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"An employer required to complete the OSHA Form 300A annual summary must generally post it from:", opts:["February 1 through April 30","January 1 through January 31","July 1 through December 31","Only on the day of an OSHA inspection"], correct:0, explain:"29 CFR 1904.32 requires the employer to post the Form 300A annual summary in a conspicuous place from February 1 through April 30 of the year following the calendar year covered by the records.", commonlyMissed:true, ref:"OSHA 29 CFR 1904.32 (Form 300A posting); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"Hazard communication on a construction site requires employees to have access to information about hazardous chemicals, including:", opts:["Only a verbal warning from a coworker, with no written chemical-specific information required","Safety Data Sheets and the other required elements of the Hazard Communication standard","A single general poster, with no safety data sheets or other chemical-specific information","Nothing, because construction work is exempt from the Hazard Communication standard"], correct:1, explain:"OSHA's Hazard Communication standard, 29 CFR 1910.1200, applies to construction through 29 CFR 1926.59. Employers must have a hazard-communication program, label containers, provide Safety Data Sheets, and train employees on hazardous chemicals in the workplace.", commonlyMissed:true, ref:"OSHA 29 CFR 1910.1200 and 1926.59 (hazard communication / SDS); HBA book: Safety section"},
  {topic:"Tax Laws", q:"A contractor should generally report wages paid to an employee on which form, as distinct from nonemployee compensation paid to an independent contractor?", opts:["Form 1099-NEC for the employee and Form W-2 for the independent contractor, which reverses the usual forms","Form 940 for both the employee and the independent contractor, with no W-2 or 1099-NEC required","Form W-2 for the employee and, when required, Form 1099-NEC for the independent contractor","Form W-9 for both, with no year-end information return issued to either the employee or the contractor"], correct:2, explain:"Employers report wages paid to employees on Form W-2. Nonemployee compensation at or above the IRS threshold ($600 for payments before 2026; $2,000 for 2026 payments) paid to an independent contractor is generally reported on Form 1099-NEC. Mixing those forms is a common classification and reporting error.", commonlyMissed:true, ref:"IRS Form W-2 vs Form 1099-NEC; HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"An employer's annual federal unemployment (FUTA) tax return is filed on:", opts:["Form 941, the employer's quarterly federal employment-tax return","Form 1099-NEC, used to report nonemployee compensation to a payee and the IRS","Form W-4, the employee's withholding certificate for federal income tax","Form 940, the employer's annual federal unemployment (FUTA) tax return"], correct:3, explain:"Form 940 is the employer's annual Federal Unemployment Tax Act (FUTA) return. Form 941 is the quarterly return for withheld income tax and the employer and employee shares of Social Security and Medicare taxes, not the annual FUTA return.", commonlyMissed:true, ref:"IRS Form 940 (annual FUTA); HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"Form W-4 is used to:", opts:["Let an employee tell the employer how to calculate federal income tax withholding from wages","Report an independent contractor's annual nonemployee compensation to the IRS and to the payee","Apply for an Employer Identification Number for a new business with the IRS","File the employer's annual federal unemployment (FUTA) tax return for the calendar year"], correct:0, explain:"An employee completes Form W-4 so the employer can calculate federal income tax withholding from wages. It is not the year-end wage statement (W-2), the independent-contractor reporting form (1099-NEC), or the FUTA return (940).", commonlyMissed:true, ref:"IRS Form W-4 (employee withholding); HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"In addition to the 2.9% Medicare portion of self-employment or FICA tax, an additional Medicare tax of 0.9% generally applies to earnings above a statutory threshold. That additional 0.9% is:", opts:["Split equally by a 0.45% employer match, just as the base 2.9% Medicare tax is shared","Paid only by the employee or self-employed individual; there is no employer match","Paid only by the employer, with no amount withheld from the employee or paid by a self-employed person","Repealed and no longer in effect, so only the base Medicare tax applies above the threshold"], correct:1, explain:"The Additional Medicare Tax of 0.9% under the Internal Revenue Code applies to wages or self-employment income above the statutory threshold and is not matched by an employer. That is separate from the base 1.45% employee / 1.45% employer Medicare tax (or the 2.9% Medicare portion of self-employment tax).", commonlyMissed:true, ref:"IRC Additional Medicare Tax (0.9%); HBA book: Tax Laws section"},

  {topic:"Licensing", q:"An R100 residential and small commercial contractor may perform commercial construction of no more than:", opts:["Two stories above ground and 10,000 square feet","Three stories above ground and 20,000 square feet","Four stories above ground and 30,000 square feet","Five stories above ground with no square-footage limit"], correct:1, explain:"Utah Code §58-55-102(42) (effective 10/1/2026; repealed 1/1/2027) defines a residential and small commercial contractor as qualified to perform or superintend single-family residences, multifamily residences up to four units, and commercial construction of not more than three stories above ground and not more than 20,000 square feet (with the usual plumbing, electrical, mechanical, and manufactured-housing exceptions). Utah Admin. Code R156-55a-301h ties the R100 scope to that definition. A B100 general building contractor is not limited to those commercial size caps.", ref:"HBA book: Licensing section, Utah Code 58-55-102(42) and R156-55a-301h (R100 commercial limits)", numeric:true},
  {topic:"Licensing", q:"Failure to notify the Division of a change in qualifier is:", opts:["Only a late-renewal fee issue, with no effect on the current status of the license, so the failure would not affect the license status itself","Automatically a class A felony, even on a first failure to notify the Division, so a first failure to notify the Division would be a class A felony","Grounds for immediate suspension of the license by the Division, not merely a later fee or a separate criminal charge","Permitted so long as the business owners remain the same people after the qualifier changes"], correct:2, explain:"Utah Code §58-55-503(4)(b) (effective 5/1/2024; superseded 1/1/2027) lists failure to notify the division concerning a change in qualifier, or loss of insurance coverage, as grounds for immediate suspension. Utah Admin. Code R156-55a-501(1) (current compiled rule effective 8/7/2026) likewise treats failure to notify the Division of a qualifier change as unprofessional conduct and as grounds for immediate suspension.", ref:"HBA book: Licensing section, Utah Code 58-55-503(4)(b) and R156-55a-501 (qualifier-change notice)"},
  {topic:"Licensing", q:"A contractor must notify the Division of a change in the qualifier's or owners' name, address, phone number, or email within:", opts:["5 days","30 days","90 days","10 days"], correct:3, explain:"Utah Admin. Code R156-55a-501(2) (current compiled rule effective 8/7/2026) makes it unprofessional conduct to fail to notify the Division within 10 days of any change of the name, address, phone number, or email address of the qualifier or owners of a licensee.", ref:"HBA book: Licensing section, R156-55a-501(2) (10-day contact-info notice)", numeric:true},
  {topic:"Licensing", q:"Performing construction-trades work without a required license is generally:", opts:["A class A misdemeanor under the Construction Trades Licensing Act, not a lesser infraction only","A class C misdemeanor only, with no possibility of a more serious charge on a first offense","A second-degree felony on the first offense of unlicensed construction-trades work","Lawful if the contract price is under $50,000, even though no license is held"], correct:0, explain:"Utah Code §58-55-501 makes unlicensed practice unlawful. §58-55-503(2)(a) (effective 5/1/2024; superseded 1/1/2027) provides that a person who violates §58-55-501(1) and listed related provisions is guilty of a class A misdemeanor.", ref:"HBA book: Licensing section, Utah Code 58-55-501 and 58-55-503(2)(a) (unlicensed practice)"},
  {topic:"Licensing", q:"For a first qualifying citation under Utah Code §58-55-503, the director generally may assess a fine of up to:", opts:["$250","$500","$1,000","$10,000"], correct:2, explain:"Utah Code §58-55-503(5)(h)(i) (effective 5/1/2024; superseded 1/1/2027) sets the general citation fine at up to $1,000 for a first offense, up to $2,000 for a second offense, and up to $2,000 for each day of a subsequent continued offense. Certain listed subsections carry higher $2,000 / $4,000 / $4,000-per-day amounts.", ref:"HBA book: Licensing section, Utah Code 58-55-503(5)(h) (citation fines)", numeric:true},
  {topic:"Licensing", q:"If a person bids construction work that requires a license and is unlicensed, the bid:", opts:["May be awarded if it is the low bid, and the person may accept the contract after the bid opening","May not be awarded, and the person may not accept the contract for the work while remaining unlicensed","Becomes valid after a 10-day cure period in which the person may later obtain a license","Is valid if a license is obtained before final payment, even if the bidder was unlicensed when the bid was made"], correct:1, explain:"Utah Code §58-55-501(8) makes bidding without a required license unlawful. §58-55-503(2)(b) (effective 5/1/2024; superseded 1/1/2027) provides that a person who violates §58-55-501(8) may not be awarded and may not accept a contract for the performance of the work.", ref:"HBA book: Licensing section, Utah Code 58-55-501(8) and 58-55-503(2)(b) (unlicensed bidding)"},
  {topic:"Licensing", q:"When performing construction-trades work, failing to timely provide, upon request, a copy of a current license or the license number is:", opts:["Unprofessional conduct under Utah Admin. Code R156-55a-501, when the license or license number is requested","Required only on company vehicles, and not when a person requests a license or license number at the site","Optional if the job is under $7,000, even when a person requests a copy of the license or the license number","Required only on public projects, and not when the work is performed for a private owner"], correct:0, explain:"Utah Admin. Code R156-55a-501(9) (current compiled rule effective 8/7/2026) defines as unprofessional conduct failing to timely provide, upon request by any person, a copy of a current license or license number when performing construction trades work. Vehicle license-number display in Utah Code §58-55-501(25) applies to sign installation / nonelectrical outdoor advertising sign contractors, not to all general contractors.", ref:"HBA book: Licensing section, R156-55a-501(9) (provide license or license number on request)"},
  {topic:"Licensing", q:"During each two-year renewal cycle, a contractor licensee generally must complete:", opts:["3 hours of continuing education, with no core-hour or live in-class requirement","12 hours, all of which may be completed online, with no live in-class hours required","24 hours, with no core-hour requirement and with no live in-class attendance required","6 hours of continuing education, including at least 3 core hours and 3 live in-class hours"], correct:3, explain:"Utah Admin. Code R156-55a-303b (current compiled rule effective 8/7/2026), under Utah Code §58-55-302.5, requires six hours of continuing education during each two-year license term. At least three hours must be core education, and at least three hours must be live in-class attendance; the remaining hours may be professional or core, and may be distance learning. Contractors with a renewal cycle ending after January 1, 2020, must also include at least one hour of energy conservation within those six hours.", ref:"HBA book: Licensing section, Utah Code 58-55-302.5 and R156-55a-303b (continuing education)", numeric:true},
  {topic:"Licensing", q:"A person who advertises that they will perform a service requiring a contractor license, but does not hold that license:", opts:["Is exempt if the advertisement is only online, and not in print or on a jobsite sign","Is exempt if no contract is signed later, because advertising alone is not treated as acting as a contractor","Is treated as a contractor, and acting as a contractor without the required license is unlawful","Commits only a private contract breach, and not a licensing violation under the Construction Trades Licensing Act"], correct:2, explain:"Utah Code §58-55-102 defines 'contractor' to include a person who advertises that the person is a contractor or will perform a service that requires a license under the chapter. Engaging in a construction trade or acting as a contractor without the required license is unlawful conduct under §58-55-501.", ref:"HBA book: Licensing section, Utah Code 58-55-102 and 58-55-501 (advertising without a license)"},
  {topic:"Licensing", q:"If a contractor loses required insurance coverage, the contractor must:", opts:["Notify the Division; failure to notify of the loss of required insurance is grounds for immediate suspension","Wait until the next renewal to report the lapse, because insurance is reviewed only at renewal","Notify only the surety company, with no duty to notify the Division of the loss of coverage","Notify only if a claim is later filed under the lapsed policy, and not at the time coverage is lost"], correct:0, explain:"Utah Code §58-55-503(4)(b) (effective 5/1/2024; superseded 1/1/2027) includes failure to notify the division concerning loss of insurance coverage, or a change in qualifier, as grounds for immediate suspension of the license. R156-55a-501 also treats failure to continuously maintain required insurance as unprofessional conduct.", ref:"HBA book: Licensing section, Utah Code 58-55-503(4)(b) and R156-55a-501 (loss of insurance)"},
  {topic:"Labor Laws", q:"An employer required to provide workers' compensation coverage must generally secure it by:", opts:["An authorized insurer or Division-approved self-insurance, not a liability policy or a bond alone","A handshake agreement with employees to waive coverage, in place of a policy or an approved self-insurance plan","A general liability policy only, with no workers' compensation policy or approved self-insurance","A performance bond, which is treated as a substitute for workers' compensation coverage"], correct:0, explain:"Utah Code §34A-2-201 requires an employer to secure workers' compensation obligation by insuring with an authorized insurer or by obtaining approval to self-insure. A general liability policy or a performance bond is not a substitute for workers' compensation coverage.", ref:"HBA book: Labor Laws section, Utah Code 34A-2-201 (securing workers' compensation)"},
  {topic:"Labor Laws", q:"Utah's new-hire reporting law generally requires an employer to report a new or rehired employee within:", opts:["3 days","7 days","20 days","90 days"], correct:2, explain:"Utah Code §35A-7-104 requires an employer to report a new hire or rehire to the state directory of new hires within 20 days of the hire date, or on a Division-approved semimonthly schedule.", ref:"HBA book: Labor Laws section, Utah Code 35A-7-104 (new-hire reporting)", numeric:true},
  {topic:"Labor Laws", q:"The ordinary civil penalty for failing to report a new hire, if the failure is not intentional, is generally:", opts:["$500, the higher penalty when the failure is intentional or part of an agreement to withhold or falsify information","$250, a mid-range figure that is not the ordinary statutory civil penalty for an unintentional failure","$10, a figure below the ordinary statutory civil penalty for an unintentional failure to report","$25, the ordinary civil penalty when the failure to report a new hire is not intentional"], correct:3, explain:"Utah Code §35A-7-106 provides a civil penalty of $25 for a failure to report. The penalty is $500 if the failure is intentional or is the result of a conspiracy or agreement to withhold the report or to supply false or incomplete information.", ref:"HBA book: Labor Laws section, Utah Code 35A-7-106 (new-hire penalties)", numeric:true},
  {topic:"Labor Laws", q:"Utah generally requires regular paydays no farther apart than semimonthly, and wages for a pay period must be paid within:", opts:["24 hours after the close of the pay period","3 days after the close of the pay period","10 days after the close of the pay period","30 days after the close of the pay period"], correct:2, explain:"Utah Code §34-28-3(1) requires an employer to pay wages at regular intervals no longer than semimonthly, and to pay for services rendered during a pay period within 10 days after the close of that pay period. (A yearly-salary employee may be paid monthly by the 7th of the following month.)", ref:"HBA book: Labor Laws section, Utah Code 34-28-3 (paydays and payment timing)", numeric:true},
  {topic:"Labor Laws", q:"After an employee starts work, the employer must generally complete Section 2 of Form I-9 within:", opts:["1 calendar day of the date of hire","3 business days of the date of hire","7 calendar days of the date of hire","30 days of the date of hire"], correct:1, explain:"Federal Form I-9 rules under 8 CFR 274a.2 (IRCA) require the employee to complete Section 1 by the first day of employment and the employer to complete Section 2 within 3 business days of the hire date. Utah does not set a different I-9 deadline.", ref:"Form I-9, 8 CFR 274a.2 (IRCA); HBA book: Labor Laws section", numeric:true},
  {topic:"Risk Management", q:"Which policy typically covers the building and materials against fire, theft, or weather damage during construction?", opts:["Workers' compensation, which pays for injury to employees rather than damage to the work or materials","Builder's risk (course of construction) insurance, which is property coverage for the work and materials during construction","A payment bond, which is a surety product for unpaid subcontractors and suppliers, not property insurance","Professional liability (errors and omissions) coverage only, which addresses design or professional mistakes"], correct:1, explain:"In standard construction-practice and NASCLA-type business-and-law materials, builder's risk (course-of-construction) insurance is property coverage for the work and materials while the project is being built. It is not a substitute for workers' compensation, liability insurance, or payment or performance bonds.", ref:"NASCLA guide: Risk Management, builder's risk (course of construction)"},
  {topic:"Risk Management", q:"A payment bond is primarily intended to protect:", opts:["Subcontractors and suppliers who furnish labor or materials, if the principal fails to pay them","The contractor's lenders only, and not the subcontractors or suppliers who furnished labor or materials","The architect's professional liability, which is the risk a payment bond is designed to cover","The owner's lost profits from a delayed opening, which is the subject of a payment bond rather than delay damages"], correct:0, explain:"In standard construction suretyship, a payment bond guarantees that subcontractors and suppliers will be paid if the principal fails to pay them. A performance bond, by contrast, protects the obligee if the contractor fails to complete the contracted work. Utah public projects also use payment-bond remedies under Title 63G, Chapter 6a, Part 11.", ref:"NASCLA guide: Risk Management, payment bonds; HBA book: Utah Code Title 63G, Chapter 6a, Part 11"},
  {topic:"Risk Management", q:"A bid bond generally protects the owner if the apparent low bidder:", opts:["Finishes the work late, after the contract has already been signed and the performance bond is in place","Has a jobsite injury, which is the event a bid bond is designed to cover instead of workers' compensation","Omits sales tax from an invoice after the work has begun, which is the default a bid bond is meant to address","Refuses to enter the contract or fails to provide the required performance or payment bonds"], correct:3, explain:"In standard surety practice, a bid bond (bid security) compensates the owner if the selected bidder will not honor the bid or cannot furnish the required contract bonds. Late completion, injuries, and tax errors are not what a bid bond is designed to cover.", ref:"NASCLA guide: Risk Management, bid bonds"},
  {topic:"Risk Management", q:"A hold-harmless (indemnity) clause is intended to:", opts:["Replace the need for insurance, so the parties can rely on the clause alone for protection against loss","Waive all mechanic's lien rights automatically, without a separate lien waiver or release","Transfer specified loss or liability from one party (the indemnitor) to another (the indemnitee)","Set the contract retainage percentage, which is the main purpose of a hold-harmless clause"], correct:2, explain:"In standard contract practice, an indemnity or hold-harmless clause allocates risk by requiring one party (the indemnitor) to protect another (the indemnitee) against specified claims or losses. It does not by itself replace insurance, waive lien rights, or set retainage.", ref:"NASCLA guide: Risk Management, hold-harmless / indemnity clauses"},
  {topic:"Risk Management", q:"Completed operations coverage under a CGL policy is intended to cover:", opts:["Only tools stolen from a locked truck during construction, which is a property-theft risk rather than completed-operations liability","The contractor's income taxes, which a CGL policy is designed to cover after the work is complete","Bid-shopping disputes, which are a contract or bid-practice issue rather than completed-operations coverage","Injury or damage arising from the work after it has been finished and put to its intended use"], correct:3, explain:"In standard CGL / NASCLA-type insurance materials, completed-operations coverage addresses bodily injury or property damage that occurs after the work is complete and put to its intended use, as distinguished from premises and operations coverage during the work.", ref:"NASCLA guide: Risk Management, completed operations coverage"},
  {topic:"Project Management", q:"A schedule of values is used primarily to:", opts:["List unit prices for a cost-plus contract only, and not to support progress billing on a lump-sum job","Break the contract sum into line items so progress payments can be billed and reviewed against completed work","Replace the need for change orders, because later scope changes are handled by revising the schedule of values alone","Set the project retainage cap under Utah law, which is the statutory purpose of a schedule of values"], correct:1, explain:"In standard construction project-management practice, a schedule of values allocates the contract price among work items so progress payments can be billed and reviewed against completed work. It does not replace change orders or establish Utah's retainage limits.", ref:"NASCLA guide: Scheduling and Project Management, schedule of values"},
  {topic:"Project Management", q:"A punch list is typically prepared:", opts:["Before the bid is submitted, as a list of items the contractor intends to exclude from the proposal","Only after the warranty period expires, when latent defects are first identified","Only by the surety, as a condition of releasing the performance bond","Near substantial completion, to list remaining incomplete or deficient work"], correct:3, explain:"In standard closeout practice, a punch list identifies incomplete or corrective items at or near substantial completion that must be finished before final completion and final payment.", ref:"NASCLA guide: Scheduling and Project Management, punch list"},
  {topic:"Project Management", q:"Shop drawings are typically prepared by:", opts:["The contractor or a subcontractor or supplier, to show how work will be fabricated or installed","The building official, as part of the permit-review set rather than a contractor or supplier submittal","The surety, as a condition of issuing the performance and payment bonds","The lender's appraiser, as part of the loan-closeout package rather than a construction submittal"], correct:0, explain:"In standard project-documentation practice, shop drawings (along with product data and samples) are submittals prepared by the contractor, a subcontractor, or a supplier to show fabrication or installation details for review. They supplement, but do not replace, the contract documents.", ref:"NASCLA guide: Scheduling and Project Management, shop drawings / submittals"},
  {topic:"Project Management", q:"A time-and-material (or force-account) change is typically used when:", opts:["The original bid included an allowance, which is the usual reason to switch a change to time-and-material terms","The project is already finally complete, and the change is used to reopen the completed contract","The parties cannot reasonably price the change in advance, so documented labor, equipment, and materials are used instead","The contractor wants to avoid a license requirement, which a force-account change is designed to do"], correct:2, explain:"In standard change-order practice, when the scope or cost cannot be fairly priced as a lump sum in advance, the change may be performed on a time-and-material or force-account basis, with documented labor, equipment, and materials. It is not a device to avoid licensing or to reopen a finished contract.", ref:"NASCLA guide: Scheduling and Project Management, time-and-material / force-account changes"},
  {topic:"Project Management", q:"A bar chart (Gantt) schedule typically shows:", opts:["Only cash-flow projections, with no activities or calendar dates shown on the chart","Activities plotted against time, but not the logical relationships a CPM network shows","Lien filing deadlines only, which is the main purpose of a Gantt or bar-chart schedule","Payroll tax deposit dates, rather than construction activities plotted against time"], correct:1, explain:"In standard scheduling practice, a bar chart or Gantt chart displays activities against a calendar. A CPM network also shows predecessor and successor logic and is used to identify the critical path and float.", ref:"NASCLA guide: Scheduling and Project Management, bar chart (Gantt) vs CPM"},
  {topic:"Estimating and Bidding", q:"Job costs are $48,000. A 25% markup on cost produces a bid of:", opts:["$54,000","$60,000","$64,000","$72,000"], correct:1, explain:"Markup is a percentage of cost. $48,000 × 1.25 = $60,000. The resulting profit margin is $12,000 / $60,000 = 20%, which is not the same as a 25% margin.", ref:"NASCLA guide: Bidding and Estimating, markup vs margin math", numeric:true},
  {topic:"Estimating and Bidding", q:"Job costs are $64,000. To earn a 20% profit margin, the bid price should be:", opts:["$70,400","$76,800","$80,000","$84,000"], correct:2, explain:"Margin is profit divided by selling price. Price = cost ÷ (1 − margin) = $64,000 ÷ 0.80 = $80,000. A 20% markup on cost would be only $76,800 and would yield a lower margin ($12,800 / $76,800 ≈ 16.7%).", ref:"NASCLA guide: Bidding and Estimating, markup vs margin math", numeric:true},
  {topic:"Estimating and Bidding", q:"A quantity takeoff is primarily:", opts:["A measurement of the labor, material, and equipment quantities needed to build the work","A list of allowance items in the specifications, rather than a measurement of work quantities","The contractor's profit percentage, which is calculated as part of the quantity takeoff itself","A bid-bond calculation, which is the primary purpose of measuring quantities from the drawings"], correct:0, explain:"In standard estimating practice, a takeoff (quantity survey) measures the quantities of work from the drawings and specifications; those quantities are then priced. It is not itself a profit percentage, allowance schedule, or bid-bond computation.", ref:"NASCLA guide: Bidding and Estimating, quantity takeoffs"},
  {topic:"Estimating and Bidding", q:"On a cost-plus contract, the owner generally pays:", opts:["A single lump-sum price regardless of the contractor's actual documented cost on the project","Only unit prices for estimated quantities, with no reimbursement of actual documented cost plus an agreed fee","Only the bid-bond amount, which is treated as the owner's entire payment obligation on a cost-plus job","The contractor's actual documented costs plus an agreed fee or percentage, rather than a single fixed lump sum"], correct:3, explain:"In standard bid and contract types, a lump-sum (stipulated-sum) contract is a fixed price; a unit-price contract pays actual quantities at agreed unit rates; and a cost-plus contract reimburses the contractor's actual documented costs plus an agreed fee or percentage. Each type allocates cost risk differently.", ref:"NASCLA guide: Bidding and Estimating, cost-plus vs lump-sum vs unit-price"},
  {topic:"Tax Laws", q:"Federal estimated income-tax payments for a calendar-year sole proprietor are generally due:", opts:["The 15th of January, April, July, and October, which are the federal estimated-tax dates for a calendar-year filer","April 15, June 15, September 15, and January 15 of the following year, not equal calendar-quarter end dates","The last day of March, June, September, and December, which would follow equal calendar quarters","April 15 only, with no other estimated-tax installment dates during the year"], correct:1, explain:"IRS estimated-tax rules (Form 1040-ES) use April 15, June 15, September 15, and January 15 of the following year — not equal calendar quarters and not January/April/July/October 15. The January 15 payment can generally be avoided if the return is filed and the balance is paid by January 31.", ref:"IRS Form 1040-ES (estimated-tax due dates); HBA book: Tax Laws section", numeric:true},
  {topic:"Tax Laws", q:"A business generally must furnish Form 1099-NEC to a payee by:", opts:["January 15","February 28","April 15","January 31"], correct:3, explain:"IRS instructions for Form 1099-NEC generally require the form to be furnished to the recipient and filed with the IRS by January 31. That due date is tighter than some other 1099 types that may have a later IRS filing date.", ref:"IRS Form 1099-NEC (January 31 furnish-and-file date); HBA book: Tax Laws section", numeric:true},
  {topic:"Tax Laws", q:"To avoid an estimated-tax underpayment penalty, a sole proprietor generally must prepay at least:", opts:["90% of the current-year tax, or 100% of the prior-year tax (110% if prior-year AGI exceeded $150,000)","50% of the current-year tax, with no alternative based on the prior year's tax","70% of last year's tax, which is the ordinary safe harbor without regard to current-year tax or AGI","Only the Social Security portion of self-employment tax, and not income tax or the Medicare portion"], correct:0, explain:"Under IRC §6654 and IRS Publication 505, the common safe harbors are to prepay at least 90% of the current year's tax, or 100% of the prior year's tax (110% if prior-year adjusted gross income exceeded $150,000). Paying only half, or only the Social Security portion, does not meet the safe harbor.", ref:"IRC 6654 and IRS Publication 505 (estimated-tax safe harbor); HBA book: Tax Laws section", numeric:true},
  // ---- Numbers & Deadlines drill: exact days, dollar amounts, percentages, and formulas ----
  {topic:"Lien Laws", q:"After recording a notice of construction lien in Utah, the claimant must deliver or mail a copy to the owner by certified mail within:", opts:["10 days","20 days","30 days","45 days"], correct:2, explain:"Utah Code §38-1a-502(4)(a): within 30 days after filing a notice of construction lien, the claimant must deliver or mail a copy by certified mail to the reputed owner or record owner.", ref:"HBA book: Lien Law section, Utah Code 38-1a-502(4) (30-day copy to owner)", numeric:true},
  {topic:"Lien Laws", q:"A subcontractor performs substantial work after the certificate of occupancy is issued. That sub must record its lien no later than:", opts:["90 days after its own work ends","120 days after its own work ends","180 days after its own work ends","1 year after its own work ends"], correct:2, explain:"Utah Code §38-1a-502(1)(b): a subcontractor who provides substantial work after a certificate of occupancy is issued (or a required final inspection is completed) must record its notice of construction lien no later than 180 days after final completion of that subcontractor's work.", ref:"HBA book: Lien Law section, Utah Code 38-1a-502(1)(b) (post-CO subcontractor work)", numeric:true},
  {topic:"Lien Laws", q:"The owner files bankruptcy before the 180-day lien enforcement period runs out. The claimant must then file the enforcement action within:", opts:["30 days after the stay is lifted","60 days after the stay is lifted","90 days after the stay is lifted","180 days after the stay is lifted"], correct:2, explain:"Utah Code §38-1a-701(2): an action to enforce a lien is normally due within 180 days after the lien is filed, but if the owner files bankruptcy before that period expires, the action is due within 90 days after the automatic stay is lifted or expires.", ref:"HBA book: Lien Law section, Utah Code 38-1a-701(2)(b) (bankruptcy extension)", numeric:true},
  {topic:"Lien Laws", q:"On an unbonded commercial nonresidential project lasting more than 120 days, a notice of intent to obtain final completion is required when the original contract price exceeds:", opts:["$250,000","$500,000","$750,000","$1,000,000"], correct:1, explain:"Utah Code §38-1a-506(1): the notice of intent is required when the performance time exceeds 120 days, the original contract price exceeds $500,000, and no payment bond was obtained under §14-2-1.", ref:"HBA book: Lien Law section, Utah Code 38-1a-506(1) (notice of intent thresholds)", numeric:true},
  {topic:"Lien Laws", q:"A required notice of intent to obtain final completion must be filed at least how many days before the notice of completion could be filed?", opts:["20 days","30 days","45 days","60 days"], correct:2, explain:"Utah Code §38-1a-506(2): the notice of intent must be filed at least 45 days before the day the owner or original contractor files, or could have filed, a notice of completion.", ref:"HBA book: Lien Law section, Utah Code 38-1a-506(2) (45 days before completion)", numeric:true},
  {topic:"Lien Laws", q:"After a notice of intent to obtain final completion is filed, each lien claimant must amend its preliminary notice with a balance statement within:", opts:["10 days","15 days","20 days","30 days"], correct:2, explain:"Utah Code §38-1a-506(3)(b): a person providing work must file an amendment to its preliminary notice (estimate of the amount remaining due, who it contracted with, and disputed amounts) no later than 20 days after the notice of intent is filed.", ref:"HBA book: Lien Law section, Utah Code 38-1a-506(3) (20-day balance statement)", numeric:true},
  {topic:"Lien Laws", q:"A claimant intentionally records an inflated lien to cloud the title. Besides criminal liability, the claimant owes the affected party:", opts:["The excess amount or actual damages, whichever is greater","Twice the excess amount or actual damages, whichever is greater","Three times the excess amount or actual damages, whichever is greater","Four times the excess amount or actual damages, whichever is greater"], correct:1, explain:"Utah Code §38-1a-308 (current version effective 5/6/2026) makes an intentionally excessive lien a class B misdemeanor and makes the claimant liable to the affected owner, original contractor, or subcontractor for twice the amount by which the lien exceeds what is actually due, or actual damages, whichever is greater. Older study materials may describe this section differently, so check the current code.", ref:"HBA book: Lien Law section, Utah Code 38-1a-308 (excessive lien liability)", numeric:true},
  {topic:"Lien Laws", q:"A subcontractor on an owner-occupied home is barred from maintaining a lien if the owner's general contract totals no more than:", opts:["$2,500","$5,000","$7,500","$10,000"], correct:1, explain:"Utah Code §38-11-107(1)(b): a subcontractor is barred from maintaining a lien on an owner-occupied residence (or getting a judgment against the owner) if the general contract totals no more than $5,000, whether or not the original contractor is licensed.", ref:"HBA book: Lien Law section, Utah Code 38-11-107(1)(b) (residence lien restriction)", numeric:true},
  {topic:"Lien Laws", q:"A claimant on a private commercial payment bond under Utah Code §14-2-1 must start the lawsuit no later than:", opts:["90 days after its last work","180 days after its last work","1 year after its last work","2 years after its last work"], correct:2, explain:"Utah Code §14-2-1(4)-(5): a claimant not paid in full within 90 days after its last labor or materials has a right of action on the bond, and the action is barred unless commenced within one year after the claimant's last day of work or supply.", ref:"HBA book: Lien Law section, Utah Code 14-2-1(5) (private payment bond suit deadline)", numeric:true},
  {topic:"Lien Laws", q:"On a private commercial job, a sub may sue on the payment bond once it has gone unpaid for how long after its last work?", opts:["30 days","60 days","90 days","120 days"], correct:2, explain:"Utah Code §14-2-1(4): a person has a right of action on the payment bond if it has not been paid in full within 90 days after the last day it performed labor or supplied equipment or material. Public projects follow the same 90-day rule under §63G-6a-1103(4).", ref:"HBA book: Lien Law section, Utah Code 14-2-1(4) and 63G-6a-1103(4) (90-day bond right)", numeric:true},
  {topic:"Risk Management", q:"On a Utah public construction contract, the performance bond and the payment bond must each equal what share of the contract price?", opts:["50%","75%","100%","125%"], correct:2, explain:"Utah Code §63G-6a-1103(1): the awarded contractor must deliver a performance bond and a payment bond, each in an amount equal to 100% of the contract price, from a surety authorized in Utah (unless waived by rule).", ref:"NASCLA guide: Risk Management (bonds), Utah Code 63G-6a-1103(1) (100% bonds)", numeric:true},
