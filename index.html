  {topic:"Contract Management", q:"A 'cardinal change' to a contract is one that is:", opts:["Any change order, no matter how small","So fundamental in scope or nature that it goes beyond what the parties originally bargained for — potentially treated as a breach of the original contract rather than a covered change", "Only relevant to change orders under $1,000","A change requested verbally instead of in writing"], correct:1, explain:"A cardinal change is so drastic it effectively creates a different project than the parties agreed to — courts may treat it as a breach of the original contract rather than simply a large change order within its scope."},
  {topic:"Contract Management", q:"'Consequential damages' differ from 'direct damages' in a construction dispute in that consequential damages:", opts:["Are always smaller in dollar amount than direct damages","Are indirect losses flowing from a breach — like lost business income or rental costs during a delay — rather than the direct cost of fixing/completing the work itself; many contracts specifically waive consequential damages to limit this exposure", "Only apply to residential projects","Can never be included in a construction contract"], correct:1, explain:"Direct damages are the immediate cost of the breach itself (redoing bad work, cost to complete); consequential damages are the ripple-effect losses (lost profits, rental costs) — which is exactly why many contracts include a mutual waiver of consequential damages to cap exposure.", commonlyMissed:true},
  {topic:"Risk Management", q:"In surety bond terminology, the 'obligee,' 'principal,' and 'surety' refer respectively to:", opts:["The contractor, the owner, and the bank","The party protected by the bond (usually the project owner), the party whose performance is guaranteed (the contractor), and the company issuing the bond and guaranteeing performance", "Three different types of the same bond","The insurance agent, the adjuster, and the underwriter"], correct:1, explain:"Obligee = the protected party (typically the owner); Principal = the bonded party (the contractor); Surety = the company backing the bond financially — mixing these up is a common and costly terminology error.", commonlyMissed:true},
  {topic:"Risk Management", q:"In an indemnification arrangement, the 'indemnitor' and 'indemnitee' refer respectively to:", opts:["The insurance company and the policyholder","The party who agrees to cover/hold harmless the other party's losses (indemnitor), and the party being protected/held harmless (indemnitee)", "The plaintiff and the defendant in any lawsuit","Two interchangeable terms for the same role"], correct:1, explain:"The indemnitor is the one agreeing to absorb specified losses; the indemnitee is the one being protected — this maps directly onto who is providing versus receiving protection in an indemnification clause."},
  {topic:"Risk Management", q:"A 'named insured' on a policy differs from an 'additional insured' in that the named insured:", opts:["Has fewer rights under the policy than an additional insured","Is the primary policyholder with the broadest rights and obligations under the policy (like paying premiums and being notified of changes), while an additional insured has coverage extended to them for specified purposes without those primary policyholder obligations", "Is only relevant for health insurance, not liability policies","Automatically becomes the additional insured's employer"], correct:1, explain:"The named insured is the actual policyholder with full rights/obligations; an additional insured gets coverage extended to them for specific situations (like a GC on a sub's policy) without taking on the named insured's full role."},
  {topic:"Risk Management", q:"An 'occurrence' form liability policy differs from a 'claims-made' form in that an occurrence policy:", opts:["Only covers claims filed the same year the policy is purchased","Covers incidents that HAPPENED during the active policy period, regardless of when the claim is later filed — even years afterward — unlike claims-made policies which respond based on when the claim itself is filed", "Costs less in every case","Doesn't require paying any premium"], correct:1, explain:"Occurrence coverage attaches to when the incident actually happened, so a policy from years ago can still respond to a claim filed today — claims-made coverage instead depends on the claim being filed while that specific policy (or an extended reporting period) is active."},
  {topic:"Risk Management", q:"'Betterment' in an insurance/risk context refers to:", opts:["A bonus paid to a contractor for excellent work","A situation where repairing damage results in the property being improved beyond its original condition — insurers often won't pay for the 'improvement' portion, only the cost to restore to the prior condition", "The process of upgrading an insurance policy's coverage limits","A type of performance bond"], correct:1, explain:"When a repair necessarily improves a property beyond its pre-loss condition, insurers typically only cover restoring the original condition — the value of the 'betterment' improvement is often excluded or cost-shared."},
  {topic:"Risk Management", q:"'Subrogation' (before any waiver is applied) generally refers to an insurer's right to:", opts:["Deny any claim it disagrees with","Step into the insured's shoes and pursue a responsible third party to recover what it paid out on a claim — this is the underlying right that a 'waiver of subrogation' specifically gives up", "Cancel a policy at any time without notice","Charge the insured a higher premium after any claim"], correct:1, explain:"Subrogation is the insurer's baseline legal right to recoup a paid claim from whoever was actually responsible — understanding this baseline right is what makes clear why a waiver of subrogation (giving that right up) is a meaningful contract concession."},
  {topic:"Risk Management", q:"A 'certificate holder' listed on an insurance certificate has fundamentally different rights than an 'additional insured' because a certificate holder:", opts:["Actually has broader coverage rights than an additional insured","Merely receives notice/proof that a policy exists and is in force, without any actual coverage under that policy — being an additional insured is what actually extends coverage protection", "Is always the insurance company itself","Automatically becomes a named insured after 30 days"], correct:1, explain:"This is one of the most common and costly confusions in construction risk management — a certificate holder just gets paperwork/notice, while only an additional insured actually gets protected by the policy's coverage.", commonlyMissed:true},
  {topic:"Project Management", q:"An RFI (Request for Information) in construction project management is used to:", opts:["Request additional payment from the owner","Formally seek clarification from the design team/owner about an ambiguity, conflict, or missing detail in the plans or specifications before proceeding with that portion of work", "Report a safety violation to OSHA","Request a background check on a new subcontractor"], correct:1, explain:"RFIs are the formal, documented channel for resolving plan/spec ambiguities — proceeding on an assumption instead of submitting an RFI can create costly rework and liability exposure if the assumption turns out wrong."},
  {topic:"Project Management", q:"A 'construction change directive' differs from a standard 'change order' in that a change directive:", opts:["Is simply a faster way to write the same document","Is typically issued unilaterally by the owner/architect directing the contractor to proceed with a change while the exact price and/or time impact is STILL being negotiated — unlike a change order, which reflects mutual agreement on scope, price, and time already reached", "Can only be used for safety-related changes","Never requires the contractor to actually perform any work"], correct:1, explain:"A change directive keeps the project moving on a change before price/time is fully negotiated and agreed — a meaningful practical difference from a change order, which represents a completed, mutually-agreed modification."},
  {topic:"Project Management", q:"'Value engineering' in a construction project refers to:", opts:["Reducing the contractor's profit margin to win a bid","A systematic process of analyzing design/material choices to reduce cost or improve efficiency while maintaining the required function and quality of the project", "Increasing scope to justify a higher fee","A term specific to structural steel engineering only"], correct:1, explain:"Value engineering looks for ways to deliver the same functional outcome for less cost or with more efficiency — distinct from simply cutting scope or quality to save money."},
  {topic:"Project Management", q:"'Constructive acceleration' occurs when:", opts:["A contractor voluntarily speeds up work to finish early for a bonus","An owner fails to grant a legitimate time extension the contractor was entitled to, effectively forcing the contractor to accelerate performance (at their own cost) to meet the original deadline anyway", "A schedule is compressed using additional resources by mutual agreement","A project uses prefabricated/modular construction methods"], correct:1, explain:"Constructive acceleration is a claim theory — the owner didn't explicitly order acceleration, but their refusal to grant a warranted extension effectively forced it, potentially entitling the contractor to recover the added cost."},
  {topic:"Project Management", q:"'As-built' drawings are best described as:", opts:["The original architectural plans before construction began","Final drawings updated to reflect the ACTUAL conditions and any changes made during construction, which may differ from the original design documents", "A contractor's personal sketch used only for their own reference","Drawings required only on projects over $1 million"], correct:1, explain:"As-built drawings capture what was actually constructed, including field changes and deviations from the original plans — valuable for future renovation, maintenance, and dispute resolution."},
  {topic:"Project Management", q:"A 'notice to proceed' in a construction contract typically:", opts:["Has no formal significance and is purely informal courtesy", "Formally authorizes the contractor to begin work and often establishes the official start date the project schedule (and related deadlines) are measured from", "Is only used on government/public projects, never private ones","Replaces the need for a signed contract"], correct:1, explain:"The notice to proceed is often the formal trigger date the entire project schedule counts from, even if it's issued after the contract itself was signed."},
  {topic:"Project Management", q:"A 'means and methods' clause in a construction contract typically establishes that:", opts:["The owner controls exactly how the contractor performs the work, step by step","The contractor generally has control over and responsibility for HOW the work gets done (construction techniques, sequencing, safety procedures), while the owner/architect's role is generally focused on the design and end-result requirements", "Only union labor may be used on the project","The architect is liable for all jobsite safety incidents"], correct:1, explain:"Means and methods is a key liability boundary — contractors generally control (and bear responsibility for) HOW work gets built, while owners/designers are generally focused on WHAT gets built, not the construction techniques used to get there."},
  {topic:"Business Organization", q:"'Ultra vires' refers to actions by a corporation (or its officers) that are:", opts:["Standard and fully authorized under the corporate charter","Beyond the scope of authority granted by the corporation's charter or governing documents — potentially void or challengeable for that reason", "Required by state law for all corporations","A type of tax election"], correct:1, explain:"Ultra vires ('beyond the powers') describes acts exceeding what a corporation's charter/bylaws actually authorize — historically a bigger issue than today, but still relevant when officers act outside their granted authority."},
  {topic:"Business Organization", q:"A 'fiduciary duty' owed by a business partner or corporate officer generally means they must:", opts:["Only follow the letter of their written contract, nothing more","Act with loyalty and good faith in the best interest of the business/other partners, rather than prioritizing personal interests in conflict with that duty", "Personally guarantee all business debts","Work a minimum number of hours per week"], correct:1, explain:"Fiduciary duty is a heightened legal obligation of loyalty and care — a partner or officer who prioritizes personal gain over the business's interest in a conflict-of-interest situation can be in breach of this duty."},
  {topic:"Business Organization", q:"'Apparent authority' can make a business liable for an employee's actions when:", opts:["The employee had zero actual authorization but the business's own conduct reasonably led a third party to believe the employee was authorized to act on the business's behalf", "The employee explicitly had written authorization for every action","The business had no relationship with the employee at all","The employee acted purely for personal benefit with no connection to the business"], correct:0, explain:"Apparent authority binds a business based on how it presented the employee's authority to outsiders — even without actual internal authorization, reasonable reliance by a third party can create real liability."},
  {topic:"Labor Laws", q:"'Respondeat superior' is a legal doctrine holding that:", opts:["Employees are always personally liable for workplace injuries, never the employer","An employer can be held liable for an employee's negligent acts committed within the scope of their employment — not for purely personal acts unrelated to their job duties", "Only supervisors can be held liable for injuries on a jobsite","Employers are liable for employee actions only if they personally witnessed them"], correct:1, explain:"Respondeat superior ('let the master answer') holds employers liable for employee negligence within the scope of employment — a foundational reason jobsite conduct and supervision matter so much for liability exposure."},
  {topic:"Labor Laws", q:"Utah is generally an 'at-will employment' state, which means:", opts:["Employees can never be terminated for any reason","Absent a contract or specific legal exception (like discrimination or retaliation), either the employer or employee can generally end the employment relationship at any time, for almost any reason, without cause", "Employers must give 2 weeks notice before any termination","Only applies to employees working fewer than 40 hours per week"], correct:1, explain:"At-will employment allows termination by either party without cause in most situations — but this default is still limited by specific legal exceptions like anti-discrimination law and retaliation protections (e.g., for OSHA complaints)."},
  {topic:"Safety", q:"Under OSHA's violation classification system, a 'willful' violation differs from a 'serious' violation primarily in that a willful violation involves:", opts:["A lower penalty than a serious violation","Intentional disregard for or plain indifference to a known legal requirement or known hazard — carrying the highest penalty tier, versus a serious violation where there's substantial probability of serious harm but not necessarily intentional disregard", "Only paperwork/recordkeeping failures","Violations that occurred more than 5 years ago"], correct:1, explain:"Willful violations (intentional disregard/plain indifference) carry OSHA's steepest penalties — meaningfully more severe than serious violations, which involve substantial harm potential without necessarily being intentional.", commonlyMissed:true},
  {topic:"Safety", q:"A 'de minimis' OSHA violation is one that:", opts:["Results in the largest possible fine","Has no direct or immediate relationship to safety or health — typically results in no citation and no monetary penalty, just a verbal or written notice", "Is automatically classified as willful","Only applies to violations discovered during a fatality investigation"], correct:1, explain:"De minimis violations are technical in nature with no real safety/health impact — OSHA generally doesn't issue a formal citation or penalty for these, unlike serious, willful, or repeat violations."},
  {topic:"Safety", q:"A 'repeat' OSHA violation classification applies when:", opts:["Any violation is found on a second inspection, regardless of similarity","An employer is cited for a substantially similar violation to one previously cited within a specific look-back period — generally carrying substantially higher penalties than a first-time violation of the same type", "The same inspector visits the site more than once","The violation involves repeated equipment failures only"], correct:1, explain:"Repeat violations specifically require a substantially similar prior citation within OSHA's look-back period — and they carry significantly elevated penalties compared to a first-time citation for the same type of hazard."},
  {topic:"Tax Laws", q:"FUTA (Federal Unemployment Tax Act) differs from FICA in that FUTA:", opts:["Is withheld from the employee's paycheck, just like FICA","Is generally paid solely by the EMPLOYER (not withheld from employee wages) and funds unemployment compensation programs, unlike FICA which is split between employer and employee to fund Social Security/Medicare", "Only applies to construction companies","Replaced FICA entirely in recent years"], correct:1, explain:"FUTA is an employer-only tax funding unemployment programs; FICA is the shared employer/employee tax funding Social Security and Medicare — mixing up who actually pays which tax is a common error.", commonlyMissed:true},
  {topic:"Tax Laws", q:"A 'pass-through entity' for tax purposes is one where:", opts:["The business pays corporate-level income tax before any distributions","Business income/loss passes through to the owners' personal tax returns, avoiding a separate entity-level income tax — sole proprietorships, most LLCs, S-corps, and partnerships are common examples", "Only government contractors qualify for this status","The business is exempt from all taxation permanently"], correct:1, explain:"Pass-through taxation avoids the 'double taxation' that traditional C-corporations face, since income flows directly to owners' personal returns rather than being taxed at the entity level first."},
  {topic:"Licensing", q:"Utah 'licensure by endorsement' differs from 'reciprocity' in that endorsement generally:", opts:["Are simply two identical terms for the same process","Relies on Utah's own evaluation of an out-of-state license holder's qualifications (experience, exam, standing) on a case-by-case basis, while true reciprocity would involve a formal state-to-state agreement automatically recognizing each other's licenses — Utah primarily uses endorsement-style evaluation rather than blanket reciprocity agreements", "Requires a completely new apprenticeship regardless of prior licensure","Only applies to specialty trade licenses, never general contractors"], correct:1, explain:"Endorsement means Utah individually evaluates an out-of-state applicant's credentials against its own requirements, which is different from a formal blanket reciprocity agreement between states — Utah's waiver provisions function more like endorsement review than automatic reciprocity."},
  {topic:"Licensing", q:"The 'qualifier of record' on a Utah contractor license is best understood as:", opts:["Any employee who happens to have construction experience","The specific individual whose personal experience and passed exam legally qualify the business entity for licensure — formally designated and on file with DOPL, not just informally recognized within the company", "The business's registered agent for legal notices","The person who signs every customer contract"], correct:1, explain:"The 'of record' distinction matters — DOPL recognizes a specific formally-designated individual, not just whoever happens to be most experienced; changing this designation requires formal notification, not just an internal company decision."},
  {topic:"Financial Management", q:"'Accounts payable' represents:", opts:["Money owed TO the business by its customers","Money the business itself owes to its own suppliers, subcontractors, or vendors for goods/services already received but not yet paid for", "Cash reserved specifically for payroll","The value of depreciated equipment"], correct:1, explain:"Accounts payable is the mirror image of accounts receivable — what the business owes others, rather than what's owed to the business — mixing the two up misreads a company's financial position entirely."},

];

const ALL_TOPICS = Object.keys(LAST_SCORE);
// Exact per-topic question counts as they appear on the real 60-question Utah exam,
// taken directly from Fernando's actual Prov score report "# Possible" column.
const EXAM_BLUEPRINT = {};
ALL_TOPICS.forEach(t => { EXAM_BLUEPRINT[t] = LAST_SCORE[t].total; });
const EXAM_TOTAL_QUESTIONS = Object.values(EXAM_BLUEPRINT).reduce((a,b)=>a+b,0); // 60
const EXAM_TIME_LIMIT_SECONDS = 120 * 60; // 120 minutes, matching the real exam
const WEAK_TOPICS = ALL_TOPICS.filter(isWeak);

let state = {screen:"intro", idx:0, answers:[], mode:"weak", source:"bank"};
let activeQuestions = [];
let attemptHistory = [];
const STORAGE_KEY = "ut_b100_attempts_v1";
const SEEN_KEY = "ut_b100_seen_ids_v1";

// ---------- localStorage-based history (works on any deployed site) ----------
function loadHistory(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    attemptHistory = raw ? JSON.parse(raw) : [];
  } catch(e){
    attemptHistory = [];
  }
}
function saveAttempt(record){
  attemptHistory.unshift(record);
  if(attemptHistory.length > 40) attemptHistory = attemptHistory.slice(0,40);
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(attemptHistory)); } catch(e){ console.error(e); }
}
function getSeenIds(){
  try{
    const raw = localStorage.getItem(SEEN_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}
function markSeen(ids){
  try{
    let seen = getSeenIds();
    seen = seen.concat(ids);
    if(seen.length > 200) seen = seen.slice(seen.length-200);
    localStorage.setItem(SEEN_KEY, JSON.stringify(seen));
  } catch(e){}
}

// assign a stable id to each question (topic + question text)
QUESTIONS.forEach(q => { q._id = q.topic + "::" + q.q; });

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Build a fresh random set: prefer unseen questions first, shuffle answer order too
// countSpec: either a flat number (same count per topic) or an object {topicName: count}
function buildRandomSet(topics, countSpec){
  const seen = getSeenIds();
  let picked = [];
  topics.forEach(topic => {
    const wantCount = (typeof countSpec === 'object') ? (countSpec[topic] || 0) : countSpec;
    if(wantCount <= 0) return;
    let pool = QUESTIONS.filter(q => q.topic === topic);
    let unseen = pool.filter(q => !seen.includes(q._id));
    let usePool = unseen.length > 0 ? unseen : pool; // reset once exhausted
    usePool = shuffle(usePool);
    const n = Math.min(wantCount, usePool.length);
    picked = picked.concat(usePool.slice(0,n));
  });
  picked = shuffle(picked);
  // shuffle each question's option order independently
  const finalSet = picked.map(q => {
    const order = shuffle([0,1,2,3]);
    const newOpts = order.map(i => q.opts[i]);
    const newCorrect = order.indexOf(q.correct);
    return {topic:q.topic, q:q.q, opts:newOpts, correct:newCorrect, explain:q.explain, _id:q._id};
  });
  markSeen(finalSet.map(q => q._id));
  return finalSet;
}

function buildActiveSet(mode){
  if(mode === "sim"){
    activeQuestions = buildRandomSet(ALL_TOPICS, EXAM_BLUEPRINT);
    return;
  }
  if(mode === "missed"){
    activeQuestions = buildCommonlyMissedSet();
    return;
  }
  const topics = mode === "weak" ? WEAK_TOPICS : ALL_TOPICS;
  const perTopic = mode === "weak" ? 6 : 4;
  activeQuestions = buildRandomSet(topics, perTopic);
}

// Pulls only from questions tagged commonlyMissed:true — the specific clusters
// research + Fernando's own missed questions point to: lien deadline mechanics,
// margin/markup business math, business org liability edge cases, payroll/tax
// specifics, and contract clause conflicts. Not grouped by topic, since the whole
// point is these span multiple topics.
function buildCommonlyMissedSet(){
  const seen = getSeenIds();
  let pool = QUESTIONS.filter(q => q.commonlyMissed);
  let unseen = pool.filter(q => !seen.includes(q._id));
  let usePool = unseen.length > 0 ? unseen : pool;
  usePool = shuffle(usePool);
  const finalSet = usePool.map(q => {
    const order = shuffle([0,1,2,3]);
    const newOpts = order.map(i => q.opts[i]);
    const newCorrect = order.indexOf(q.correct);
    return {topic:q.topic, q:q.q, opts:newOpts, correct:newCorrect, explain:q.explain, _id:q._id};
  });
  markSeen(finalSet.map(q => q._id));
  return finalSet;
}

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'intro') app.innerHTML = renderIntro();
  else if(state.screen === 'quiz') app.innerHTML = renderQuiz();
  else app.innerHTML = renderResults();
}

function renderIntro(){
  let bars = ALL_TOPICS.map(name => {
    const s = LAST_SCORE[name];
    const pct = Math.round((s.correct/s.total)*100);
    const weak = isWeak(name);
    return `
    <div class="breakdown-row">
      <div class="breakdown-label ${weak?'weak':''}">${name}</div>
      <div class="bar-track"><div class="bar-fill ${weak?'weak':''}" style="width:${pct}%"></div></div>
      <div class="breakdown-pct">${s.correct}/${s.total}</div>
    </div>`;
  }).join('');

  let historyBlock;
  if(attemptHistory.length === 0){
    historyBlock = `<div class="empty-note">No practice attempts logged yet on this device. Finish a set below and it'll show up here.</div>`;
  } else {
    historyBlock = attemptHistory.slice(0,8).map(a => {
      const d = new Date(a.date);
      const dateStr = (d.getMonth()+1) + "/" + d.getDate() + "/" + d.getFullYear();
      const passed = a.scorePct >= 70;
      const modeLabel = a.mode === 'weak' ? 'Weak areas' : a.mode === 'sim' ? 'Simulated exam' : a.mode === 'missed' ? 'Commonly missed' : 'Full exam';
      return `<div class="history-row">
        <span class="history-meta">${dateStr} · ${modeLabel} · ${a.total} Q</span>
        <span class="history-score ${passed?'pass':'fail'}">${a.scorePct}%</span>
      </div>`;
    }).join('');
  }

  return `
    <header class="top">
      <div class="eyebrow">Retake Prep — Built From Your Actual Score Report</div>
      <h1>B100 Business &amp; Law<br>Practice Exam</h1>
      <div class="sub">Your 03/20/2026 attempt scored 48% (needed 70%). Weakest areas: Safety, Business Organization, Contract Management, and Lien Laws.</div>
      <span class="blueprint-badge">70% TO PASS</span>
      <span class="blueprint-badge weak">${QUESTIONS.filter(q=>isWeak(q.topic)).length} WEAK-AREA QUESTIONS IN BANK</span>
    </header>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:12px;">Your last attempt, by subject</div>
      ${bars}
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:10px;">Practice history (this device)</div>
      ${historyBlock}
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:10px;">Choose scope</div>
      <div class="mode-row">
        <div class="mode-btn ${state.mode==='weak'?'active':''}" onclick="setMode('weak')">Weak Areas Only</div>
        <div class="mode-btn ${state.mode==='all'?'active':''}" onclick="setMode('all')">Full Exam</div>
        <div class="mode-btn ${state.mode==='sim'?'active':''}" onclick="setMode('sim')">Simulated Exam</div>
        <div class="mode-btn ${state.mode==='missed'?'active':''}" onclick="setMode('missed')">Commonly Missed</div>
      </div>
      <div class="sub" style="margin-top:8px;">${
        state.mode==='weak' ? "Drills only Safety, Business Organization, Contract Management, and Lien Laws — the sections that sank your last score." :
        state.mode==='sim' ? `Matches the real test exactly: ${EXAM_TOTAL_QUESTIONS} questions sized per-topic just like your actual score report (10 Licensing, 6 Contract Mgmt, 4 Business Org, etc.), with a live 120-minute countdown.` :
        state.mode==='missed' ? `Pulls only the ${QUESTIONS.filter(q=>q.commonlyMissed).length} questions matching the clusters test-takers most often get wrong: lien deadline mechanics, margin-vs-markup math, business org liability edge cases, payroll/tax specifics, and contract clause conflicts — spans multiple subject areas by design.` :
        "Covers all 11 subject areas, including the ones you already did well on, to confirm they've stuck."
      }</div>
    </div>
    <button class="primary" onclick="startQuiz()">${state.mode==='sim' ? 'Start Full Simulated Exam (120 min) →' : state.mode==='missed' ? 'Drill Commonly Missed →' : 'Shuffle a New Set →'}</button>
    <footer>Every set pulls a fresh random mix from a ${QUESTIONS.length}-question bank (including harder scenario and calculation questions) with shuffled answer order. Study aid only — verify current rules with DOPL / your Prov candidate handbook.</footer>
  `;
}

function setMode(m){
  state.mode = m;
  render();
}

let timerInterval = null;

function startQuiz(){
  buildActiveSet(state.mode);
  state.source = "bank";
  state.screen = "quiz";
  state.idx = 0;
  state.answers = new Array(activeQuestions.length).fill(null);
  state.timeUp = false;
  if(state.mode === "sim"){
    state.deadline = Date.now() + EXAM_TIME_LIMIT_SECONDS * 1000;
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(tickTimer, 1000);
  } else {
    state.deadline = null;
    if(timerInterval) clearInterval(timerInterval);
  }
  render();
}

function tickTimer(){
  if(state.screen !== 'quiz' || !state.deadline) return;
  const remaining = state.deadline - Date.now();
  if(remaining <= 0){
    clearInterval(timerInterval);
    state.timeUp = true;
    finishAttempt();
    state.screen = "results";
    render();
    return;
  }
  // only re-render the timer chip to avoid disrupting the current question view
  const el = document.getElementById('exam-timer');
  if(el) el.textContent = formatTime(remaining);
}

function formatTime(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(totalSec/60);
  const s = totalSec % 60;
  return m + ":" + (s < 10 ? "0"+s : s);
}

function renderQuiz(){
  const q = activeQuestions[state.idx];
  const answered = state.answers[state.idx] !== null;
  const pct = Math.round((state.idx/activeQuestions.length)*100);
  const weak = isWeak(q.topic);

  let opts = q.opts.map((opt, i) => {
    let cls = "opt";
    let disabledAttr = answered ? "disabled" : "";
    if(answered){
      if(i === q.correct) cls += " correct";
      else if(i === state.answers[state.idx] && i !== q.correct) cls += " incorrect";
    }
    return `<button class="${cls}" ${disabledAttr} onclick="selectAnswer(${i})">
      <span class="letter">${String.fromCharCode(65+i)}</span><span>${opt}</span>
    </button>`;
  }).join('');

  let explainBlock = answered ? `<div class="explain"><b>${state.answers[state.idx] === q.correct ? "Correct." : "Not quite."}</b> ${q.explain}</div>` : '';

  let navButtons = `<div class="nav-row">`;
  if(answered){
    navButtons += `<button class="primary" onclick="nextQuestion()">${state.idx === activeQuestions.length-1 ? "See Results →" : "Next Question →"}</button>`;
  }
  navButtons += `</div>`;

  return `
    <div class="progress-row">
      <span>QUESTION ${state.idx+1} / ${activeQuestions.length}</span>
      ${state.mode === 'sim' && state.deadline ? `<span id="exam-timer" style="color:var(--amber);font-weight:600;">${formatTime(state.deadline - Date.now())}</span>` : `<span>${pct}% THROUGH</span>`}
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <span class="topic-tag ${weak?'weak':''}">${q.topic}${weak?' · weak spot':''}</span>
    <div class="question-card">
      <p class="q-text">${q.q}</p>
      ${opts}
      ${explainBlock}
    </div>
    ${navButtons}
  `;
}

function selectAnswer(i){
  if(state.answers[state.idx] !== null) return;
  state.answers[state.idx] = i;
  render();
}

function nextQuestion(){
  if(state.idx === activeQuestions.length-1){
    if(timerInterval) clearInterval(timerInterval);
    finishAttempt();
    state.screen = "results";
  } else {
    state.idx += 1;
  }
  render();
}

function finishAttempt(){
  let correctCount = 0;
  let topicStats = {};
  activeQuestions.forEach((q,i) => {
    if(!topicStats[q.topic]) topicStats[q.topic] = {correct:0,total:0};
    topicStats[q.topic].total += 1;
    if(state.answers[i] === q.correct){
      correctCount += 1;
      topicStats[q.topic].correct += 1;
    }
  });
  const scorePct = Math.round((correctCount/activeQuestions.length)*100);
  saveAttempt({
    date: new Date().toISOString(),
    mode: state.mode,
    scorePct: scorePct,
    correct: correctCount,
    total: activeQuestions.length,
    topics: topicStats
  });
}

function renderResults(){
  let correctCount = 0;
  let topicStats = {};
  activeQuestions.forEach((q,i) => {
    if(!topicStats[q.topic]) topicStats[q.topic] = {correct:0,total:0};
    topicStats[q.topic].total += 1;
    if(state.answers[i] === q.correct){
      correctCount += 1;
      topicStats[q.topic].correct += 1;
    }
  });
  const scorePct = Math.round((correctCount/activeQuestions.length)*100);
  const passed = scorePct >= 70;

  let topicRows = Object.keys(topicStats).map(name => {
    let s = topicStats[name];
    let weak = isWeak(name);
    return `<div class="topic-result-row ${weak?'weak':''}"><span>${name}</span><span class="topic-score">${s.correct}/${s.total}</span></div>`;
  }).join('');

  const modeLabel = state.mode === 'weak' ? 'Weak-Area Drill' : state.mode === 'sim' ? 'Full Simulated Exam' : state.mode === 'missed' ? 'Commonly Missed Drill' : 'Full Exam';
  let timeUpNotice = state.timeUp ? `<div class="error-box">Time's up — this matches what happens on the real exam if the 120-minute clock runs out. Unanswered questions were scored as incorrect.</div>` : '';

  return `
    <header class="top">
      <div class="eyebrow">Results — ${modeLabel}</div>
      <h1>Practice Complete</h1>
    </header>
    ${timeUpNotice}
    <div class="panel">
      <div class="score-hero">
        <div class="score-num ${passed ? 'pass':'fail'}">${scorePct}%</div>
        <div class="score-label">${correctCount} of ${activeQuestions.length} correct — ${passed ? 'passing (70% needed)' : 'below 70% passing mark'}</div>
      </div>
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:8px;">By topic</div>
      ${topicRows}
    </div>
    <button class="ghost" onclick="reviewMissed()">Review Missed Questions</button>
    <button class="secondary" onclick="startQuiz()">Shuffle Another New Set (same scope) →</button>
    <button class="primary" onclick="backToIntro()">Back to Start</button>
    <footer>Study aid only — verify current rules with DOPL / your Prov candidate handbook.</footer>
  `;
}

function backToIntro(){
  if(timerInterval) clearInterval(timerInterval);
  state.screen = "intro";
  render();
}

function reviewMissed(){
  const app = document.getElementById('app');
  let missed = activeQuestions.map((q,i) => ({q,i})).filter(item => state.answers[item.i] !== item.q.correct);
  let html = `
    <header class="top">
      <div class="eyebrow">Review</div>
      <h1>Missed Questions</h1>
      <div class="sub">${missed.length === 0 ? "You didn't miss any — nice work." : missed.length + " question(s) to revisit."}</div>
    </header>
  `;
  missed.forEach(item => {
    let q = item.q;
    let yourAns = state.answers[item.i];
    let weak = isWeak(q.topic);
    html += `
      <div class="question-card" style="margin-bottom:14px;">
        <span class="topic-tag ${weak?'weak':''}">${q.topic}</span>
        <p class="q-text">${q.q}</p>
        ${q.opts.map((opt,i) => {
          let cls = "opt";
          if(i === q.correct) cls += " correct";
          else if(i === yourAns) cls += " incorrect";
          return `<div class="${cls}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${opt}</span></div>`;
        }).join('')}
        <div class="explain"><b>Why:</b> ${q.explain}</div>
      </div>
    `;
  });
  html += `<button class="primary" onclick="backToIntro()">Back to Start</button>`;
  app.innerHTML = html;
}

loadHistory();
render();
</script>
</body>
</html>
