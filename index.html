  {topic:"Risk Management", q:"Under Utah Code §14-2-1, an owner must get a payment bond from the contractor on a private commercial contract exceeding:", opts:["$25,000","$50,000","$100,000","$250,000"], correct:1, explain:"Utah Code §14-2-1(2)-(3): before an original commercial contract exceeding $50,000 is awarded, the owner must obtain a payment bond from the contractor in a sum equal to the original contract price. Residential construction (single-family through fourplex) is excluded from the definition of a commercial contract.", ref:"NASCLA guide: Risk Management (bonds), Utah Code 14-2-1(2) (private payment bond threshold)", numeric:true},
  {topic:"Contract Management", q:"Under Utah Code §78B-2-225, a contract or warranty claim against a builder generally must be filed within how long after completion?", opts:["2 years","4 years","6 years","9 years"], correct:2, explain:"Utah Code §78B-2-225(3)(a): an action based in contract or warranty must be commenced within six years after completion or abandonment of the improvement, unless the contract or warranty sets a different period.", ref:"HBA book: Contract Management section, Utah Code 78B-2-225(3) (6-year contract/warranty)", numeric:true},
  {topic:"Contract Management", q:"Under Utah Code §78B-2-225, a non-contract claim (such as negligence) generally must be filed within how long after it is discovered?", opts:["1 year","2 years","3 years","4 years"], correct:1, explain:"Utah Code §78B-2-225(4)(a): all other actions must be commenced within two years from the earlier of discovery or when the claim should have been discovered with reasonable diligence (the clock starts no earlier than completion or abandonment).", ref:"HBA book: Contract Management section, Utah Code 78B-2-225(4)(a) (2-year discovery)", numeric:true},
  {topic:"Contract Management", q:"Under Utah Code §78B-2-225, a non-contract claim generally cannot be brought more than how long after completion (outer limit)?", opts:["6 years","7 years","9 years","12 years"], correct:2, explain:"Utah Code §78B-2-225(4)(c): a non-contract action may not be commenced more than nine years after completion or abandonment. If it is discovered in the eighth or ninth year, the claimant gets two years from discovery. Fraudulent concealment and willful acts are excepted.", ref:"HBA book: Contract Management section, Utah Code 78B-2-225(4)(c)-(d) (9-year repose)", numeric:true},
  {topic:"Financial Management", q:"The owner-GC contract on a commercial job sets retainage at 3%. The most the GC may withhold from its subcontractors is:", opts:["3%","5%","7.5%","10%"], correct:0, explain:"Utah Code §13-8-5(3)(c): if the owner-original contractor retention is less than 5%, the retention between the original contractor and subcontractors (and between subs) must be the same percentage. So a 3% owner retention means 3% down the chain, not the 5% cap. (The 2027 version of §13-8-5 only renumbers cross-references; the percentages are unchanged.)", ref:"HBA book: Financial Management section, Utah Code 13-8-5(3)(c) (matching lower-tier retention)", numeric:true},
  {topic:"Financial Management", q:"After substantial completion of a §13-8-5 project, the owner may keep back for unfinished work up to:", opts:["1.5 times its fair market value","2 times its fair market value","3 times its fair market value","4 times its fair market value"], correct:1, explain:"Utah Code §13-8-5(8)(a)(ii): once a project or portion is substantially complete, the owner or public agency may retain until completion up to twice the fair market value of the work not yet completed. Under (8)(b) the owner must describe the incomplete work in writing within 45 days of withholding.", ref:"HBA book: Financial Management section, Utah Code 13-8-5(8) (withholding for incomplete work)", numeric:true},
  {topic:"Financial Management", q:"An owner withholding payment for incomplete or defective work under §13-8-5 must describe the problem in writing within:", opts:["10 days","15 days","30 days","45 days"], correct:3, explain:"Utah Code §13-8-5(8)(b): an owner or public agency that refuses payment under subsection (8)(a) must describe in writing, within 45 days of withholding, what portion of the work was not completed to the required standards.", ref:"HBA book: Financial Management section, Utah Code 13-8-5(8)(b) (45-day written explanation)", numeric:true},
  {topic:"Financial Management", q:"A contractor has total liabilities of $300,000 and owner's equity of $200,000. The debt-to-equity ratio is:", opts:["0.67","1.00","1.50","2.50"], correct:2, explain:"Debt-to-equity = total liabilities ÷ owner's equity = $300,000 ÷ $200,000 = 1.50. A higher ratio means the company relies more on borrowed money than on owner investment.", ref:"NASCLA guide: Financial Management (financial ratios: debt-to-equity)", numeric:true},
  {topic:"Financial Management", q:"A $500,000 contract has estimated total costs of $400,000; $100,000 of cost is incurred so far. Under percentage-of-completion, revenue earned to date is:", opts:["$100,000","$125,000","$150,000","$400,000"], correct:1, explain:"Percent complete = cost to date ÷ estimated total cost = $100,000 ÷ $400,000 = 25%. Earned revenue = 25% × $500,000 contract = $125,000.", ref:"NASCLA guide: Financial Management (percentage-of-completion method)", numeric:true},
  {topic:"Licensing", q:"Utah contractor licenses expire on:", opts:["June 30 of even-numbered years","November 30 of odd-numbered years","December 31 of odd-numbered years","November 30 of even-numbered years"], correct:1, explain:"DOPL's contractor renewal page: contracting licenses expire on November 30 of odd years, on the two-year cycle set under Utah Code §58-55-303 and R156-1-308a. DOPL emails renewal notices at least 60 days before expiration. Note: Utah's Construction Trades Licensing Act (Title 58, Chapter 55) is being renumbered effective January 1, 2027 (renewal moves to §58-55-108); the two-year term is unchanged.", ref:"HBA book: Licensing section, Utah Code 58-55-303 and R156-1-308a (renewal date)", numeric:true},
  {topic:"Licensing", q:"A company's qualifier quits and the company notifies DOPL on time. The license stays in force for how long so a new qualifier can be named?", opts:["30 days","45 days","60 days","90 days"], correct:2, explain:"Utah Code §58-55-304(6): the licensee must notify the Division in writing within 10 days after the qualifier leaves. If notice is given, the license remains in force for 60 days, and the qualifier must be replaced within that 60-day period or the license is automatically suspended. Note: Utah's Construction Trades Licensing Act (Title 58, Chapter 55) is being renumbered effective January 1, 2027; the same 10-day and 60-day rules move to §58-55-107(8).", ref:"HBA book: Licensing section, Utah Code 58-55-304(6) (qualifier leaves: 10 / 60 days)", numeric:true},
  {topic:"Licensing", q:"When a company's qualifier leaves, the company must notify DOPL in writing within:", opts:["5 days","10 days","15 days","30 days"], correct:1, explain:"Utah Code §58-55-304(6): notice is due within 10 days after the qualifier's association or employment ends; the license then stays in force for 60 days while a replacement qualifier is named. Note: Utah's Construction Trades Licensing Act (Title 58, Chapter 55) is being renumbered effective January 1, 2027; the 10-day rule continues in §58-55-107(8)(a).", ref:"HBA book: Licensing section, Utah Code 58-55-304(6) (10-day qualifier notice)", numeric:true},
  {topic:"Licensing", q:"After failing the Utah Business and Law exam (up to three failures), how soon may a candidate retake it?", opts:["After 7 days","After 14 days","After 30 days","After 60 days"], correct:2, explain:"Utah Admin. Code R156-55a-302a(2): a candidate may retake a failed exam no sooner than 30 days after a failure, for up to three failures, and then no sooner than six months after each later failure. DOPL's exam page describes this as 3 attempts 30 days apart, then 180 days between retakes.", ref:"Prov candidate handbook; R156-55a-302a(2) (retake waiting periods)", numeric:true},
  {topic:"Licensing", q:"After a candidate's third failure of the Utah Business and Law exam, each later retake requires waiting at least:", opts:["3 months","6 months","9 months","12 months"], correct:1, explain:"Utah Admin. Code R156-55a-302a(2)(b): after three failures, a retake is allowed no sooner than six months following each failure. DOPL's exam page states it as 180 days between later retakes.", ref:"Prov candidate handbook; R156-55a-302a(2)(b) (six-month wait after three failures)", numeric:true},
  {topic:"Licensing", q:"A B100, R100, or E100 applicant must complete a pre-licensure course of how many hours?", opts:["20 hours","25 hours","30 hours","40 hours"], correct:2, explain:"DOPL's application instructions: general contractors (B100, R100, E100) and plumbing and electrical contractors need a 30-hour pre-licensure course from an approved provider (ABC, AGC, or Utah HBA). Specialty contractors need 25 hours. Courses taken before October 1, 2019 don't need the extra 5 hours.", ref:"HBA book: Licensing section; DOPL contractor application (25- vs 30-hour pre-licensure course)", numeric:true},
  {topic:"Licensing", q:"An unlicensed person doing exempt small-project work under $7,000 must file proof of liability insurance with DOPL once the project value exceeds:", opts:["$1,000","$2,000","$3,000","$5,000"], correct:2, explain:"Utah Code §58-55-305(1)(h): work under $7,000 (labor and materials, including changes) can be exempt from licensure, but if the project is greater than $3,000 the person must file a one-time affirmation of public liability insurance (and workers' comp if applicable). Note: Utah's Construction Trades Licensing Act (Title 58, Chapter 55) is being renumbered effective January 1, 2027: the exemption moves to §58-55-110, which keeps the $7,000 and $3,000 figures but requires registering with the Division of Corporations and submitting insurance documentation.", ref:"HBA book: Licensing section, Utah Code 58-55-305(1)(h) (handyman exemption: $7,000 / $3,000)", numeric:true},
  {topic:"Licensing", q:"DOPL generally must issue a citation for unlicensed or unlawful conduct within how long after the violation is reported?", opts:["90 days","6 months","1 year","2 years"], correct:2, explain:"Utah Code §58-55-503(5)(g): a citation may not be issued more than one year after the violation is reported to the Division. Note: Utah's Construction Trades Licensing Act (Title 58, Chapter 55) is being renumbered effective January 1, 2027; the one-year limit continues in §58-55-604(4)(b).", ref:"HBA book: Licensing section, Utah Code 58-55-503(5)(g) (one-year citation limit)", numeric:true},
  {topic:"Licensing", q:"For a second qualifying citation under Utah Code §58-55-503 (general violations), the fine may be up to:", opts:["$1,000","$2,000","$3,000","$5,000"], correct:1, explain:"Utah Code §58-55-503(5)(h)(i): up to $1,000 for a first offense, up to $2,000 for a second offense, and up to $2,000 per day for later continued offenses (higher $2,000 / $4,000 amounts apply to certain listed violations). Note: Utah's Construction Trades Licensing Act (Title 58, Chapter 55) is being renumbered effective January 1, 2027; the same amounts move to §58-55-604(5).", ref:"HBA book: Licensing section, Utah Code 58-55-503(5)(h) (citation fines)", numeric:true},
  {topic:"Labor Laws", q:"In Utah, when an employer fires (separates) an employee, final wages must be paid within:", opts:["24 hours","72 hours","7 days","15 days"], correct:0, explain:"Utah Code §34-28-5(1)(a): when an employer separates an employee, unpaid wages are due immediately and must be paid within 24 hours of separation (mailing postmarked within one day, or a direct deposit or hand delivery started within 24 hours, also satisfies the rule).", ref:"HBA book: Labor Laws section, Utah Code 34-28-5(1) (24-hour final pay)", numeric:true},
  {topic:"Labor Laws", q:"In Utah, an employee without a fixed-term contract quits. Final wages are due:", opts:["Within 24 hours of quitting","Within 3 days of quitting","On the next regular payday","Within 30 days of quitting"], correct:2, explain:"Utah Code §34-28-5(2): when an employee resigns, earned and unpaid wages become due and payable on the next regular payday. The 24-hour rule applies when the employer separates the employee.", ref:"HBA book: Labor Laws section, Utah Code 34-28-5(2) (resignation: next payday)", numeric:true},
  {topic:"Labor Laws", q:"An injured worker must notify the employer (or the Division) of a work injury within how many days, or the claim is barred?", opts:["30 days","90 days","180 days","365 days"], correct:2, explain:"Utah Code §34A-2-407(3): an employee is barred from benefits for an injury unless the employer or the Division is notified within 180 days after the injury (occupational hearing loss has its own period).", ref:"HBA book: Labor Laws section, Utah Code 34A-2-407(3) (180-day injury notice)", numeric:true},
  {topic:"Labor Laws", q:"A non-exempt worker earns $24/hour and works 46 hours in one workweek. Under the FLSA, gross pay for that week is:", opts:["$1,104","$1,176","$1,248","$1,656"], correct:1, explain:"FLSA overtime is 1.5× the regular rate for hours over 40 in a workweek: 40 × $24 = $960, plus 6 × $36 = $216, for $1,176 total. $1,104 ignores overtime, $1,248 uses double time, and $1,656 pays every hour at 1.5×.", ref:"FLSA 29 U.S.C. 207 (overtime over 40 hours at 1.5x); HBA book: Labor Laws section", numeric:true},
  {topic:"Labor Laws", q:"Under FLSA recordkeeping rules, payroll records must be preserved for at least:", opts:["1 year","2 years","3 years","5 years"], correct:2, explain:"29 CFR 516.5: payroll records must be preserved for at least 3 years from the last date of entry. Supplementary records such as time cards and wage-rate tables need only 2 years under 29 CFR 516.6.", ref:"FLSA 29 CFR 516.5 (3-year payroll records); HBA book: Labor Laws section", numeric:true},
  {topic:"Labor Laws", q:"An employee hired March 1, 2022 is terminated June 1, 2026. The employer must keep the employee's Form I-9 until at least:", opts:["March 1, 2025","June 1, 2027","March 1, 2027","June 1, 2029"], correct:1, explain:"8 CFR 274a.2(b)(2): an employer keeps Form I-9 for three years after the date of hire or one year after employment ends, whichever is later. Three years after hire is March 1, 2025, and one year after termination is June 1, 2027. The later date, June 1, 2027, controls.", ref:"Form I-9 instructions, 8 CFR 274a.2(b)(2) (I-9 retention); HBA book: Labor Laws section", numeric:true},
  {topic:"Tax Laws", q:"For payments made in 2026, a business must file Form 1099-NEC for nonemployee compensation of at least:", opts:["$600","$1,000","$2,000","$5,000"], correct:2, explain:"IRS: for payments made after December 31, 2025, the 1099-NEC reporting threshold rose from $600 to $2,000 (One Big Beautiful Bill Act), with inflation adjustments starting in 2027. Payments made before 2026 still use $600. Older study books will show $600, so read the question's year carefully.", ref:"IRS Instructions for Forms 1099-MISC and 1099-NEC ($2,000 for 2026 payments); HBA book: Tax Laws section", numeric:true},
  {topic:"Tax Laws", q:"An employer is a monthly schedule depositor for payroll taxes if its total taxes in the lookback period were:", opts:["$10,000 or less","$25,000 or less","$50,000 or less","$100,000 or less"], correct:2, explain:"IRS Publication 15: if you reported $50,000 or less of employment taxes in the 4-quarter lookback period (July 1 through June 30), you are a monthly schedule depositor; more than $50,000 makes you a semiweekly depositor.", ref:"IRS Publication 15 (Circular E), deposit schedules ($50,000 lookback test); HBA book: Tax Laws section", numeric:true},
  {topic:"Tax Laws", q:"A monthly schedule depositor must deposit payroll taxes for a month's wages by what day of the following month?", opts:["The 5th","The 10th","The 15th","The last day"], correct:2, explain:"IRS Publication 15: under the monthly schedule, employment taxes on payments made during a month are due by the 15th day of the following month. Accumulating $100,000 or more on any day triggers the next-business-day rule.", ref:"IRS Publication 15 (Circular E), monthly deposit schedule; HBA book: Tax Laws section", numeric:true},
  {topic:"Tax Laws", q:"Form 941 for the second quarter (April through June) is due by:", opts:["June 30","July 15","July 31","August 15"], correct:2, explain:"IRS Publication 15: Form 941 is filed quarterly by April 30, July 31, October 31, and January 31, the last day of the month after each quarter ends.", ref:"IRS Publication 15 / Form 941 instructions (quarterly due dates); HBA book: Tax Laws section", numeric:true},
  {topic:"Tax Laws", q:"With the full 5.4% state credit, the most FUTA tax an employer owes per employee per year is:", opts:["$42","$56","$378","$420"], correct:0, explain:"IRS Publication 15 (2026): FUTA is 6.0% of the first $7,000 of each employee's wages. With the maximum 5.4% credit for state unemployment tax paid, the net rate is 0.6%, and 0.6% × $7,000 = $42. ($420 is the gross 6.0% amount before the credit.)", ref:"IRS Publication 15 and Form 940 instructions (FUTA 6.0% / $7,000 / 5.4% credit); HBA book: Tax Laws section", numeric:true},
  {topic:"Tax Laws", q:"The IRS says employers should keep all employment tax records for at least:", opts:["2 years","3 years","4 years","7 years"], correct:2, explain:"IRS Publication 15, Recordkeeping: keep all records of employment taxes for at least 4 years and have them available for IRS review.", ref:"IRS Publication 15 (Circular E), recordkeeping (4 years); HBA book: Tax Laws section", numeric:true},
  {topic:"Tax Laws", q:"Below the Social Security wage base, the total FICA rate withheld from an employee's wages is:", opts:["6.20%","7.65%","12.40%","15.30%"], correct:1, explain:"IRS Publication 15: Social Security tax is 6.2% and Medicare is 1.45% for the employee, a combined 7.65%, which the employer matches. 15.3% is the combined employee and employer amount, which is also the self-employment tax rate. (The 2026 Social Security wage base is $184,500 and changes every year; Medicare has no wage base.)", ref:"IRS Publication 15 (Social Security 6.2%, Medicare 1.45%); HBA book: Tax Laws section", numeric:true},
  {topic:"Safety", q:"A worker dies from a work-related incident days later. OSHA's 8-hour fatality report is only required if the death occurs within how long after the incident?", opts:["24 hours","7 days","30 days","1 year"], correct:2, explain:"29 CFR 1904.39(b)(6): a fatality must be reported only if it occurs within 30 days of the work-related incident. In-patient hospitalization, amputation, or eye loss must be reported only if it occurs within 24 hours of the incident.", ref:"OSHA 29 CFR 1904.39(b)(6) (30-day fatality window); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"A recordable injury must be entered on the OSHA 300 Log within how long after the employer learns of it?", opts:["24 hours","3 calendar days","7 calendar days","30 calendar days"], correct:2, explain:"29 CFR 1904.29(b)(3): each recordable injury or illness must be entered on the OSHA 300 Log and 301 Incident Report within seven calendar days of receiving information that it occurred.", ref:"OSHA 29 CFR 1904.29(b)(3) (7-day recording); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"Employees on a scaffold must be protected from falling once they are more than how high above a lower level?", opts:["4 feet","6 feet","10 feet","15 feet"], correct:2, explain:"29 CFR 1926.451(g)(1): each employee on a scaffold more than 10 feet above a lower level must be protected from falling. The general 6-foot trigger in 1926.501 applies to other walking and working surfaces.", ref:"OSHA 29 CFR 1926.451(g)(1) (10-foot scaffold rule); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"The top edge of a construction guardrail must be what height above the walking or working surface?", opts:["36 inches, plus or minus 3","39 inches, plus or minus 3","42 inches, plus or minus 3","48 inches, plus or minus 3"], correct:2, explain:"29 CFR 1926.502(b)(1): the top rail must be 42 inches (plus or minus 3 inches) above the walking or working level. Under 1926.502(b)(3) the system must withstand at least 200 pounds applied near the top edge.", ref:"OSHA 29 CFR 1926.502(b)(1) (42-inch guardrail); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"A stairway or ladder must be provided at a personnel access point when the break in elevation is at least:", opts:["12 inches","16 inches","19 inches","24 inches"], correct:2, explain:"29 CFR 1926.1051(a): a stairway or ladder is required at all personnel points of access with a break in elevation of 19 inches or more, unless a ramp, runway, sloped embankment, or personnel hoist is provided.", ref:"OSHA 29 CFR 1926.1051(a) (19-inch break in elevation); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"On a construction site, the travel distance to the nearest fire extinguisher (2A minimum) may not exceed:", opts:["50 feet","75 feet","100 feet","150 feet"], correct:2, explain:"29 CFR 1926.150(c)(1)(i): provide at least one 2A-rated extinguisher for each 3,000 square feet of protected building area, and travel distance from any point to the nearest extinguisher may not exceed 100 feet.", ref:"OSHA 29 CFR 1926.150(c)(1)(i) (100-foot extinguisher travel); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"Utah is an OSHA state-plan state. Under Utah law, an employer must notify Utah OSHA of a work-related fatality or serious injury within:", opts:["8 hours","24 hours","48 hours","72 hours"], correct:0, explain:"Utah Code §34A-6-301(3)(b)(ii): each employer must notify the Utah OSHA division within eight hours of any work-related fatality, disabling, serious, or significant injury, or occupational disease incident. That is stricter than federal OSHA's 24-hour window for hospitalizations, amputations, and eye losses (29 CFR 1904.39).", ref:"HBA book: Safety section, Utah Code 34A-6-301(3)(b) (Utah 8-hour report)", numeric:true},
  {topic:"Safety", q:"A Utah employer that wants to contest a Utah OSHA citation or proposed penalty must give notice within:", opts:["10 days","15 days","30 days","45 days"], correct:2, explain:"Utah Code §34A-6-303(1): the employer has 30 days from receiving the notice to tell the Division of Adjudication it intends to contest the citation, abatement, or proposed assessment; otherwise it becomes final. (Federal OSHA uses 15 working days, but Utah runs its own state plan.)", ref:"HBA book: Safety section, Utah Code 34A-6-303(1) (30-day contest period)", numeric:true},
  {topic:"Estimating and Bidding", q:"A contractor wants a 25% gross margin on the selling price. What markup on cost is needed?", opts:["20.0%","25.0%","33.3%","40.0%"], correct:2, explain:"Markup = margin ÷ (1 − margin) = 0.25 ÷ 0.75 = 33.3%. Check: $100 cost × 1.333 = $133.33 price, and $33.33 ÷ $133.33 = 25% margin.", ref:"NASCLA guide: Bidding and Estimating (markup vs. margin conversion)", numeric:true},
  {topic:"Estimating and Bidding", q:"A 20% markup on cost is equal to what gross margin on the selling price?", opts:["16.7%","20.0%","24.0%","25.0%"], correct:0, explain:"Margin = markup ÷ (1 + markup) = 0.20 ÷ 1.20 = 16.7%. Check: $100 cost × 1.20 = $120 price, and $20 ÷ $120 = 16.7%.", ref:"NASCLA guide: Bidding and Estimating (markup vs. margin conversion)", numeric:true},
  {topic:"Estimating and Bidding", q:"A carpenter earns $30.00/hour and labor burden (payroll taxes, insurance, benefits) is 35% of wages. The burdened labor cost per hour is:", opts:["$35.00","$39.00","$40.50","$45.00"], correct:2, explain:"Burdened rate = wage × (1 + burden %) = $30.00 × 1.35 = $40.50 per hour.", ref:"NASCLA guide: Bidding and Estimating (labor burden)", numeric:true},
  {topic:"Estimating and Bidding", q:"Annual overhead is $180,000 and annual direct job costs are $1,200,000. The overhead rate to apply to direct costs is:", opts:["6.7%","12.0%","15.0%","18.0%"], correct:2, explain:"Overhead rate = annual overhead ÷ annual direct costs = $180,000 ÷ $1,200,000 = 15.0%.", ref:"NASCLA guide: Bidding and Estimating (overhead recovery rate)", numeric:true},
  {topic:"Project Management", q:"Activity A (3 days) is followed by B (5 days) and C (4 days) in parallel; both must finish before D (2 days). Total project duration is:", opts:["9 days","10 days","12 days","14 days"], correct:1, explain:"The longest path is A-B-D: 3 + 5 + 2 = 10 days. A-C-D is 3 + 4 + 2 = 9 days. The critical path sets the project duration, so 10 days.", ref:"NASCLA guide: Scheduling and Project Management (critical path method)", numeric:true},
  {topic:"Project Management", q:"Using the same schedule (A 3 days, then B 5 days and C 4 days in parallel, then D 2 days), how much total float does Activity C have?", opts:["0 days","1 day","2 days","4 days"], correct:1, explain:"Float = critical path length − length of the path through the activity = 10 − 9 = 1 day. C can slip 1 day without delaying D or the project.", ref:"NASCLA guide: Scheduling and Project Management (float calculation)", numeric:true},
];

const ALL_TOPICS = Object.keys(LAST_SCORE);

ALL_TOPICS.forEach(t => { EXAM_BLUEPRINT[t] = LAST_SCORE[t].total; });
const EXAM_TOTAL_QUESTIONS = Object.values(EXAM_BLUEPRINT).reduce((a,b)=>a+b,0); // 60
const EXAM_TIME_LIMIT_SECONDS = 120 * 60; // 120 minutes, matching the real exam
const WEAK_TOPICS = ALL_TOPICS.filter(isWeak);

let state = {screen:"intro", idx:0, answers:[], mode:"weak", source:"bank", showRefs:true};
let activeQuestions = [];
let attemptHistory = [];
const STORAGE_KEY = "ut_b100_attempts_v1";
const SEEN_KEY = "ut_b100_seen_ids_v1";
const REFS_KEY = "ut_b100_show_refs_v1";
function loadShowRefs(){
  try{
    const raw = localStorage.getItem(REFS_KEY);
    if(raw === null) return true;
    return raw !== "0";
  }catch(e){ return true; }
}
function setShowRefs(on){
  state.showRefs = !!on;
  try{ localStorage.setItem(REFS_KEY, state.showRefs ? "1" : "0"); }catch(e){}
  render();
}
function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
function renderRefHint(q, toggleable){
  if(!q || !q.ref) return "";
  if(toggleable && !state.showRefs){
    return `<div class="ref-line ref-hidden"><button type="button" class="ref-toggle" onclick="setShowRefs(true)">Show where to look</button></div>`;
  }
  const hideBtn = toggleable
    ? `<button type="button" class="ref-toggle" onclick="setShowRefs(false)">Hide</button>`
    : "";
  return `<div class="ref-line"><span class="ref-label">Where to look:</span>${escapeHtml(q.ref)}${hideBtn}</div>`;
}

// ---------- localStorage-based history (works on any deployed site) ----------
function loadHistory(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    attemptHistory = raw ? JSON.parse(raw) : [];
  } catch(e){
    attemptHistory = [];
  }
}
function saveAttempt(record){
  attemptHistory.unshift(record);
  if(attemptHistory.length > 40) attemptHistory = attemptHistory.slice(0,40);
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(attemptHistory)); } catch(e){ console.error(e); }
}
function getSeenIds(){
  try{
    const raw = localStorage.getItem(SEEN_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}
function markSeen(ids){
  try{
    let seen = getSeenIds();
    seen = seen.concat(ids);
    if(seen.length > 200) seen = seen.slice(seen.length-200);
    localStorage.setItem(SEEN_KEY, JSON.stringify(seen));
  } catch(e){}
}

// assign a stable id to each question (topic + question text)
QUESTIONS.forEach(q => { q._id = q.topic + "::" + q.q; });

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Build a fresh random set: prefer unseen questions first, shuffle answer order too
// countSpec: either a flat number (same count per topic) or an object {topicName: count}
function buildRandomSet(topics, countSpec){
  const seen = getSeenIds();
  let picked = [];
  topics.forEach(topic => {
    const wantCount = (typeof countSpec === 'object') ? (countSpec[topic] || 0) : countSpec;
    if(wantCount <= 0) return;
    let pool = QUESTIONS.filter(q => q.topic === topic);
    let unseen = pool.filter(q => !seen.includes(q._id));
    let usePool = unseen.length > 0 ? unseen : pool; // reset once exhausted
    usePool = shuffle(usePool);
    const n = Math.min(wantCount, usePool.length);
    picked = picked.concat(usePool.slice(0,n));
  });
  picked = shuffle(picked);
  // shuffle each question's option order independently
  const finalSet = picked.map(q => {
    const order = shuffle([0,1,2,3]);
    const newOpts = order.map(i => q.opts[i]);
    const newCorrect = order.indexOf(q.correct);
    return {topic:q.topic, q:q.q, opts:newOpts, correct:newCorrect, explain:q.explain, ref:q.ref, _id:q._id};
  });
  markSeen(finalSet.map(q => q._id));
  return finalSet;
}

function buildActiveSet(mode){
  if(mode === "sim"){
    activeQuestions = buildRandomSet(ALL_TOPICS, EXAM_BLUEPRINT);
    return;
  }
  if(mode === "missed"){
    activeQuestions = buildCommonlyMissedSet();
    return;
  }
  if(mode === "numbers"){
    activeQuestions = buildNumbersSet(NUMBERS_ROUND_SIZE);
    return;
  }
  const topics = mode === "weak" ? WEAK_TOPICS : ALL_TOPICS;
  const perTopic = mode === "weak" ? 6 : 4;
  activeQuestions = buildRandomSet(topics, perTopic);
}

// Pulls only from questions tagged commonlyMissed:true — the specific clusters
// research + Fernando's own missed questions point to: lien deadline mechanics,
// margin/markup business math, business org liability edge cases, payroll/tax
// specifics, and contract clause conflicts. Not grouped by topic, since the whole
// point is these span multiple topics.
function buildCommonlyMissedSet(){
  const seen = getSeenIds();
  let pool = QUESTIONS.filter(q => q.commonlyMissed);
  let unseen = pool.filter(q => !seen.includes(q._id));
  let usePool = unseen.length > 0 ? unseen : pool;
  usePool = shuffle(usePool);
  const finalSet = usePool.map(q => {
    const order = shuffle([0,1,2,3]);
    const newOpts = order.map(i => q.opts[i]);
    const newCorrect = order.indexOf(q.correct);
    return {topic:q.topic, q:q.q, opts:newOpts, correct:newCorrect, explain:q.explain, ref:q.ref, _id:q._id};
  });
  markSeen(finalSet.map(q => q._id));
  return finalSet;
}

// Numbers & Deadlines drill: pulls only questions tagged numeric:true (exact day counts,
// time windows, dollar amounts, percentages, and formulas), across every topic.
// Prefers questions not seen recently, then tops up from the rest of the numeric pool.
const NUMBERS_ROUND_SIZE = 25;
function buildNumbersSet(size){
  const seen = getSeenIds();
  const pool = QUESTIONS.filter(q => q.numeric);
  const unseen = shuffle(pool.filter(q => !seen.includes(q._id)));
  const rest = shuffle(pool.filter(q => seen.includes(q._id)));
  const picked = unseen.concat(rest).slice(0, Math.min(size, pool.length));
  const finalSet = picked.map(q => {
    const order = shuffle([0,1,2,3]);
    const newOpts = order.map(i => q.opts[i]);
    const newCorrect = order.indexOf(q.correct);
    return {topic:q.topic, q:q.q, opts:newOpts, correct:newCorrect, explain:q.explain, ref:q.ref, _id:q._id};
  });
  markSeen(finalSet.map(q => q._id));
  return finalSet;
}

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'intro') app.innerHTML = renderIntro();
  else if(state.screen === 'quiz') app.innerHTML = renderQuiz();
  else app.innerHTML = renderResults();
}

function renderIntro(){
  let bars = ALL_TOPICS.map(name => {
    const s = LAST_SCORE[name];
    const pct = Math.round((s.correct/s.total)*100);
    const weak = isWeak(name);
    return `
    <div class="breakdown-row">
      <div class="breakdown-label ${weak?'weak':''}">${name}</div>
      <div class="bar-track"><div class="bar-fill ${weak?'weak':''}" style="width:${pct}%"></div></div>
      <div class="breakdown-pct">${s.correct}/${s.total}</div>
    </div>`;
  }).join('');

  const latestTotals = reportTotals(LAST_SCORE);
  const officialHistory = SCORE_REPORTS.map(r => {
    const t = reportTotals(r.scores);
    const passed = t.pct >= 70;
    return `<div class="history-row">
        <span class="history-meta">${r.date} · Official exam · ${t.correct}/${t.total}</span>
        <span class="history-score ${passed?'pass':'fail'}">${t.pct}%</span>
      </div>`;
  }).join('');

  let historyBlock;
  if(attemptHistory.length === 0){
    historyBlock = `<div class="empty-note">No practice attempts logged yet on this device. Finish a set below and it'll show up here.</div>`;
  } else {
    historyBlock = attemptHistory.slice(0,8).map(a => {
      const d = new Date(a.date);
      const dateStr = (d.getMonth()+1) + "/" + d.getDate() + "/" + d.getFullYear();
      const passed = a.scorePct >= 70;
      const modeLabel = a.mode === 'weak' ? 'Weak areas' : a.mode === 'sim' ? 'Simulated exam' : a.mode === 'missed' ? 'Commonly missed' : a.mode === 'numbers' ? 'Numbers & deadlines' : 'Full exam';
      return `<div class="history-row">
        <span class="history-meta">${dateStr} · ${modeLabel} · ${a.total} Q</span>
        <span class="history-score ${passed?'pass':'fail'}">${a.scorePct}%</span>
      </div>`;
    }).join('');
  }

  return `
    <header class="top">
      <div class="eyebrow">Retake Prep — Built From Your Actual Score Report</div>
      <h1>B100 Business &amp; Law<br>Practice Exam</h1>
      <div class="sub">Your ${LATEST_REPORT.date} attempt scored ${latestTotals.pct}% (${latestTotals.correct}/${latestTotals.total}; needed 70%). Weakest areas: ${formatTopicList(WEAK_TOPICS)}.</div>
      <span class="blueprint-badge">70% TO PASS</span>
      <span class="blueprint-badge weak">${QUESTIONS.filter(q=>isWeak(q.topic)).length} WEAK-AREA QUESTIONS IN BANK</span>
    </header>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:12px;">Your ${LATEST_REPORT.date} official exam, by subject</div>
      ${bars}
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:10px;">Official Prov exams</div>
      ${officialHistory}
      <div class="empty-note" style="margin-top:8px;">Weak-area practice follows your most recent official report. Earlier official attempts stay listed here, separate from practice history on this device.</div>
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:10px;">Practice history (this device)</div>
      ${historyBlock}
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:10px;">Choose scope</div>
      <div class="mode-row">
        <div class="mode-btn ${state.mode==='weak'?'active':''}" onclick="setMode('weak')">Weak Areas Only</div>
        <div class="mode-btn ${state.mode==='all'?'active':''}" onclick="setMode('all')">Full Exam</div>
        <div class="mode-btn ${state.mode==='sim'?'active':''}" onclick="setMode('sim')">Simulated Exam</div>
        <div class="mode-btn ${state.mode==='missed'?'active':''}" onclick="setMode('missed')">Commonly Missed</div>
        <div class="mode-btn ${state.mode==='numbers'?'active':''}" onclick="setMode('numbers')">Numbers &amp; Deadlines</div>
      </div>
      <div class="sub" style="margin-top:8px;">${
        state.mode==='weak' ? (WEAK_TOPICS.length ? `Drills only ${formatTopicList(WEAK_TOPICS)} — the sections below 50% on your ${LATEST_REPORT.date} official score report.` : `Your ${LATEST_REPORT.date} official report has no sections below 50%. Choose another mode to keep practicing.`) :
        state.mode==='sim' ? `Matches the real test exactly: ${EXAM_TOTAL_QUESTIONS} questions sized per-topic just like your actual score report (10 Licensing, 6 Contract Mgmt, 4 Business Org, etc.), with a live 120-minute countdown.` :
        state.mode==='numbers' ? `Drills only exact numbers: day counts, deadlines, time windows, dollar amounts, percentages, and formulas. Each round pulls ${Math.min(NUMBERS_ROUND_SIZE, QUESTIONS.filter(q=>q.numeric).length)} shuffled questions from ${QUESTIONS.filter(q=>q.numeric).length} numeric questions across all 11 subject areas, with close distractor numbers so you have to know (or look up) the exact figure.` :
        state.mode==='missed' ? `Pulls only the ${QUESTIONS.filter(q=>q.commonlyMissed).length} questions matching the clusters test-takers most often get wrong: lien deadline mechanics, margin-vs-markup math, business org liability edge cases, payroll/tax specifics, and contract clause conflicts — spans multiple subject areas by design.` :
        "Covers all 11 subject areas, including the ones you already did well on, to confirm they've stuck."
      }</div>
    </div>
    <button class="primary" onclick="startQuiz()">${state.mode==='sim' ? 'Start Full Simulated Exam (120 min) →' : state.mode==='missed' ? 'Drill Commonly Missed →' : state.mode==='numbers' ? 'Drill Numbers &amp; Deadlines →' : 'Shuffle a New Set →'}</button>
    <footer>Every set pulls a fresh random mix from a ${QUESTIONS.length}-question bank (including harder scenario and calculation questions) with shuffled answer order. Each question lists where to look in the HBA Utah Contractor Education Book or the NASCLA guide so you can practice finding answers while you test; use Hide if you want to try without the hint. Study aid only — verify current rules with DOPL / your Prov candidate handbook.</footer>
  `;
}

function setMode(m){
  state.mode = m;
  render();
}

let timerInterval = null;

function startQuiz(){
  buildActiveSet(state.mode);
  state.source = "bank";
  state.screen = "quiz";
  state.idx = 0;
  state.answers = new Array(activeQuestions.length).fill(null);
  state.timeUp = false;
  if(state.mode === "sim"){
    state.deadline = Date.now() + EXAM_TIME_LIMIT_SECONDS * 1000;
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(tickTimer, 1000);
  } else {
    state.deadline = null;
    if(timerInterval) clearInterval(timerInterval);
  }
  render();
}

function tickTimer(){
  if(state.screen !== 'quiz' || !state.deadline) return;
  const remaining = state.deadline - Date.now();
  if(remaining <= 0){
    clearInterval(timerInterval);
    state.timeUp = true;
    finishAttempt();
    state.screen = "results";
    render();
    return;
  }
  // only re-render the timer chip to avoid disrupting the current question view
  const el = document.getElementById('exam-timer');
  if(el) el.textContent = formatTime(remaining);
}

function formatTime(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(totalSec/60);
  const s = totalSec % 60;
  return m + ":" + (s < 10 ? "0"+s : s);
}

function renderQuiz(){
  const q = activeQuestions[state.idx];
  const answered = state.answers[state.idx] !== null;
  const pct = Math.round((state.idx/activeQuestions.length)*100);
  const weak = isWeak(q.topic);

  let opts = q.opts.map((opt, i) => {
    let cls = "opt";
    let disabledAttr = answered ? "disabled" : "";
    if(answered){
      if(i === q.correct) cls += " correct";
      else if(i === state.answers[state.idx] && i !== q.correct) cls += " incorrect";
    }
    return `<button class="${cls}" ${disabledAttr} onclick="selectAnswer(${i})">
      <span class="letter">${String.fromCharCode(65+i)}</span><span>${opt}</span>
    </button>`;
  }).join('');

  let explainBlock = answered ? `<div class="explain"><b>${state.answers[state.idx] === q.correct ? "Correct." : "Not quite."}</b> ${q.explain}</div>` : '';

  let navButtons = `<div class="nav-row">`;
  if(answered){
    navButtons += `<button class="primary" onclick="nextQuestion()">${state.idx === activeQuestions.length-1 ? "See Results →" : "Next Question →"}</button>`;
  }
  navButtons += `</div>`;

  return `
    <div class="progress-row">
      <span>QUESTION ${state.idx+1} / ${activeQuestions.length}</span>
      ${state.mode === 'sim' && state.deadline ? `<span id="exam-timer" style="color:var(--amber);font-weight:600;">${formatTime(state.deadline - Date.now())}</span>` : `<span>${pct}% THROUGH</span>`}
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <span class="topic-tag ${weak?'weak':''}">${q.topic}${weak?' · weak spot':''}</span>
    <div class="question-card">
      <p class="q-text">${q.q}</p>
      ${renderRefHint(q, true)}
      ${opts}
      ${explainBlock}
    </div>
    ${navButtons}
  `;
}

function selectAnswer(i){
  if(state.answers[state.idx] !== null) return;
  state.answers[state.idx] = i;
  render();
}

function nextQuestion(){
  if(state.idx === activeQuestions.length-1){
    if(timerInterval) clearInterval(timerInterval);
    finishAttempt();
    state.screen = "results";
  } else {
    state.idx += 1;
  }
  render();
}

function finishAttempt(){
  let correctCount = 0;
  let topicStats = {};
  activeQuestions.forEach((q,i) => {
    if(!topicStats[q.topic]) topicStats[q.topic] = {correct:0,total:0};
    topicStats[q.topic].total += 1;
    if(state.answers[i] === q.correct){
      correctCount += 1;
      topicStats[q.topic].correct += 1;
    }
  });
  const scorePct = Math.round((correctCount/activeQuestions.length)*100);
  saveAttempt({
    date: new Date().toISOString(),
    mode: state.mode,
    scorePct: scorePct,
    correct: correctCount,
    total: activeQuestions.length,
    topics: topicStats
  });
}

function renderResults(){
  let correctCount = 0;
  let topicStats = {};
  activeQuestions.forEach((q,i) => {
    if(!topicStats[q.topic]) topicStats[q.topic] = {correct:0,total:0};
    topicStats[q.topic].total += 1;
    if(state.answers[i] === q.correct){
      correctCount += 1;
      topicStats[q.topic].correct += 1;
    }
  });
  const scorePct = Math.round((correctCount/activeQuestions.length)*100);
  const passed = scorePct >= 70;

  let topicRows = Object.keys(topicStats).map(name => {
    let s = topicStats[name];
    let weak = isWeak(name);
    return `<div class="topic-result-row ${weak?'weak':''}"><span>${name}</span><span class="topic-score">${s.correct}/${s.total}</span></div>`;
  }).join('');

  const modeLabel = state.mode === 'weak' ? 'Weak-Area Drill' : state.mode === 'sim' ? 'Full Simulated Exam' : state.mode === 'missed' ? 'Commonly Missed Drill' : state.mode === 'numbers' ? 'Numbers & Deadlines Drill' : 'Full Exam';
  let timeUpNotice = state.timeUp ? `<div class="error-box">Time's up — this matches what happens on the real exam if the 120-minute clock runs out. Unanswered questions were scored as incorrect.</div>` : '';

  return `
    <header class="top">
      <div class="eyebrow">Results — ${modeLabel}</div>
      <h1>Practice Complete</h1>
    </header>
    ${timeUpNotice}
    <div class="panel">
      <div class="score-hero">
        <div class="score-num ${passed ? 'pass':'fail'}">${scorePct}%</div>
        <div class="score-label">${correctCount} of ${activeQuestions.length} correct — ${passed ? 'passing (70% needed)' : 'below 70% passing mark'}</div>
      </div>
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:8px;">By topic</div>
      ${topicRows}
    </div>
    <button class="ghost" onclick="reviewMissed()">Review Missed Questions</button>
    <button class="secondary" onclick="startQuiz()">Shuffle Another New Set (same scope) →</button>
    <button class="primary" onclick="backToIntro()">Back to Start</button>
    <footer>Study aid only — verify current rules with DOPL / your Prov candidate handbook.</footer>
  `;
}

function backToIntro(){
  if(timerInterval) clearInterval(timerInterval);
  state.screen = "intro";
  render();
}

function reviewMissed(){
  const app = document.getElementById('app');
  let missed = activeQuestions.map((q,i) => ({q,i})).filter(item => state.answers[item.i] !== item.q.correct);
  let html = `
    <header class="top">
      <div class="eyebrow">Review</div>
      <h1>Missed Questions</h1>
      <div class="sub">${missed.length === 0 ? "You didn't miss any — nice work." : missed.length + " question(s) to revisit."}</div>
    </header>
  `;
  missed.forEach(item => {
    let q = item.q;
    let yourAns = state.answers[item.i];
    let weak = isWeak(q.topic);
    html += `
      <div class="question-card" style="margin-bottom:14px;">
        <span class="topic-tag ${weak?'weak':''}">${q.topic}</span>
        <p class="q-text">${q.q}</p>
        ${renderRefHint(q, false)}
        ${q.opts.map((opt,i) => {
          let cls = "opt";
          if(i === q.correct) cls += " correct";
          else if(i === yourAns) cls += " incorrect";
          return `<div class="${cls}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${opt}</span></div>`;
        }).join('')}
        <div class="explain"><b>Why:</b> ${q.explain}</div>
      </div>
    `;
  });
  html += `<button class="primary" onclick="backToIntro()">Back to Start</button>`;
  app.innerHTML = html;
}

loadHistory();
state.showRefs = loadShowRefs();
render();
</script>
</body>
</html>
