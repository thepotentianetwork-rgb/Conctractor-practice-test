  {topic:"Project Management", q:"A project's critical path is 20 days. Path B, originally 15 days (5 days of float), experiences a 3-day delay due to a late material delivery. What is Path B's remaining float, and does the overall project finish date change?", opts:["Float is now 2 days remaining; project finish date is unaffected since Path B still has float left and hasn't become critical","Float is now 8 days, and the project finishes 3 days earlier than the original 20-day critical path","The project finish date is delayed 3 days, because any delay on Path B automatically extends the critical path","Float remains 5 days, because only delays on the critical path itself can change available float"], correct:0, explain:"Path B had 5 days of float; a 3-day delay consumes 3 of those days, leaving 2 days of float remaining (5 − 3 = 2) — since Path B (18 days) is still under the 20-day critical path, the overall project finish date is unaffected, though the safety margin has shrunk.", ref:"NASCLA guide: Scheduling and Project Management, float after a delay", numeric:true},
  {topic:"Risk Management", q:"A performance bond primarily protects the project owner by guaranteeing:", opts:["The contractor will finish the project according to contract terms, or the surety will step in","The owner will receive the lowest possible contract price, even if the contractor later defaults","The owner will receive free warranty work for 10 years after substantial completion, paid by the surety","The subcontractors' personal income taxes will be paid if the contractor fails to issue those payments"], correct:0, explain:"A performance bond ensures the surety completes or pays for completion of the contracted work if the contractor defaults.", ref:"NASCLA guide: Risk Management, performance bonds"},
  {topic:"Risk Management", q:"A GC carries a $1M general liability policy but a jury awards $1.5M against them on a covered claim. What generally happens to the excess $500,000?", opts:["The insurer must pay the entire $1.5 million, because a covered claim is not limited by the stated policy amount","It's typically the GC's own exposure beyond the policy limit, unless additional coverage like an umbrella policy applies","The claimant forfeits the extra $500,000, because a verdict cannot exceed the insured's policy limit","The surety on the performance bond automatically pays the extra $500,000 as part of the bond penalty"], correct:1, explain:"Standard liability policies cap payouts at the stated limit; amounts above that limit are the insured's own exposure unless excess/umbrella coverage is in place.", ref:"NASCLA guide: Risk Management, liability policy limits / excess verdicts"},
  {topic:"Safety", q:"Which federal agency sets and enforces jobsite safety standards contractors must follow?", opts:["EPA","OSHA","FEMA","DOT"], correct:1, explain:"The Occupational Safety and Health Administration (OSHA) sets and enforces workplace safety standards on construction sites.", ref:"OSHA (Occupational Safety and Health Administration); 29 CFR 1926 (construction); HBA book: Safety section"},
  {topic:"Safety", q:"Fall protection is generally required for construction workers once they are working at or above what height?", opts:["4 feet","6 feet","10 feet","12 feet"], correct:1, explain:"OSHA's construction standard generally requires fall protection at 6 feet or more above a lower level.", ref:"OSHA 29 CFR 1926.501 (fall protection; 6-foot trigger); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"An excavation deeper than 5 feet generally requires which OSHA protective measure, absent a stable rock determination?", opts:["No protective system, because OSHA does not require cave-in protection until a trench reaches 10 feet","Sloping, benching, shoring, or shielding, which are the protective systems used to prevent a cave-in","A single warning sign at the edge of the excavation, with no sloping, benching, shoring, or shielding","Only a spotter stationed at the top, with no physical protective system for workers inside the excavation"], correct:1, explain:"OSHA requires protective systems such as sloping, benching, shoring, or shielding for excavations 5 feet or deeper (with limited exceptions).", ref:"OSHA 29 CFR 1926.652 (excavation protective systems); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"Personal Protective Equipment (PPE) on a job site is generally the responsibility of:", opts:["Solely the individual worker, with no employer duty to assess hazards or to provide the needed equipment","The employer, who must assess workplace hazards and provide or require appropriate personal protective equipment","The project owner only, and only when the work is performed on a federally funded project","Optional based on each worker's preference, because OSHA does not require the employer to provide PPE"], correct:1, explain:"Employers must assess workplace hazards and ensure appropriate PPE is provided and used, per OSHA requirements.", ref:"OSHA 29 CFR 1926.95 (personal protective equipment); HBA book: Safety section"},
  {topic:"Safety", q:"A competent person on an OSHA-regulated jobsite is defined as someone who:", opts:["Has the most years of jobsite experience, even if that person has no training or authority to correct hazards","Can identify existing/predictable hazards and has authority to take corrective action","Is the project owner, because only the owner can be designated as the competent person","Holds a valid driver's license, which is the only credential OSHA requires for that designation"], correct:1, explain:"OSHA defines a competent person as one capable of identifying hazards and authorized to take prompt corrective measures.", ref:"OSHA 29 CFR 1926.32(f) (competent person); HBA book: Safety section"},
  {topic:"Safety", q:"Scaffolding used on a construction site must generally be:", opts:["Self-certified by the crew, with no inspection by a competent person required before work begins","Inspected by a competent person before each work shift, and after any event that could affect its stability","Used only on commercial projects; scaffolding on residential sites is outside the inspection rules","Left unguarded if it is under 10 feet tall, because fall protection and inspections start at that height"], correct:1, explain:"OSHA requires scaffolding to be inspected by a competent person before each shift and after any event that could affect its structural integrity.", ref:"OSHA 29 CFR 1926.451 (scaffolding; inspections); HBA book: Safety section"},
  {topic:"Safety", q:"A worker is assigned to enter a below-grade utility vault to make a connection. Before entry, the crew should determine whether this qualifies as:", opts:["A routine task requiring no special precautions beyond ordinary personal protective equipment, with no atmospheric testing or rescue plan required","A permit-required confined space, which requires atmospheric testing, ventilation, and entry/rescue procedures if applicable","A concern only in underground mining, not in construction utility vaults or similar enclosed spaces","A task exempt from OSHA entry rules if the worker will be inside for less than 10 minutes, so a stay under 10 minutes would need no permit or testing"], correct:1, explain:"Enclosed, below-grade spaces with limited entry/exit and potential atmospheric hazards can qualify as permit-required confined spaces, triggering specific testing and entry procedures.", ref:"OSHA 29 CFR 1926 Subpart AA (confined spaces in construction); HBA book: Safety section"},
  {topic:"Safety", q:"An employer disciplines a worker specifically for reporting a safety hazard to OSHA. This action is:", opts:["A legitimate exercise of management rights, because an employer may discipline any worker who contacts OSHA","Illegal retaliation, since OSHA law protects workers from adverse action for reporting hazards or filing complaints","Unlawful only if the reported hazard is later confirmed; an unfounded report may be the basis for discipline","Permitted if the discipline is written up as a performance issue rather than as a response to the OSHA report"], correct:1, explain:"OSHA's whistleblower protections prohibit retaliating against employees for reporting hazards or filing safety complaints, regardless of how the report is later characterized.", ref:"OSH Act section 11(c), 29 U.S.C. 660(c) (whistleblower / retaliation); HBA book: Safety section"},
  {topic:"Safety", q:"A subcontractor's employee is injured due to a hazard created by the general contractor's own crew, even though the GC never directly supervised the injured worker. Under OSHA's multi-employer worksite doctrine, the GC as 'controlling employer' can:", opts:["Not be cited, because only the injured worker's direct employer can receive an OSHA citation on the site","Potentially be cited for the hazard, since a controlling employer has a duty to address hazards it creates or could reasonably detect and correct","Be cited only if a GC supervisor personally witnessed the injury as it occurred, so a citation would be possible only if a GC supervisor saw the injury happen","Be automatically exempt from citation because a general contractor is not the injured worker's employer, because only the injured worker's direct employer could be cited on that worksite"], correct:1, explain:"Under OSHA's multi-employer citation policy, a controlling employer (like a GC) can be cited for hazards it created, controls, or should have detected and corrected, even affecting another employer's workers.", ref:"OSHA multi-employer worksite citation policy; HBA book: Safety section"},
  {topic:"Safety", q:"A ladder is set up at a construction site with its base 1 foot away from the wall it leans against, reaching a height of 8 feet. Using the standard 4-to-1 ladder angle rule, this setup is:", opts:["Correctly positioned under the 4-to-1 rule, because a 1-foot offset is enough at an 8-foot height, treating a 1-foot offset as enough for an 8-foot height","Too steep — the base should be roughly 2 feet from the wall for an 8-foot working height (1 foot of base offset per 4 feet of height)","Outside any OSHA ladder-angle rule, because those setup ratios apply only to extension lengths, not base offset","A concern only if the ladder reaches 20 feet or more; shorter setups have no 4-to-1 requirement, leaving an 8-foot setup outside the 4-to-1 rule"], correct:1, explain:"The 4-to-1 rule means the base should sit about 1 foot away from the vertical surface for every 4 feet of height to that surface — at 8 feet, the base should be about 2 feet out, not 1.", ref:"OSHA 29 CFR 1926.1053 (ladders; 4-to-1 setup); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"A trench box (shield) used during excavation work is meant to:", opts:["Prevent cave-ins from crushing workers inside the protected zone, rather than necessarily preventing the trench walls from moving at all","Replace the need for any other excavation precautions, including sloping, benching, or a competent-person inspection","Be used only in trenches shallower than 3 feet, where a shield takes the place of a protective system, putting shields outside the rules used on deeper excavations","Eliminate the need for atmospheric testing, because a shield also serves as the method of ventilation, so air monitoring could be skipped in a shield-protected trench"], correct:0, explain:"Trench shields protect workers inside them from a cave-in's force; they don't necessarily prevent soil movement itself, which is why other protective methods like sloping/benching may still apply elsewhere.", ref:"OSHA 29 CFR 1926.652 (trench shields / protective systems); HBA book: Safety section"},
  {topic:"Safety", q:"OSHA's 'Focus Four' hazards in construction, responsible for the majority of construction fatalities, include falls, electrocution, struck-by, and:", opts:["Chemical exposure","Caught-in/between hazards","Noise-induced hearing loss","Repetitive motion injury"], correct:1, explain:"OSHA's Focus Four construction hazards are falls, struck-by, electrocution, and caught-in/between hazards — together responsible for the majority of construction worker fatalities.", ref:"OSHA Focus Four construction hazards; HBA book: Safety section"},
  {topic:"Safety", q:"A workplace fatality occurs on a jobsite. Under OSHA reporting requirements, the employer must report it to OSHA within:", opts:["30 days","24 hours","8 hours","72 hours"], correct:2, explain:"OSHA requires employers to report a work-related fatality within 8 hours of learning about it.", ref:"OSHA 29 CFR 1904.39 (8-hour fatality reporting); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"A worker suffers an in-patient hospitalization, amputation, or loss of an eye on the job. OSHA requires this be reported within:", opts:["8 hours of learning of the event","24 hours of learning of the event","7 days of learning of the event","30 days of learning of the event"], correct:1, explain:"In-patient hospitalizations, amputations, and losses of an eye must be reported to OSHA within 24 hours, a separate and longer window than the 8-hour fatality reporting rule. Utah note: Utah runs its own OSHA state plan, and Utah Code §34A-6-301(3)(b) requires employers to notify Utah OSHA within 8 hours of any work-related fatality or disabling, serious, or significant injury. On a Utah-specific question, expect the 8-hour rule.", ref:"OSHA 29 CFR 1904.39 (24-hour hospitalization, amputation, or eye-loss reporting); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"Under OSHA recordkeeping rules, employers with how many or fewer employees are generally exempt from routinely maintaining injury and illness logs (with some industry exceptions)?", opts:["5 or fewer","10 or fewer","25 or fewer","50 or fewer"], correct:1, explain:"Employers with 10 or fewer employees at all times during the prior calendar year are generally exempt from routine OSHA injury/illness recordkeeping, subject to certain industry exceptions.", ref:"OSHA 29 CFR 1904.1 (partial exemption for 10 or fewer employees); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"OSHA-required injury and illness records (such as the OSHA 300 log) must generally be retained for how long?", opts:["1 year","3 years","5 years","10 years"], correct:2, explain:"OSHA generally requires injury and illness records to be retained for 5 years following the end of the calendar year they cover.", ref:"OSHA 29 CFR 1904.33 (retain injury and illness records 5 years); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"After receiving an OSHA citation, an employer must generally post the citation at or near the location of the violation for how long?", opts:["24 hours only, even if the violation has not yet been corrected","3 working days or until the violation is corrected, whichever is longer","30 calendar days, regardless of whether the violation has already been corrected","There is no posting period; the citation may be kept only in the employer's private files"], correct:1, explain:"OSHA generally requires citations to remain posted for 3 working days or until the violation is corrected, whichever period is longer.", ref:"OSHA 29 CFR 1903.16 (posting citations); HBA book: Safety section", numeric:true},
  {topic:"Safety", q:"OSHA's general Lockout/Tagout standard (1910.147) primarily governs general industry. For CONSTRUCTION work involving hazardous energy control, the applicable requirements instead generally come from:", opts:["The same 1910.147 general-industry rule, applied identically and exclusively to construction work as well","Construction-specific standards under 29 CFR 1926; assuming 1910.147 automatically covers a construction jobsite is a common error","No lockout or tagout requirements at all, because construction work is outside hazardous-energy-control rules","Only state OSHA-plan rules, because federal standards do not address lockout or tagout on construction sites"], correct:1, explain:"General industry's 1910.147 LOTO standard doesn't directly govern most construction activity; construction has its own hazardous-energy-control provisions under 29 CFR 1926 — treating 1910.147 as automatically applicable to a job site is a genuine and common misconception.", ref:"OSHA 29 CFR 1926 (construction hazardous-energy control) vs 1910.147; HBA book: Safety section"},
  {topic:"Safety", q:"A concrete-cutting task using a handheld grinder is listed on OSHA's respirable crystalline silica 'Table 1.' Following Table 1's specified engineering controls and work practices for that task generally:", opts:["Has no bearing on compliance, because Table 1 is only a training aid and not a compliance option, treating Table 1 only as a training handout rather than a compliance option for that task","Satisfies the exposure-control requirements for that task without separate air monitoring, but only if the listed controls are followed exactly as described","Is optional guidance with no compliance value, even if the listed water or vacuum controls are fully used, even when the listed water or vacuum controls are used exactly as Table 1 describes","Applies only at concrete plants, and not to jobsite cutting with a handheld grinder, so Table 1 would not apply to jobsite cutting with a handheld grinder at all"], correct:1, explain:"Table 1 offers a compliance shortcut — following its specified controls for a listed task satisfies silica exposure requirements without separate exposure monitoring, but ONLY if implemented exactly as specified; partial or modified implementation doesn't qualify for that shortcut.", ref:"OSHA 29 CFR 1926.1153 Table 1 (respirable crystalline silica); HBA book: Safety section"},
  {topic:"Tax Laws", q:"In Utah, sales/use tax generally applies to a contractor's:", opts:["Labor charges only; materials and supplies used in the work are not subject to sales or use tax on a construction contract","Purchase of materials and supplies used in construction, in most cases, rather than the contractor's labor charges alone","Nothing, because contractors are treated as fully exempt from sales and use tax on all project costs, including materials","Only jobs over $1 million; smaller contracts are outside the sales- and use-tax rules for materials and supplies"], correct:1, explain:"Contractors generally owe sales/use tax on materials and supplies they purchase and consume in construction work.", ref:"HBA book: Tax Laws section, Utah Code Title 59, Chapter 12 (sales and use tax on materials)"},
  {topic:"Tax Laws", q:"A contractor pays an independent contractor $2,500 for services in 2026. Which tax form is generally required?", opts:["Form W-2, for employee wages and withheld income and employment taxes","Form 1099-NEC, used to report nonemployee compensation of $2,000 or more in 2026","Form I-9, to verify the worker's identity and employment authorization","Form W-4, to set the worker's federal income-tax withholding allowances"], correct:1, explain:"Form 1099-NEC reports nonemployee compensation paid to independent contractors. For payments made in 2026 the IRS reporting threshold is $2,000 (it was $600 for payments made before 2026, and it will be inflation-adjusted after 2026). Older study books still show $600.", ref:"IRS Instructions for Forms 1099-MISC and 1099-NEC ($2,000 for 2026 payments); HBA book: Tax Laws section", numeric:true},
  {topic:"Tax Laws", q:"Self-employed contractors who expect to owe tax are generally required to pay taxes:", opts:["Only once a year, when the annual income-tax return is filed in April","Quarterly, as estimated tax payments during the year, not only when the annual return is filed","Not at all, if expected net income is under $100,000 for the year, with no quarterly estimated-tax payments due","Only if the contractor is later selected for an IRS audit of that tax year"], correct:1, explain:"Self-employed individuals typically must make quarterly estimated tax payments rather than paying everything at year-end.", ref:"IRS Form 1040-ES (estimated tax); HBA book: Tax Laws section", numeric:true},
  {topic:"Tax Laws", q:"A contractor purchases a truck used 70% for business and 30% for personal errands. For tax purposes, the deductible portion of related vehicle expenses is generally:", opts:["100% of the truck expenses, because the vehicle is titled in the name of the business","Limited to the business-use percentage (roughly 70% in this case), not the full cost","0% of the truck expenses, because any personal use disqualifies the entire deduction","A percentage based solely on the truck's purchase price, not on actual business versus personal use"], correct:1, explain:"Mixed-use vehicle expenses are generally deductible only in proportion to actual business use, requiring reasonable recordkeeping (e.g., a mileage log) to support the split.", ref:"IRS Publication 463 (business use of a vehicle); HBA book: Tax Laws section", numeric:true},
  {topic:"Tax Laws", q:"A contractor accepts a large cash payment for a job and doesn't report it as income. Beyond ethical concerns, this creates exposure to:", opts:["Little practical risk if the cash payment is under $10,000 and is not deposited in a bank","Tax evasion penalties, interest, and potential criminal exposure if discovered, regardless of the payment method","Only a simple late-filing fee, because unreported cash is treated as a timing issue rather than unreported income","No tax exposure, because cash transactions are not treated as taxable income until they are deposited"], correct:1, explain:"All income is taxable regardless of payment form; failing to report cash income creates the same (or greater) audit and penalty exposure as any other unreported income.", ref:"IRC income-reporting rules; IRS Form 1040 / Schedule C; HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"A Section 179 deduction allows a business to:", opts:["Avoid paying sales tax on the equipment, by deducting the purchase instead of paying tax at the sale","Potentially deduct the full purchase price of qualifying equipment/tools in the year purchased, rather than depreciating it over several years","Skip filing a tax return entirely for the year in which the qualifying equipment is purchased, so buying qualifying equipment would excuse the business from filing that year's tax return","Exempt all business vehicles from state registration fees for as long as the Section 179 election remains in effect"], correct:1, explain:"Section 179 allows eligible businesses to expense the full cost of qualifying equipment purchases immediately, rather than spreading the deduction out through standard depreciation schedules.", ref:"IRC Section 179; IRS Publication 946; HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"A contractor operating as an LLC taxed as a sole proprietorship generally owes self-employment tax on:", opts:["Nothing, because an LLC is treated as tax-exempt and its owner does not owe self-employment tax, treating the LLC as tax-exempt so the owner would owe no Social Security or Medicare tax","Net self-employment earnings, covering the individual's share of Social Security and Medicare that an employer would otherwise split with an employee","Only gross revenue before expenses, with no reduction for ordinary business costs, computing self-employment tax on gross receipts with no deduction for ordinary business expenses","Only net earnings above $1,000,000, with amounts below that threshold exempt from self-employment tax, so only net earnings above a $1,000,000 threshold would be subject to self-employment tax"], correct:1, explain:"Self-employed individuals owe self-employment tax on net earnings, covering both the employee and employer portions of Social Security/Medicare that a traditional employer would otherwise split.", ref:"IRS self-employment tax (Schedule SE); HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"The self-employment tax rate on net self-employment earnings is approximately:", opts:["7.65% of net self-employment earnings","15.3% of net self-employment earnings","22% of net self-employment earnings","35% of net self-employment earnings"], correct:1, explain:"Self-employment tax is roughly 15.3% of net earnings — 12.4% for Social Security plus 2.9% for Medicare, covering both the 'employee' and 'employer' shares a traditional payroll arrangement would split.", commonlyMissed:true, ref:"IRS Schedule SE / self-employment tax rate (15.3%); HBA book: Tax Laws section", numeric:true},
  {topic:"Tax Laws", q:"Form W-9 is used to:", opts:["Report an employee's annual wages, federal income tax withheld, and FICA wages on a year-end form","Collect a contractor's/vendor's taxpayer ID information before the payer issues a 1099","Apply for an employer identification number directly with the IRS for a new business","Report quarterly payroll-tax deposits and the employer's share of Social Security and Medicare tax"], correct:1, explain:"A business collects Form W-9 from independent contractors/vendors to get their taxpayer ID number, which is then used to prepare an accurate Form 1099 at year-end.", commonlyMissed:true, ref:"IRS Form W-9; HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"If a contractor fails to provide a valid taxpayer ID on Form W-9, the payer may be required to withhold what's known as 'backup withholding' from payments at a rate of approximately:", opts:["10%","24%","33%","50%"], correct:1, explain:"Backup withholding is currently around 24% of the payment when a payee fails to furnish a valid taxpayer ID, and the payer must remit it to the IRS.", commonlyMissed:true, ref:"IRS backup withholding (Form W-9 / 1099); HBA book: Tax Laws section", numeric:true},
  {topic:"Tax Laws", q:"Form 941 is filed by employers to report:", opts:["Annual business income tax on the employer's net profit for the calendar year","Quarterly federal payroll taxes withheld from employees, plus the employer's matching share","Sales tax collected from customers on taxable sales during the quarter","A one-time new-hire notification to the state directory of new hires"], correct:1, explain:"Form 941 is the employer's quarterly federal tax return reporting withheld income tax plus Social Security/Medicare taxes for both employee and employer portions.", commonlyMissed:true, ref:"IRS Form 941 (quarterly federal employment tax); HBA book: Tax Laws section", numeric:true},
  {topic:"Tax Laws", q:"The 'trust fund recovery penalty' can make a responsible individual (like a business owner) personally liable for what portion of unpaid withheld payroll taxes?", opts:["10% of the unpaid withheld payroll taxes, which is not the trust-fund recovery exposure for a responsible individual","50% of the unpaid withheld payroll taxes, which is not the statutory trust-fund recovery amount","Up to 100% of the unpaid withheld payroll taxes, which can be imposed on a responsible individual personally","None of the withheld taxes; only the business entity, not a responsible individual, can be liable"], correct:2, explain:"The trust fund recovery penalty can impose personal liability of up to 100% of unpaid withheld payroll taxes on responsible individuals, piercing the usual entity liability shield for this specific obligation.", commonlyMissed:true, ref:"IRS trust fund recovery penalty (unpaid withheld payroll taxes); HBA book: Tax Laws section", numeric:true},
  {topic:"Tax Laws", q:"Since the 2020 tax year, nonemployee compensation paid to independent contractors is reported on which form — a change from the older practice of using a different form's box for this?", opts:["Form 1099-MISC, which remains the form used for nonemployee compensation just as it was before 2020","Form 1099-NEC; nonemployee compensation was moved off Form 1099-MISC onto its own form starting with the 2020 tax year","Form W-2, which is used for independent contractors in the same way it is used for employees","No dedicated information return; nonemployee compensation is reported only on the payer's income-tax return"], correct:1, explain:"Starting with tax year 2020, the IRS revived Form 1099-NEC specifically for nonemployee compensation, which had previously been reported in a box on Form 1099-MISC — outdated study material or memory can lead people to answer 1099-MISC incorrectly.", commonlyMissed:true, ref:"IRS Form 1099-NEC vs 1099-MISC; HBA book: Tax Laws section"},
  {topic:"Contract Management", q:"A 'novation' in contract law specifically means:", opts:["Adding a minor amendment to an existing contract without changing the parties or releasing anyone, leaving the original parties in place and nobody released from the existing obligations","Substituting a new party into a contract in place of an original party, with the original party's obligations fully released, unlike an assignment, where the original party can remain liable","Simply renaming the contract document, with the same parties and the same obligations remaining in place, so a novation would be only a new title on the same document with the same parties","Extending the contract's deadline by agreement, without substituting a new party or releasing the original one, so a later completion-date agreement would be called a novation even with no party substitution"], correct:1, explain:"Novation fully substitutes a new party and releases the original party from the contract entirely — this is the key distinction from an assignment, where the assignor can often still remain secondarily liable.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, novation"},
  {topic:"Contract Management", q:"An 'assignment' of contract rights differs from a 'delegation' of contract duties in that:", opts:["They are simply two names for the same transfer, and either word can be used for rights or for duties, so 'assignment' and 'delegation' could be used interchangeably for a transfer of either kind","Assignment transfers the benefits or rights under a contract, while delegation transfers the obligations or duties; delegating does not necessarily release the delegator if the duties are not performed","Only duties can be transferred, and contract rights must stay with the original party, so a right to payment could not be transferred and only the duty to perform could be moved","Delegation requires court approval before it is effective, while assignment does not, so a delegation of duties would be ineffective until a court had approved the transfer"], correct:1, explain:"Rights (benefits) are assigned; duties (obligations) are delegated — and unlike a novation, delegating a duty typically doesn't release the original party from liability if the delegate fails to perform.", ref:"NASCLA guide: Contract Management, assignment vs delegation"},
  {topic:"Contract Management", q:"'Privity of contract' refers to:", opts:["The confidentiality of contract terms, which keeps the agreement from being disclosed to anyone outside the project, so privity would be a secrecy rule rather than a question of who may sue on the contract","The direct legal relationship that exists only between the actual parties to a contract, which is why an owner generally cannot sue a sub-subcontractor directly without another legal basis","A clause requiring private arbitration rather than a lawsuit in court, so a mandatory arbitration clause would be what lawyers mean by privity of contract","The private, unrecorded nature of a contract, as opposed to a recorded instrument such as a lien, so an unrecorded contract would lack privity until it was recorded like a lien"], correct:1, explain:"Privity limits contract enforcement rights to the actual contracting parties — a key reason mechanics liens and payment bonds exist as separate remedies for parties (like sub-subs and suppliers) who lack direct privity with the owner.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, privity of contract"},
  {topic:"Contract Management", q:"A 'third-party beneficiary' of a contract is someone who:", opts:["Signed the contract only as a witness and has no rights or duties under the agreement itself, so a witness signature would be enough to make that person a third-party beneficiary","Is not a party to the contract but was specifically intended to benefit from it, and may in some cases have enforceable rights under it despite lacking privity","Provided financing for the contract and therefore stands in the same position as a party to it, so a lender would automatically have beneficiary rights simply by providing project financing","Is automatically liable for any breach of the contract even though that person did not sign it, so an intended beneficiary would also be automatically liable for a breach of the contract"], correct:1, explain:"Third-party beneficiary status is an exception to the general privity rule — someone the contracting parties specifically intended to benefit can sometimes enforce the contract even without being a signatory.", ref:"NASCLA guide: Contract Management, third-party beneficiaries"},
  {topic:"Contract Management", q:"'Quantum meruit' is an equitable remedy that allows a contractor to recover:", opts:["Punitive damages for a willful breach, in addition to the amounts set out in the written contract","The reasonable value of labor and materials actually provided, even without an enforceable contract covering that work","The contractor's full expected profit, even if little or no work was actually performed","Only amounts specifically itemized in a signed change order, with no recovery outside that writing"], correct:1, explain:"Quantum meruit ('as much as deserved') lets a party recover the reasonable value of work performed even without a valid enforceable contract, preventing unjust enrichment of the party who received the benefit.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, quantum meruit"},
  {topic:"Contract Management", q:"'Accord and satisfaction' in a payment dispute means:", opts:["The parties agreed on a new contract price before work began, replacing the original bid figure, so a pre-construction price revision would be what lawyers mean by accord and satisfaction","The parties settled a disputed claim by agreeing to and accepting a different (often lesser) payment than originally claimed, discharging the original obligation","A court ordered specific performance, requiring the contractor to finish the work as originally specified, treating a specific-performance order as the same thing as an agreed substitute payment","The contractor formally accepted defective materials and agreed to install them without a price adjustment, so accepting defective materials at the original price would be an accord and satisfaction"], correct:1, explain:"Accord and satisfaction resolves a genuine dispute — accepting a lesser negotiated payment as full satisfaction discharges the original claim, which is why cashing a 'paid in full' check on a disputed invoice can be legally risky.", ref:"NASCLA guide: Contract Management, accord and satisfaction"},
  {topic:"Contract Management", q:"The legal difference between 'waiver' and 'estoppel' is that waiver is:", opts:["Identical to estoppel, with no practical difference in what a party must show or in the result, so waiver and estoppel would require the same showing and produce the same result","The intentional, voluntary relinquishment of a known right, while estoppel prevents asserting a right because that party's conduct induced another party's reasonable reliance","A doctrine that applies only in lien law and is not used in ordinary construction-contract disputes, leaving waiver unused in ordinary construction-contract payment and delay disputes","A remedy that only a court can grant, and that the parties themselves cannot create by their conduct, so the parties could not create a waiver by their own conduct without a court order"], correct:1, explain:"Waiver is about a party's own intentional choice to give up a right; estoppel is about being barred from asserting a right due to your conduct having misled someone else who reasonably relied on it — a subtle but real distinction.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, waiver vs estoppel"},
  {topic:"Contract Management", q:"A 'latent defect' differs from a 'patent defect' in that a latent defect is:", opts:["More expensive to repair than a patent defect, regardless of whether it could have been seen at inspection","Hidden and not reasonably discoverable through a normal inspection at the time, unlike a patent defect, which is reasonably obvious upon inspection","Relevant only to electrical work, and not to structural, plumbing, or finish defects of other kinds, leaving structural, plumbing, and finish defects outside the latent-versus-patent distinction","A defect caused intentionally by the contractor, whereas a patent defect is only the result of an honest mistake"], correct:1, explain:"Latent defects are hidden/not reasonably discoverable at the time (like a structural flaw behind finished walls), while patent defects are apparent on reasonable inspection — the distinction matters for when claims can reasonably be discovered and pursued.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, latent vs patent defects"},
  {topic:"Contract Management", q:"A 'cardinal change' to a contract is one that is:", opts:["Any change order, no matter how small, including a minor adjustment to a finish allowance, so even a small finish-allowance adjustment would be treated as a cardinal change","So fundamental in scope or nature that it goes beyond what the parties originally bargained for, and may be treated as a breach of the original contract rather than a covered change","Relevant only to change orders under $1,000, and not to larger additions to the original scope, so a cardinal change would apply only to small dollar changes under a $1,000 threshold","A change requested verbally instead of in writing, regardless of how large or small the change is, treating any oral request as a cardinal change regardless of the size of the added work"], correct:1, explain:"A cardinal change is so drastic it effectively creates a different project than the parties agreed to — courts may treat it as a breach of the original contract rather than simply a large change order within its scope.", ref:"NASCLA guide: Contract Management, cardinal change"},
  {topic:"Contract Management", q:"'Consequential damages' differ from 'direct damages' in a construction dispute in that consequential damages:", opts:["Are smaller in dollar amount than direct damages, which is how the two categories are distinguished, so the label would turn only on which dollar figure is smaller, not on the type of loss","Are indirect losses flowing from a breach, such as lost business income or rental costs during a delay, rather than the direct cost of fixing or completing the work itself","Apply only to residential projects, and are not recoverable on commercial or public work, leaving lost-income or rental-delay losses unrecoverable on commercial or public projects","Cannot be addressed in a construction contract, because the parties are not allowed to allocate that risk, so a contract could not allocate delay or lost-income risk to either party in advance"], correct:1, explain:"Direct damages are the immediate cost of the breach itself (redoing bad work, cost to complete); consequential damages are the ripple-effect losses (lost profits, rental costs) — which is exactly why many contracts include a mutual waiver of consequential damages to cap exposure.", commonlyMissed:true, ref:"NASCLA guide: Contract Management, consequential vs direct damages"},
  {topic:"Risk Management", q:"In surety bond terminology, the 'obligee,' 'principal,' and 'surety' refer respectively to:", opts:["The contractor, the owner, and the bank that provided the construction loan for the project, substituting the construction lender for the surety as one of the three parties to the bond","The party protected by the bond (usually the project owner), the party whose performance is guaranteed (the contractor), and the surety issuing the bond","Three different types of the same bond, rather than three different roles on a single bond, treating obligee, principal, and surety as three bond products rather than three roles on one bond","The insurance agent, the adjuster, and the underwriter on the contractor's general liability policy, naming the liability-policy agent, adjuster, and underwriter as the three parties to a performance bond"], correct:1, explain:"Obligee = the protected party (typically the owner); Principal = the bonded party (the contractor); Surety = the company backing the bond financially — mixing these up is a common and costly terminology error.", commonlyMissed:true, ref:"NASCLA guide: Risk Management, surety parties (obligee, principal, surety)"},
  {topic:"Risk Management", q:"In an indemnification arrangement, the 'indemnitor' and 'indemnitee' refer respectively to:", opts:["The insurance company and the policyholder named on the liability or property policy, as if those insurance-policy roles were the same as indemnitor and indemnitee","The party who agrees to cover/hold harmless the other party's losses (indemnitor), and the party being protected/held harmless (indemnitee)","The plaintiff and the defendant in any lawsuit, regardless of who agreed to hold whom harmless, even if neither party had agreed to hold the other harmless under a contract","Two interchangeable terms for the same role, with no difference in who bears the transferred risk, so it would not matter which party had agreed to bear the transferred risk"], correct:1, explain:"The indemnitor is the one agreeing to absorb specified losses; the indemnitee is the one being protected — this maps directly onto who is providing versus receiving protection in an indemnification clause.", ref:"NASCLA guide: Risk Management, indemnitor and indemnitee"},
  {topic:"Risk Management", q:"A 'named insured' on a policy differs from an 'additional insured' in that the named insured:", opts:["Has fewer rights under the policy than an additional insured, who is treated as the primary policyholder, treating the additional insured as the primary policyholder with the broader rights","Is the primary policyholder with the broadest rights and obligations under the policy, while an additional insured has coverage extended for specified purposes without those primary obligations","Is a concept used only in health insurance, and does not appear on construction liability policies, so a named insured designation would not appear on a construction liability policy at all","Automatically becomes the additional insured's employer after being listed on the policy, as if listing a party as named insured also made that party the additional insured's employer"], correct:1, explain:"The named insured is the actual policyholder with full rights/obligations; an additional insured gets coverage extended to them for specific situations (like a GC on a sub's policy) without taking on the named insured's full role.", ref:"NASCLA guide: Risk Management, named insured vs additional insured"},
  {topic:"Risk Management", q:"An 'occurrence' form liability policy differs from a 'claims-made' form in that an occurrence policy:", opts:["Covers only claims filed in the same year the policy is first purchased, and not later-filed claims, so a claim filed after the first policy year would be outside an occurrence policy even for an earlier incident","Covers incidents that happened during the active policy period, regardless of when the claim is later filed, unlike a claims-made policy, which responds based on when the claim itself is filed","Costs less in every case than a claims-made policy, which is the only distinction between the two forms, treating a lower premium as the only difference between an occurrence form and a claims-made form","Does not require payment of a premium, because coverage attaches automatically when a claim is filed, so an occurrence policy would attach with no premium once someone later filed a claim"], correct:1, explain:"Occurrence coverage attaches to when the incident actually happened, so a policy from years ago can still respond to a claim filed today — claims-made coverage instead depends on the claim being filed while that specific policy (or an extended reporting period) is active.", ref:"NASCLA guide: Risk Management, occurrence vs claims-made coverage"},
  {topic:"Risk Management", q:"'Betterment' in an insurance/risk context refers to:", opts:["A bonus paid to a contractor for excellent work that exceeds the quality required by the contract, as if a quality bonus for work above the contract standard were what insurers call betterment","A situation where repairing damage results in the property being improved beyond its original condition; insurers often will not pay for the improvement portion, only the cost to restore the prior condition","The process of upgrading an insurance policy's coverage limits at renewal or after a loss, so raising policy limits at renewal or after a loss would be the meaning of betterment","A type of performance bond that guarantees the completed work will be free of defects, treating a defect-free-work guarantee as a betterment rather than as a warranty or bond obligation"], correct:1, explain:"When a repair necessarily improves a property beyond its pre-loss condition, insurers typically only cover restoring the original condition — the value of the 'betterment' improvement is often excluded or cost-shared.", ref:"NASCLA guide: Risk Management, betterment"},
  {topic:"Risk Management", q:"'Subrogation' (before any waiver is applied) generally refers to an insurer's right to:", opts:["Deny any claim it disagrees with, without regard to the policy's coverage terms, allowing the insurer to refuse a covered claim simply because it disagreed with the loss","Step into the insured's shoes and pursue a responsible third party to recover what the insurer paid out on a claim, which is the right that a waiver of subrogation gives up","Cancel a policy at any time without notice, including after a claim has already been paid, allowing the insurer to drop the policy without notice even after it had already paid the claim","Charge the insured a higher premium after any claim, as an automatic condition of payment, raising the premium automatically after any paid claim as a condition of making that payment"], correct:1, explain:"Subrogation is the insurer's baseline legal right to recoup a paid claim from whoever was actually responsible — understanding this baseline right is what makes clear why a waiver of subrogation (giving that right up) is a meaningful contract concession.", ref:"NASCLA guide: Risk Management, subrogation"},
  {topic:"Risk Management", q:"A 'certificate holder' listed on an insurance certificate has fundamentally different rights than an 'additional insured' because a certificate holder:", opts:["Actually has broader coverage rights than an additional insured listed on the same policy, so a certificate holder would have more coverage rights than an additional insured on the same policy","Merely receives notice or proof that a policy exists and is in force, without any actual coverage under that policy; being an additional insured is what actually extends coverage","Is the insurance company itself, listed on the certificate only for the insurer's own records, listing the insurance company itself as the certificate holder only for the insurer's records","Automatically becomes a named insured after 30 days of being listed as a certificate holder, so a certificate holder would become a named insured automatically after 30 days on the certificate"], correct:1, explain:"This is one of the most common and costly confusions in construction risk management — a certificate holder just gets paperwork/notice, while only an additional insured actually gets protected by the policy's coverage.", commonlyMissed:true, ref:"NASCLA guide: Risk Management, certificate holder vs additional insured"},
  {topic:"Project Management", q:"An RFI (Request for Information) in construction project management is used to:", opts:["Request additional payment from the owner for work already performed under the original contract, using an RFI as a request for extra payment on work already required by the original contract","Formally seek clarification from the design team or owner about an ambiguity, conflict, or missing detail in the plans or specifications before proceeding with that work","Report a safety violation to OSHA, or to the project's designated safety representative, treating an RFI as a safety-violation report to OSHA or to a project's safety representative","Request a background check on a new subcontractor before that firm is allowed on the site, using an RFI as a request for a background check before a new subcontractor enters the site"], correct:1, explain:"RFIs are the formal, documented channel for resolving plan/spec ambiguities — proceeding on an assumption instead of submitting an RFI can create costly rework and liability exposure if the assumption turns out wrong.", ref:"NASCLA guide: Scheduling and Project Management, RFIs"},
  {topic:"Project Management", q:"A 'construction change directive' differs from a standard 'change order' in that a change directive:", opts:["Is simply a faster way to write the same mutually signed change-order document, so a change directive and a change order would both already reflect a signed agreement on price and time","Is typically issued unilaterally by the owner or architect, directing the contractor to proceed while price or time is still being negotiated, unlike a signed change order that already reflects mutual agreement","Can be used only for safety-related changes, and not for scope, time, or price adjustments, so a change in scope, time, or price would still have to wait for a later signed change order","Does not require the contractor to actually perform any work until a later change order is signed, so the contractor could wait to perform until the price and time of the directed change were fully agreed"], correct:1, explain:"A change directive keeps the project moving on a change before price/time is fully negotiated and agreed — a meaningful practical difference from a change order, which represents a completed, mutually-agreed modification.", ref:"NASCLA guide: Scheduling and Project Management, construction change directives vs change orders"},
  {topic:"Project Management", q:"'Value engineering' in a construction project refers to:", opts:["Reducing the contractor's profit margin in order to win a bid, without changing the design or materials, cutting the contractor's markup to win the bid without changing any design or material choice","A systematic process of analyzing design/material choices to reduce cost or improve efficiency while maintaining the required function and quality of the project","Increasing the project's scope in order to justify a higher fee or a larger contract sum, expanding the project's scope in order to support a higher fee or a larger contract sum","A term used only in structural steel engineering, and not for other trades or design choices, limiting value engineering to structural steel and excluding other trades and design choices"], correct:1, explain:"Value engineering looks for ways to deliver the same functional outcome for less cost or with more efficiency — distinct from simply cutting scope or quality to save money.", ref:"NASCLA guide: Scheduling and Project Management, value engineering"},
  {topic:"Project Management", q:"'Constructive acceleration' occurs when:", opts:["A contractor voluntarily speeds up work to finish early in hope of an early-completion bonus, as when a contractor chooses to finish early in hope of an early-completion bonus","An owner fails to grant a legitimate time extension the contractor was entitled to, effectively forcing the contractor to accelerate (at their own cost) to meet the original deadline anyway","A schedule is compressed using additional resources by mutual agreement, with a price for the overtime or extra crews already settled, as when both parties already agreed on a price for overtime or extra crews to compress the schedule","A project uses prefabricated or modular construction methods, which shorten the on-site duration, as when prefabricated or modular methods simply shorten the time spent working on site"], correct:1, explain:"Constructive acceleration is a claim theory — the owner didn't explicitly order acceleration, but their refusal to grant a warranted extension effectively forced it, potentially entitling the contractor to recover the added cost.", ref:"NASCLA guide: Scheduling and Project Management, constructive acceleration"},
  {topic:"Project Management", q:"'As-built' drawings are best described as:", opts:["The original architectural plans issued before construction began, with no later field changes shown, showing only the pre-construction design and omitting field changes made during the work","Final drawings updated to reflect the ACTUAL conditions and any changes made during construction, which may differ from the original design documents","A contractor's personal sketch used only for the crew's own reference, not a project closeout document, treating a crew-only sketch as the project's official as-built closeout set","Drawings required only on projects over $1 million, and optional on smaller private work, so as-built drawings would be required only on jobs over $1 million and optional on smaller private work"], correct:1, explain:"As-built drawings capture what was actually constructed, including field changes and deviations from the original plans — valuable for future renovation, maintenance, and dispute resolution.", ref:"NASCLA guide: Scheduling and Project Management, as-built drawings"},
  {topic:"Project Management", q:"A 'notice to proceed' in a construction contract typically:", opts:["Has no formal significance and is only an informal courtesy before the contractor mobilizes, treating the notice to proceed as only a courtesy and not as the official start of the schedule","Formally authorizes the contractor to begin work and often establishes the official start date the project schedule (and related deadlines) are measured from","Is used only on government or public projects, and is not used to start the clock on private work, so a notice to proceed would start the clock only on government or other public projects","Replaces the need for a signed contract, so work may begin on the notice alone, allowing work to begin on the notice to proceed even if no signed contract was ever in place"], correct:1, explain:"The notice to proceed is often the formal trigger date the entire project schedule counts from, even if it's issued after the contract itself was signed.", ref:"NASCLA guide: Scheduling and Project Management, notice to proceed"},
  {topic:"Project Management", q:"A 'means and methods' clause in a construction contract typically establishes that:", opts:["The owner controls exactly how the contractor performs the work, step by step, including techniques and sequencing, so the owner would direct the contractor's techniques and sequencing step by step","The contractor generally has control over and responsibility for how the work gets done, while the owner or architect's role is generally focused on the design and end-result requirements","Only union labor may be used on the project, and the contractor may not choose an alternate crew or method, limiting the project to union labor and barring the contractor from choosing another crew or method","The architect is liable for all jobsite safety incidents, because means and methods are the designer's responsibility, placing jobsite safety and means-and-methods liability on the architect rather than the contractor"], correct:1, explain:"Means and methods is a key liability boundary — contractors generally control (and bear responsibility for) HOW work gets built, while owners/designers are generally focused on WHAT gets built, not the construction techniques used to get there.", ref:"NASCLA guide: Scheduling and Project Management, means and methods"},
  {topic:"Business Organization", q:"'Ultra vires' refers to actions by a corporation (or its officers) that are:", opts:["Standard and fully authorized under the corporate charter or the officers' ordinary job descriptions","Beyond the scope of authority granted by the corporation's charter or governing documents, and potentially void or challengeable for that reason","Required by state law for all corporations, as a routine part of annual corporate filings, as if every corporation had a statutory duty to take that kind of action in its annual filings","A type of tax election, such as choosing S-corporation treatment for federal income tax, treating the act as a tax election such as choosing S-corporation status for federal income tax"], correct:1, explain:"Ultra vires ('beyond the powers') describes acts exceeding what a corporation's charter/bylaws actually authorize — historically a bigger issue than today, but still relevant when officers act outside their granted authority.", ref:"NASCLA guide: Business Organization, ultra vires / corporate authority"},
  {topic:"Business Organization", q:"A 'fiduciary duty' owed by a business partner or corporate officer generally means they must:", opts:["Only follow the letter of their written contract, with no higher duty of loyalty or care, so partners or corporate officers would owe no extra duty of loyalty or care beyond the written contract","Act with loyalty and good faith in the best interest of the business/other partners, rather than prioritizing personal interests in conflict with that duty","Personally guarantee all business debts, even when they have not signed a separate guarantee, so a partner or officer would personally guarantee every business debt without a separate signed guarantee","Work a minimum number of hours per week, which is how the duty is measured in practice, measuring the fiduciary duty by a weekly hour requirement rather than by loyalty and good faith"], correct:1, explain:"Fiduciary duty is a heightened legal obligation of loyalty and care — a partner or officer who prioritizes personal gain over the business's interest in a conflict-of-interest situation can be in breach of this duty.", ref:"NASCLA guide: Business Organization, fiduciary duties"},
  {topic:"Business Organization", q:"'Apparent authority' can make a business liable for an employee's actions when:", opts:["The employee had zero actual authorization but the business's own conduct reasonably led a third party to believe the employee was authorized to act on the business's behalf","The employee already had written authorization for every action, so apparent authority is not in issue, so written authority for every act would be required before apparent authority could arise","The business had no relationship with the person at all, and did not hold that person out as its agent, so apparent authority could exist even if the business had no relationship with that person","The employee acted purely for personal benefit, with no connection to the business's affairs, so an act done purely for the employee's own benefit would still bind the business under apparent authority"], correct:0, explain:"Apparent authority binds a business based on how it presented the employee's authority to outsiders — even without actual internal authorization, reasonable reliance by a third party can create real liability.", ref:"NASCLA guide: Business Organization, apparent authority"},
  {topic:"Labor Laws", q:"'Respondeat superior' is a legal doctrine holding that:", opts:["Employees, not the employer, are the only parties who can be liable for workplace injuries, leaving the employing company with no vicarious liability for a workplace injury","An employer can be held liable for an employee's negligent acts committed within the scope of employment, not for purely personal acts unrelated to job duties","Only supervisors can be held liable for injuries on a jobsite, and not the employing company itself, so only a supervisor, and not the company itself, could be liable for a jobsite injury","Employers are liable for employee actions only if a manager personally witnessed the conduct, requiring a manager to have personally witnessed the conduct before the employer could be liable"], correct:1, explain:"Respondeat superior ('let the master answer') holds employers liable for employee negligence within the scope of employment — a foundational reason jobsite conduct and supervision matter so much for liability exposure.", ref:"NASCLA guide: Employee Management, respondeat superior / employer liability; HBA book: Labor Laws section"},
  {topic:"Labor Laws", q:"Utah is generally an 'at-will employment' state, which means:", opts:["Employees cannot be terminated for any reason once they have started work, unless a court first approves the discharge, so a worker could not be discharged after starting work unless a court had first approved the termination","Absent a contract or a specific legal exception, such as discrimination or retaliation, either the employer or the employee can generally end the employment relationship without cause","Employers must give two weeks' notice before any termination, even when no contract requires that notice, imposing a two-week notice duty even when no contract or policy required that notice","The rule applies only to employees working fewer than 40 hours per week, and not to full-time staff, limiting at-will employment to part-time staff and excluding employees who work 40 hours or more"], correct:1, explain:"At-will employment allows termination by either party without cause in most situations — but this default is still limited by specific legal exceptions like anti-discrimination law and retaliation protections (e.g., for OSHA complaints).", ref:"HBA book: Labor Laws section, Utah at-will employment (and statutory exceptions)"},
  {topic:"Safety", q:"Under OSHA's violation classification system, a 'willful' violation differs from a 'serious' violation primarily in that a willful violation involves:", opts:["A lower penalty than a serious violation, because willful citations are treated as less severe, treating a willful citation as a lighter penalty than a serious citation for the same hazard","Intentional disregard for, or plain indifference to, a known legal requirement or known hazard, and it carries a higher penalty tier than a serious violation","Only paperwork or recordkeeping failures, and not hazards that could cause physical harm, limiting willful citations to paperwork failures and excluding hazards that could cause physical harm","Violations that occurred more than 5 years ago, which is how the willful classification is triggered, so only a violation more than 5 years old would be classified as willful"], correct:1, explain:"Willful violations (intentional disregard/plain indifference) carry OSHA's steepest penalties — meaningfully more severe than serious violations, which involve substantial harm potential without necessarily being intentional.", commonlyMissed:true, ref:"OSHA violation classifications (willful vs serious); 29 U.S.C. 666; HBA book: Safety section"},
  {topic:"Safety", q:"A 'de minimis' OSHA violation is one that:", opts:["Results in the largest possible fine, because even a technical violation is treated as willful","Has no direct or immediate relationship to safety or health, and typically results in no citation and no monetary penalty","Is automatically classified as willful, with the same penalty range as an intentional violation","Applies only to violations discovered during a fatality investigation, and not during a routine inspection"], correct:1, explain:"De minimis violations are technical in nature with no real safety/health impact — OSHA generally doesn't issue a formal citation or penalty for these, unlike serious, willful, or repeat violations.", ref:"OSHA violation classifications (de minimis); 29 U.S.C. 666; HBA book: Safety section"},
  {topic:"Safety", q:"A 'repeat' OSHA violation classification applies when:", opts:["Any violation is found on a second inspection, regardless of whether it is similar to the earlier citation, so a later citation of any kind on a second inspection would be classified as repeat","An employer is cited for a substantially similar violation to one previously cited within a specific look-back period, generally carrying substantially higher penalties than a first-time violation of the same type","The same inspector returns to the site, even if the later condition is a completely different hazard, so a return visit by the same inspector would make even a new, unrelated hazard a repeat violation","A first-time paperwork violation is automatically reclassified as repeat after 30 days, so a first-time paperwork citation would become a repeat violation automatically after 30 days"], correct:1, explain:"Repeat violations specifically require a substantially similar prior citation within OSHA's look-back period — and they carry significantly elevated penalties compared to a first-time citation for the same type of hazard.", ref:"OSHA violation classifications (repeat); 29 U.S.C. 666; HBA book: Safety section"},
  {topic:"Tax Laws", q:"FUTA (Federal Unemployment Tax Act) differs from FICA in that FUTA:", opts:["Is withheld from employee wages in the same way as the employee share of FICA, and is not an employer-only tax, so FUTA would be taken from each paycheck the way the employee share of FICA is withheld","Is generally paid solely by the employer, not withheld from employee wages, and funds unemployment programs, unlike FICA, which is split between employer and employee for Social Security and Medicare","Is paid solely by the employee, and funds Social Security and Medicare rather than unemployment programs, so the worker, not the employer, would pay FUTA, and the tax would fund Social Security and Medicare","Is a one-time license tax paid to the state, and is not a federal employment tax at all, treating FUTA as a state license fee rather than as a federal unemployment-tax obligation"], correct:1, explain:"FUTA is an employer-only tax funding unemployment programs; FICA is the shared employer/employee tax funding Social Security and Medicare — mixing up who actually pays which tax is a common error.", commonlyMissed:true, ref:"IRS FUTA vs FICA (Forms 940 and 941); HBA book: Tax Laws section"},
  {topic:"Tax Laws", q:"A 'pass-through entity' for tax purposes is one where:", opts:["The entity pays its own corporate income tax, and owners are also taxed again on the same earnings as dividends, which is double taxation of C-corporation earnings rather than pass-through treatment of the profit","Business income or loss passes through to the owners' personal tax returns, avoiding a separate entity-level income tax; sole proprietorships, most LLCs, S corporations, and partnerships are common examples","Only government contractors qualify for this status, and other businesses must be taxed as C corporations, so an ordinary private contractor could not be a pass-through entity and would have to be taxed as a C corporation","The business is exempt from all taxation permanently, including employment taxes and sales tax, so a pass-through business would also be free of employment taxes and sales tax on a permanent basis"], correct:1, explain:"Pass-through taxation avoids the 'double taxation' that traditional C-corporations face, since income flows directly to owners' personal returns rather than being taxed at the entity level first.", ref:"IRS pass-through entities; HBA book: Tax Laws section"},
  {topic:"Licensing", q:"Utah 'licensure by endorsement' differs from 'reciprocity' in that endorsement generally:", opts:["Is simply another name for reciprocity, and the two terms describe the same automatic recognition process, so endorsement and reciprocity would both mean automatic recognition of the other state's license","Relies on Utah's own case-by-case evaluation of an out-of-state license holder's qualifications, while true reciprocity would involve a formal state-to-state agreement automatically recognizing each other's licenses","Requires a completely new apprenticeship, regardless of the applicant's prior out-of-state licensure, requiring a new apprenticeship even if the applicant already held a comparable out-of-state license","Applies only to specialty trade licenses, and is not available to general-contractor classifications, so a general-contractor applicant could not use licensure by endorsement and only specialty trades could"], correct:1, explain:"Endorsement means Utah individually evaluates an out-of-state applicant's credentials against its own requirements, which is different from a formal blanket reciprocity agreement between states — Utah's waiver provisions function more like endorsement review than automatic reciprocity.", ref:"HBA book: Licensing section, Utah Code 58-1-302 (licensure by endorsement)"},
  {topic:"Licensing", q:"The 'qualifier of record' on a Utah contractor license is best understood as:", opts:["Any employee who happens to have construction experience, even if that person is not designated with DOPL, so any experienced employee could serve as qualifier without being designated on the DOPL license record","The specific individual whose personal experience and passed exam legally qualify the business entity for licensure, formally designated and on file with DOPL, not just informally recognized within the company","The business's registered agent for legal notices, who need not have construction experience or have passed an exam, treating the registered agent for legal notices as the qualifier even with no exam or construction experience","The person who signs every customer contract, regardless of whether that person is designated with DOPL, so whoever signs customer contracts would be the qualifier even if that person was not designated with DOPL"], correct:1, explain:"The 'of record' distinction matters — DOPL recognizes a specific formally-designated individual, not just whoever happens to be most experienced; changing this designation requires formal notification, not just an internal company decision.", ref:"HBA book: Licensing section, Utah Code 58-55 and R156-55a-501 (qualifier of record / change notice)"},
  {topic:"Financial Management", q:"'Accounts payable' represents:", opts:["Money owed to the business by its customers for billed work that has not yet been collected","Money the business itself owes to its own suppliers, subcontractors, or vendors for goods/services already received but not yet paid for","Cash reserved specifically for payroll, held in a separate account until payday, which is a payroll cash reserve rather than amounts owed to suppliers or subcontractors","The book value of depreciated equipment, reported as a long-term asset on the balance sheet"], correct:1, explain:"Accounts payable is the mirror image of accounts receivable — what the business owes others, rather than what's owed to the business — mixing the two up misreads a company's financial position entirely.", ref:"NASCLA guide: Financial Management, accounts payable"},

  {topic:"Financial Management", q:"On a contractor's financial statements, the balance sheet reports:", opts:["Assets, liabilities, and owners' equity at a specific point in time","Revenues and expenses over a period of time, resulting in net income or loss","Only cash received and cash paid during the year","The scheduled start and finish dates for each job"], correct:0, explain:"The balance sheet is a snapshot of assets, liabilities, and equity as of a given date. Revenues and expenses over a period belong on the income statement, not the balance sheet.", ref:"NASCLA guide: Financial Management, balance sheet"},
  {topic:"Financial Management", q:"A contractor has current assets of $240,000 and current liabilities of $80,000. The current ratio is:", opts:["$160,000 (current assets minus current liabilities, which is working capital, not the current ratio)","0.33 (current liabilities divided by current assets, the inverse of the current ratio)","$320,000 (current assets plus current liabilities, which is not the current ratio)","3.0 (current assets of $240,000 divided by current liabilities of $80,000, which is the current ratio)"], correct:3, explain:"Current ratio = current assets ÷ current liabilities = $240,000 ÷ $80,000 = 3.0. This is a ratio, not a dollar amount — $160,000 would be working capital (current assets minus current liabilities), a related but different measure.", ref:"NASCLA guide: Financial Management, ratios (current ratio)", numeric:true},
  {topic:"Financial Management", q:"A contractor has cash of $40,000, accounts receivable of $80,000, inventory of $50,000, prepaid expenses of $10,000, and current liabilities of $60,000. The quick (acid-test) ratio is:", opts:["3.0 (current assets including inventory and prepaids, divided by current liabilities, which is the current ratio)","0.67 (current liabilities divided by cash plus receivables, the inverse of the quick ratio)","2.0 (cash plus accounts receivable, divided by current liabilities, excluding inventory and prepaids)","2.83 (cash, receivables, and inventory divided by current liabilities, which still includes inventory)"], correct:2, explain:"The quick ratio is (cash + accounts receivable + other quick assets) ÷ current liabilities, and it excludes inventory and prepaid expenses. ($40,000 + $80,000) ÷ $60,000 = 2.0. Including inventory would produce about 2.83, and including all current assets would produce 3.0 — both of which measure liquidity less conservatively than the quick ratio.", ref:"NASCLA guide: Financial Management, ratios (quick / acid-test)", numeric:true},
  {topic:"Financial Management", q:"Under the accrual method of accounting, a contractor who completes a billed progress payment in December but does not collect the cash until January should:", opts:["Record the revenue in January, when the cash is actually received, and not in December","Record the revenue in December, when it is earned, and record an account receivable until the cash is collected","Do not record the amount, because cash has not been received by year-end, leaving the earned December billing off the books entirely","Record it as a reduction of accounts payable, rather than as revenue and a receivable"], correct:1, explain:"Accrual accounting recognizes revenue when it is earned, not when cash is collected, so December work that has been billed is revenue in December with a corresponding receivable. Cash-basis accounting would wait until January; mixing the two methods misstates both the income statement and the balance sheet.", ref:"NASCLA guide: Financial Management, accrual vs cash accounting"},
  {topic:"Financial Management", q:"A lump-sum contract is priced at $400,000. Estimated total cost is $250,000, and costs incurred to date are $100,000. Using the cost-to-cost percentage-of-completion method, gross profit recognized to date is:", opts:["$60,000","$150,000","$100,000","$160,000"], correct:0, explain:"Percent complete = costs to date ÷ estimated total cost = $100,000 ÷ $250,000 = 40%. Total estimated gross profit is $400,000 − $250,000 = $150,000, so profit recognized to date is 40% × $150,000 = $60,000. $160,000 is the revenue recognized to date (40% × $400,000), not the profit.", ref:"NASCLA guide: Financial Management, percentage-of-completion", numeric:true},
  {topic:"Financial Management", q:"Job costing on a construction project is used primarily to:", opts:["Replace the need for a balance sheet, because job reports already show the company's financial position","Record only the company's income-tax liability, allocated to each project in proportion to revenue","Allocate corporate dividends to individual jobs, so owners can see profit distributions by project, assigning owner dividend distributions to individual jobs","Track direct materials, direct labor, and allocated overhead against a specific job so actual cost can be compared to the estimate"], correct:3, explain:"Job costing accumulates the actual costs of a particular project — typically direct materials, direct labor, and a share of overhead — so management can compare them to the estimate, control overruns, and price future work more accurately.", ref:"NASCLA guide: Financial Management, job costing"},
  {topic:"Financial Management", q:"A job has $50,000 in direct costs. The contractor applies overhead at 20% of direct costs, then adds a 10% markup on the resulting total cost (direct costs plus overhead). The bid price should be:", opts:["$55,000","$60,000","$66,000","$72,000"], correct:2, explain:"Overhead = 20% × $50,000 = $10,000, so total cost = $60,000. A 10% markup on that total cost is $6,000, for a bid price of $66,000. $55,000 applies the 10% markup to direct costs and skips overhead; $60,000 includes overhead but no markup; $72,000 incorrectly applies a 20% factor twice.", ref:"NASCLA guide: Financial Management, overhead and markup", numeric:true},
  {topic:"Financial Management", q:"A contractor buys equipment for $85,000, estimates a $10,000 salvage value, and uses straight-line depreciation over a 5-year useful life. Annual depreciation expense is:", opts:["$17,000","$15,000","$85,000","$10,000"], correct:1, explain:"Straight-line depreciation = (cost − salvage value) ÷ useful life = ($85,000 − $10,000) ÷ 5 = $15,000 per year. $17,000 would result from ignoring salvage value ($85,000 ÷ 5).", ref:"NASCLA guide: Financial Management, depreciation", numeric:true},
  {topic:"Financial Management", q:"A contractor's fixed costs are $48,000 and the contribution margin ratio is 20% of sales. The sales volume needed to break even is:", opts:["$240,000, which is $48,000 of fixed costs divided by the 20% contribution-margin ratio","$9,600, which would be $48,000 multiplied by the 20% contribution-margin ratio","$60,000, which would be $48,000 plus a 20% increment, not fixed costs divided by the margin ratio","$48,000, which is the fixed-cost amount alone and is not the break-even sales volume"], correct:0, explain:"Break-even sales = fixed costs ÷ contribution margin ratio = $48,000 ÷ 0.20 = $240,000. At that revenue, contribution margin exactly covers fixed costs and profit is zero. $9,600 is 20% of the fixed costs, which is not the break-even formula.", ref:"NASCLA guide: Financial Management, break-even analysis", numeric:true},
