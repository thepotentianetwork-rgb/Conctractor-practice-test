  {topic:"Licensing", q:"An R100 residential and small commercial contractor may perform commercial construction of no more than:", opts:["Two stories above ground and 10,000 square feet","Three stories above ground and 20,000 square feet","Four stories above ground and 30,000 square feet","Five stories above ground with no square-footage limit"], correct:1, explain:"Utah Code §58-55-102(42) (effective 10/1/2026; repealed 1/1/2027) defines a residential and small commercial contractor as qualified to perform or superintend single-family residences, multifamily residences up to four units, and commercial construction of not more than three stories above ground and not more than 20,000 square feet (with the usual plumbing, electrical, mechanical, and manufactured-housing exceptions). Utah Admin. Code R156-55a-301h ties the R100 scope to that definition. A B100 general building contractor is not limited to those commercial size caps.", ref:"HBA book: Licensing section, Utah Code 58-55-102(42) and R156-55a-301h (R100 commercial limits)"},
  {topic:"Licensing", q:"Failure to notify the Division of a change in qualifier is:", opts:["Only a late-renewal fee issue","Automatically a class A felony","Grounds for immediate suspension of the license","Allowed if the business owners stay the same"], correct:2, explain:"Utah Code §58-55-503(4)(b) (effective 5/1/2024; superseded 1/1/2027) lists failure to notify the division concerning a change in qualifier, or loss of insurance coverage, as grounds for immediate suspension. Utah Admin. Code R156-55a-501(1) (current compiled rule effective 8/7/2026) likewise treats failure to notify the Division of a qualifier change as unprofessional conduct and as grounds for immediate suspension.", ref:"HBA book: Licensing section, Utah Code 58-55-503(4)(b) and R156-55a-501 (qualifier-change notice)"},
  {topic:"Licensing", q:"A contractor must notify the Division of a change in the qualifier's or owners' name, address, phone number, or email within:", opts:["5 days","30 days","90 days","10 days"], correct:3, explain:"Utah Admin. Code R156-55a-501(2) (current compiled rule effective 8/7/2026) makes it unprofessional conduct to fail to notify the Division within 10 days of any change of the name, address, phone number, or email address of the qualifier or owners of a licensee.", ref:"HBA book: Licensing section, R156-55a-501(2) (10-day contact-info notice)"},
  {topic:"Licensing", q:"Performing construction-trades work without a required license is generally:", opts:["A class A misdemeanor","A class C misdemeanor only","A second-degree felony on the first offense","Lawful if the contract is under $50,000"], correct:0, explain:"Utah Code §58-55-501 makes unlicensed practice unlawful. §58-55-503(2)(a) (effective 5/1/2024; superseded 1/1/2027) provides that a person who violates §58-55-501(1) and listed related provisions is guilty of a class A misdemeanor.", ref:"HBA book: Licensing section, Utah Code 58-55-501 and 58-55-503(2)(a) (unlicensed practice)"},
  {topic:"Licensing", q:"For a first qualifying citation under Utah Code §58-55-503, the director generally may assess a fine of up to:", opts:["$250","$500","$1,000","$10,000"], correct:2, explain:"Utah Code §58-55-503(5)(h)(i) (effective 5/1/2024; superseded 1/1/2027) sets the general citation fine at up to $1,000 for a first offense, up to $2,000 for a second offense, and up to $2,000 for each day of a subsequent continued offense. Certain listed subsections carry higher $2,000 / $4,000 / $4,000-per-day amounts.", ref:"HBA book: Licensing section, Utah Code 58-55-503(5)(h) (citation fines)"},
  {topic:"Licensing", q:"If a person bids construction work that requires a license and is unlicensed, the bid:", opts:["May be awarded if it is the low bid","May not be awarded, and the person may not accept the contract","Becomes valid after a 10-day cure period","Is valid if a license is obtained before final payment"], correct:1, explain:"Utah Code §58-55-501(8) makes bidding without a required license unlawful. §58-55-503(2)(b) (effective 5/1/2024; superseded 1/1/2027) provides that a person who violates §58-55-501(8) may not be awarded and may not accept a contract for the performance of the work.", ref:"HBA book: Licensing section, Utah Code 58-55-501(8) and 58-55-503(2)(b) (unlicensed bidding)"},
  {topic:"Licensing", q:"When performing construction-trades work, failing to timely provide, upon request, a copy of a current license or the license number is:", opts:["Unprofessional conduct","Required only on company vehicles","Optional if the job is under $7,000","Required only on public projects"], correct:0, explain:"Utah Admin. Code R156-55a-501(9) (current compiled rule effective 8/7/2026) defines as unprofessional conduct failing to timely provide, upon request by any person, a copy of a current license or license number when performing construction trades work. Vehicle license-number display in Utah Code §58-55-501(25) applies to sign installation / nonelectrical outdoor advertising sign contractors, not to all general contractors.", ref:"HBA book: Licensing section, R156-55a-501(9) (provide license or license number on request)"},
  {topic:"Licensing", q:"During each two-year renewal cycle, a contractor licensee generally must complete:", opts:["3 hours of continuing education","12 hours, all of which may be online","24 hours, with no core-hour requirement","6 hours of continuing education, including at least 3 core hours and 3 live in-class hours"], correct:3, explain:"Utah Admin. Code R156-55a-303b (current compiled rule effective 8/7/2026), under Utah Code §58-55-302.5, requires six hours of continuing education during each two-year license term. At least three hours must be core education, and at least three hours must be live in-class attendance; the remaining hours may be professional or core, and may be distance learning. Contractors with a renewal cycle ending after January 1, 2020, must also include at least one hour of energy conservation within those six hours.", ref:"HBA book: Licensing section, Utah Code 58-55-302.5 and R156-55a-303b (continuing education)"},

// taken directly from Fernando's actual Prov score report "# Possible" column.

ALL_TOPICS.forEach(t => { EXAM_BLUEPRINT[t] = LAST_SCORE[t].total; });

const SEEN_KEY = "ut_b100_seen_ids_v1";

function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
function renderRefHint(q, toggleable){
  if(!q || !q.ref) return "";
  if(toggleable && !state.showRefs){
    return `<div class="ref-line ref-hidden"><button type="button" class="ref-toggle" onclick="setShowRefs(true)">Show where to look</button></div>`;
  }
  const hideBtn = toggleable
    ? `<button type="button" class="ref-toggle" onclick="setShowRefs(false)">Hide</button>`
    : "";
  return `<div class="ref-line"><span class="ref-label">Where to look:</span>${escapeHtml(q.ref)}${hideBtn}</div>`;
}

// ---------- localStorage-based history (works on any deployed site) ----------
function loadHistory(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    attemptHistory = raw ? JSON.parse(raw) : [];
  } catch(e){
    attemptHistory = [];
  }
}
function saveAttempt(record){
  attemptHistory.unshift(record);
  if(attemptHistory.length > 40) attemptHistory = attemptHistory.slice(0,40);
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(attemptHistory)); } catch(e){ console.error(e); }
}
function getSeenIds(){
  try{
    const raw = localStorage.getItem(SEEN_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}
function markSeen(ids){
  try{
    let seen = getSeenIds();
    seen = seen.concat(ids);
    if(seen.length > 200) seen = seen.slice(seen.length-200);
    localStorage.setItem(SEEN_KEY, JSON.stringify(seen));
  } catch(e){}
}

// assign a stable id to each question (topic + question text)
QUESTIONS.forEach(q => { q._id = q.topic + "::" + q.q; });

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Build a fresh random set: prefer unseen questions first, shuffle answer order too
// countSpec: either a flat number (same count per topic) or an object {topicName: count}
function buildRandomSet(topics, countSpec){
  const seen = getSeenIds();
  let picked = [];
  topics.forEach(topic => {
    const wantCount = (typeof countSpec === 'object') ? (countSpec[topic] || 0) : countSpec;
    if(wantCount <= 0) return;
    let pool = QUESTIONS.filter(q => q.topic === topic);
    let unseen = pool.filter(q => !seen.includes(q._id));
    let usePool = unseen.length > 0 ? unseen : pool; // reset once exhausted
    usePool = shuffle(usePool);
    const n = Math.min(wantCount, usePool.length);
    picked = picked.concat(usePool.slice(0,n));
  });
  picked = shuffle(picked);
  // shuffle each question's option order independently
  const finalSet = picked.map(q => {
    const order = shuffle([0,1,2,3]);
    const newOpts = order.map(i => q.opts[i]);
    const newCorrect = order.indexOf(q.correct);
    return {topic:q.topic, q:q.q, opts:newOpts, correct:newCorrect, explain:q.explain, ref:q.ref, _id:q._id};
  });
  markSeen(finalSet.map(q => q._id));
  return finalSet;
}

function buildActiveSet(mode){
  if(mode === "sim"){
    activeQuestions = buildRandomSet(ALL_TOPICS, EXAM_BLUEPRINT);
    return;
  }
  if(mode === "missed"){
    activeQuestions = buildCommonlyMissedSet();
    return;
  }
  const topics = mode === "weak" ? WEAK_TOPICS : ALL_TOPICS;
  const perTopic = mode === "weak" ? 6 : 4;
  activeQuestions = buildRandomSet(topics, perTopic);
}

// Pulls only from questions tagged commonlyMissed:true — the specific clusters
// research + Fernando's own missed questions point to: lien deadline mechanics,
// margin/markup business math, business org liability edge cases, payroll/tax
// specifics, and contract clause conflicts. Not grouped by topic, since the whole
// point is these span multiple topics.
function buildCommonlyMissedSet(){
  const seen = getSeenIds();
  let pool = QUESTIONS.filter(q => q.commonlyMissed);
  let unseen = pool.filter(q => !seen.includes(q._id));
  let usePool = unseen.length > 0 ? unseen : pool;
  usePool = shuffle(usePool);
  const finalSet = usePool.map(q => {
    const order = shuffle([0,1,2,3]);
    const newOpts = order.map(i => q.opts[i]);
    const newCorrect = order.indexOf(q.correct);
    return {topic:q.topic, q:q.q, opts:newOpts, correct:newCorrect, explain:q.explain, ref:q.ref, _id:q._id};
  });
  markSeen(finalSet.map(q => q._id));
  return finalSet;
}

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'intro') app.innerHTML = renderIntro();
  else if(state.screen === 'quiz') app.innerHTML = renderQuiz();
  else app.innerHTML = renderResults();
}

  return `
    <header class="top">
      <div class="eyebrow">Retake Prep — Built From Your Actual Score Report</div>
      <h1>B100 Business &amp; Law<br>Practice Exam</h1>

        state.mode==='sim' ? `Matches the real test exactly: ${EXAM_TOTAL_QUESTIONS} questions sized per-topic just like your actual score report (10 Licensing, 6 Contract Mgmt, 4 Business Org, etc.), with a live 120-minute countdown.` :

function setMode(m){
  state.mode = m;
  render();
}

let timerInterval = null;

function startQuiz(){
  buildActiveSet(state.mode);
  state.source = "bank";
  state.screen = "quiz";
  state.idx = 0;
  state.answers = new Array(activeQuestions.length).fill(null);
  state.timeUp = false;
  if(state.mode === "sim"){
    state.deadline = Date.now() + EXAM_TIME_LIMIT_SECONDS * 1000;
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(tickTimer, 1000);
  } else {
    state.deadline = null;
    if(timerInterval) clearInterval(timerInterval);
  }
  render();
}

function tickTimer(){
  if(state.screen !== 'quiz' || !state.deadline) return;
  const remaining = state.deadline - Date.now();
  if(remaining <= 0){
    clearInterval(timerInterval);
    state.timeUp = true;
    finishAttempt();
    state.screen = "results";
    render();
    return;
  }
  // only re-render the timer chip to avoid disrupting the current question view
  const el = document.getElementById('exam-timer');
  if(el) el.textContent = formatTime(remaining);
}

function formatTime(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(totalSec/60);
  const s = totalSec % 60;
  return m + ":" + (s < 10 ? "0"+s : s);
}

function renderQuiz(){
  const q = activeQuestions[state.idx];
  const answered = state.answers[state.idx] !== null;
  const pct = Math.round((state.idx/activeQuestions.length)*100);
  const weak = isWeak(q.topic);

  let opts = q.opts.map((opt, i) => {
    let cls = "opt";
    let disabledAttr = answered ? "disabled" : "";
    if(answered){
      if(i === q.correct) cls += " correct";
      else if(i === state.answers[state.idx] && i !== q.correct) cls += " incorrect";
    }
    return `<button class="${cls}" ${disabledAttr} onclick="selectAnswer(${i})">
      <span class="letter">${String.fromCharCode(65+i)}</span><span>${opt}</span>
    </button>`;
  }).join('');

  let explainBlock = answered ? `<div class="explain"><b>${state.answers[state.idx] === q.correct ? "Correct." : "Not quite."}</b> ${q.explain}</div>` : '';

  let navButtons = `<div class="nav-row">`;
  if(answered){
    navButtons += `<button class="primary" onclick="nextQuestion()">${state.idx === activeQuestions.length-1 ? "See Results →" : "Next Question →"}</button>`;
  }
  navButtons += `</div>`;

  return `
    <div class="progress-row">
      <span>QUESTION ${state.idx+1} / ${activeQuestions.length}</span>
      ${state.mode === 'sim' && state.deadline ? `<span id="exam-timer" style="color:var(--amber);font-weight:600;">${formatTime(state.deadline - Date.now())}</span>` : `<span>${pct}% THROUGH</span>`}
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <span class="topic-tag ${weak?'weak':''}">${q.topic}${weak?' · weak spot':''}</span>
    <div class="question-card">
      <p class="q-text">${q.q}</p>
      ${renderRefHint(q, true)}
      ${opts}
      ${explainBlock}
    </div>
    ${navButtons}
  `;
}

function selectAnswer(i){
  if(state.answers[state.idx] !== null) return;
  state.answers[state.idx] = i;
  render();
}

function nextQuestion(){
  if(state.idx === activeQuestions.length-1){
    if(timerInterval) clearInterval(timerInterval);
    finishAttempt();
    state.screen = "results";
  } else {
    state.idx += 1;
  }
  render();
}

function finishAttempt(){
  let correctCount = 0;
  let topicStats = {};
  activeQuestions.forEach((q,i) => {
    if(!topicStats[q.topic]) topicStats[q.topic] = {correct:0,total:0};
    topicStats[q.topic].total += 1;
    if(state.answers[i] === q.correct){
      correctCount += 1;
      topicStats[q.topic].correct += 1;
    }
  });
  const scorePct = Math.round((correctCount/activeQuestions.length)*100);
  saveAttempt({
    date: new Date().toISOString(),
    mode: state.mode,
    scorePct: scorePct,
    correct: correctCount,
    total: activeQuestions.length,
    topics: topicStats
  });
}

function renderResults(){
  let correctCount = 0;
  let topicStats = {};
  activeQuestions.forEach((q,i) => {
    if(!topicStats[q.topic]) topicStats[q.topic] = {correct:0,total:0};
    topicStats[q.topic].total += 1;
    if(state.answers[i] === q.correct){
      correctCount += 1;
      topicStats[q.topic].correct += 1;
    }
  });
  const scorePct = Math.round((correctCount/activeQuestions.length)*100);
  const passed = scorePct >= 70;

  let topicRows = Object.keys(topicStats).map(name => {
    let s = topicStats[name];
    let weak = isWeak(name);
    return `<div class="topic-result-row ${weak?'weak':''}"><span>${name}</span><span class="topic-score">${s.correct}/${s.total}</span></div>`;
  }).join('');

  const modeLabel = state.mode === 'weak' ? 'Weak-Area Drill' : state.mode === 'sim' ? 'Full Simulated Exam' : state.mode === 'missed' ? 'Commonly Missed Drill' : 'Full Exam';
  let timeUpNotice = state.timeUp ? `<div class="error-box">Time's up — this matches what happens on the real exam if the 120-minute clock runs out. Unanswered questions were scored as incorrect.</div>` : '';

  return `
    <header class="top">
      <div class="eyebrow">Results — ${modeLabel}</div>
      <h1>Practice Complete</h1>
    </header>
    ${timeUpNotice}
    <div class="panel">
      <div class="score-hero">
        <div class="score-num ${passed ? 'pass':'fail'}">${scorePct}%</div>
        <div class="score-label">${correctCount} of ${activeQuestions.length} correct — ${passed ? 'passing (70% needed)' : 'below 70% passing mark'}</div>
      </div>
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:8px;">By topic</div>
      ${topicRows}
    </div>
    <button class="ghost" onclick="reviewMissed()">Review Missed Questions</button>
    <button class="secondary" onclick="startQuiz()">Shuffle Another New Set (same scope) →</button>
    <button class="primary" onclick="backToIntro()">Back to Start</button>
    <footer>Study aid only — verify current rules with DOPL / your Prov candidate handbook.</footer>
  `;
}

function backToIntro(){
  if(timerInterval) clearInterval(timerInterval);
  state.screen = "intro";
  render();
}

function reviewMissed(){
  const app = document.getElementById('app');
  let missed = activeQuestions.map((q,i) => ({q,i})).filter(item => state.answers[item.i] !== item.q.correct);
  let html = `
    <header class="top">
      <div class="eyebrow">Review</div>
      <h1>Missed Questions</h1>
      <div class="sub">${missed.length === 0 ? "You didn't miss any — nice work." : missed.length + " question(s) to revisit."}</div>
    </header>
  `;
  missed.forEach(item => {
    let q = item.q;
    let yourAns = state.answers[item.i];
    let weak = isWeak(q.topic);
    html += `
      <div class="question-card" style="margin-bottom:14px;">
        <span class="topic-tag ${weak?'weak':''}">${q.topic}</span>
        <p class="q-text">${q.q}</p>
        ${renderRefHint(q, false)}
        ${q.opts.map((opt,i) => {
          let cls = "opt";
          if(i === q.correct) cls += " correct";
          else if(i === yourAns) cls += " incorrect";
          return `<div class="${cls}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${opt}</span></div>`;
        }).join('')}
        <div class="explain"><b>Why:</b> ${q.explain}</div>
      </div>
    `;
  });
  html += `<button class="primary" onclick="backToIntro()">Back to Start</button>`;
  app.innerHTML = html;
}

loadHistory();
state.showRefs = loadShowRefs();
render();
</script>
</body>
</html>
