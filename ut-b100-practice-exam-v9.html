  {topic:"Licensing", q:"A qualifying construction management degree can credit up to one year toward the B100 experience requirement's supervisory/managerial portion. This means the degree:", opts:["Eliminates the entire 2-year experience requirement outright","Can substitute for the supervisory-year portion specifically, but doesn't by itself establish that the applicant has met the full requirement — actual field experience details still need to be confirmed with DOPL for the specific applicant's situation", "Only counts if paired with 4,000 hours of unrelated retail experience","Has no bearing on licensure experience at all"], correct:1, explain:"The degree credit applies specifically to the supervisory/managerial portion of the requirement. Because how it interacts with total-hours requirements can vary by applicant specifics, this is exactly the kind of edge case worth confirming directly with DOPL rather than assuming — a good real-world habit, not just an exam answer."},

  // LIEN LAWS (7) — weak
  {topic:"Lien Laws", q:"What is a mechanics lien filed by a contractor or supplier meant to secure?", opts:["A tax refund","Payment for labor or materials furnished to improve real property","A building permit extension","Priority parking on site"], correct:1, explain:"A mechanics lien is a legal claim against real property to secure payment for labor, services, or materials that improved that property."},
  {topic:"Lien Laws", q:"Why is prompt attention to preliminary notice and lien filing deadlines important for a contractor?", opts:["They have no real deadlines","Missing statutory deadlines can forfeit lien rights to secure payment","They only apply to commercial projects","They are optional paperwork"], correct:1, explain:"Lien rights are strictly time-bound by statute; missing a preliminary notice or filing deadline can permanently waive the right to lien the property."},
  {topic:"Lien Laws", q:"A subcontractor who was never paid by the general contractor may still have lien rights against:", opts:["The general contractor's personal vehicle only","The improved real property itself, even though their contract was with the GC, not the owner","Nothing — only the GC can file a lien","The subcontractor's own equipment"], correct:1, explain:"Mechanics lien laws generally allow subcontractors and suppliers to lien the property they improved, even without a direct contract with the owner, provided notice/filing rules are followed."},
  {topic:"Lien Laws", q:"What is a lien release (or lien waiver) typically used for?", opts:["To cancel a contract entirely","To document that a contractor/supplier has been paid and waives lien rights for that amount","To extend the filing deadline indefinitely","To transfer the lien to a different property"], correct:1, explain:"Lien waivers/releases confirm payment was received and that the party is giving up lien rights corresponding to that payment."},
  {topic:"Lien Laws", q:"Filing a preliminary notice early in a project generally serves to:", opts:["Guarantee the contractor will be paid regardless of performance","Preserve the contractor's/supplier's right to later file a lien if unpaid","Replace the need for a written contract","Notify the IRS of the project"], correct:1, explain:"A preliminary notice is often a required first step to preserve lien rights down the road — without it, the ability to lien may be lost."},
  {topic:"Lien Laws", q:"A homeowner who has already paid the general contractor in full, but the GC never paid a sub, may still face:", opts:["No further exposure whatsoever","A potential lien claim from the unpaid subcontractor against the property", "A refund from the state","Automatic dismissal of any lien filed"], correct:1, explain:"This 'double payment' risk is exactly why lien releases and preliminary notices matter — the owner can face a lien even after paying the GC."},
  {topic:"Lien Laws", q:"A conditional lien waiver differs from an unconditional lien waiver in that it:", opts:["Never takes effect at all","Only takes effect once the referenced payment actually clears","Applies retroactively to all past payments automatically","Is illegal in Utah"], correct:1, explain:"A conditional waiver is effective only once the payment it references actually clears, protecting the payee if a check later bounces."},
  {topic:"Lien Laws", q:"A supplier delivers materials to a project but the GC never engaged them directly — a sub-subcontractor did. The supplier's lien rights generally depend most on:", opts:["Whether the supplier is a large or small company","Whether they properly and timely served any required preliminary notice, since they're further removed from the owner in the contract chain","Whether the GC personally approved the delivery in writing","Nothing — suppliers never have lien rights"], correct:1, explain:"Parties further down the contract chain (suppliers to sub-subcontractors) generally face stricter notice requirements to preserve lien rights, since the owner may be unaware they're even involved."},
  {topic:"Lien Laws", q:"A lien claimant files a valid mechanics lien but then fails to file a lawsuit to foreclose the lien within the statutory period after filing. The likely result is:", opts:["The lien remains valid and enforceable forever","The lien can expire or become unenforceable, since foreclosure deadlines are also strictly time-bound","The lien automatically converts to a judgment","Nothing changes — no deadline applies after filing"], correct:1, explain:"Beyond the initial filing deadline, statutes also set a window to actually foreclose (enforce) the lien in court — missing that deadline too can render the lien unenforceable."},
  {topic:"Lien Laws", q:"An owner receives an unconditional final lien waiver from the GC before making the final payment, then later fails to actually pay. What does this create for the owner?", opts:["No risk at all — the waiver protects the owner regardless of payment","Real risk, since an unconditional waiver given before payment actually clears can be used against the claimant even if payment is never made", "A guarantee the GC will refund the waiver","Automatic forfeiture of the GC's license"], correct:1, explain:"Unconditional waivers are effective immediately upon signing regardless of whether payment later clears — which is exactly why using conditional waivers tied to actual payment is safer practice."},
  {topic:"Lien Laws", q:"Lien priority (who gets paid first if a property is sold to satisfy multiple liens) is often determined primarily by:", opts:["Whichever lienholder is a licensed contractor","Statutory rules, which can consider factors like the date work began or when notice/lien was recorded, varying by jurisdiction","Whoever files last always wins","The size of the lien amount alone"], correct:1, explain:"Lien priority rules are jurisdiction-specific but often hinge on timing factors like when work commenced or when notices/liens were recorded, not simply lien size or filing order alone."},
  {topic:"Lien Laws", q:"A property owner wants assurance that no hidden unpaid subs or suppliers could later lien their newly completed home. The best practice to request from the GC before final payment is:", opts:["A verbal assurance that everyone was paid","A full set of conditional (or unconditional, post-payment) lien waivers and releases from the GC and all subs/suppliers who provided notice","Nothing — liens can't attach to a completed home","A copy of the GC's business license only"], correct:1, explain:"Collecting waivers/releases from the GC and all notice-serving subs/suppliers is the standard way to confirm the chain of payment before final release of funds."},
  {topic:"Lien Laws", q:"A contractor's preliminary notice was served, but it listed an incorrect legal description of the property. This kind of defect could:", opts:["Never matter since preliminary notices are purely optional paperwork","Potentially invalidate the notice and jeopardize lien rights, since accuracy in required notice content is often strictly enforced","Only matter if the amount owed exceeds $50,000","Automatically be corrected by the county recorder for free"], correct:1, explain:"Because lien rights are statutorily strict, errors in required notice content (like the legal property description) can undermine the notice's validity and the lien rights it was meant to preserve."},

  {topic:"Lien Laws", q:"A subcontractor's preliminary notice deadline is generally measured from the date they FIRST furnished labor/materials, while their lien FILING deadline is generally measured from the date they LAST furnished labor/materials. If a sub worked on a project from March 1 to March 30, this means:", opts:["Both deadlines are measured from the same date, March 1", "Both deadlines are measured from the same date, March 30", "The preliminary notice deadline clock started around March 1 (first furnishing), while the lien filing deadline clock starts from March 30 (last furnishing) — two different trigger dates for two different deadlines", "Neither deadline applies since the work was completed within the same month"], correct:2, explain:"Preliminary notice and lien filing deadlines are commonly triggered by different events — first furnishing versus last furnishing — and conflating the two trigger dates is a frequent, costly lien-law mistake."},
  {topic:"Lien Laws", q:"A GC receives an invoice from a sub for $50,000 but only pays $35,000 due to a good-faith dispute over back-charges. The sub is considering whether to file a lien for the unpaid $15,000. Filing a lien in this situation:", opts:["Is never allowed if any payment at all was made","Can generally still be pursued for the legitimately unpaid balance, since a partial payment doesn't automatically waive lien rights for the remaining unpaid amount — though the back-charge dispute itself may still need separate resolution", "Automatically resolves the underlying back-charge dispute in the sub's favor","Voids the sub's original contract with the GC"], correct:1, explain:"Partial payment doesn't waive lien rights to the legitimately unpaid remainder; the lien remedy and the underlying billing dispute are related but distinct issues that may both need addressing."},

  // PROJECT MANAGEMENT (7)
  {topic:"Project Management", q:"A critical path in a project schedule refers to:", opts:["The most expensive line item in the budget","The sequence of tasks that determines the shortest possible project duration","A backup plan if the main plan fails","The last task performed before closeout"], correct:1, explain:"The critical path is the longest chain of dependent tasks; delays on it directly delay the whole project."},
  {topic:"Project Management", q:"A punch list is used to:", opts:["Track daily labor hours","Document remaining minor items to complete before final acceptance","Record change order pricing","List potential subcontractors to hire"], correct:1, explain:"A punch list itemizes outstanding minor deficiencies or tasks that must be finished before the owner accepts the project as complete."},
  {topic:"Project Management", q:"Float (or slack) in scheduling refers to:", opts:["The amount of time a task can be delayed without affecting the project finish date","A type of concrete finishing tool","Extra materials ordered as a buffer","The contractor's profit margin"], correct:0, explain:"Float is the schedule flexibility a non-critical-path task has before it starts impacting the overall completion date."},
  {topic:"Project Management", q:"Why is a pre-construction meeting with subcontractors valuable?", opts:["It's legally required before any permit is issued","It aligns expectations on schedule, safety, and scope before work starts","It replaces the need for a written contract","It's only useful for large commercial jobs"], correct:1, explain:"Pre-construction meetings align the team on schedule, site logistics, safety, and scope before work begins, reducing costly misunderstandings."},
  {topic:"Project Management", q:"Which of these is the best way to manage subcontractor quality on a job site?", opts:["Trust verbal assurances only, no inspections","Set clear scope, schedule milestones, and conduct regular inspections","Only inspect after the final walkthrough","Avoid contact until the invoice is due"], correct:1, explain:"Ongoing inspection against clearly defined scope and milestones is standard practice for quality control on subcontracted work."},
  {topic:"Project Management", q:"A Gantt chart is commonly used on a construction project to:", opts:["Track payroll deductions","Visually display tasks against a timeline, showing sequence, duration, and overlap","Record material defects","Calculate sales tax owed"], correct:1, explain:"Gantt charts display project tasks as bars along a timeline, making sequencing, duration, and overlaps easy to visualize."},
  {topic:"Project Management", q:"Submittals (such as shop drawings or material samples) are used on a project to:", opts:["Replace the need for a contract","Get owner/architect approval on specific materials or methods before they're installed","Calculate the final invoice","Register the contractor's license"], correct:1, explain:"Submittals let the owner or design team review and approve specific products or methods before installation, catching issues early."},
  {topic:"Project Management", q:"A task on the critical path slips by 3 days with no mitigation. What is the most likely direct effect on the overall project?", opts:["No effect, since only non-critical tasks matter","The overall project completion date is also likely delayed by approximately 3 days, since critical path tasks have zero float", "The project will automatically finish early to compensate","Only the budget is affected, never the schedule"], correct:1, explain:"By definition, critical path tasks have no float — any delay on them pushes back the entire project's finish date by roughly the same amount, absent schedule compression efforts."},
  {topic:"Project Management", q:"A subcontractor consistently finishes their scope late but always within their own individual float (they're not on the critical path). What's the biggest risk of ignoring this pattern?", opts:["There is no risk since float absorbs the delay","Repeated float consumption can eventually erode all remaining float, turning that path critical and threatening the overall schedule","It always improves the project's final schedule","It has no bearing on other trades' work"], correct:1, explain:"Float isn't unlimited — chronically consuming it can convert a previously non-critical path into a new critical path, putting the overall completion date at risk."},
  {topic:"Project Management", q:"Fast-tracking a schedule (starting some phases before prior phases fully finish) primarily trades:", opts:["Nothing — it has no tradeoffs","Faster completion for increased coordination complexity and rework risk if upstream work changes","Cost for quality with no schedule impact","Safety for speed by definition"], correct:1, explain:"Fast-tracking overlaps sequential phases to compress schedule, but increases coordination risk and potential rework if earlier-phase decisions change after later work has begun."},
  {topic:"Project Management", q:"A project is tracking behind schedule mid-project. 'Crashing' the schedule to catch up typically means:", opts:["Simply extending the deadline instead","Adding resources (labor, shifts, equipment) to critical path tasks to shorten their duration, usually at increased cost","Removing scope from the contract unilaterally","Waiting and hoping the schedule self-corrects"], correct:1, explain:"Crashing means compressing critical path task durations by adding resources, typically increasing direct costs to regain lost schedule time."},
  {topic:"Project Management", q:"During a pre-construction meeting, the GC and key subs disagree on the sequencing of two interdependent trades. The best resolution approach is to:", opts:["Ignore the disagreement and address it if it becomes a problem later","Resolve and document the agreed sequencing before work begins, since ambiguity here often causes costly field conflicts later","Let each trade proceed on their own separate schedule with no coordination","Cancel the project"], correct:1, explain:"Resolving sequencing conflicts before work starts, and documenting the agreement, prevents costly on-site conflicts and rework once trades are actively working."},
  {topic:"Project Management", q:"A project manager notices the punch list keeps growing even as major systems are being finished. This pattern most likely indicates:", opts:["The project is ahead of schedule","Quality control issues occurring during construction rather than being caught and addressed in real time","The owner is being overly picky with no real basis","Nothing of concern — punch lists always grow late in projects"], correct:1, explain:"A rapidly growing punch list late in construction often signals that quality issues weren't caught and corrected during the work itself, requiring more end-of-project cleanup."},

  {topic:"Project Management", q:"On a project schedule, Path A takes 20 days and is the critical path; Path B takes 15 days. What is the float available on Path B?", opts:["0 days","5 days","15 days","20 days"], correct:1, explain:"Float on a non-critical path equals the critical path duration minus that path's own duration: 20 − 15 = 5 days of float available on Path B before it would also become critical."},
  {topic:"Project Management", q:"A project's critical path is 20 days. Path B, originally 15 days (5 days of float), experiences a 3-day delay due to a late material delivery. What is Path B's remaining float, and does the overall project finish date change?", opts:["Float is now 2 days remaining; project finish date is unaffected since Path B still has float left and hasn't become critical", "Float is now 8 days; the project finishes 3 days early", "The project is automatically delayed 3 days regardless of float", "Float doesn't change; only critical path delays ever matter"], correct:0, explain:"Path B had 5 days of float; a 3-day delay consumes 3 of those days, leaving 2 days of float remaining (5 − 3 = 2) — since Path B (18 days) is still under the 20-day critical path, the overall project finish date is unaffected, though the safety margin has shrunk."},

  // RISK MANAGEMENT (7)
  {topic:"Risk Management", q:"A performance bond primarily protects the project owner by guaranteeing:", opts:["The contractor will finish the project according to contract terms, or the surety will step in","The lowest possible price on the job","Free warranty work for 10 years","The subcontractors' personal income taxes"], correct:0, explain:"A performance bond ensures the surety completes or pays for completion of the contracted work if the contractor defaults."},
  {topic:"Risk Management", q:"A payment bond is intended to protect:", opts:["The general contractor's profit margin","Subcontractors and suppliers by guaranteeing they'll be paid for labor/materials","The homeowner's mortgage lender","The building inspector's fees"], correct:1, explain:"Payment bonds guarantee subcontractors and material suppliers get paid even if the prime contractor fails to pay them directly."},
  {topic:"Risk Management", q:"Builder's risk insurance is designed to cover:", opts:["A contractor's personal health expenses","Damage to a structure under construction from covered perils like fire or storm","A subcontractor's vehicle","The owner's future property taxes"], correct:1, explain:"Builder's risk insurance covers a building under construction against damage from covered causes of loss during the build."},
  {topic:"Risk Management", q:"A 'waiver of subrogation' in a contract or insurance policy generally means:", opts:["The insurer gives up its right to sue a third party (like another contracting party) to recover a claim it paid","The contractor waives all insurance coverage","The owner waives the right to file any claim","Nothing — it has no real legal effect"], correct:0, explain:"A waiver of subrogation stops an insurer from pursuing a party (often another contractor on the same job) to recoup what it paid on a claim, per the contract terms."},
  {topic:"Risk Management", q:"Requiring a subcontractor to carry their own general liability insurance and name the GC as an additional insured is a way to:", opts:["Increase the GC's own premiums unnecessarily","Transfer and share risk exposure with the party actually performing the work","Avoid needing a written subcontract","Guarantee the subcontractor never gets sued"], correct:1, explain:"This is a standard risk-transfer technique — pushing coverage responsibility to the party doing the work, with the GC protected as an additional insured."},
  {topic:"Risk Management", q:"A certificate of insurance (COI) is a document that:", opts:["Guarantees full policy coverage details and cannot be altered","Provides proof of active insurance coverage, summarizing policy type, limits, and dates","Replaces the need for an actual insurance policy","Is only used for health insurance"], correct:1, explain:"A COI is a summary proof-of-coverage document, commonly requested before allowing a sub or vendor onto a job."},
  {topic:"Risk Management", q:"An arbitration clause in a contract is a risk management tool because it:", opts:["Guarantees the contractor wins any dispute","Provides a defined, often faster/cheaper alternative to court litigation for resolving disputes","Eliminates the possibility of any dispute occurring","Voids the contract if a dispute ever arises"], correct:1, explain:"Arbitration clauses set an agreed-upon dispute resolution process, often faster and more predictable than litigation."},
  {topic:"Risk Management", q:"A GC carries a $1M general liability policy but a jury awards $1.5M against them on a covered claim. What generally happens to the excess $500,000?", opts:["The insurer must pay it regardless of policy limits","It's typically the GC's own exposure beyond the policy limit, unless additional coverage like an umbrella policy applies","The claimant simply forfeits the excess amount","The bonding company automatically covers it instead"], correct:1, explain:"Standard liability policies cap payouts at the stated limit; amounts above that limit are the insured's own exposure unless excess/umbrella coverage is in place."},
  {topic:"Risk Management", q:"A contractor's general liability policy typically does NOT cover:", opts:["Third-party bodily injury on the jobsite","The contractor's own faulty workmanship being repaired/replaced (in most standard policies)","Third-party property damage caused by the contractor's operations","Legal defense costs for a covered claim"], correct:1, explain:"Standard GL policies are generally designed around third-party injury/property damage, not as a warranty covering the cost to simply redo the contractor's own defective work."},
  {topic:"Risk Management", q:"An 'occurrence' policy versus a 'claims-made' policy differ primarily in that occurrence policies:", opts:["Never actually pay out any claims","Cover incidents that happened during the policy period, regardless of when the claim is later filed","Only cover claims filed the same day as the policy starts","Are illegal for contractors to purchase"], correct:1, explain:"Occurrence policies respond to incidents that happened during the active policy period even if the claim surfaces years later, unlike claims-made policies tied to when the claim is filed."},
  {topic:"Risk Management", q:"A subcontractor's insurance lapses mid-project without the GC's knowledge, and an injury occurs during the lapse. The GC's own risk exposure in this scenario is:", opts:["Zero, since it was the sub's insurance that lapsed","Potentially increased, since the GC may be pulled into claims/liability if the sub's coverage can't respond — a reason GCs track sub insurance status ongoing","Automatically transferred entirely to the injured worker","Eliminated by the original certificate of insurance forever, regardless of later lapses"], correct:1, explain:"A COI is only a snapshot at issuance — ongoing verification matters, since a lapsed sub policy can leave the GC more exposed if a claim arises during the gap."},
  {topic:"Risk Management", q:"Why might a project owner require a payment bond even when hiring a well-established, financially strong general contractor?", opts:["Payment bonds are never actually necessary for strong contractors","Even strong GCs can have subs/suppliers go unpaid due to disputes or cash flow issues, and the bond protects against resulting liens/claims", "It's purely a formality with no practical protective value","Only weak contractors are legally required to provide them"], correct:1, explain:"Payment bonds protect against nonpayment down the contract chain regardless of the GC's overall financial strength — disputes or cash flow hiccups can still leave subs unpaid."},
  {topic:"Risk Management", q:"A contractor is deciding whether to self-insure (retain) a risk versus transfer it via insurance or contract clauses. Self-insuring is generally most appropriate for risks that are:", opts:["Catastrophic and unpredictable, like major fire or collapse","Low-severity and relatively predictable/frequent, where the cost of insuring exceeds the expected loss","Always required to be insured by law regardless of size","Impossible to estimate at all"], correct:1, explain:"Self-insuring (retaining) risk fits low-severity, predictable exposures where insurance premiums would exceed expected losses; high-severity, unpredictable risks are better transferred via insurance."},

  {topic:"Risk Management", q:"A GC is added as an 'additional insured' on a subcontractor's general liability policy, with a 'primary and non-contributory' endorsement. In the event of a covered claim involving both parties, this endorsement means:", opts:["The GC's own insurance must pay first, before the sub's policy responds at all","The sub's policy must respond first and primarily, without seeking contribution from the GC's own separate policy — protecting the GC's own loss history/premiums", "Only the sub's policy can ever be used, and the GC's own policy is cancelled","The endorsement has no practical effect beyond naming the GC"], correct:1, explain:"A primary and non-contributory endorsement ensures the sub's policy responds first for a covered claim without pulling in the GC's own policy for contribution — protecting the GC's separate coverage and loss experience, a meaningful distinction from simply being 'named' as additional insured."},
  {topic:"Risk Management", q:"A GC is listed only as a 'certificate holder' on a sub's insurance policy, rather than as an 'additional insured.' The practical difference is that a certificate holder:", opts:["Has identical coverage rights to an additional insured","Generally just receives notice/proof that a policy exists, but is NOT actually covered under that policy for claims — a meaningfully weaker protection than being named an additional insured", "Has broader protection than an additional insured","Is automatically covered for all of the insured's operations"], correct:1, explain:"Being a certificate holder means you're on file to receive notice about the policy's existence/status — it does NOT extend actual coverage to you the way being named an additional insured does; conflating the two leaves real coverage gaps."},

  // SAFETY (9) — weak
  {topic:"Safety", q:"Which federal agency sets and enforces jobsite safety standards contractors must follow?", opts:["EPA","OSHA","FEMA","DOT"], correct:1, explain:"The Occupational Safety and Health Administration (OSHA) sets and enforces workplace safety standards on construction sites."},
  {topic:"Safety", q:"Fall protection is generally required for construction workers once they are working at or above what height?", opts:["4 feet","6 feet","10 feet","12 feet"], correct:1, explain:"OSHA's construction standard generally requires fall protection at 6 feet or more above a lower level."},
  {topic:"Safety", q:"An excavation deeper than 5 feet generally requires which OSHA protective measure, absent a stable rock determination?", opts:["No protection required under 10 feet","Sloping, benching, shoring, or shielding to prevent cave-in","A single warning sign only","Only a spotter, no physical protection"], correct:1, explain:"OSHA requires protective systems such as sloping, benching, shoring, or shielding for excavations 5 feet or deeper (with limited exceptions)."},
  {topic:"Safety", q:"Before digging on a job site, a contractor should first:", opts:["Call 811 / Blue Stakes to have underground utilities located and marked","Wait for the neighbor's permission","Only check utility maps from memory","Begin digging and stop if something is hit"], correct:0, explain:"Utah's one-call utility locating service (Blue Stakes, dial 811) must be contacted before excavation to mark underground utility lines."},
  {topic:"Safety", q:"A Hazard Communication (HazCom) program on a jobsite primarily ensures workers:", opts:["Get paid overtime automatically","Know about chemical hazards on site through labeling and safety data sheets (SDS)","Wear matching uniforms","Never handle any hazardous materials"], correct:1, explain:"HazCom requires labeling of hazardous chemicals and access to safety data sheets so workers understand risks and handling procedures."},
  {topic:"Safety", q:"Who is generally responsible for making sure work is performed to the current enforceable safety and code standard on a project?", opts:["The homeowner exclusively","The licensed contractor performing the work","The material supplier","The mortgage lender"], correct:1, explain:"The licensed contractor bears responsibility for ensuring construction complies with current adopted safety and code standards."},
  {topic:"Safety", q:"Personal Protective Equipment (PPE) on a job site is generally the responsibility of:", opts:["Solely the individual worker, with no employer role","The employer, who must assess hazards and provide/require appropriate PPE","Only required on federal projects","Optional, based on worker preference"], correct:1, explain:"Employers must assess workplace hazards and ensure appropriate PPE is provided and used, per OSHA requirements."},
  {topic:"Safety", q:"A competent person on an OSHA-regulated jobsite is defined as someone who:", opts:["Has the most years of experience regardless of training","Can identify existing/predictable hazards and has authority to take corrective action","Is always the project owner","Only needs a valid driver's license"], correct:1, explain:"OSHA defines a competent person as one capable of identifying hazards and authorized to take prompt corrective measures."},
  {topic:"Safety", q:"Scaffolding used on a construction site must generally be:", opts:["Self-certified by the crew with no inspection needed","Inspected by a competent person before each work shift for damage or instability","Used only on commercial projects","Left unguarded if under 10 feet tall"], correct:1, explain:"OSHA requires scaffolding to be inspected by a competent person before each shift and after any event that could affect its structural integrity."},
  {topic:"Safety", q:"A worker is assigned to enter a below-grade utility vault to make a connection. Before entry, the crew should determine whether this qualifies as:", opts:["A routine task requiring no special precautions","A permit-required confined space, which requires atmospheric testing, ventilation, and entry/rescue procedures if applicable","Something only relevant to underground mining","A task exempt from OSHA rules if it takes less than 10 minutes"], correct:1, explain:"Enclosed, below-grade spaces with limited entry/exit and potential atmospheric hazards can qualify as permit-required confined spaces, triggering specific testing and entry procedures."},
  {topic:"Safety", q:"An employer disciplines a worker specifically for reporting a safety hazard to OSHA. This action is:", opts:["A legitimate exercise of the employer's management rights","Illegal retaliation, since OSHA law protects workers from adverse action for reporting hazards or filing complaints","Only illegal if the hazard report turns out to be true","Permitted as long as it's documented as a performance issue"], correct:1, explain:"OSHA's whistleblower protections prohibit retaliating against employees for reporting hazards or filing safety complaints, regardless of how the report is later characterized."},
  {topic:"Safety", q:"A subcontractor's employee is injured due to a hazard created by the general contractor's own crew, even though the GC never directly supervised the injured worker. Under OSHA's multi-employer worksite doctrine, the GC as 'controlling employer' can:", opts:["Never be cited, since only the sub's direct employer can be cited","Potentially be cited for the hazard, since a controlling employer has a duty to address hazards it creates or could reasonably detect and correct","Only be liable if they personally witnessed the injury occur","Automatically be exempt because they are the GC, not the sub"], correct:1, explain:"Under OSHA's multi-employer citation policy, a controlling employer (like a GC) can be cited for hazards it created, controls, or should have detected and corrected, even affecting another employer's workers."},
  {topic:"Safety", q:"A ladder is set up at a construction site with its base 1 foot away from the wall it leans against, reaching a height of 8 feet. Using the standard 4-to-1 ladder angle rule, this setup is:", opts:["Correctly positioned per the 4-to-1 rule","Too steep — the base should be roughly 2 feet from the wall for an 8-foot working height (1 foot of base offset per 4 feet of height)","Irrelevant, since ladder angle rules don't exist","Only a concern above 20 feet"], correct:1, explain:"The 4-to-1 rule means the base should sit about 1 foot away from the vertical surface for every 4 feet of height to that surface — at 8 feet, the base should be about 2 feet out, not 1."},
  {topic:"Safety", q:"A trench box (shield) used during excavation work is meant to:", opts:["Prevent cave-ins from crushing workers inside the protected zone, rather than necessarily preventing the trench walls from moving at all","Replace the need for any other safety precautions on site","Only be used in trenches shallower than 3 feet","Eliminate the need for atmospheric testing"], correct:0, explain:"Trench shields protect workers inside them from a cave-in's force; they don't necessarily prevent soil movement itself, which is why other protective methods like sloping/benching may still apply elsewhere."},
  {topic:"Safety", q:"A jobsite safety program requires 'toolbox talks.' These are best described as:", opts:["Formal annual safety certifications","Brief, regular safety discussions with crews focused on specific, relevant hazards for that day's or week's work","A one-time orientation given only to new hires","Paperwork with no real value beyond compliance"], correct:1, explain:"Toolbox talks are short, frequent safety discussions targeting hazards relevant to the current work, reinforcing awareness on an ongoing basis rather than a one-time event."},
  {topic:"Safety", q:"OSHA's 'Focus Four' hazards in construction, responsible for the majority of construction fatalities, include falls, electrocution, struck-by, and:", opts:["Chemical exposure","Caught-in/between hazards","Noise-induced hearing loss","Repetitive motion injury"], correct:1, explain:"OSHA's Focus Four construction hazards are falls, struck-by, electrocution, and caught-in/between hazards — together responsible for the majority of construction worker fatalities."},
  {topic:"Safety", q:"A workplace fatality occurs on a jobsite. Under OSHA reporting requirements, the employer must report it to OSHA within:", opts:["30 days","24 hours","8 hours","72 hours"], correct:2, explain:"OSHA requires employers to report a work-related fatality within 8 hours of learning about it."},
  {topic:"Safety", q:"A worker suffers an in-patient hospitalization, amputation, or loss of an eye on the job. OSHA requires this be reported within:", opts:["8 hours","24 hours","7 days","No reporting requirement unless it's a fatality"], correct:1, explain:"In-patient hospitalizations, amputations, and losses of an eye must be reported to OSHA within 24 hours, a separate and longer window than the 8-hour fatality reporting rule."},
  {topic:"Safety", q:"Under OSHA recordkeeping rules, employers with how many or fewer employees are generally exempt from routinely maintaining injury and illness logs (with some industry exceptions)?", opts:["5 or fewer","10 or fewer","25 or fewer","50 or fewer"], correct:1, explain:"Employers with 10 or fewer employees at all times during the prior calendar year are generally exempt from routine OSHA injury/illness recordkeeping, subject to certain industry exceptions."},
  {topic:"Safety", q:"OSHA-required injury and illness records (such as the OSHA 300 log) must generally be retained for how long?", opts:["1 year","3 years","5 years","10 years"], correct:2, explain:"OSHA generally requires injury and illness records to be retained for 5 years following the end of the calendar year they cover."},
  {topic:"Safety", q:"After receiving an OSHA citation, an employer must generally post the citation at or near the location of the violation for how long?", opts:["24 hours only","3 working days or until the violation is corrected, whichever is longer","30 calendar days regardless of correction status","There is no posting requirement"], correct:1, explain:"OSHA generally requires citations to remain posted for 3 working days or until the violation is corrected, whichever period is longer."},

  {topic:"Safety", q:"OSHA's general Lockout/Tagout standard (1910.147) primarily governs general industry. For CONSTRUCTION work involving hazardous energy control, the applicable requirements instead generally come from:", opts:["1910.147 applies identically and exclusively to construction too, with no separate standard", "Construction-specific standards under 29 CFR 1926 — assuming 1910.147 automatically covers a construction jobsite is a common and meaningful error", "No lockout/tagout requirements apply to construction work at all","Only state OSHA plans address lockout/tagout on construction sites"], correct:1, explain:"General industry's 1910.147 LOTO standard doesn't directly govern most construction activity; construction has its own hazardous-energy-control provisions under 29 CFR 1926 — treating 1910.147 as automatically applicable to a job site is a genuine and common misconception."},
  {topic:"Safety", q:"A concrete-cutting task using a handheld grinder is listed on OSHA's respirable crystalline silica 'Table 1.' Following Table 1's specified engineering controls and work practices for that task generally:", opts:["Has no bearing on compliance obligations", "Satisfies the exposure control requirements for that task without needing separate air monitoring — but only if the specific listed controls (like water delivery or a shroud with vacuum) are actually and fully followed as described", "Is optional guidance with no compliance value","Only applies to concrete plants, not jobsite cutting"], correct:1, explain:"Table 1 offers a compliance shortcut — following its specified controls for a listed task satisfies silica exposure requirements without separate exposure monitoring, but ONLY if implemented exactly as specified; partial or modified implementation doesn't qualify for that shortcut."},

  // TAX LAWS (8) — weak
  {topic:"Tax Laws", q:"In Utah, sales/use tax generally applies to a contractor's:", opts:["Labor charges only, never materials","Purchase of materials and supplies used in construction, in most cases","Nothing — contractors are fully tax-exempt","Only jobs over $1 million"], correct:1, explain:"Contractors generally owe sales/use tax on materials and supplies they purchase and consume in construction work."},
  {topic:"Tax Laws", q:"A business that pays an independent contractor $600 or more in a year typically must issue what tax form?", opts:["W-2","1099-NEC","I-9","W-4"], correct:1, explain:"Form 1099-NEC reports nonemployee compensation of $600 or more paid to independent contractors during the year."},
  {topic:"Tax Laws", q:"A W-2 form is used to report wages for which type of worker?", opts:["Independent contractors","Employees, along with tax withholdings","Business partners","Unpaid volunteers"], correct:1, explain:"W-2 forms report employee wages and the taxes withheld from them, distinct from 1099 forms used for independent contractors."},
  {topic:"Tax Laws", q:"Self-employed contractors who expect to owe tax are generally required to pay taxes:", opts:["Only once a year, in April","Quarterly, as estimated tax payments","Never, if income is under $100,000","Only if audited"], correct:1, explain:"Self-employed individuals typically must make quarterly estimated tax payments rather than paying everything at year-end."},
  {topic:"Tax Laws", q:"An Employer Identification Number (EIN) is primarily used to:", opts:["Identify a business for federal tax purposes, similar to an SSN for individuals","Register a vehicle for business use","Replace the need for a contractor license","Track employee attendance"], correct:0, explain:"An EIN is a federal tax ID number the IRS assigns to identify a business entity, used for filing taxes and payroll reporting."},
  {topic:"Tax Laws", q:"Employer payroll tax obligations for a contractor with employees typically include withholding and remitting:", opts:["Only state sales tax","Federal income tax withholding, Social Security, and Medicare (FICA) taxes","Only property tax","No taxes if paid in cash"], correct:1, explain:"Employers must withhold federal income tax and FICA (Social Security/Medicare) from employee wages and remit them, along with employer-matched portions."},
  {topic:"Tax Laws", q:"A resale certificate allows a contractor to:", opts:["Avoid ever paying any tax on the business","Purchase certain materials tax-exempt when they will be resold or incorporated into a taxable sale, per state rules","Skip filing an annual tax return","Deduct personal expenses as business costs"], correct:1, explain:"Resale certificates let qualifying purchases be made without sales tax when the item will be resold or otherwise taxed downstream, per state rules."},
  {topic:"Tax Laws", q:"Deductible business expenses for a contractor commonly include:", opts:["Personal vacation costs unrelated to the business","Ordinary and necessary costs of running the business, like tools, vehicle use, and insurance premiums","The owner's personal mortgage payment","Fines and penalties for code violations"], correct:1, explain:"The IRS generally allows deduction of ordinary and necessary business expenses; personal costs, fines, and penalties are not deductible."},
  {topic:"Tax Laws", q:"A contractor misclassifies several employees as 1099 independent contractors to avoid payroll tax. If discovered in an audit, the business is generally exposed to:", opts:["No consequences if the workers agreed to the arrangement","Back payroll taxes, interest, and penalties for the misclassified period, potentially for multiple years","A simple warning letter with no financial impact","Automatic license revocation only, no tax exposure"], correct:1, explain:"Misclassification discovered on audit typically triggers back payroll tax liability, interest, and penalties, which can compound significantly across multiple tax years."},
  {topic:"Tax Laws", q:"A contractor purchases a truck used 70% for business and 30% for personal errands. For tax purposes, the deductible portion of related vehicle expenses is generally:", opts:["100%, since it's titled to the business","Limited to the business-use percentage (roughly 70% in this case), not the full cost","0%, since any personal use disqualifies the entire deduction","Determined solely by the truck's purchase price"], correct:1, explain:"Mixed-use vehicle expenses are generally deductible only in proportion to actual business use, requiring reasonable recordkeeping (e.g., a mileage log) to support the split."},
  {topic:"Tax Laws", q:"A contractor accepts a large cash payment for a job and doesn't report it as income. Beyond ethical concerns, this creates exposure to:", opts:["No real risk if it's under $10,000","Tax evasion penalties, interest, and potential criminal exposure if discovered, regardless of the payment method","A simple late-filing fee only","Nothing, since cash transactions aren't taxable"], correct:1, explain:"All income is taxable regardless of payment form; failing to report cash income creates the same (or greater) audit and penalty exposure as any other unreported income."},
  {topic:"Tax Laws", q:"A Section 179 deduction allows a business to:", opts:["Avoid ever paying sales tax on equipment","Potentially deduct the full purchase price of qualifying equipment/tools in the year purchased, rather than depreciating it over several years","Skip filing a tax return entirely for that year","Exempt all business vehicles from registration fees"], correct:1, explain:"Section 179 allows eligible businesses to expense the full cost of qualifying equipment purchases immediately, rather than spreading the deduction out through standard depreciation schedules."},
  {topic:"Tax Laws", q:"A contractor operating as an LLC taxed as a sole proprietorship generally owes self-employment tax on:", opts:["Nothing, since LLCs are tax-exempt","Net self-employment earnings, covering the individual's share of Social Security and Medicare that an employer would otherwise split with an employee","Only gross revenue before any expenses","Only income above $1,000,000"], correct:1, explain:"Self-employed individuals owe self-employment tax on net earnings, covering both the employee and employer portions of Social Security/Medicare that a traditional employer would otherwise split."},
  {topic:"Tax Laws", q:"A contractor fails to remit collected sales tax to the state on time. Compared to failing to pay income tax, sales tax non-remittance is often treated by tax authorities as:", opts:["Identical in severity, no distinction exists","Potentially more serious, since sales tax collected from customers is treated as funds held in trust for the state, not the contractor's own money","Less serious, since sales tax is optional to remit","Irrelevant if the contractor eventually goes out of business"], correct:1, explain:"Collected sales tax is generally treated as trust fund money owed to the state; failing to remit it can carry more severe personal liability exposure than ordinary income tax delinquency."},
  {topic:"Tax Laws", q:"The self-employment tax rate on net self-employment earnings is approximately:", opts:["7.65%","15.3%","22%","35%"], correct:1, explain:"Self-employment tax is roughly 15.3% of net earnings — 12.4% for Social Security plus 2.9% for Medicare, covering both the 'employee' and 'employer' shares a traditional payroll arrangement would split."},
  {topic:"Tax Laws", q:"Form W-9 is used to:", opts:["Report an employee's annual wages and withholding","Collect a contractor's/vendor's taxpayer ID information before the payer issues a 1099", "Apply for an EIN directly with the IRS","Report quarterly payroll tax deposits"], correct:1, explain:"A business collects Form W-9 from independent contractors/vendors to get their taxpayer ID number, which is then used to prepare an accurate Form 1099 at year-end."},
  {topic:"Tax Laws", q:"If a contractor fails to provide a valid taxpayer ID on Form W-9, the payer may be required to withhold what's known as 'backup withholding' from payments at a rate of approximately:", opts:["10%","24%","33%","50%"], correct:1, explain:"Backup withholding is currently around 24% of the payment when a payee fails to furnish a valid taxpayer ID, and the payer must remit it to the IRS."},
  {topic:"Tax Laws", q:"Form 941 is filed by employers to report:", opts:["Annual business income tax","Quarterly federal payroll taxes withheld from employees, plus the employer's matching share","Sales tax collected from customers","A one-time new-hire notification"], correct:1, explain:"Form 941 is the employer's quarterly federal tax return reporting withheld income tax plus Social Security/Medicare taxes for both employee and employer portions."},
  {topic:"Tax Laws", q:"The 'trust fund recovery penalty' can make a responsible individual (like a business owner) personally liable for what portion of unpaid withheld payroll taxes?", opts:["10%","50%","Up to 100%","There is no personal liability, only the business entity is liable"], correct:2, explain:"The trust fund recovery penalty can impose personal liability of up to 100% of unpaid withheld payroll taxes on responsible individuals, piercing the usual entity liability shield for this specific obligation."},
  {topic:"Tax Laws", q:"Self-employed individuals who expect to owe at least a certain amount in tax are generally required to make estimated tax payments on approximately what schedule?", opts:["Once a year, at filing time only","Roughly four times a year — around mid-April, mid-June, mid-September, and mid-January of the following year","Monthly, on the 1st of every month","Only if audited by the IRS"], correct:1, explain:"Estimated tax payments are generally due in four installments spread across the year, spaced roughly every quarter, rather than in one lump sum at filing."},
  {topic:"Tax Laws", q:"Since the 2020 tax year, nonemployee compensation paid to independent contractors is reported on which form — a change from the older practice of using a different form's box for this?", opts:["1099-MISC, as it always has been","1099-NEC — nonemployee compensation was moved OFF the 1099-MISC and onto its own dedicated form starting with the 2020 tax year, a change that trips up anyone recalling older rules", "W-2, same as employees","There is no dedicated reporting form for this"], correct:1, explain:"Starting with tax year 2020, the IRS revived Form 1099-NEC specifically for nonemployee compensation, which had previously been reported in a box on Form 1099-MISC — outdated study material or memory can lead people to answer 1099-MISC incorrectly."},
  {topic:"Tax Laws", q:"A contractor uses one room in their home exclusively and regularly as a dedicated office for business administration, and wants to claim a home office deduction. If that same room is ALSO used regularly for personal family activities in the evenings, the deduction is:", opts:["Still fully allowed, since business use occurs at some point","Generally disqualified for that space, since the 'exclusive use' test requires the area be used ONLY for business — regular personal use of the same space breaks that requirement even if business use also occurs", "Allowed at a reduced 50% rate automatically","Only a concern if the IRS specifically asks about it"], correct:1, explain:"The home office deduction's exclusive-use test is strict — regular personal use of the same physical space generally disqualifies it entirely, regardless of how much legitimate business use also happens there."}
];

const ALL_TOPICS = Object.keys(LAST_SCORE);
// Exact per-topic question counts as they appear on the real 60-question Utah exam,
// taken directly from Fernando's actual Prov score report "# Possible" column.
const EXAM_BLUEPRINT = {};
ALL_TOPICS.forEach(t => { EXAM_BLUEPRINT[t] = LAST_SCORE[t].total; });
const EXAM_TOTAL_QUESTIONS = Object.values(EXAM_BLUEPRINT).reduce((a,b)=>a+b,0); // 60
const EXAM_TIME_LIMIT_SECONDS = 120 * 60; // 120 minutes, matching the real exam
const WEAK_TOPICS = ALL_TOPICS.filter(isWeak);

let state = {screen:"intro", idx:0, answers:[], mode:"weak", source:"bank"};
let activeQuestions = [];
let attemptHistory = [];
const STORAGE_KEY = "ut_b100_attempts_v1";
const SEEN_KEY = "ut_b100_seen_ids_v1";

// ---------- localStorage-based history (works on any deployed site) ----------
function loadHistory(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    attemptHistory = raw ? JSON.parse(raw) : [];
  } catch(e){
    attemptHistory = [];
  }
}
function saveAttempt(record){
  attemptHistory.unshift(record);
  if(attemptHistory.length > 40) attemptHistory = attemptHistory.slice(0,40);
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(attemptHistory)); } catch(e){ console.error(e); }
}
function getSeenIds(){
  try{
    const raw = localStorage.getItem(SEEN_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}
function markSeen(ids){
  try{
    let seen = getSeenIds();
    seen = seen.concat(ids);
    if(seen.length > 200) seen = seen.slice(seen.length-200);
    localStorage.setItem(SEEN_KEY, JSON.stringify(seen));
  } catch(e){}
}

// assign a stable id to each question (topic + question text)
QUESTIONS.forEach(q => { q._id = q.topic + "::" + q.q; });

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Build a fresh random set: prefer unseen questions first, shuffle answer order too
// countSpec: either a flat number (same count per topic) or an object {topicName: count}
function buildRandomSet(topics, countSpec){
  const seen = getSeenIds();
  let picked = [];
  topics.forEach(topic => {
    const wantCount = (typeof countSpec === 'object') ? (countSpec[topic] || 0) : countSpec;
    if(wantCount <= 0) return;
    let pool = QUESTIONS.filter(q => q.topic === topic);
    let unseen = pool.filter(q => !seen.includes(q._id));
    let usePool = unseen.length > 0 ? unseen : pool; // reset once exhausted
    usePool = shuffle(usePool);
    const n = Math.min(wantCount, usePool.length);
    picked = picked.concat(usePool.slice(0,n));
  });
  picked = shuffle(picked);
  // shuffle each question's option order independently
  const finalSet = picked.map(q => {
    const order = shuffle([0,1,2,3]);
    const newOpts = order.map(i => q.opts[i]);
    const newCorrect = order.indexOf(q.correct);
    return {topic:q.topic, q:q.q, opts:newOpts, correct:newCorrect, explain:q.explain, _id:q._id};
  });
  markSeen(finalSet.map(q => q._id));
  return finalSet;
}

function buildActiveSet(mode){
  if(mode === "sim"){
    activeQuestions = buildRandomSet(ALL_TOPICS, EXAM_BLUEPRINT);
    return;
  }
  const topics = mode === "weak" ? WEAK_TOPICS : ALL_TOPICS;
  const perTopic = mode === "weak" ? 6 : 4;
  activeQuestions = buildRandomSet(topics, perTopic);
}

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'intro') app.innerHTML = renderIntro();
  else if(state.screen === 'quiz') app.innerHTML = renderQuiz();
  else app.innerHTML = renderResults();
}

    const s = LAST_SCORE[name];
    const pct = Math.round((s.correct/s.total)*100);
    const weak = isWeak(name);
    return `
    <div class="breakdown-row">
      <div class="breakdown-label ${weak?'weak':''}">${name}</div>
      <div class="bar-track"><div class="bar-fill ${weak?'weak':''}" style="width:${pct}%"></div></div>
      <div class="breakdown-pct">${s.correct}/${s.total}</div>
    </div>`;
  }).join('');

  let historyBlock;
  if(attemptHistory.length === 0){
    historyBlock = `<div class="empty-note">No practice attempts logged yet on this device. Finish a set below and it'll show up here.</div>`;
  } else {
    historyBlock = attemptHistory.slice(0,8).map(a => {
      const d = new Date(a.date);
      const dateStr = (d.getMonth()+1) + "/" + d.getDate() + "/" + d.getFullYear();
      const passed = a.scorePct >= 70;
      const modeLabel = a.mode === 'weak' ? 'Weak areas' : a.mode === 'sim' ? 'Simulated exam' : 'Full exam';
      return `<div class="history-row">
        <span class="history-meta">${dateStr} · ${modeLabel} · ${a.total} Q</span>
        <span class="history-score ${passed?'pass':'fail'}">${a.scorePct}%</span>
      </div>`;
    }).join('');
  }

  return `
    <header class="top">
      <div class="eyebrow">Retake Prep — Built From Your Actual Score Report</div>
      <h1>B100 Business &amp; Law<br>Practice Exam</h1>
      <div class="sub">Your 03/20/2026 attempt scored 48% (needed 70%). Weakest areas: Safety, Business Organization, Contract Management, and Lien Laws.</div>
      <span class="blueprint-badge">70% TO PASS</span>
      <span class="blueprint-badge weak">${QUESTIONS.filter(q=>isWeak(q.topic)).length} WEAK-AREA QUESTIONS IN BANK</span>
    </header>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:12px;">Your last attempt, by subject</div>
      ${bars}
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:10px;">Practice history (this device)</div>
      ${historyBlock}
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:10px;">Choose scope</div>
      <div class="mode-row">
        <div class="mode-btn ${state.mode==='weak'?'active':''}" onclick="setMode('weak')">Weak Areas Only</div>
        <div class="mode-btn ${state.mode==='all'?'active':''}" onclick="setMode('all')">Full Exam</div>
        <div class="mode-btn ${state.mode==='sim'?'active':''}" onclick="setMode('sim')">Simulated Exam</div>
      </div>
      <div class="sub" style="margin-top:8px;">${state.mode==='weak' ? "Drills only Safety, Business Organization, Contract Management, and Lien Laws — the sections that sank your last score." : state.mode==='sim' ? `Matches the real test exactly: ${EXAM_TOTAL_QUESTIONS} questions sized per-topic just like your actual score report (10 Licensing, 6 Contract Mgmt, 4 Business Org, etc.), with a live 120-minute countdown.` : "Covers all 11 subject areas, including the ones you already did well on, to confirm they've stuck."}</div>
    </div>
    <button class="primary" onclick="startQuiz()">${state.mode==='sim' ? 'Start Full Simulated Exam (120 min) →' : 'Shuffle a New Set →'}</button>
    <footer>Every set pulls a fresh random mix from a ${QUESTIONS.length}-question bank (including harder scenario and calculation questions) with shuffled answer order. Study aid only — verify current rules with DOPL / your Prov candidate handbook.</footer>
  `;
}

function setMode(m){
  state.mode = m;
  render();
}

let timerInterval = null;

function startQuiz(){
  buildActiveSet(state.mode);
  state.source = "bank";
  state.screen = "quiz";
  state.idx = 0;
  state.answers = new Array(activeQuestions.length).fill(null);
  state.timeUp = false;
  if(state.mode === "sim"){
    state.deadline = Date.now() + EXAM_TIME_LIMIT_SECONDS * 1000;
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(tickTimer, 1000);
  } else {
    state.deadline = null;
    if(timerInterval) clearInterval(timerInterval);
  }
  render();
}

function tickTimer(){
  if(state.screen !== 'quiz' || !state.deadline) return;
  const remaining = state.deadline - Date.now();
  if(remaining <= 0){
    clearInterval(timerInterval);
    state.timeUp = true;
    finishAttempt();
    state.screen = "results";
    render();
    return;
  }
  // only re-render the timer chip to avoid disrupting the current question view
  const el = document.getElementById('exam-timer');
  if(el) el.textContent = formatTime(remaining);
}

function formatTime(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(totalSec/60);
  const s = totalSec % 60;
  return m + ":" + (s < 10 ? "0"+s : s);
}

function renderQuiz(){
  const q = activeQuestions[state.idx];
  const answered = state.answers[state.idx] !== null;
  const pct = Math.round((state.idx/activeQuestions.length)*100);
  const weak = isWeak(q.topic);

  let opts = q.opts.map((opt, i) => {
    let cls = "opt";
    let disabledAttr = answered ? "disabled" : "";
    if(answered){
      if(i === q.correct) cls += " correct";
      else if(i === state.answers[state.idx] && i !== q.correct) cls += " incorrect";
    }
    return `<button class="${cls}" ${disabledAttr} onclick="selectAnswer(${i})">
      <span class="letter">${String.fromCharCode(65+i)}</span><span>${opt}</span>
    </button>`;
  }).join('');

  let explainBlock = answered ? `<div class="explain"><b>${state.answers[state.idx] === q.correct ? "Correct." : "Not quite."}</b> ${q.explain}</div>` : '';

  let navButtons = `<div class="nav-row">`;
  if(answered){
    navButtons += `<button class="primary" onclick="nextQuestion()">${state.idx === activeQuestions.length-1 ? "See Results →" : "Next Question →"}</button>`;
  }
  navButtons += `</div>`;

  return `
    <div class="progress-row">
      <span>QUESTION ${state.idx+1} / ${activeQuestions.length}</span>
      ${state.mode === 'sim' && state.deadline ? `<span id="exam-timer" style="color:var(--amber);font-weight:600;">${formatTime(state.deadline - Date.now())}</span>` : `<span>${pct}% THROUGH</span>`}
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <span class="topic-tag ${weak?'weak':''}">${q.topic}${weak?' · weak spot':''}</span>
    <div class="question-card">
      <p class="q-text">${q.q}</p>
      ${opts}
      ${explainBlock}
    </div>
    ${navButtons}
  `;
}

function selectAnswer(i){
  if(state.answers[state.idx] !== null) return;
  state.answers[state.idx] = i;
  render();
}

function nextQuestion(){
  if(state.idx === activeQuestions.length-1){
    if(timerInterval) clearInterval(timerInterval);
    finishAttempt();
    state.screen = "results";
  } else {
    state.idx += 1;
  }
  render();
}

function finishAttempt(){
  let correctCount = 0;
  let topicStats = {};
  activeQuestions.forEach((q,i) => {
    if(!topicStats[q.topic]) topicStats[q.topic] = {correct:0,total:0};
    topicStats[q.topic].total += 1;
    if(state.answers[i] === q.correct){
      correctCount += 1;
      topicStats[q.topic].correct += 1;
    }
  });
  const scorePct = Math.round((correctCount/activeQuestions.length)*100);
  saveAttempt({
    date: new Date().toISOString(),
    mode: state.mode,
    scorePct: scorePct,
    correct: correctCount,
    total: activeQuestions.length,
    topics: topicStats
  });
}

function renderResults(){
  let correctCount = 0;
  let topicStats = {};
  activeQuestions.forEach((q,i) => {
    if(!topicStats[q.topic]) topicStats[q.topic] = {correct:0,total:0};
    topicStats[q.topic].total += 1;
    if(state.answers[i] === q.correct){
      correctCount += 1;
      topicStats[q.topic].correct += 1;
    }
  });
  const scorePct = Math.round((correctCount/activeQuestions.length)*100);
  const passed = scorePct >= 70;

  let topicRows = Object.keys(topicStats).map(name => {
    let s = topicStats[name];
    let weak = isWeak(name);
    return `<div class="topic-result-row ${weak?'weak':''}"><span>${name}</span><span class="topic-score">${s.correct}/${s.total}</span></div>`;
  }).join('');

  const modeLabel = state.mode === 'weak' ? 'Weak-Area Drill' : state.mode === 'sim' ? 'Full Simulated Exam' : 'Full Exam';
  let timeUpNotice = state.timeUp ? `<div class="error-box">Time's up — this matches what happens on the real exam if the 120-minute clock runs out. Unanswered questions were scored as incorrect.</div>` : '';

  return `
    <header class="top">
      <div class="eyebrow">Results — ${modeLabel}</div>
      <h1>Practice Complete</h1>
    </header>
    ${timeUpNotice}
    <div class="panel">
      <div class="score-hero">
        <div class="score-num ${passed ? 'pass':'fail'}">${scorePct}%</div>
        <div class="score-label">${correctCount} of ${activeQuestions.length} correct — ${passed ? 'passing (70% needed)' : 'below 70% passing mark'}</div>
      </div>
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:8px;">By topic</div>
      ${topicRows}
    </div>
    <button class="ghost" onclick="reviewMissed()">Review Missed Questions</button>
    <button class="secondary" onclick="startQuiz()">Shuffle Another New Set (same scope) →</button>
    <button class="primary" onclick="backToIntro()">Back to Start</button>
    <footer>Study aid only — verify current rules with DOPL / your Prov candidate handbook.</footer>
  `;
}

function backToIntro(){
  if(timerInterval) clearInterval(timerInterval);
  state.screen = "intro";
  render();
}

function reviewMissed(){
  const app = document.getElementById('app');
  let missed = activeQuestions.map((q,i) => ({q,i})).filter(item => state.answers[item.i] !== item.q.correct);
  let html = `
    <header class="top">
      <div class="eyebrow">Review</div>
      <h1>Missed Questions</h1>
      <div class="sub">${missed.length === 0 ? "You didn't miss any — nice work." : missed.length + " question(s) to revisit."}</div>
    </header>
  `;
  missed.forEach(item => {
    let q = item.q;
    let yourAns = state.answers[item.i];
    let weak = isWeak(q.topic);
    html += `
      <div class="question-card" style="margin-bottom:14px;">
        <span class="topic-tag ${weak?'weak':''}">${q.topic}</span>
        <p class="q-text">${q.q}</p>
        ${q.opts.map((opt,i) => {
          let cls = "opt";
          if(i === q.correct) cls += " correct";
          else if(i === yourAns) cls += " incorrect";
          return `<div class="${cls}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${opt}</span></div>`;
        }).join('')}
        <div class="explain"><b>Why:</b> ${q.explain}</div>
      </div>
    `;
  });
  html += `<button class="primary" onclick="backToIntro()">Back to Start</button>`;
  app.innerHTML = html;
}

loadHistory();
render();
</script>
</body>
</html>
