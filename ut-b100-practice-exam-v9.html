<!DOCTYPE html>
<html lang="en">
<head>

<title>UT B100 Business &amp; Law — Practice Exam</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --blue-950:#0a1f33;
    --blue-900:#0e2a44;
    --blue-800:#123657;
    --line:#4f90c4;
    --line-soft:#2e5478;
    --amber:#e0a548;
    --brick:#c1543a;
    --green:#5f9e6e;
    --ink:#eaf1f7;
    --ink-dim:#a9bdd0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--blue-950);
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:28px 28px;
    background-position:-1px -1px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 18px;}

  header.top{border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:22px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:28px;line-height:1.15;margin:0 0 8px 0;}
  .sub{color:var(--ink-dim);font-size:14px;line-height:1.5;}
  .blueprint-badge{display:inline-block;border:1.5px solid var(--line);border-radius:2px;padding:2px 8px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--line);margin-right:6px;margin-top:10px;}
  .blueprint-badge.weak{border-color:var(--brick);color:var(--brick);}

  .panel{background:var(--blue-900);border:1px solid var(--line-soft);border-radius:4px;padding:18px;margin-bottom:16px;}
  .breakdown-row{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-bottom:9px;}
  .breakdown-label{font-family:'IBM Plex Mono',monospace;width:150px;flex-shrink:0;color:var(--ink-dim);}
  .breakdown-label.weak{color:var(--brick);font-weight:600;}
  .bar-track{flex:1;height:8px;background:var(--blue-800);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--line);}
  .bar-fill.weak{background:var(--brick);}
  .breakdown-pct{font-family:'IBM Plex Mono',monospace;width:52px;text-align:right;color:var(--ink);flex-shrink:0;}

  button.primary{background:var(--amber);color:var(--blue-950);border:none;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;letter-spacing:0.03em;padding:14px 20px;border-radius:3px;width:100%;cursor:pointer;margin-top:8px;}
  button.primary:active{transform:translateY(1px);}
  button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:10px 16px;border-radius:3px;cursor:pointer;width:100%;margin-top:10px;}
  button.secondary{background:var(--blue-800);color:var(--amber);border:1.5px solid var(--amber);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;padding:12px 16px;border-radius:3px;width:100%;cursor:pointer;margin-top:10px;}

  .progress-row{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);margin-bottom:10px;}
  .progress-track{height:5px;background:var(--blue-800);border-radius:3px;overflow:hidden;margin-bottom:20px;}
  .progress-fill{height:100%;background:var(--amber);transition:width .25s ease;}

  .topic-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--blue-950);background:var(--line);padding:3px 8px;border-radius:2px;margin-bottom:12px;}
  .topic-tag.weak{background:var(--brick);}

  .question-card{background:var(--blue-900);border:1px solid var(--line-soft);border-radius:4px;padding:20px 18px 18px 18px;}
  .q-text{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.35;margin:0 0 16px 0;}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--blue-800);border:1.5px solid transparent;color:var(--ink);font-family:'Inter',sans-serif;font-size:14.5px;line-height:1.4;padding:12px 12px;border-radius:3px;margin-bottom:9px;cursor:pointer;}
  .opt .letter{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--line);flex-shrink:0;}
  .opt.correct{border-color:var(--green);background:rgba(95,158,110,0.18);}
  .opt.correct .letter{color:var(--green);}
  .opt.incorrect{border-color:var(--brick);background:rgba(193,84,58,0.18);}
  .opt.incorrect .letter{color:var(--brick);}
  .opt:disabled{cursor:default;}

  .explain{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-soft);font-size:13.5px;line-height:1.55;color:var(--ink-dim);}
  .explain b{color:var(--ink);}

  .nav-row{display:flex;gap:10px;margin-top:16px;}

  .score-hero{text-align:center;padding:26px 0 10px 0;}
  .score-num{font-family:'Fraunces',serif;font-weight:700;font-size:64px;line-height:1;}
  .score-num.pass{color:var(--green);}
  .score-num.fail{color:var(--brick);}
  .score-label{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-dim);margin-top:6px;}

  .topic-result-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:9px 0;border-bottom:1px solid var(--blue-800);}
  .topic-result-row:last-child{border-bottom:none;}
  .topic-score{font-family:'IBM Plex Mono',monospace;color:var(--ink-dim);}
  .topic-result-row.weak span:first-child{color:var(--brick);font-weight:600;}

  footer{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--line-soft);margin-top:26px;}
  .mode-row{display:flex;gap:8px;margin-bottom:6px;}
  .mode-btn{flex:1;background:var(--blue-800);border:1.5px solid var(--line-soft);color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:10px 8px;border-radius:3px;cursor:pointer;text-align:center;}
  .mode-btn.active{border-color:var(--amber);color:var(--amber);}

  .history-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--blue-800);font-family:'IBM Plex Mono',monospace;}
  .history-row:last-child{border-bottom:none;}
  .history-score{font-weight:600;}
  .history-score.pass{color:var(--green);}
  .history-score.fail{color:var(--brick);}
  .history-meta{color:var(--ink-dim);}
  .empty-note{color:var(--ink-dim);font-size:13px;font-style:italic;}
</style>

<script>
// Fernando's actual 03/20/2026 Prov score report — used to flag weak subject areas
const LAST_SCORE = {
  "Business Organization": {correct:1, total:4},
  "Contract Management": {correct:1, total:6},
  "Estimating and Bidding": {correct:4, total:6},
  "Financial Management": {correct:4, total:6},
  "Labor Laws": {correct:3, total:6},
  "Licensing": {correct:5, total:10},
  "Lien Laws": {correct:1, total:3},
  "Project Management": {correct:5, total:5},
  "Risk Management": {correct:3, total:5},
  "Safety": {correct:0, total:4},
  "Tax Laws": {correct:2, total:5}
};
const WEAK_THRESHOLD = 0.5;
function isWeak(topic){
  const s = LAST_SCORE[topic];
  if(!s) return false;
  return (s.correct/s.total) < WEAK_THRESHOLD;
}

// Expanded question bank — each topic has more questions than any single quiz uses,
// so "shuffle a new set" pulls a genuinely different mix each time.
const QUESTIONS = [
  // BUSINESS ORGANIZATION (9) — weak
  {topic:"Business Organization", q:"What is the main advantage of forming an LLC over a sole proprietorship for a contracting business?", opts:["It eliminates the need for a license","It generally shields personal assets from business debts and liabilities","It removes the need for insurance","It exempts the business from taxes entirely"], correct:1, explain:"An LLC creates a legal separation between the business and the owner's personal assets, limiting personal liability for business debts."},
  {topic:"Business Organization", q:"In a sole proprietorship, who is personally liable for business debts and lawsuits?", opts:["No one — the business is a separate entity","The owner, personally and without limit","Only the bank that financed the business","The State of Utah"], correct:1, explain:"A sole proprietorship has no legal separation from its owner, so the owner bears unlimited personal liability."},
  {topic:"Business Organization", q:"What is a 'qualifying party' (or qualifier) in the context of a Utah contracting license?", opts:["The customer who hires the contractor","The individual whose experience and exam results qualify the business entity for licensure","The bank that approves a construction loan","The building inspector assigned to a project"], correct:1, explain:"The qualifier is the individual (owner, officer, or employee) whose experience and passed exam allow the business entity to hold a license."},
  {topic:"Business Organization", q:"A general partnership means that each partner is typically:", opts:["Only liable up to their invested capital","Personally liable for the partnership's debts, including a partner's actions","Protected from all business liability","Taxed separately from the partnership's income"], correct:1, explain:"In a general partnership, partners share personal liability for business obligations, including debts created by other partners acting within the business."},
  {topic:"Business Organization", q:"What does 'DBA' (doing business as) allow a company to do?", opts:["Avoid needing a contractor license","Operate and advertise under a name other than its legal registered name","Skip filing taxes","Bypass workers' compensation requirements"], correct:1, explain:"A DBA (assumed/fictitious business name filing) lets a business legally operate under a trade name different from its registered legal name."},
  {topic:"Business Organization", q:"Which business structure creates the clearest separation between the business entity and its owners, with shares and a board?", opts:["Sole proprietorship","General partnership","Corporation","Informal joint venture"], correct:2, explain:"A corporation is a distinct legal entity from its owners (shareholders), with its own liability shield, governed by officers/directors."},
  {topic:"Business Organization", q:"An S-corporation election primarily affects a business's:", opts:["Ability to hold a contractor license","Tax treatment, passing income/loss through to shareholders' personal returns","Insurance requirements","Bonding requirements"], correct:1, explain:"An S-corp is a tax election allowing income and losses to pass through to shareholders, avoiding corporate-level double taxation."},
  {topic:"Business Organization", q:"A registered agent for a Utah LLC or corporation is primarily responsible for:", opts:["Managing daily job site operations","Receiving legal and official state correspondence on behalf of the business","Signing every customer contract","Filing the company's sales tax returns"], correct:1, explain:"A registered agent is the designated point of contact for legal notices and state filings sent to the business."},
  {topic:"Business Organization", q:"In a joint venture between two contracting companies for a single large project, each party typically:", opts:["Has no liability tied to the venture","Shares in the profits, losses, and liability of that specific project per their agreement","Automatically merges into one company permanently","Is exempt from needing their own license"], correct:1, explain:"A joint venture is a temporary partnership for a specific project, with liability and profit/loss shared per the venture agreement."},
  {topic:"Business Organization", q:"An LLC owner personally guarantees a business loan for equipment. If the LLC later defaults, the owner's personal assets are:", opts:["Fully protected, since the LLC shields all personal liability no matter what","Exposed for that specific guaranteed debt, despite the LLC's general liability protection","Protected only if the owner is also the qualifier","Automatically forgiven under LLC law"], correct:1, explain:"A personal guarantee creates individual liability for that specific debt, overriding the LLC's protection for that obligation regardless of the entity structure."},
  {topic:"Business Organization", q:"'Piercing the corporate veil' is a legal doctrine that allows a court to:", opts:["Dissolve a corporation for late tax filings only","Hold owners personally liable despite a corporate/LLC structure, typically due to fraud or ignoring corporate formalities","Automatically transfer ownership to creditors","Require a company to change its business name"], correct:1, explain:"Courts can disregard the liability shield and reach owners' personal assets when formalities are ignored or the entity is used to commit fraud or injustice."},
  {topic:"Business Organization", q:"By default, a single-member LLC that hasn't elected corporate tax treatment is taxed by the IRS as:", opts:["A C-corporation","A disregarded entity, with income reported on the owner's personal return","Automatically tax-exempt","A general partnership"], correct:1, explain:"A single-member LLC is a 'disregarded entity' by default — its income/loss flows directly to the owner's personal tax return unless an election is made otherwise."},
  {topic:"Business Organization", q:"A 'manager-managed' LLC, as opposed to a 'member-managed' LLC, means:", opts:["Only outside employees can ever be hired","Day-to-day decisions are delegated to designated managers rather than all members directly","The LLC cannot hold a contractor license","Members lose their liability protection"], correct:1, explain:"Manager-managed LLCs designate specific managers (who may or may not be members) to run daily operations, rather than requiring all members to be involved."},
  {topic:"Business Organization", q:"If a sole proprietor who is the license qualifier passes away or becomes incapacitated, the business generally:", opts:["Continues operating under the license automatically forever","Loses its qualifying basis and must address the licensure gap, since the license was tied to that individual","Is transferred by default to the deceased's spouse regardless of experience","Is unaffected since sole proprietorships don't need qualifiers"], correct:1, explain:"Because licensure is tied to the qualifying individual's experience and exam, losing that person creates a real licensure gap the business must resolve."},
  {topic:"Business Organization", q:"A general partnership can be formed and become legally binding:", opts:["Only with a formal written and notarized agreement","Through the conduct and conduct-based agreement of the parties, even without a written contract","Only after filing Articles of Partnership with DOPL","Only if a lawyer drafts the agreement"], correct:1, explain:"General partnerships can arise from conduct alone under partnership law, without any written agreement — though a written agreement is still strongly advisable."},
  {topic:"Business Organization", q:"Compared to an LLC, a corporation generally requires more ongoing formalities such as:", opts:["No formalities are required for either structure","Regular board/shareholder meetings, minutes, and stricter recordkeeping to preserve the liability shield","Annual re-licensing with DOPL specifically for corporations only","Mandatory public stock offerings"], correct:1, explain:"Corporations typically must maintain more rigorous formalities — meetings, minutes, resolutions — than LLCs to preserve the liability protection of the entity."},

  {topic:"Business Organization", q:"An LLC elects to be taxed as an S-corporation instead of its default disregarded-entity/partnership tax treatment. This election primarily changes:", opts:["The LLC's liability protection for its owners, making it stronger","How income can be split between salary and distributions to potentially reduce self-employment tax — not the underlying liability protection, which stays the same", "Whether the LLC needs a contractor license at all","Whether the LLC can have more than one owner"], correct:1, explain:"An S-corp tax election is purely a tax-treatment choice, primarily affecting self-employment tax exposure via salary/distribution splits — it does not change or enhance the LLC's liability shield, which comes from the entity type itself, not the tax election."},
  {topic:"Business Organization", q:"A limited liability partnership (LLP) most specifically protects an individual partner from personal liability for:", opts:["All debts and obligations of the partnership under any circumstance","The malpractice, negligence, or misconduct of the OTHER partners — not necessarily their own actions or general partnership debts they personally guaranteed","Their own negligent work","Criminal liability for any partner's actions"], correct:1, explain:"LLP status is narrower than many assume — it typically shields a partner from liability caused by co-partners' negligence or misconduct, but doesn't necessarily eliminate liability for the partner's own actions or personally guaranteed debts."},
  {topic:"Business Organization", q:"A single-member LLC's default classification as a 'disregarded entity' for FEDERAL tax purposes means:", opts:["The entity doesn't exist for any legal purpose, including liability","Its income/loss is reported on the owner's personal federal return, but this classification doesn't by itself affect the LLC's separate legal existence, its liability shield, or state-level tax treatment","It automatically loses its liability protection","It cannot hold a Utah contractor license"], correct:1, explain:"'Disregarded' is a federal INCOME TAX reporting concept only — the LLC still exists as a separate legal entity for liability and state-law purposes; conflating tax disregard with loss of liability protection is a common and costly misunderstanding."},

  // CONTRACT MANAGEMENT (11) — weak
  {topic:"Contract Management", q:"What three elements must generally be present for a construction contract to be enforceable?", opts:["Notarization, witnesses, and a state seal","Offer, acceptance, and consideration","A permit number, a bond, and insurance proof","A handshake, a deposit, and a start date"], correct:1, explain:"Like any contract, a construction contract needs an offer, acceptance of that offer, and consideration (something of value exchanged) to be legally binding."},
  {topic:"Contract Management", q:"A homeowner asks for added scope mid-project that wasn't in the original agreement. What should happen before the work proceeds?", opts:["Just complete the work and mention it on the final invoice","A written, signed change order documenting scope, cost, and schedule impact","A verbal agreement is sufficient and standard practice","The contractor should refuse any changes once signed"], correct:1, explain:"Written change orders, signed by both parties before work begins, protect against payment disputes and scope creep."},
  {topic:"Contract Management", q:"What is 'retainage' in a construction contract?", opts:["A late fee charged to the owner","A percentage of each payment withheld until satisfactory completion","A state tax on construction contracts","An insurance deductible"], correct:1, explain:"Retainage is a portion (commonly 5–10%) of each progress payment withheld until the work is completed and accepted."},
  {topic:"Contract Management", q:"What does a force majeure clause protect a contractor against?", opts:["Poor workmanship claims","Delay caused by extraordinary events outside either party's control, like severe weather or natural disaster","Late payment from the owner","Subcontractor default"], correct:1, explain:"Force majeure clauses excuse performance delays caused by extraordinary events beyond the parties' control."},
  {topic:"Contract Management", q:"In a cost-plus contract, the contractor is paid:", opts:["A fixed lump sum regardless of actual costs incurred","Actual documented costs of labor and materials, plus an agreed fee or percentage","Only for materials, with labor unpaid","A flat hourly rate with no cost documentation"], correct:1, explain:"Cost-plus contracts reimburse actual project costs and add a contractor fee, shifting more cost risk to the owner than fixed-price contracts."},
  {topic:"Contract Management", q:"An indemnification clause in a contract primarily does what?", opts:["Sets the payment schedule","Shifts liability for specified claims or losses from one party to another","Defines the warranty period on materials","Sets the project's completion date"], correct:1, explain:"Indemnification clauses allocate responsibility for specified losses, claims, or damages between the contracting parties."},
  {topic:"Contract Management", q:"A liquidated damages clause is used to:", opts:["Guarantee the contractor a bonus for finishing early","Pre-set a dollar penalty for late completion, agreed to in advance by both parties","Waive all contractor liability for defects","Automatically approve every change order"], correct:1, explain:"Liquidated damages establish a pre-agreed daily or flat penalty for missing the completion date, avoiding the need to prove actual damages later."},
  {topic:"Contract Management", q:"Best practice when a customer wants work to start before a written contract is finalized is to:", opts:["Start work anyway and formalize the contract later","Decline to begin substantial work until scope and terms are documented and signed","Rely on a verbal 'yes' recorded during a phone call","Have a friend witness a handshake agreement instead"], correct:1, explain:"Starting substantial work without a signed contract creates real legal and payment risk — get scope and terms documented first."},
  {topic:"Contract Management", q:"A 'time is of the essence' clause in a construction contract signals that:", opts:["Deadlines are casual suggestions","Meeting the stated deadlines is a material contract term, and missing them can be a breach","The contract has no fixed end date","Only the owner's deadlines matter, not the contractor's"], correct:1, explain:"This clause elevates scheduled dates to material terms — missing them can constitute a breach of contract, not just a minor delay."},
  {topic:"Contract Management", q:"A warranty clause in a construction contract typically specifies:", opts:["The contractor's personal cell phone number","The period and scope during which the contractor will remedy defects in workmanship or materials","The homeowner's mortgage terms","The subcontractor's hourly rate"], correct:1, explain:"Warranty clauses define how long and to what extent the contractor is responsible for correcting defective work after completion."},
  {topic:"Contract Management", q:"If a contract is silent on a specific issue that later becomes a dispute, courts often look to:", opts:["Whichever party shouts loudest","Industry custom, prior dealings between the parties, and general contract law principles","Always ruling in favor of the contractor","Voiding the entire contract automatically"], correct:1, explain:"Courts often fill contractual gaps using industry custom, the parties' prior course of dealing, and general legal principles."},
  {topic:"Contract Management", q:"An owner directs a contractor to proceed with extra work but refuses to sign a change order, saying 'we'll sort it out later.' The contractor's safest move is to:", opts:["Proceed with no documentation, trusting the owner's word","Document the verbal direction in writing (e.g., email confirmation) and still pursue a signed change order before continuing", "Refuse to do any more work on the project at all","Simply add the cost silently to the final bill with no notice"], correct:1, explain:"Written confirmation of verbal direction protects the contractor even if a formal change order isn't signed immediately, while still pushing for proper documentation."},
  {topic:"Contract Management", q:"A 'pay-if-paid' clause in a subcontract differs from a 'pay-when-paid' clause in that pay-if-paid:", opts:["Both mean the same thing legally in every state","Can shift the risk of owner non-payment entirely onto the subcontractor, contingent on the GC actually being paid","Guarantees the subcontractor is always paid on time","Only applies to change orders"], correct:1, explain:"A pay-if-paid clause makes owner payment to the GC a true condition precedent to paying the sub, shifting non-payment risk downstream — treated differently by courts than a pay-when-paid timing clause."},
  {topic:"Contract Management", q:"A contract includes both a liquidated damages clause AND allows the owner to also sue for actual/consequential damages from the same delay. This is generally considered:", opts:["Always fully enforceable with no issue","Potentially unenforceable as an improper penalty, since liquidated damages are meant to replace, not add to, proof of actual damages","Required under Utah law","Only a concern for public projects"], correct:1, explain:"Courts often view liquidated damages as the exclusive remedy for the delay they cover; stacking actual damages on top can render the clause an unenforceable penalty."},
  {topic:"Contract Management", q:"A 'no-damages-for-delay' clause in a contract generally means:", opts:["The contractor can never be delayed","The contractor's remedy for an owner-caused delay is limited to a time extension only, not monetary damages","The owner waives all rights to enforce the schedule","The clause has no legal effect anywhere"], correct:1, explain:"This clause limits the contractor's remedy for delay to additional time rather than money, even when the delay is caused by the owner — though some jurisdictions carve out exceptions for bad faith."},
  {topic:"Contract Management", q:"A contractor completes 90% of a project on a lump-sum contract, then the owner terminates for convenience. Absent other contract terms, the contractor is generally entitled to:", opts:["Nothing at all, since the job wasn't finished","Payment for work properly completed and costs reasonably incurred up to termination, per the termination clause","The full original contract price regardless of completion","Only reimbursement for materials, never labor"], correct:1, explain:"Termination-for-convenience clauses typically entitle the contractor to payment for completed work and reasonably incurred costs, not the full remaining contract value."},
  {topic:"Contract Management", q:"A 'flow-down' (or 'flow-through') clause in a subcontract is used to:", opts:["Waive the subcontractor's right to payment","Bind the subcontractor to the same relevant terms and obligations the GC owes the owner in the prime contract","Guarantee the subcontractor extra profit","Eliminate the need for a written subcontract"], correct:1, explain:"Flow-down clauses pass applicable prime contract obligations (schedule, quality, dispute procedures) down to the subcontractor, keeping obligations consistent through the contract chain."},
  {topic:"Contract Management", q:"Two clauses conflict: the general conditions say disputes go to arbitration, but a later-signed addendum says disputes go to court. Under standard contract interpretation, which typically controls?", opts:["The general conditions always control, regardless of when other documents were signed","Generally, the more specific and/or later-executed document controls over the earlier general terms","Neither clause is valid, so no dispute resolution process exists","Only a judge assigned before signing can decide"], correct:1, explain:"Standard interpretation principles generally favor specific and later-in-time provisions over earlier general ones when contract documents conflict."},

  {topic:"Contract Management", q:"'Substantial completion' differs from 'final completion' in that substantial completion generally:", opts:["Means the contractor has been fully paid","Marks when the owner can use/occupy the project for its intended purpose, even though minor punch list items remain — triggering warranty periods and possibly retainage release timing, distinct from final completion when all punch items are done","Is a synonym for final completion with no practical difference","Only applies to public projects, never private ones"], correct:1, explain:"Substantial completion is a specific milestone (usable for intended purpose) that starts warranty clocks and often partial retainage release, while final completion requires all remaining punch list items to be finished — conflating the two is a common costly mistake."},
  {topic:"Contract Management", q:"A contract requires written notice of any claim within 10 days of the event giving rise to it, or the claim is waived. A contractor discovers a differing site condition and submits written notice on day 12. Under a strictly enforced notice clause, the claim is most likely:", opts:["Still valid, since 2 days over is a minor technicality","Waived, since strict contractual notice deadlines are generally enforced regardless of how promptly the contractor otherwise acted once discovering the issue","Automatically valid because differing site conditions are always exempt from notice deadlines","Only valid if the owner agrees to accept it"], correct:1, explain:"Courts often strictly enforce contractual notice-of-claim deadlines as written; missing the deadline — even by a couple of days, even with a legitimate underlying claim — can waive the claim entirely absent a specific contract exception."},
  {topic:"Contract Management", q:"An integration (merger) clause in a signed contract most specifically means:", opts:["The contract merges two companies into one entity","The written contract represents the entire and final agreement between the parties, superseding prior verbal or written negotiations on the same subject — not just a formality with no legal effect","The contract automatically renews each year","Change orders are no longer allowed after signing"], correct:1, explain:"An integration/merger clause has real legal weight — it bars a party from later claiming a prior verbal promise or earlier draft term still applies, since the final written contract is treated as the complete agreement."},
  {topic:"Contract Management", q:"A 'differing site conditions' clause and a 'no-damages-for-delay' clause appear in the same contract. If an unforeseen differing site condition causes a delay, which clause's protection for the contractor typically controls, absent clearer contract language?", opts:["No-damages-for-delay always overrides everything else automatically","This depends on the specific contract language — differing site conditions clauses are often carved out as an exception to broad no-damages-for-delay provisions, but only if the contract actually says so", "Neither clause has any legal effect if both exist","The contractor automatically loses in this scenario"], correct:1, explain:"These clauses can genuinely conflict; whether a differing site conditions claim escapes a no-damages-for-delay bar depends entirely on the specific carve-out language in that contract — there's no universal default, which is exactly why this trips people up."},

  // ESTIMATING AND BIDDING (8)
  {topic:"Estimating and Bidding", q:"A material and labor 'takeoff' refers to:", opts:["Removing old materials from a site","Quantifying materials and labor needed from the plans to build an estimate","The final walkthrough with the owner","A tax deduction for tools"], correct:1, explain:"A takeoff is the process of measuring plans/specs to quantify materials, labor, and other costs used to build an estimate."},
  {topic:"Estimating and Bidding", q:"What does a contractor's overhead and profit markup applied to a bid typically cover?", opts:["Only the cost of raw materials","Business operating costs (overhead) plus the contractor's profit margin, on top of direct job costs","Government permit fees exclusively","The homeowner's mortgage interest"], correct:1, explain:"Overhead and profit (O&P) is added on top of direct costs to cover business operating expenses and generate a profit."},
  {topic:"Estimating and Bidding", q:"What is a bid bond intended to guarantee?", opts:["That the contractor will finish the job on time","That if awarded the job, the bidder will sign the contract and provide required bonds, or forfeit the bond amount","That the lowest bidder automatically wins the job","That materials will be delivered on schedule"], correct:1, explain:"A bid bond assures the project owner that a winning bidder will honor their bid and proceed with the contract, or the surety covers the difference."},
  {topic:"Estimating and Bidding", q:"Why include a contingency line item in a project estimate?", opts:["To inflate the bid to guarantee the highest price wins","To budget for unforeseen costs or conditions discovered during construction","Because it's required by DOPL on every bid","To cover the owner's future maintenance costs"], correct:1, explain:"A contingency reserves budget for unforeseen conditions or costs that surface once work begins, reducing the risk of a loss on the job."},
  {topic:"Estimating and Bidding", q:"When comparing competitive bids, an unusually low bid compared to others often signals:", opts:["The bidder is the most efficient and should always be selected","A possible scope gap, underestimation, or intent to make up costs through change orders","That the project will finish early","Nothing of concern"], correct:1, explain:"A bid far below others can indicate missing scope, poor estimating, or a strategy to recover profit later through change orders — worth a closer look before awarding."},
  {topic:"Estimating and Bidding", q:"Unit pricing in a bid (e.g., cost per square foot or per linear foot) is most useful for:", opts:["Hiding the true total cost from the owner","Pricing quantities that may change during construction and adjusting the contract value accordingly","Avoiding the need for a written contract","Calculating payroll taxes"], correct:1, explain:"Unit pricing lets both parties adjust final contract value fairly when actual quantities differ from the original estimate."},
  {topic:"Estimating and Bidding", q:"A pre-bid site visit is valuable primarily because it helps a contractor:", opts:["Meet the neighbors","Identify site conditions, access issues, and scope details that affect the estimate's accuracy","Skip reading the plans","Guarantee winning the bid"], correct:1, explain:"Site visits surface real conditions — access, terrain, existing utilities — that plans alone may not fully capture, improving estimate accuracy."},
  {topic:"Estimating and Bidding", q:"An allowance in a bid or contract (e.g., '$5,000 allowance for flooring') is used when:", opts:["The final material selection hasn't been made yet, so a placeholder budget is set","The contractor wants to avoid liability entirely","The item is guaranteed to cost exactly that amount","No work will actually be done in that category"], correct:0, explain:"Allowances set a placeholder budget for items the owner hasn't finalized yet, to be adjusted once the actual selection and cost are known."},
  {topic:"Estimating and Bidding", q:"A job has direct costs of $80,000. The contractor applies 10% overhead and then 10% profit, each calculated on the running subtotal. What is the approximate total bid price?", opts:["$96,000","$96,800","$100,000","$88,000"], correct:1, explain:"$80,000 + 10% overhead ($8,000) = $88,000; then + 10% profit on that subtotal ($8,800) = $96,800 total bid."},
  {topic:"Estimating and Bidding", q:"A contractor's estimate assumes 4 workers for 10 days at 8 hours/day, but the actual crew size needed is 5 workers for the same duration. What best describes the estimating error?", opts:["A pricing error, not a quantity error","An underestimation of labor quantity (man-hours), which will compress margins if not corrected before bidding","No error — 4 or 5 workers doesn't matter for total labor hours","A materials takeoff error"], correct:1, explain:"Underestimating the number of workers needed understates total labor hours and cost, a quantity (not pricing) estimating error that erodes profit if uncorrected."},
  {topic:"Estimating and Bidding", q:"Two bids come in for the same scope: Bid A is a lump sum of $150,000; Bid B is $140,000 plus unit prices for site conditions that 'may' add up to $20,000. From a risk standpoint, the owner should recognize that:", opts:["Bid B is definitely cheaper overall","Bid A offers more cost certainty, while Bid B carries potential upside/downside risk tied to actual field conditions","Lump sum bids are always illegal","Unit price bids can never exceed the stated cap"], correct:1, explain:"Lump sum pricing transfers quantity risk to the contractor and gives the owner price certainty, while unit-price/allowance structures leave final cost dependent on actual conditions."},
  {topic:"Estimating and Bidding", q:"During bid leveling (comparing multiple contractor bids on the same project), the most important step before comparing prices is to:", opts:["Simply rank bids from lowest to highest price","Confirm each bid includes the same scope, exclusions, and assumptions so the comparison is apples-to-apples","Automatically disqualify the highest bid","Average all the bids together"], correct:1, explain:"Bid leveling requires normalizing scope, exclusions, and assumptions across bids first — otherwise a 'low' bid may simply be missing scope, not actually cheaper."},
  {topic:"Estimating and Bidding", q:"A contractor discovers a takeoff error the day before a bid is due that would raise their price by 8%. The most defensible course of action is to:", opts:["Submit the original bid anyway to avoid looking disorganized","Correct the error and submit the accurate, adjusted bid, even if it changes their competitive position","Submit the low bid and plan to recover the difference through change orders later","Withdraw entirely rather than fix the number"], correct:1, explain:"Submitting a known-inaccurate bid to appear competitive, intending to recover cost later through change orders, is a red flag for bad-faith bidding practice — correcting and submitting an accurate number is the defensible path."},
  {topic:"Estimating and Bidding", q:"A general contractor receives a bid bond requirement of 5% of the bid amount on a project. What is this bond amount if the bid is $400,000?", opts:["$4,000","$20,000","$40,000","$2,000"], correct:1, explain:"5% of $400,000 is $20,000 — the bid bond amount tied to that bid."},
  {topic:"Estimating and Bidding", q:"Escalation clauses tied to material price volatility (e.g., lumber or steel) in a bid are used primarily to:", opts:["Guarantee the contractor a fixed profit no matter what","Protect the contractor from absorbing unpredictable material price increases between bid submission and purchase","Eliminate the need for any contingency","Lock material suppliers into a fixed price forever"], correct:1, explain:"Escalation clauses shift risk of material price volatility (partially or fully) to the owner, protecting the contractor's margin on long lead-time or volatile materials."},

  {topic:"Estimating and Bidding", q:"A contractor wants a 20% GROSS MARGIN on a job with $80,000 in direct costs (margin calculated on the final selling price, not on cost). What should the bid price be?", opts:["$96,000","$100,000","$104,000","$88,000"], correct:1, explain:"For a 20% margin on price: Price × (1 − 0.20) = Cost, so Price = $80,000 ÷ 0.80 = $100,000. This differs from a 20% MARKUP on cost, which would instead be $80,000 × 1.20 = $96,000 — mixing up margin-on-price versus markup-on-cost is a classic estimating error.", },
  {topic:"Estimating and Bidding", q:"Two contractors both claim to add '15% profit' to a $100,000 cost job — one calculates it as a markup on cost, the other as a margin on the final price. Their resulting bid prices will be:", opts:["Identical, since both used '15%'", "Different — the margin-on-price method yields a higher bid price ($117,647) than the markup-on-cost method ($115,000) for the same nominal '15%'","Different, but the markup-on-cost method always yields the higher price","Impossible to determine without more information"], correct:1, explain:"Markup-on-cost: $100,000 × 1.15 = $115,000. Margin-on-price: Price = $100,000 ÷ (1 − 0.15) = $117,647. The same percentage produces different dollar results depending on which base it's applied to — a frequent source of bidding confusion."},
  {topic:"Estimating and Bidding", q:"A bid includes a unit price of $45/linear foot for site utility trenching, with an estimated 800 linear feet, but the engineer's estimate shows only 750 linear feet as the likely actual quantity. If actual field quantities come in at 750 LF, standard unit-price contract practice generally means the contractor is paid:", opts:["For the original 800 LF regardless of actual quantity installed","For the actual 750 LF installed, at the agreed $45/LF unit rate — unit pricing adjusts to true field quantities rather than locking in the estimate", "Nothing, since the estimate didn't match","A renegotiated rate for the full contract"], correct:1, explain:"Unit-price contracts are specifically designed to true up to actual field-measured quantities at the agreed rate, unlike a lump-sum contract which would lock in the original estimated total regardless of actual quantity."},

  // FINANCIAL MANAGEMENT (8)
  {topic:"Financial Management", q:"Positive cash flow in a construction business means:", opts:["The business is profitable on paper only","More cash is coming in than going out during a given period","All invoices have been paid by the owner","The business owns more equipment than debt"], correct:1, explain:"Cash flow tracks actual cash movement; a business can be profitable on paper yet still run out of cash if receivables lag behind expenses."},
  {topic:"Financial Management", q:"Overhead costs in a construction business generally refer to:", opts:["Direct materials used on a specific job","Ongoing business expenses not tied to one specific job, like office rent, insurance, and admin salaries","Subcontractor invoices for a project","Change order costs"], correct:1, explain:"Overhead is the cost of running the business generally (office, admin, insurance) rather than a specific job's direct costs."},
  {topic:"Financial Management", q:"A contractor's break-even point is the level of revenue at which:", opts:["Profit is maximized","Total revenue equals total costs, with zero profit or loss","The business must close","Taxes are no longer owed"], correct:1, explain:"Break-even is the sales/revenue level where total costs are exactly covered — beyond that point, additional revenue becomes profit."},
  {topic:"Financial Management", q:"Under cash-basis accounting, income is recorded when:", opts:["A contract is signed","Cash is actually received, not necessarily when it's earned","Work begins on a project","An invoice is sent to the client"], correct:1, explain:"Cash-basis accounting records income and expenses when cash actually changes hands, unlike accrual accounting which records them when earned/incurred."},
  {topic:"Financial Management", q:"Accounts receivable represents:", opts:["Money the business owes to suppliers","Money owed to the business by clients for completed work","Cash reserved for payroll","Depreciation on equipment"], correct:1, explain:"Accounts receivable is money owed to the business by customers, typically for invoiced work not yet paid."},
  {topic:"Financial Management", q:"Why is job costing (tracking actual cost per project) important for a contractor?", opts:["It's only useful for tax filing","It shows whether each job was profitable and improves future estimating accuracy","It replaces the need for insurance","It's required only for government contracts"], correct:1, explain:"Job costing compares actual costs to the estimate on each project, revealing profitability and sharpening future bids."},
  {topic:"Financial Management", q:"Under accrual-basis accounting, revenue is recorded when:", opts:["Cash is physically deposited","It is earned (e.g., work is completed or a milestone is met), regardless of when cash is received","The fiscal year ends","A customer signs a new contract"], correct:1, explain:"Accrual accounting recognizes revenue when it's earned, not necessarily when cash actually arrives — the opposite of cash-basis timing."},
  {topic:"Financial Management", q:"A healthy current ratio (current assets ÷ current liabilities) above 1.0 generally suggests:", opts:["The business has no debt at all","The business has enough short-term assets to cover its short-term obligations","The business is guaranteed to be profitable","The business overpaid its taxes"], correct:1, explain:"A current ratio above 1.0 indicates short-term assets exceed short-term liabilities, a sign of reasonable short-term financial health."},
  {topic:"Financial Management", q:"A contractor is profitable per their income statement but keeps running short on cash to make payroll. The most likely explanation is:", opts:["The business is committing tax fraud","Revenue is being recognized (accrual) faster than cash is actually being collected, creating a cash flow timing gap","Profit and cash are always identical, so this can't happen","The business needs to lower its prices immediately"], correct:1, explain:"Accrual profit can outpace actual cash collections, especially with slow-paying clients or heavy retainage — a classic profitable-but-cash-poor scenario."},
  {topic:"Financial Management", q:"On a $500,000 project with 10% retainage, how much of the contract value is withheld from progress payments until final completion?", opts:["$5,000","$50,000","$10,000","$500"], correct:1, explain:"10% of $500,000 is $50,000 held back as retainage until the work is completed and accepted."},
  {topic:"Financial Management", q:"Which financial statement shows a company's assets, liabilities, and equity at a specific point in time?", opts:["Income statement","Balance sheet","Cash flow statement","Change order log"], correct:1, explain:"The balance sheet is a snapshot at a point in time of what a company owns (assets), owes (liabilities), and the owner's equity — unlike the income statement, which covers a period."},
  {topic:"Financial Management", q:"A contractor's gross profit margin is calculated as:", opts:["Net income divided by total assets","(Revenue minus direct job costs) divided by revenue","Revenue divided by overhead","Total assets minus total liabilities"], correct:1, explain:"Gross profit margin measures the percentage of revenue remaining after direct job costs, before overhead and other expenses are subtracted."},
  {topic:"Financial Management", q:"Over-billing (billing a client for more work than has actually been completed) on a project creates what on the contractor's balance sheet?", opts:["An asset called 'costs in excess of billings'","A liability called 'billings in excess of costs,' representing work still owed to the client","No effect on the balance sheet at all","Automatic profit that can be recognized immediately"], correct:1, explain:"Over-billing creates a liability (billings in excess of costs) since the contractor has been paid for work it hasn't yet performed — the opposite of under-billing, which creates an asset."},
  {topic:"Financial Management", q:"A contractor relies heavily on one large client for 70% of annual revenue. From a financial risk standpoint, this represents:", opts:["No real risk, since the revenue is guaranteed","Significant customer concentration risk — losing that client could severely impact cash flow and viability","A tax advantage under Utah law","A situation requiring no contingency planning"], correct:1, explain:"Heavy reliance on one client creates concentration risk; losing that relationship can create an outsized, sudden impact on revenue and cash flow."},
  {topic:"Financial Management", q:"Depreciation on a contractor's equipment (like an excavator) is best described as:", opts:["A cash expense paid monthly to a bank","A non-cash accounting expense that spreads the equipment's cost over its useful life","A one-time tax penalty","Identical to a loan payment"], correct:1, explain:"Depreciation allocates an asset's cost over its useful life as a non-cash accounting expense — it reduces reported profit without an associated current cash outflow."},

  {topic:"Financial Management", q:"A contractor has current assets of $180,000 and current liabilities of $130,000. Their working capital is:", opts:["$310,000","$50,000","$1.38 (a ratio, not a dollar figure)","Cannot be determined from this information"], correct:1, explain:"Working capital = current assets − current liabilities = $180,000 − $130,000 = $50,000. (Note this is different from the CURRENT RATIO, which would be 180,000 ÷ 130,000 ≈ 1.38 — a ratio, not a dollar amount; mixing these two up is a common error.)"},
  {topic:"Financial Management", q:"A surety evaluating a contractor's BONDING capacity typically weighs working capital and net worth most heavily because:", opts:["Bonding capacity is based solely on years in business, not financials","These figures indicate the contractor's real financial cushion to absorb losses or cash flow gaps on a job, regardless of how many years of experience or how strong the contractor's trade skills are","Bonding capacity is set entirely by the contractor's license classification","Sureties only look at profit, never working capital or net worth"], correct:1, explain:"A financially thin contractor — even a highly experienced, skilled one — can be a bonding risk, since bonding capacity reflects the ability to absorb financial shocks, not construction competence alone."},
  {topic:"Financial Management", q:"A contractor's income statement shows a healthy $150,000 net profit for the year, but their cash balance actually DECREASED by $40,000 over the same period. The most likely explanation involves differences between:", opts:["This is impossible — profit and cash change must always match","Accrual-based profit recognition versus actual cash timing — e.g., growth in unbilled receivables, heavy equipment purchases paid in cash, or debt principal payments that don't appear on the income statement", "A bookkeeping error that must be corrected immediately","Sales tax being miscalculated"], correct:1, explain:"Profit (income statement, accrual basis) and cash change (cash flow) are genuinely different measures — growing receivables, capital purchases, and debt principal payments can all reduce cash without reducing reported profit, a distinction that trips up many contractors."},

  // LABOR LAWS (8)
  {topic:"Labor Laws", q:"Under federal labor law (FLSA), non-exempt employees who work over 40 hours in a week are generally entitled to:", opts:["No additional pay","Overtime pay, typically at 1.5x their regular rate","Comp time only, never pay","A flat bonus regardless of hours"], correct:1, explain:"The Fair Labor Standards Act requires overtime pay (typically time-and-a-half) for non-exempt employees working over 40 hours per week."},
  {topic:"Labor Laws", q:"Misclassifying an employee as an independent contractor can expose a contracting business to:", opts:["No real consequences if the worker agrees","Back taxes, penalties, and liability for unpaid workers' comp/unemployment insurance","A tax refund","Automatic license renewal"], correct:1, explain:"Misclassification carries real financial and legal risk, including back payroll taxes, penalties, and unpaid insurance contributions."},
  {topic:"Labor Laws", q:"Employers are generally required to verify a new employee's identity and work eligibility using which federal form?", opts:["W-9","Form I-9","1099-NEC","W-4 only"], correct:1, explain:"Form I-9 is used to verify identity and employment authorization for new hires."},
  {topic:"Labor Laws", q:"On a public works project, what wage requirement often applies that doesn't apply to typical private jobs?", opts:["Federal minimum wage only, with no exceptions","Prevailing wage rates set for that trade and locality","No wage laws apply on public projects","Only union employees may be paid"], correct:1, explain:"Public works projects often require paying prevailing wage rates, set by government surveys of local wage standards for each trade."},
  {topic:"Labor Laws", q:"Which of these is a key factor in determining whether a worker is an employee vs. an independent contractor?", opts:["The worker's preferred job title","The degree of control the business has over how, when, and where the work is performed","Whether the worker owns a truck","How many years the worker has been in the trade"], correct:1, explain:"Behavioral and financial control — how much the business directs the work — is a central factor in employee vs. contractor classification tests."},
  {topic:"Labor Laws", q:"What must employers generally maintain regarding workplace injuries under OSHA recordkeeping rules?", opts:["Nothing, unless someone is hospitalized","A log of recordable work-related injuries and illnesses (e.g., OSHA Form 300)","A public press release for every injury","Only verbal notification to OSHA"], correct:1, explain:"Covered employers must maintain injury and illness records, such as the OSHA 300 log, for recordable workplace incidents."},
  {topic:"Labor Laws", q:"Federal minimum wage sets a floor that:", opts:["Always overrides a higher state minimum wage","Applies unless a state or local minimum wage is higher, in which case the higher rate applies","Only applies to salaried employees","Doesn't apply to construction workers"], correct:1, explain:"Employers must pay at least the highest applicable minimum wage among federal, state, and local requirements."},
  {topic:"Labor Laws", q:"A jobsite apprentice working under a licensed contractor typically must:", opts:["Hold their own separate contractor license","Work under appropriate supervision per apprenticeship/training program requirements","Be paid the same rate as a licensed journeyman immediately","Skip all safety training"], correct:1, explain:"Apprentices generally work under defined supervision within a training program rather than independently or unsupervised."},
  {topic:"Labor Laws", q:"A worker sets their own hours, uses their own tools, works for multiple contractors simultaneously, and is paid a flat fee per project. These facts tend to support classifying them as:", opts:["An employee, regardless of these facts","An independent contractor, since they show low behavioral/financial control by the hiring business","Neither an employee nor a contractor","Always an employee if they work more than 10 hours a week"], correct:1, explain:"Autonomy over schedule/methods, use of own tools, working for multiple clients, and flat-fee pay are hallmark indicators supporting independent contractor status."},
  {topic:"Labor Laws", q:"An employer requires a worker to use company tools, follow a set daily schedule, work exclusively for that company, and receives ongoing training and supervision. These facts tend to support classifying them as:", opts:["An independent contractor","An employee, due to the high degree of behavioral and economic control exercised","A subcontractor automatically","A volunteer"], correct:1, explain:"High control over schedule, tools, exclusivity, and training/supervision are classic indicators of an employment relationship, not independent contractor status."},
  {topic:"Labor Laws", q:"A salaried supervisor who regularly directs the work of other employees and has hiring/firing input is most likely classified under the FLSA as:", opts:["Non-exempt, entitled to overtime regardless of duties","Potentially exempt from overtime under the executive exemption, if duties and salary tests are met","Automatically an independent contractor","Ineligible for a salary of any kind"], correct:1, explain:"The FLSA executive exemption can apply to supervisory employees meeting salary and duties tests, exempting them from overtime pay requirements."},
  {topic:"Labor Laws", q:"An employee is injured on the job and workers' compensation applies. In most cases, the employee's ability to sue the employer directly for the injury (outside the workers' comp system) is:", opts:["Unlimited and encouraged","Generally barred, since workers' comp is typically the exclusive remedy for workplace injuries","Only available on weekends","Always allowed for injuries over $10,000"], correct:1, explain:"Workers' compensation is generally the exclusive remedy for workplace injuries, meaning the employee generally cannot also sue the employer in most ordinary injury cases."},
  {topic:"Labor Laws", q:"A contractor pays a crew a flat day rate regardless of hours worked, sometimes exceeding 50 hours/week, without extra pay. If these workers are properly classified as non-exempt employees, this practice:", opts:["Is compliant as long as the day rate is generous","Likely violates overtime requirements, since day-rate pay doesn't automatically satisfy FLSA overtime obligations for non-exempt workers","Is only a problem for salaried employees","Is legal in all states regardless of hours"], correct:1, explain:"Non-exempt employees are generally owed overtime for hours over 40/week regardless of pay structure; a flat day rate alone doesn't satisfy this requirement without proper overtime calculation."},
  {topic:"Labor Laws", q:"A contractor with several employees fails to carry required workers' compensation insurance. If a worker is injured, the contractor faces:", opts:["No consequences as long as the worker doesn't complain","Potential direct personal liability for the injury, penalties, and possible license action, since required coverage was missing","A one-time warning with no further exposure","Automatic dismissal of the injury claim"], correct:1, explain:"Failing to carry required workers' comp coverage can expose the employer to direct liability for the injury, statutory penalties, and disciplinary action against their license."},
  {topic:"Labor Laws", q:"Under the FLSA, overtime is generally calculated based on hours worked beyond 40 in a single:", opts:["Calendar month","Workweek (a fixed, recurring 168-hour period), not necessarily a calendar week","Two-week pay period averaged together","Calendar year"], correct:1, explain:"Overtime is calculated per workweek — a fixed, regularly recurring 7-day/168-hour period the employer defines — not averaged across pay periods or months."},
  {topic:"Labor Laws", q:"An employer wants to avoid paying overtime by giving an employee 'comp time' (time off later) instead of overtime pay for hours over 40 in a week. For most private-sector non-exempt employees, this practice is:", opts:["Fully compliant and commonly used to avoid overtime pay","Generally not permitted under the FLSA for private employers — overtime for non-exempt employees is normally paid in wages, not banked comp time","Only illegal if the employee objects","Required by federal law instead of paying cash overtime"], correct:1, explain:"Private-sector employers generally can't substitute comp time for cash overtime pay owed to non-exempt employees under the FLSA — that practice is more common in public-sector employment."},
  {topic:"Labor Laws", q:"Federal law generally imposes daily overtime requirements (e.g., overtime after 8 hours in a single day) on private employers:", opts:["Always, in every state, as a floor under federal law","Not by default — the FLSA sets a weekly 40-hour threshold, and daily overtime rules (if any) come from state law, not federal law","Only for construction workers specifically","Only when the contract explicitly waives it"], correct:1, explain:"The FLSA's overtime trigger is weekly (over 40 hours), not daily; any daily overtime requirement would have to come from a state law, since federal law doesn't impose one by default."},
  {topic:"Labor Laws", q:"A worker travels between two job sites during the middle of their workday, staying on the clock the whole time. This travel time is generally:", opts:["Never compensable under any circumstance","Compensable work time, since it occurs during the workday between duty locations","Only compensable if it exceeds 2 hours","The employee's own responsibility to absorb unpaid"], correct:1, explain:"Travel between job sites during the workday is generally compensable hours worked, distinct from an employee's normal home-to-first-jobsite commute, which typically isn't."},
  {topic:"Labor Laws", q:"An employee is required to remain on the jobsite during a short break, unable to leave or use the time freely. Under FLSA rules, short breaks (typically under about 20 minutes) are usually treated as:", opts:["Always unpaid, regardless of length or restrictions","Compensable work time that counts toward hours worked, including for overtime calculations","Only paid if the employee requests it","Automatically unpaid if longer than 5 minutes"], correct:1, explain:"Short rest breaks (typically under ~20 minutes) are generally counted as compensable hours worked under FLSA guidance, unlike longer bona fide meal periods where the employee is fully relieved of duty."},
  {topic:"Labor Laws", q:"To qualify for the FLSA's executive/administrative overtime exemption, an employee generally must meet BOTH a duties test AND:", opts:["Be over the age of 21","A minimum salary threshold, paid on a salary basis rather than hourly","Have a college degree","Work for a company with over 500 employees"], correct:1, explain:"Overtime exemptions like executive/administrative require satisfying both a duties test (nature of the work) and a minimum salary-basis threshold — hourly workers generally can't be classified exempt regardless of duties."},

  {topic:"Labor Laws", q:"A non-exempt employee earns $20/hour and also receives a $100 non-discretionary weekly production bonus. In a week they work 45 hours, their overtime rate calculation must:", opts:["Ignore the bonus entirely and pay overtime on the $20/hour rate only","Fold the non-discretionary bonus into the 'regular rate' used to calculate the overtime premium, not just use the base hourly rate alone", "Only apply if the bonus exceeds $500", "Treat the bonus as fully exempt from any wage calculation"], correct:1, explain:"Non-discretionary bonuses must generally be included when calculating an employee's 'regular rate' for overtime purposes — using only the base hourly rate and ignoring the bonus understates the overtime actually owed."},
  {topic:"Labor Laws", q:"Two companies — a staffing agency and a contractor — jointly direct and control the same worker's daily tasks and schedule on a jobsite. Under a 'joint employer' analysis, wage and hour compliance obligations (like overtime) generally:", opts:["Fall solely on the staffing agency, since they issue the paycheck","Can be shared between both companies, since both may be considered joint employers responsible for FLSA compliance depending on their actual degree of control", "Fall solely on the contractor since the work happens at their jobsite","Don't apply at all in joint arrangements"], correct:1, explain:"Under a joint employer analysis, both companies exercising meaningful control over the worker can share FLSA compliance responsibility — simply not being the one who issues the paycheck doesn't eliminate wage and hour exposure."},
  {topic:"Labor Laws", q:"An employer classifies a worker as exempt from overtime and pays a fixed weekly salary, but the worker's actual day-to-day duties are almost entirely manual labor with no supervisory or discretionary authority. This exempt classification is:", opts:["Valid, since they are paid a salary rather than hourly","Likely invalid — salary basis alone does not create an overtime exemption; the actual job DUTIES must also independently meet an exemption test, regardless of pay structure", "Automatically valid if the worker agreed to it in writing","Only a problem if the worker earns under minimum wage equivalent"], correct:1, explain:"Both the salary-basis AND duties tests must be met for an exemption to apply — paying someone a salary doesn't by itself exempt them from overtime if their actual duties are non-exempt manual work."},

  // LICENSING (16) — largest exam section
  {topic:"Licensing", q:"Which state agency oversees contractor licensing in Utah?", opts:["Utah Department of Commerce Insurance Division","Utah Division of Occupational and Professional Licensing (DOPL)","Utah Labor Commission","Utah State Construction Registrar"], correct:1, explain:"DOPL, under the Department of Commerce, administers contractor licensing and enforcement through its Construction Trades Bureau."},
  {topic:"Licensing", q:"As of current DOPL rules, at what total project value (labor and materials combined) does work require a full Utah contractor license?", opts:["$3,000 or more","$5,000 or more","$7,000 or more","$10,000 or more"], correct:2, explain:"The licensing threshold was raised to $7,000 (labor and materials combined). Projects between $3,000 and $7,000 fall under the 'handyman exemption' — no license needed, but a one-time insurance/workers' comp affirmation must still be filed with DOPL. This changed from the older $3,000 threshold, so confirm against dopl.utah.gov if it's been a while since you checked."},
  {topic:"Licensing", q:"What classification code identifies a Utah General Building Contractor license?", opts:["R100","B100","E100","S200"], correct:1, explain:"B100 is the General Building Contractor classification, covering structural work but not electrical, plumbing, or mechanical scopes."},
  {topic:"Licensing", q:"A B100 licensee wants to install new electrical wiring on a remodel. What must they do?", opts:["Nothing — B100 covers all trades","Subcontract to a licensed electrical contractor","Self-perform since they're the GC of record","Get a same-day verbal waiver from DOPL"], correct:1, explain:"B100 is a structural license only; electrical, plumbing, and mechanical work must be performed by separately licensed trade contractors."},
  {topic:"Licensing", q:"How much experience is generally required to qualify for a B100 license?", opts:["1 year (2,000 hours)","2 years (4,000 hours)","3 years (6,000 hours)","4 years (8,000 hours)"], correct:1, explain:"Utah requires 2 years of paid construction experience totaling at least 4,000 hours."},
  {topic:"Licensing", q:"Of the required experience for a B100 qualifier, how much must be in a supervisory or managerial role?", opts:["None required","At least 6 months","At least 1 of the 2 years","All of it"], correct:2, explain:"Under Utah rule, at least one of the two required years must be in a supervisory or managerial capacity."},
  {topic:"Licensing", q:"A contractor licensed and in good standing in another state for at least a year applies in Utah. What is true about the Business & Law exam?", opts:["Still mandatory regardless of out-of-state license","May be waived if the out-of-state license covers a similar scope and is active/in good standing","Only the trade exam is waived, not Business & Law","Exam is waived only for military veterans"], correct:1, explain:"Utah can waive the Business & Law exam for applicants with at least one year of active, similar-scope licensure in good standing elsewhere."},
  {topic:"Licensing", q:"As of the rule change effective April 20, 2026, what is the minimum general liability insurance Utah requires a licensed contractor to carry?", opts:["$100,000 per occurrence / $300,000 aggregate (the old minimum)","$1,000,000 per occurrence / $3,000,000 aggregate","$500,000 per occurrence / $1,000,000 aggregate","No minimum is specified by rule"], correct:1, explain:"DOPL raised the minimum general liability coverage from $100,000/$300,000 to $1,000,000/$3,000,000 per occurrence/aggregate, effective April 20, 2026 under Utah Admin. Rule R156-55a-302d — double-check this is still current when you test, since it's a recent change."},
  {topic:"Licensing", q:"DOPL can take disciplinary action against a contractor's license for which of the following?", opts:["Submitting a bid that wasn't the lowest","Working without required insurance or violating licensing law","Hiring a subcontractor with more experience","Advertising on social media"], correct:1, explain:"Operating without required insurance, unlicensed practice, or other statutory violations are common grounds for DOPL discipline, fines, or license action."},
  {topic:"Licensing", q:"What is the minimum passing score on the Utah Contractors Business and Law exam?", opts:["60%","65%","70%","75%"], correct:2, explain:"A minimum score of 70% is required to pass the Utah Business and Law exam."},
  {topic:"Licensing", q:"Who administers and proctors the Utah contractor Business and Law exam, both developing its content and running the testing centers?", opts:["DOPL directly runs all testing centers itself","Prov (Prov Exams) — under contract with DOPL, both developing exam content and operating the testing centers/online proctoring","PSI Examination Services","NASCLA directly"], correct:1, explain:"Prov is DOPL's contracted exam vendor for Utah contracting exams — it develops the content and runs both physical testing centers and the Examroom online proctoring option. (Some third-party sites incorrectly reference PSI for Utah — always confirm against dopl.utah.gov.)"},
  {topic:"Licensing", q:"What happens if a person performs contracting work above the licensing threshold without a valid license?", opts:["Nothing, as long as the work is done well","They can face fines, be barred from enforcing payment through the courts, and face other DOPL/legal penalties","They automatically get a temporary license","Only the customer faces consequences"], correct:1, explain:"Unlicensed contracting exposes the individual to civil penalties, fines, and can bar them from suing to collect payment for the unlicensed work."},
  {topic:"Licensing", q:"A Utah contractor license generally must be renewed:", opts:["Only once, for life","On a periodic renewal cycle set by DOPL, typically requiring a fee and good standing","Every 10 years automatically, no action needed","Never — licenses don't expire"], correct:1, explain:"Contractor licenses require periodic renewal with DOPL, including a renewal fee and maintaining required insurance/bonding."},
  {topic:"Licensing", q:"If a licensed business changes its qualifying party (e.g., the qualifier leaves the company), the business generally must:", opts:["Do nothing — the license stays valid indefinitely regardless","Notify DOPL and designate a new qualifier within the required timeframe, or risk losing the license","Immediately dissolve the company","Automatically transfer the license to the departing qualifier"], correct:1, explain:"Since the license is tied to the qualifier's experience and exam, losing that qualifier without replacement can jeopardize the license."},
  {topic:"Licensing", q:"A homeowner performing construction work exclusively on their own residence is generally:", opts:["Required to hold a full contractor license regardless","Exempt from the contractor licensing requirement for their own home","Required to hire a licensed GC for any work at all","Subject to the same bonding requirements as a licensed contractor"], correct:1, explain:"Utah generally exempts owners performing work on their own residence from the contractor license requirement."},
  {topic:"Licensing", q:"What is a surety bond required for Utah contractor licensure primarily meant to protect?", opts:["The contractor's own equipment","Consumers/the public against certain contractor misconduct or financial harm, up to the bond amount","The contractor's personal savings","The state government's tax revenue"], correct:1, explain:"The license bond provides a limited fund the public can claim against for specific contractor violations, separate from liability insurance."},
  {topic:"Licensing", q:"A B100-licensed contractor wants to also occasionally perform small plumbing repairs incidental to a remodel. The correct approach is generally to:", opts:["Perform minor plumbing freely since it's 'incidental' to the structural work","Still subcontract to or coordinate with a licensed plumbing contractor, since B100 doesn't cover plumbing scope","Get a one-time verbal approval from the homeowner instead","Assume DOPL allows it if the job is under $3,000"], correct:1, explain:"B100 remains a structural-only license; plumbing work generally requires a separately licensed plumbing contractor regardless of how minor or 'incidental' it seems."},
  {topic:"Licensing", q:"An applicant has 18 months of construction experience, 4 months of which were supervisory, plus a 2-year construction management associate's degree. How does the degree typically apply toward the B100 experience requirement?", opts:["It cannot be used at all toward licensure","It can credit up to one year toward the supervisory/managerial portion of the experience requirement, per Utah rule","It replaces the entire 2-year experience requirement automatically","It only counts if paired with a 4-year bachelor's degree"], correct:1, explain:"A qualifying construction management degree can credit up to one year toward the supervisory/managerial experience requirement, helping applicants who are otherwise short on that portion."},
  {topic:"Licensing", q:"A licensed contractor allows an unlicensed individual to pull permits and represent themselves as the license holder ('license lending'). This practice:", opts:["Is a common and accepted industry practice with no risk","Is a serious licensing violation that can result in discipline against the actual licensee","Only creates risk for the unlicensed individual, not the license holder","Is legal as long as the licensee is paid a fee"], correct:1, explain:"License lending — allowing another party to use your license without your actual oversight — is a significant violation that puts the license holder's own credential at risk of discipline."},
  {topic:"Licensing", q:"A contractor's license lapses because the renewal fee wasn't paid on time. If they continue performing licensed-level work during the lapse, they are effectively:", opts:["Still fully licensed since the lapse is just paperwork","Operating unlicensed during that period, exposing them to the same risks as never having been licensed","Automatically granted a 1-year grace period with full legal protection","Only at risk if a customer specifically complains"], correct:1, explain:"Performing licensed work during a lapsed period generally carries the same unlicensed-practice exposure as never having held a license, regardless of the lapse being unintentional."},
  {topic:"Licensing", q:"An out-of-state applicant has held an active, similar-scope contractor license in good standing for 8 months (not yet a full year). Regarding the Utah Business & Law exam requirement, they are:", opts:["Automatically exempt since they hold any out-of-state license","Not yet eligible for the experience-based exam waiver, since Utah's waiver generally requires at least one full year of active, similar-scope licensure","Exempt only if their home state is adjacent to Utah","Required to retake their home state's exam instead"], correct:1, explain:"The waiver generally requires at least one full year of active, similar-scope licensure in good standing — 8 months would not yet meet that threshold."},
  {topic:"Licensing", q:"A DOPL disciplinary action results in a contractor's license being placed on probation rather than revoked. This generally means the contractor:", opts:["Has no restrictions of any kind going forward","May continue operating but under specific conditions or monitoring set by DOPL, with revocation possible if violated","Automatically loses the license within 30 days regardless","Must immediately dissolve their business entity"], correct:1, explain:"Probation allows continued licensed operation under DOPL-imposed conditions; violating those conditions can escalate to suspension or revocation."},
  {topic:"Licensing", q:"Two business partners each hold separate, valid B100 qualifier credentials, but only one is officially designated as the qualifying party on the license. If that designated qualifier leaves the company, the OTHER partner's personal experience:", opts:["Automatically becomes the new qualifying basis with zero paperwork","May be able to support a new qualifier designation, but the business must still formally update its qualifier of record with DOPL","Is irrelevant since only the original qualifier's credentials ever count","Voids the license permanently regardless of the other partner's qualifications"], correct:1, explain:"Even if another qualified individual is available, licensing rules generally require formally updating who the designated qualifier of record is with DOPL — it isn't automatic."},

  {topic:"Licensing", q:"A contractor is licensed R100 (Residential and Small Commercial) and is offered a $300,000 commercial remodel job. Given R100's project value cap on small commercial work, the contractor should recognize that:", opts:["R100 covers any project regardless of value, so they can proceed", "This project likely exceeds R100's small-commercial scope/value cap, meaning a B100 (uncapped general) or the appropriate higher classification may be required instead", "Only a specialty S-classification could ever cover this","R100 and B100 are interchangeable in every situation"], correct:1, explain:"R100 is scoped to residential plus SMALL commercial work under a value cap; a $300,000 commercial remodel is likely to exceed that scope, meaning the contractor needs to confirm whether B100 or another classification is actually required for this job."},
  {topic:"Licensing", q:"An applicant is licensed and in good standing as a qualifier in a state Utah recognizes, but has only held that license for 10 months. Compared to an applicant with 14 months in the same situation, the 10-month applicant:", opts:["Qualifies for the same exam waiver, since both have 'about a year'","Does NOT yet qualify for the experience-based Business & Law exam waiver, since Utah's waiver threshold requires at least a full year (12 months) — 10 months falls short even though it looks close","Automatically qualifies because 10 months rounds up to a year","Is treated identically to someone with zero months of experience"], correct:1, explain:"The waiver threshold is a genuine cutoff at one full year — 10 months, despite being close, does not satisfy it, illustrating how these thresholds are applied literally rather than 'approximately.'"},
